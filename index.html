sure full contraction you need to bring that small finger higher than the thumb.\nSqueeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions.\nSwitch arms and repeat the movement."],["One_Arm_Floor_Press","One Arm Floor Press","","Kraft","Langhantel",[16],[5,14],"kraft",2,"Lie down on a flat surface with your back pressing against the floor or an exercise mat. Make sure your knees are bent.\nHave a partner hand you the bar on one hand. When starting, your arm should be just about fully extended, similar to the starting position of a barbell bench press. However, this time your grip will be neutral (palms facing your torso).\nMake sure the hand you are not using to lift the weight is placed by your side.\nBegin the exercise by lowering the barbell until your elbow touches the ground. Make sure to breathe in as this is the eccentric (lowering part of the exercise).\nThen start lifting the barbell back up to the original starting position. Remember to breathe out during the concentric (lifting part of the exercise).\nRepeat until you have performed your recommended repetitions.\nSwitch arms and repeat the movement."],["One_Arm_Lat_Pulldown","One Arm Lat Pulldown","","Kraft","Kabelzug",[9],[3,11],"kraft",2,"Select an appropriate weight and adjust the knee pad to help keep you down. Grasp the handle with a pronated grip. This will be your starting position.\nPull the handle down, squeezing your elbow to your side as you flex the elbow.\nPause at the bottom of the motion, and then slowly return the handle to the starting position.\nFor multiple repetitions, avoid completely returning the weight to keep tension on the muscles being worked."],["One_Arm_Pronated_Dumbbell_Triceps_Extension","One Arm Pronated Dumbbell Triceps Extension","","Kraft","Kurzhantel",[16],[],"kraft",2,"Lie flat on a bench while holding a dumbbell at arms length. Your arm should be perpendicular to your body. The palm of your hand should be facing towards your feet as a pronated grip is required to perform this exercise.\nPlace your non lifting hand on your bicep for support.\nSlowly begin to lower the dumbbell down as you breathe in.\nThen, begin lifting the dumbbell upward as you contract the triceps. Remember to breathe out during the concentric (lifting part of the exercise).\nRepeat until you have performed your set repetitions.\nSwitch arms and repeat the movement."],["One_Arm_Supinated_Dumbbell_Triceps_Extension","One Arm Supinated Dumbbell Triceps Extension","","Kraft","Kurzhantel",[16],[],"kraft",2,"Lie flat on a bench while holding a dumbbell at arms length. Your arm should be perpendicular to your body. The palm of your hand should be facing towards your face as a supinated grip is required to perform this exercise.\nPlace your non lifting hand on your bicep for support.\nSlowly begin to lower the dumbbell down as you breathe in.\nThen, begin lifting the dumbbell upward as you contract the triceps. Remember to breathe out during the concentric (lifting part of the exercise).\nRepeat until you have performed your set repetitions.\nSwitch arms and repeat the movement.\nSwitch arms again and repeat the movement."],["One_Half_Locust","One Half Locust","","Dehnen","Ohne",[13],[0,3,5],"zeit",2,"Lie facedown on the floor.\nPut your left hand under your left hipbone to pad your hip and pubic bone.\nBend your right knee so you can hold the foot in your right hand.\nLift the foot in the air and simultaneously lift your shoulders off the floor. This also stretches the right hip flexor and the chest and shoulders. Switch sides. If it doesn't bother your back, you can try it with both arms and legs at the same time."],["One_Handed_Hang","One Handed Hang","","Dehnen","Sonstiges",[9],[3],"zeit",2,"Grab onto a chinup bar with one hand, using a pronated grip. Keep your feet on the floor or a step. Allow the majority of your weight to hang from that hand, while keeping your feet on the ground. Hold for 10-20 seconds and switch sides."],["One_Knee_To_Chest","One Knee To Chest","","Dehnen","Ohne",[7],[8,10],"zeit",2,"Start off by lying on the floor.\nExtend one leg straight and pull the other knee to your chest. Hold under the knee joint to protect the kneecap.\nGently tug that knee toward your nose.\nSwitch sides. This stretches the buttocks and lower back of the bent leg and the hip flexor of the straight leg."],["One_Leg_Barbell_Squat","One Leg Barbell Squat","","Kraft","Langhantel",[13],[4,7,8],"kraft",2,"Start by standing about 2 to 3 feet in front of a flat bench with your back facing the bench. Have a barbell in front of you on the floor. Tip: Your feet should be shoulder width apart from each other.\nBend the knees and use a pronated grip with your hands being wider than shoulder width apart from each other to lift the barbell up until you can rest it on your chest.\nThen lift the barbell over your head and rest it on the base of your neck. Move one foot back so that your toe is resting on the flat bench. Your other foot should be stationary in front of you. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. Tip: Make sure your back is straight and chest is out while performing this exercise.\nAs you inhale, slowly lower your leg until your thigh is parallel to the floor. At this point, your knee should be over your toes. Your chest should be directly above the middle of your thigh.\nLeading with the chest and hips and contracting the quadriceps, elevate your leg back to the starting position as you exhale.\nRepeat for the recommended amount of repetitions.\nSwitch legs and repeat the movement."],["Open_Palm_Kettlebell_Clean","Open Palm Kettlebell Clean","","Kraft","Kettlebell",[8],[7,10,13,14],"kraft",2,"Place one kettlebell between your feet. Clean the kettlebell by extending through the legs and hips as you raise the kettlebell towards your shoulders.\nRelease the kettlebell as it comes up, and let it flip so that the ball of the kettlebell lands in the palms of your hands.\nRelease the kettlebell out in front of you and catch the handle with both hands. Lower the kettlebell to the starting position and repeat."],["Otis-Up","Otis-Up","","Kraft","Sonstiges",[0],[5,14,16],"kraft",2,"Secure your feet and lay back on the floor. Your knees should be bent. Hold a weight with both hands to your chest. This will be your starting position.\nInitiate the movement by flexing the hips and spine to raise your torso up from the ground.\nAs you move up, press the weight up so that it is above your head at the top of the movement.\nReturn the weight to your chest as you reverse the sit-up motion, ensuring not to go all the way down to the floor."],["Overhead_Cable_Curl","Overhead Cable Curl","","Kraft","Kabelzug",[3],[],"kraft",2,"To begin, set a weight that is comfortable on each side of the pulley machine. Note: Make sure that the amount of weight selected is the same on each side.\nNow adjust the height of the pulleys on each side and make sure that they are positioned at a height higher than that of your shoulders.\nStand in the middle of both sides and use an underhand grip (palms facing towards the ceiling) to grab each handle. Your arms should be fully extended and parallel to the floor with your feet positioned shoulder width apart from each other. Your body should be evenly aligned the handles. This is the starting position.\nWhile exhaling, slowly squeeze the biceps on each side until your forearms and biceps touch.\nWhile inhaling, move your forearms back to the starting position. Note: Your entire body is stationary during this exercise except for the forearms.\nRepeat for the recommended amount of repetitions prescribed in your program."],["Overhead_Lat","Overhead Lat","","Dehnen","Sonstiges",[9],[16],"zeit",2,"Sit upright on the floor with your partner behind you. Raise one arm straight up, and flex the elbow, attempting to touch your hand to your back. Your parner should hold your tricep and wrist. This will be your starting position.\nAttempt to pull your upper arm to your side as your partner prevents you from doing actually doing so.\nAfter 10-20 seconds, relax the arm and allow your partner to further stretch the lat by applying gentle pressure to the tricep. Hold for 10-20 seconds, and then switch sides."],["Overhead_Slam","Overhead Slam","","Plyometrie","Medizinball",[9],[],"kraft",2,"Hold a medine ball with both hands and stand with your feet at shoulder width. This will be your starting position.\nInitiate the countermovement by raising the ball above your head and fully extending your body.\nReverse the motion, slamming the ball into the ground directly in front of you as hard as you can.\nReceive the ball with both hands on the bounce and repeat the movement."],["Overhead_Squat","Overhead Squat","","Gewichtheben","Langhantel",[13],[0,4,7,8,10,14,16],"kraft",2,"Start out by having a barbell in front of you on the floor. Your feet should be wider than shoulder width apart from each other.\nBend the knees and use a pronated grip (palms facing you) to grab the barbell. Your hands should be at a wider than shoulder width apart from each other before lifting. Once you are positioned, lift the barbell up until you can rest it on your chest.\nMove the barbell over and slightly behind your head and make sure your arms are fully extended. Keep your head up at all times and also maintain a straight back. Retract your shoulder blades. This is your starting position.\nSlowly lower the weight by bending your knees until your thighs are parallel to the ground while inhaling. Tip: Keep your back straight while performing this exercise to avoid any injuries and your arms should remain extended and over your head at all times.\nNow use your feet and legs to help bring the weight back up to the starting position while exhaling.\nRepeat for the recommended amount of repetitions."],["Overhead_Stretch","Overhead Stretch","","Dehnen","Ohne",[0],[5,6,9,16],"zeit",2,"Standing straight up, lace your fingers together and open your palms to the ceiling. Keep your shoulders down as you extend your arms up.\nTo create a full torso stretch, pull your tailbone down and stabilize your torso as you do this. Stretch the muscles on both the front and the back of the torso."],["Overhead_Triceps","Overhead Triceps","","Dehnen","Körpergewicht",[16],[9],"zeit",2,"Sit upright on the floor with your partner behind you. Raise one arm straight up, and flex the elbow, attempting to touch your hand to your back. Your parner should hold your elbow and wrist. This will be your starting position.\nAttempt to extend the arm straight into the air as your partner prevents you from doing actually doing so.\nAfter 10-20 seconds, relax the arm and allow your partner to further stretch the tricep by applying gentle pressure to the wrist. Hold for 10-20 seconds, and then switch sides."],["Pallof_Press","Pallof Press","Pallof Press","Kraft","Kabelzug",[0],[5,14,16],"kraft",2,"Connect a standard handle to a tower, and—if possible—position the cable to shoulder height. If not, a low pulley will suffice.\nWith your side to the cable, grab the handle with both hands and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.\nWith your feet positioned hip-width apart and knees slightly bent, hold the cable to the middle of your chest. This will be your starting position.\nPress the cable away from your chest, fully extending both arms. You core should be tight and engaged.\nHold the repetition for several seconds before returning to the starting position.\nAt the conclusion of the set, repeat facing the other direction."],["Pallof_Press_With_Rotation","Pallof Press With Rotation","","Kraft","Kabelzug",[0],[5,14,16],"kraft",2,"Connect a standard handle to a tower, and position the cable to shoulder height.\nWith your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Align outstretched arm with cable.\nWith your feet positioned hip-width apart, pull the cable into your chest and grab the handle with your other hand. Both hands should be on the handle at this time.\nFacing forward, press the cable away from your chest. You core should be tight and engaged.\nKeeping your hips straight, twist your torso away from the pulley until you get a full quarter rotation.\nMaintain your rigid stance and straight arms. Return to the neutral position in a slow and controlled manner. Your arms should be extended in front of you.\nWith the side tension still engaging your core, bring your hands to your chest and immediately press outward to a fully extended position. This constitutes one rep.\nRepeat to failure.\nThen, reposition and repeat the same series of movements on the opposite side."],["Palms-Down_Dumbbell_Wrist_Curl_Over_A_Bench","Palms-Down Dumbbell Wrist Curl Over A Bench","","Kraft","Kurzhantel",[6],[],"kraft",2,"Start out by placing two dumbbells on one side of a flat bench.\nKneel down on both of your knees so that your body is facing the flat bench.\nUse your arms to grab both of the dumbbells with a pronated grip (palms facing down) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.\nStart out by curling your wrist upwards and exhaling.\nSlowly lower your wrists back down to the starting position while inhaling.\nYour forearms should be stationary as your wrist is the only movement needed to perform this exercise.\nRepeat for the recommended amount of repetitions."],["Palms-Down_Wrist_Curl_Over_A_Bench","Palms-Down Wrist Curl Over A Bench","","Kraft","Langhantel",[6],[],"kraft",2,"Start out by placing a barbell on one side of a flat bench.\nKneel down on both of your knees so that your body is facing the flat bench.\nUse your arms to grab the barbell with a pronated grip (palms down) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.\nStart out by curling your wrist upwards and exhaling.\nSlowly lower your wrists back down to the starting position while inhaling.\nYour forearms should be stationary as your wrist is the only movement needed to perform this exercise.\nRepeat for the recommended amount of repetitions."],["Palms-Up_Barbell_Wrist_Curl_Over_A_Bench","Palms-Up Barbell Wrist Curl Over A Bench","","Kraft","Langhantel",[6],[],"kraft",2,"Start out by placing a barbell on one side of a flat bench.\nKneel down on both of your knees so that your body is facing the flat bench.\nUse your arms to grab the barbell with a supinated grip (palms up) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.\nStart out by curling your wrist upwards and exhaling.\nSlowly lower your wrists back down to the starting position while inhaling.\nYour forearms should be stationary as your wrist is the only movement needed to perform this exercise.\nRepeat for the recommended amount of repetitions."],["Palms-Up_Dumbbell_Wrist_Curl_Over_A_Bench","Palms-Up Dumbbell Wrist Curl Over A Bench","","Kraft","Kurzhantel",[6],[],"kraft",2,"Start out by placing two dumbbells on one side of a flat bench.\nKneel down on both of your knees so that your body is facing the flat bench.\nUse your arms to grab both of the dumbbells with a supinated grip (palms up) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.\nStart out by curling your wrist upwards and exhaling.\nSlowly lower your wrists back down to the starting position while inhaling. Make sure to inhale during this part of the exercise.\nYour forearms should be stationary as your wrist is the only movement needed to perform this exercise.\nRepeat for the recommended amount of repetitions."],["Parallel_Bar_Dip","Parallel Bar Dip","","Kraft","Sonstiges",[16],[5,14],"kraft",2,"Stand between a set of parallel bars. Place a hand on each bar, and then take a small jump to help you get into the starting position with your arms locked out.\nBegin by flexing the elbow, lowering your body until your arms break 90 degrees. Avoid swinging, and maintain good posture throughout the descent.\nReverse the motion by extending the elbow, pushing yourself back up into the starting position.\nRepeat for the desired number of repetitions."],["Pelvic_Tilt_Into_Bridge","Pelvic Tilt Into Bridge","","Dehnen","Ohne",[10],[],"zeit",2,"Lie down with your feet on the floor, heels directly under your knees.\nLift only your tailbone to the ceiling to stretch your lower back. (Don't lift the entire spine yet.) Pull in your stomach.\nTo go into a bridge, lift the entire spine except the neck."],["Peroneals-SMR","Peroneals-SMR","","Dehnen","Faszienrolle",[4],[],"zeit",2,"Lay on your side, supporting your weight on your forearm and on a foam roller placed on the outside of your lower leg. Your upper leg can either be on top of your lower leg, or you can cross it in front of you. This will be your starting position.\nRaise your hips off of the ground and begin to roll from below the knee to above the ankle on the side of your leg, pausing at points of tension for 10-30 seconds. Repeat on the other leg."],["Peroneals_Stretch","Peroneals Stretch","","Dehnen","Sonstiges",[4],[],"zeit",2,"In a seated position, loop a belt, rope, or band around one foot. This will be your starting position.\nWith the leg extended and the heel off of the ground, pull on the belt so that the foot is inverted, with the inside of the foot being pulled towards you. Hold for 10-20 seconds, and then switch sides."],["Physioball_Hip_Bridge","Physioball Hip Bridge","","Kraft","Gymnastikball",[7],[8],"kraft",2,"Lay on a ball so that your upper back is on the ball with your hips unsupported. Both feet should be flat on the floor, hip width apart or wider. This will be your starting position.\nBegin by extending the hips using your glutes and hamstrings, raising your hips upward as you bridge.\nPause at the top of the motion and return to the starting position."],["Pin_Presses","Pin Presses","","Powerlifting","Langhantel",[16],[5,6,9,11,14],"kraft",2,"Pin presses remove the eccentric phase of the bench press, developing starting strength. They also allow you to train a desired range of motion.\nThe bench should be set up in a power rack. Set the pins to the desired point in your range of motion, whether it just be lockout or an inch off of your chest. The bar should be moved to the pins and prepared for lifting.\nBegin by lying on the bench, with the bar directly above the contact point during your regular bench. Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.\nYou can take a standard bench grip, or shoulder width to focus on the triceps. The bar, wrist, and elbow should stay in line at all times. Focus on squeezing the bar and trying to pull it apart.\nDrive the bar up with as much force as possible. The elbows should be tucked in until lockout.\nReturn the bar to the pins, pausing before beginning the next repetition."],["Piriformis-SMR","Piriformis-SMR","","Dehnen","Faszienrolle",[7],[],"zeit",2,"Sit with your buttocks on top of a foam roll. Bend your knees, and then cross one leg so that the ankle is over the knee. This will be your starting position.\nShift your weight to the side of the crossed leg, rolling over the buttocks until you feel tension in your upper glute. You may assist the stretch by using one hand to pull the bent knee towards your chest. Hold this position for 10-30 seconds, and then switch sides."],["Plank","Plank","Unterarmstütz (Plank)","Kraft","Körpergewicht",[0],[],"zeit",2,"Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.\nKeep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."],["Plate_Pinch","Plate Pinch","","Kraft","Sonstiges",[6],[],"kraft",2,"Grab two wide-rimmed plates and put them together with the smooth sides facing outward\nUse your fingers to grip the outside part of the plate and your thumb for the other side thus holding both plates together. This is the starting position.\nSqueeze the plate with your fingers and thumb. Hold this position for as long as you can.\nRepeat for the recommended amount of sets prescribed in your program.\nSwitch arms and repeat the movements."],["Plate_Twist","Plate Twist","","Kraft","Sonstiges",[0],[],"kraft",2,"Lie down on the floor or an exercise mat with your legs fully extended and your upper body upright. Grab the plate by its sides with both hands out in front of your abdominals with your arms slightly bent.\nSlowly cross your legs near your ankles and lift them up off the ground. Your knees should also be bent slightly. Note: Move your upper body back slightly to help keep you balanced turning this exercise. This is the starting position.\nMove the plate to the left side and touch the floor with it. Breathe out as you perform that movement.\nCome back to the starting position as you breathe in and then repeat the movement but this time to the right side of the body. Tip: Use a slow controlled movement at all times. Jerking motions can injure the back.\nRepeat for the recommended amount of repetitions."],["Platform_Hamstring_Slides","Platform Hamstring Slides","","Kraft","Sonstiges",[8],[7],"kraft",2,"For this movement a wooden floor or similar is needed. Lay on your back with your legs extended. Place a gym towel or a light weight underneath your heel. This will be your starting position.\nBegin the movement by flexing the knee, keeping your other leg straight.\nContinue bringing the heel closer to you, sliding it on the floor.\nAt full knee flexion, reverse the movement to return to the starting position."],["Plie_Dumbbell_Squat","Plie Dumbbell Squat","","Kraft","Kurzhantel",[13],[0,4,7,8],"kraft",2,"Hold a dumbbell at the base with both hands and stand straight up. Move your legs so that they are wider than shoulder width apart from each other with your knees slightly bent.\nYour toes should be facing out. Note: Your arms should be stationary while performing the exercise. This is the starting position.\nSlowly bend the knees and lower your legs until your thighs are parallel to the floor. Make sure to inhale as this is the eccentric part of the exercise.\nPress mainly with the heel of the foot to bring the body back to the starting position while exhaling.\nRepeat for the recommended amount of repetitions."],["Plyo_Kettlebell_Pushups","Plyo Kettlebell Pushups","","Kraft","Kettlebell",[5],[14,16],"kraft",2,"Place a kettlebell on the floor. Place yourself in a pushup position, on your toes with one hand on the ground and one hand holding the kettlebell, with your elbows extended. This will be your starting position.\nBegin by lowering yourself as low as you can, keeping your back straight.\nQuickly and forcefully reverse direction, pushing yourself up to the other side of the kettlebell, switching hands as you do so. Continue the movement by descending and repeating the movement back and forth."],["Plyo_Push-up","Plyo Push-up","","Plyometrie","Körpergewicht",[5],[14,16],"body",2,"Move into a prone position on the floor, supporting your weight on your hands and toes.\nYour arms should be fully extended with the hands around shoulder width. Keep your body straight throughout the movement. This will be your starting position.\nDescend by flexing at the elbow, lowering your chest towards the ground.\nAt the bottom, reverse the motion by pushing yourself up through elbow extension as quickly as possible. Attempt to push your upper body up until your hands leave the ground.\nReturn to the starting position and repeat the exercise.\nFor added difficulty, add claps into the movement while you are air borne."],["Posterior_Tibialis_Stretch","Posterior Tibialis Stretch","","Dehnen","Sonstiges",[4],[],"zeit",2,"In a seated position, loop a belt, rope, or band around one foot. This will be your starting position.\nWith the leg extended and the heel off of the ground, pull on the belt so that the foot is everted, with the outside of the foot being pulled towards you. Hold for 10-20 seconds, and then switch sides."],["Power_Clean","Power Clean","Power Clean","Kraft","Langhantel",[8],[4,6,7,10,11,13,14,15,16],"kraft",2,"Stand with your feet slightly wider than shoulder width apart and toes pointing out slightly.\nSquat down and grasp bar with a closed, pronated grip. Your hands should be slightly wider than shoulder width apart outside knees with elbows fully extended.\nPlace the bar about 1 inch in front of your shins and over the balls of your feet.\nYour back should be flat or slightly arched, your chest held up and out and your shoulder blades should be retracted.\nKeep your head in a neutral position (in line with vertebral column and not tilted or rotated) with your eyes focused straight ahead. Inhale during this phase.\nLift the bar from the floor by forcefully extending the hips and the knees as you exhale. Tip: The upper torso should maintain the same angle. Do not bend at the waist yet and do not let the hips rise before the shoulders (this would have the effect of pushing the glutes in the air and stretching the hamstrings.\nKeep elbows fully extended with the head in a neutral position and the shoulders over the bar.\nAs the bar raises keep it as close to the shins as possible.\nAs the bar passes the knees, thrust your hips forward and slightly bend the knees to avoid locking them. Tip: At this point your thighs should be against the bar.\nKeep the back flat or slightly arched, elbows fully extended and your head neutral. Tip: You will hold your breath until the next phase.\nInhale and then forcefully and quickly extend your hips and knees and stand on your toes.\nKeep the bar as close to your body as possible. Tip: Your back should be flat with the elbows pointed out to the sides and your head in a neutral position. Also, keep your shoulders over the bar and arms straight as long as possible.\nWhen your lower body joints are fully extended, shrug the shoulders upward rapidly without letting the elbows flex yet. Exhale during this portion of the movement.\nAs the shoulders reach their highest elevation flex your elbows to begin pulling your body under the bar.\nContinue to pull the arms as high and as long as possible. Tip: Due to the explosive nature of this phase, your torso will be erect or with an arched back, your head will be tilted back slightly and your feet may lose contact with the floor.\nAfter the lower body has fully extended and the bar reaches near maximal height, pull your body under the bar and rotate the arms around and under the bar.\nSimultaneously, flex the hips and knees into a quarter squat position.\nOnce the arms are under the bar, inhale and then lift your elbows to position the upper arms parallel to the floor. Rack the bar across the front of your collar bones and front shoulder muscles.\nCatch the bar with an erect and tight torso, a neutral head position and flat feet. Exhale during this movement.\nStand up by extending the hips and knees to a fully erect position.\nLower the bar by gradually reducing the muscular tension of the arms to allow a controlled descent of the bar to the thighs. Inhale during this movement.\nSimultaneously flex the hips and knees to cushion the impact of the bar on the thighs.\nSquat down with the elbows fully extended until the bar touches the floor.\nStart over at Phase 1 and repeat for the recommended amount of repetitions."],["Power_Clean_from_Blocks","Power Clean from Blocks","","Gewichtheben","Langhantel",[8],[13],"kraft",2,"With a barbell on boxes of the desired height, take a grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.\nBegin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. As the bar approaches the mid-thigh position, begin extending through the hips.\nIn a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward. There should be no need to actively pull through the arms to accelerate the weight. At the end of the second pull, the body should be fully extended, leaning slightly back, with the arms still extended.\nAs full extension is achieved, transition into the third pull by aggressively shrugging and flexing the arms with the elbows up and out. At peak extension, pull yourself under the bar far enough that it can be racked onto the shoulders, rotating your elbows under the bar as you do so. The bar should be racked onto the protracted shoulders, lightly touching the throat with the hands relaxed.\nImmediately recover by driving through the heels, keeping the torso upright and elbows up. Continue until you have risen to a standing position, and complete the repetition by returning the weight to the boxes."],["Power_Jerk","Power Jerk","","Gewichtheben","Langhantel",[13],[0,4,7,8,14,16],"kraft",2,"Standing with the weight racked on the front of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward. Go down only slightly, and reverse direction as powerfully as possible.\nDrive through the heels create as much speed and force as possible, and be sure to move your head out of the way as the bar leaves the shoulders.\nAt this moment as the feet leave the floor, the feet must be placed into the receiving position as quickly as possible. In the brief moment the feet are not actively driving against the platform, the athletes effort to push the bar up will drive them down. The feet should be moved to a slightly wider stance, with the knees partially bent.\nReceive the bar with the arms locked out overhead.\nReturn to a standing position."],["Power_Partials","Power Partials","","Kraft","Kurzhantel",[14],[],"kraft",2,"Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.\nThe palms of the hands should be facing your torso. Your feet should be about shoulder width apart. This will be your starting position.\nKeeping your arms straight and the torso stationary, lift the weights out to your sides until they are about shoulder level height while exhaling.\nFeel the contraction for a second and begin to lower the weights back down to the starting position while inhaling. Tip: Keep the palms facing down with the little finger slightly higher while lifting and lowering the weights as it will concentrate the stress on your shoulders mainly.\nRepeat for the recommended amount of repetitions."],["Power_Snatch","Power Snatch","","Gewichtheben","Langhantel",[8],[4,7,10,13,14,15,16],"kraft",2,"Begin with a loaded barbell on the floor. The bar should be close to or touching the shins, and a wide grip should be taken on the bar. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar. This will be the starting position.\nBegin the first pull by driving through the front of the heels, raising the bar from the ground. The back angle should stay the same until the bar passes the knees.\nTransition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body. At peak extension, shrug the shoulders and allow the elbows to flex to the side.\nAs you move your feet into the receiving position, a slightly wider position, pull yourself below the bar as you elevate the bar overhead. The bar should be received in a partial squat. Continue raising the bar to the overhead position, receiving the bar locked out overhead.\nReturn to a standing position with the weight over head."],["Power_Snatch_from_Blocks","Power Snatch from Blocks","","Gewichtheben","Langhantel",[13],[4,6,7,8,10,14,15,16],"kraft",2,"Begin with a loaded barbell on boxes or stands of the desired height. A wide grip should be taken on the bar. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar, with the elbows pointed out. This will be the starting position.\nBegin the first pull by driving through the front of the heels, raising the bar from the boxes.\nTransition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body. At peak extension, shrug the shoulders and allow the elbows to flex to the side.\nAs you move your feet into the receiving position, forcefully pull yourself below the bar as you elevate the bar overhead. The feet should move to just outside the hips, turned out as necessary. Receive the bar above a full squat and with the arms fully extended overhead.\nKeeping the bar aligned over the front of the heels, your head and chest up, drive through heels of the feet to move to a standing position. Carefully return the weight to the boxes."],["Power_Stairs","Power Stairs","","Strongman","Sonstiges",[8],[2,4,7,10,13,14,15],"kraft",2,"In the power stairs, implements are moved up a staircase. For training purposes, these can be performed with a tire or box.\nBegin by taking the implement with both hands. Set your feet wide, with your head and chest up. Drive through the ground with your heels, extending your knees and hips to raise the weight from the ground.\nAs you lean back, attempt to swing the weight onto the stairs, which are usually around 16-18\" high. You can use your legs to help push the weight onto the stair.\nRepeat for 3-5 repetitions, and continue with a heavier weight, moving as fast as possible."],["Preacher_Curl","Preacher Curl","","Kraft","Langhantel",[3],[],"kraft",2,"To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.\nWith the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.\nAs you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.\nAs you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second.\nRepeat for the recommended amount of repetitions."],["Preacher_Hammer_Dumbbell_Curl","Preacher Hammer Dumbbell Curl","","Kraft","Kurzhantel",[3],[6],"kraft",2,"Place the upper part of both arms on top of the preacher bench as you hold a dumbbell in each hand with the palms facing each other (neutral grip).\nAs you breathe in, slowly lower the dumbbells until your upper arm is extended and the biceps is fully stretched.\nAs you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the dumbbells are at shoulder height.\nSqueeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions."],["Press_Sit-Up","Press Sit-Up","","Kraft","Langhantel",[0],[5,14,16],"kraft",2,"To begin, lie down on a bench with a barbell resting on your chest. Position your legs so they are secure on the extension of the abdominal bench. This is the starting position.\nWhile inhaling, tighten your abdominals and glutes. Simultaneously curl your torso as you do when performing a sit-up and press the barbell to an overhead position while exhaling. Tip: Use your arms to push the barbell out as you perform this exercise while still focusing on the abdominal muscles.\nLower your upper body back down to the starting position while bringing the barbell back down to your torso. Remember to breathe in while lowering the body.\nRepeat for the recommended amount of repetitions."],["Prone_Manual_Hamstring","Prone Manual Hamstring","","Kraft","Ohne",[8],[],"kraft",2,"You will need a partner for this exercise. Lay face down with your legs straight. Your assistant will place their hand on your heel.\nTo begin, flex the knee to curl your leg up. Your partner should provide resistance, starting light and increasing the pressure as the movement is completed. Communicate with your partner to monitor appropriate resistance levels.\nPause at the top, returning the leg to the starting position as your partner provides resistance going the other direction."],["Prowler_Sprint","Prowler Sprint","","Cardio","Sonstiges",[8],[4,5,7,13,14],"cardio",2,"Place your sled on an appropriate surface, loaded to a suitable weight. The sled should provide enough resistance to require effort, but not so heavy that you are significantly slowed down.\nYou may use the upright or the low handles for this exercise. Place your hands on the handles with your arms extended, leaning into the implement.\nWith good posture, drive through the ground with alternating, short steps. Move as fast as you can for a short distance."],["Pull_Through","Pull Through","","Kraft","Kabelzug",[7],[8,10],"kraft",2,"Begin standing a few feet in front of a low pulley with a rope or handle attached. Face away from the machine, straddling the cable, with your feet set wide apart.\nBegin the movement by reaching through your legs as far as possible, bending at the hips. Keep your knees slightly bent. Keeping your arms straight, extend through the hip to stand straight up. Avoid pulling upward through the shoulders; all of the motion should originate through the hips."],["Pullups","Pullups","Klimmzüge","Kraft","Körpergewicht",[9],[3,11],"body",2,"Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.\nAs you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.\nPull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.\nAfter a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.\nRepeat this motion for the prescribed amount of repetitions."],["Push-Up_Wide","Push-Up Wide","","Kraft","Körpergewicht",[5],[0,14,16],"body",2,"With your hands wide apart, support your body on your toes and hands in a plank position. Your elbows should be extended and your body straight. Do not allow your hips to sag. This will be your starting position.\nTo begin, allow the elbows to flex, lowering your chest to the floor as you inhale.\nUsing your pectoral muscles, press your upper body back up to the starting position by extending the elbows. Exhale as you perform this step.\nAfter pausing at the contracted position, repeat the movement for the prescribed amount of repetitions."],["Push-Ups_-_Close_Triceps_Position","Push-Ups - Close Triceps Position","","Kraft","Körpergewicht",[16],[5,14],"body",2,"Lie on the floor face down and place your hands closer than shoulder width for a close hand position. Make sure that you are holding your torso up at arms' length.\nLower yourself until your chest almost touches the floor as you inhale.\nUsing your triceps and some of your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.\nAfter a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."],["Push-Ups_With_Feet_Elevated","Push-Ups With Feet Elevated","","Kraft","Körpergewicht",[5],[14,16],"body",2,"Lie on the floor face down and place your hands about 36 inches apart from each other holding your torso up at arms length.\nPlace your toes on top of a flat bench. This will allow your body to be elevated. Note: The higher the elevation of the flat bench, the higher the resistance of the exercise is.\nLower yourself until your chest almost touches the floor as you inhale.\nUsing your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.\nAfter a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."],["Push-Ups_With_Feet_On_An_Exercise_Ball","Push-Ups With Feet On An Exercise Ball","","Kraft","Gymnastikball",[5],[14,16],"kraft",2,"Lie on the floor face down and place your hands about 36 inches apart from each other holding your torso up at arms length.\nPlace your toes on top of an exercise ball. This will allow your body to be elevated.\nLower yourself until your chest almost touches the floor as you inhale.\nUsing your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.\nAfter a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."],["Push_Press","Push Press","","Gewichtheben","Langhantel",[14],[13,16],"kraft",2,""],["Push_Press_-_Behind_the_Neck","Push Press - Behind the Neck","","Gewichtheben","Langhantel",[14],[4,13,16],"kraft",2,"Standing with the weight racked on the back of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward. Go down only slightly, and reverse direction as powerfully as possible. Drive through the heels create as much speed and force as possible, moving the bar in a vertical path.\nUsing the momentum generated, finish pressing the weight overhead be extending through the arms.\nReturn to the starting position, using your legs to absorb the impact."],["Push_Up_to_Side_Plank","Push Up to Side Plank","","Kraft","Körpergewicht",[5],[0,14,16],"body",2,"Get into pushup position on the toes with your hands just outside of shoulder width.\nPerform a pushup by allowing the elbows to flex. As you descend, keep your body straight.\nDo one pushup and as you come up, shift your weight on the left side of the body, twist to the side while bringing the right arm up towards the ceiling in a side plank.\nLower the arm back to the floor for another pushup and then twist to the other side.\nRepeat the series, alternating each side, for 10 or more reps."],["Pushups","Pushups","Liegestütze","Kraft","Körpergewicht",[5],[14,16],"body",2,"Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.\nNext, lower yourself downward until your chest almost touches the floor as you inhale.\nNow breathe out and press your upper body back up to the starting position while squeezing your chest.\nAfter a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."],["Pushups_Close_and_Wide_Hand_Positions","Pushups (Close and Wide Hand Positions)","","Kraft","Körpergewicht",[5],[14,16],"body",2,"Lie on the floor face down and body straight with your toes on the floor and the hands wider than shoulder width for a wide hand position and closer than shoulder width for a close hand position. Make sure you are holding your torso up at arms length.\nLower yourself until your chest almost touches the floor as you inhale.\nUsing your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.\nAfter a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."],["Pyramid","Pyramid","","Dehnen","Gymnastikball",[10],[14],"zeit",2,"Start off by rolling your torso forward onto the ball so your hips rest on top of the ball and become the highest point of your body.\nRest your hands and feet on the floor. Your arms and legs can be slightly bent or straight, depending on the size of the ball, your flexibility, and the length of your limbs. This also helps develop stabilizing strength in your torso and shoulders."],["Quad_Stretch","Quad Stretch","","Dehnen","Sonstiges",[13],[],"zeit",2,"Lay on your side. Loop a belt, rope, or band around your top foot. Flex the knee and extend your hip, attempting to touch your glutes with your foot, and holding the belt with your hands. This will be your starting position.\nWith the belt being held over the shoulder or overhead, gently pull to increase the stretch in the quadriceps. Hold for 10-20 seconds, and then switch sides."],["Quadriceps-SMR","Quadriceps-SMR","","Dehnen","Faszienrolle",[13],[],"zeit",2,"Lay facedown on the floor with your weight supported by your hands or forearms. Place a foam roll underneath one leg on the quadriceps, and keep the foot off of the ground. Make sure to relax the leg as much as possible. This will be your starting position.\nShifting as much weight onto the leg to be stretched as is tolerable, roll over the foam from above the knee to below the hip, holding points of tension for 10-30 seconds. Switch sides."],["Quick_Leap","Quick Leap","","Plyometrie","Sonstiges",[13],[4,8],"kraft",2,"You will need a box for this exerise.\nBegin facing the box standing 1-2 feet from its edge.\nBy utilizing your hips, hop onto the box, landing on both legs. Ensure that you land with your legs bent and your feet flat.\nImmediately upon landing, fully extend through the entire body and swing your arms overhead to explode off of the box. Use your legs to absorb the impact of landing."],["Rack_Delivery","Rack Delivery","","Gewichtheben","Langhantel",[14],[6,15],"kraft",2,"This drill teaches the delivery of the barbell to the rack position on the shoulders. Begin holding a bar in the scarecrow position, with the upper arms parallel to the floor, and the forearms hanging down. Use a hook grip, with your fingers wrapped over your thumbs.\nBegin by rotating the elbows around the bar, delivering the bar to the shoulders. As your elbows come forward, relax your grip. The shoulders should be protracted, providing a shelf for the bar, which should lightly contact the throat.\nIt is important that the bar stay close to the body at all times, as with a heavier load any distance will result in an unwanted collision. As the movement becomes smoother, speed and load can be increased before progressing further."],["Rack_Pull_with_Bands","Rack Pull with Bands","","Powerlifting","Langhantel",[10],[6,7,8,13,15],"kraft",2,"Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Attach bands to the base of the rack, or secure them with dumbbells. Attach the other end to the bar. You may need to choke the bands to provide tension.\nPosition yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.\nWith your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement. Return the weight to the pins and repeat."],["Rack_Pulls","Rack Pulls","","Powerlifting","Langhantel",[10],[6,7,8,15],"kraft",2,"Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Position yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.\nWith your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement.\nReturn the weight to the pins and repeat."],["Rear_Leg_Raises","Rear Leg Raises","","Dehnen","Körpergewicht",[13],[],"zeit",2,"Place yourself on your hands knees on an exercise mat. Your head should be looking forward and the bend of the knees should create a 90-degree angle between the hamstrings and the calves. This will be your starting position.\nExtend one leg up and behind you. The knee and hip should both extend. Repeat for 5-10 repetitions, and then switch sides."],["Recumbent_Bike","Recumbent Bike","","Cardio","Maschine",[13],[4,7,8],"cardio",2,"To begin, seat yourself on the bike and adjust the seat to your height.\nSelect the desired option from the menu. You may have to start pedaling to turn it on. You can use the manual setting, or you can select a program to use. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. The level of resistance can be changed throughout the workout. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity.\nRecumbent bikes offer convenience, cardiovascular benefits, and have less impact than other activities. A 150 lb person will burn about 230 calories cycling at a moderate rate for 30 minutes, compared to 450 calories or more running."],["Return_Push_from_Stance","Return Push from Stance","","Plyometrie","Medizinball",[14],[5,16],"kraft",2,"You will need a partner for this drill.\nBegin in an athletic 2 or 3 point stance.\nAt the signal, move into a position to receive the pass from your partner.\nCatch the medicine ball with both hands and immediately throw it back to your partner.\nYou can modify this drill by running different routes."],["Reverse_Band_Bench_Press","Reverse Band Bench Press","","Powerlifting","Langhantel",[16],[5,6,9,11,14],"kraft",2,"Position a bench inside a power rack, with the bar set to the correct height. Begin by anchoring bands either to band pegs or to the top of the rack. Ensure that you will be position properly under the bands. Attach the other end to the barbell.\nLie on the bench, tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement. However wide your grip, it should cover the ring on the bar.\nPull the bar out of the rack without protracting your shoulders. Focus on squeezing the bar and trying to pull it apart. Lower the bar to your lower chest or upper stomach. The bar, wrist, and elbow should stay in line at all times.\nPause when the barbell touches your torso, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."],["Reverse_Band_Box_Squat","Reverse Band Box Squat","","Powerlifting","Langhantel",[13],[1,2,4,6,7,8,10],"kraft",2,"Begin in a power rack with a box at the appropriate height behind you. Set up the bands either on band pegs or attached to the top of the rack, ensuring they will be directly above the bar during the squat. Attach the other end to the bar.\nBegin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.\nWith your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.\nKeeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe. Use care to return the barbell to the rack."],["Reverse_Band_Deadlift","Reverse Band Deadlift","","Powerlifting","Langhantel",[10],[1,2,4,7,8,13],"kraft",2,"Set the bar up in a power rack. Attach bands to the top of the rack, using either bands pegs or the frame itself. Attach the other end of the bands to the bar.\nApproach the bar so that it is centered over your feet. You feet should be about hip width apart. Bend at the hip to grip the bar at shoulder width, allowing your shoulder blades to protract. Typically, you would use an overhand grip or an over/under grip on heavier sets.\nWith your feet, and your grip set, take a big breath and then lower your hips and bend the knees until your shins contact the bar. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward.\nAfter the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.\nLower the bar by bending at the hips and guiding it to the floor."],["Reverse_Band_Power_Squat","Reverse Band Power Squat","","Powerlifting","Langhantel",[13],[2,4,7,8,10],"kraft",2,"Begin in a power rack with the pins and bar set at the appropriate height. After loading the bar, attach bands to the top of the rack, using either pegs or the frame itself. Attach the other end of the bands to the bar.\nBegin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wide for more emphasis on the back, glutes, adductors, and hamstrings.\nKeep your head facing forward. With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips as much as possible. Ideally, your shins should be perpendicular to the ground. Lower bar position necessitates a greater torso lean to keep the bar over the heels. Continue until you break parallel, which is defined as the crease of the hip being in line with the top of the knee.\nKeeping the weight on your heels and pushing your feet and knees out, drive upward as you lead the movement with your head. Continue upward, maintaining tightness head to toe, until you have returned to the starting position."],["Reverse_Band_Sumo_Deadlift","Reverse Band Sumo Deadlift","","Powerlifting","Langhantel",[8],[1,2,4,6,7,10,13,15],"kraft",2,"Begin with a bar loaded on the floor inside of a power rack. Attach bands to the top of the rack, using either pegs or the frame itself. Attach the other end to the barbell.\nApproach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.\nTake a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.\nAs the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.\nReturn the weight to the ground by bending at the hips and controlling the weight on the way down."],["Reverse_Barbell_Curl","Reverse Barbell Curl","","Kraft","Langhantel",[3],[6],"kraft",2,"Stand up with your torso upright while holding a barbell at shoulder width with the elbows close to the torso. The palm of your hands should be facing down (pronated grip). This will be your starting position.\nWhile holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.\nSlowly begin to bring the bar back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions."],["Reverse_Barbell_Preacher_Curls","Reverse Barbell Preacher Curls","","Kraft","SZ-Stange",[3],[6],"kraft",2,"Grab an EZ-bar using a shoulder width and palms down (pronated) grip.\nNow place the upper part of both arms on top of the preacher bench and have your arms extended. This will be your starting position.\nAs you exhale, use the biceps to curl the weight up until your biceps are fully contracted and the barbell is at shoulder height. Squeeze the biceps hard for a second at the contracted position.\nAs you breathe in, slowly lower the barbell until your upper arms are extended and the biceps is fully stretched.\nRepeat for the recommended amount of repetitions."],["Reverse_Cable_Curl","Reverse Cable Curl","","Kraft","Kabelzug",[3],[6],"kraft",2,"Stand up with your torso upright while holding a bar attachment that is attached to a low pulley using a pronated (palms down) and shoulder width grip. Make sure also that you keep the elbows close to the torso. This will be your starting position.\nWhile holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.\nSlowly begin to bring the bar back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions."],["Reverse_Crunch","Reverse Crunch","","Kraft","Körpergewicht",[0],[],"body",2,"Lie down on the floor with your legs fully extended and arms to the side of your torso with the palms on the floor. Your arms should be stationary for the entire exercise.\nMove your legs up so that your thighs are perpendicular to the floor and feet are together and parallel to the floor. This is the starting position.\nWhile inhaling, move your legs towards the torso as you roll your pelvis backwards and you raise your hips off the floor. At the end of this movement your knees will be touching your chest.\nHold the contraction for a second and move your legs back to the starting position while exhaling.\nRepeat for the recommended amount of repetitions."],["Reverse_Flyes","Reverse Flyes","Reverse Flys","Kraft","Kurzhantel",[14],[],"kraft",2,"To begin, lie down on an incline bench with the chest and stomach pressing against the incline. Have the dumbbells in each hand with the palms facing each other (neutral grip).\nExtend the arms in front of you so that they are perpendicular to the angle of the bench. The legs should be stationary while applying pressure with the ball of your toes. This is the starting position.\nMaintaining the slight bend of the elbows, move the weights out and away from each other (to the side) in an arc motion while exhaling. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.\nThe arms should be elevated until they are parallel to the floor.\nFeel the contraction and slowly lower the weights back down to the starting position while inhaling.\nRepeat for the recommended amount of repetitions."],["Reverse_Flyes_With_External_Rotation","Reverse Flyes With External Rotation","","Kraft","Kurzhantel",[14],[],"kraft",2,"To begin, lie down on an incline bench set at a 30-degree angle with the chest and stomach pressing against the incline.\nHave the dumbbells in each hand with the palms facing down to the floor. Your arms should be in front of you so that they are perpendicular to the angle of the bench. Tip: Your elbows should have a slight bend. The legs should be stationary while applying pressure with the ball of your toes (your heels should not be touching the floor). This is the starting position.\nMaintaining the slight bend of the elbows, move the weights out and away from each other in an arc motion while exhaling.\nAs you lift the weight, your wrist should externally rotate by 90-degrees so that you go from a palms down (pronated) grip to a palms facing each other (neutral) grip. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.\nThe arms should be elevated until they are level with the head.\nFeel the contraction and slowly lower the weights back down to the starting position while inhaling.\nRepeat for the recommended amount of repetitions."],["Reverse_Grip_Bent-Over_Rows","Reverse Grip Bent-Over Rows","","Kraft","Langhantel",[11],[3,9,14],"kraft",2,"Stand erect while holding a barbell with a supinated grip (palms facing up).\nBend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.\nWhile keeping the torso stationary, lift the barbell as you breathe out, keeping the elbows close to the body and not doing any force with the forearm other than holding the weights. On the top contracted position, squeeze the back muscles and hold for a second.\nSlowly lower the weight again to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Reverse_Grip_Triceps_Pushdown","Reverse Grip Triceps Pushdown","","Kraft","Kabelzug",[16],[],"kraft",2,"Start by setting a bar attachment (straight or e-z) on a high pulley machine.\nFacing the bar attachment, grab it with the palms facing up (supinated grip) at shoulder width. Lower the bar by using your lats until your arms are fully extended by your sides. Tip: Elbows should be in by your sides and your feet should be shoulder width apart from each other. This is the starting position.\nSlowly elevate the bar attachment up as you inhale so it is aligned with your chest. Only the forearms should move and the elbows/upper arms should be stationary by your side at all times.\nThen begin to lower the cable bar back down to the original staring position while exhaling and contracting the triceps hard.\nRepeat for the recommended amount of repetitions."],["Reverse_Hyperextension","Reverse Hyperextension","","Kraft","Maschine",[8],[4,7],"kraft",2,"Place your feet between the pads after loading an appropriate weight. Lay on the top pad, allowing your hips to hang off the back, while grasping the handles to hold your position.\nTo begin the movement, flex the hips, pulling the legs forward.\nReverse the motion by extending the hips, kicking the leg back. It is very important not to over-extend the hip on this movement, stopping short of your full range of motion.\nReturn by again flexing the hip, pulling the carriage forward as far as you can.\nRepeat for the desired number of repetitions."],["Reverse_Machine_Flyes","Reverse Machine Flyes","","Kraft","Maschine",[14],[],"kraft",2,"Adjust the handles so that they are fully to the rear. Make an appropriate weight selection and adjust the seat height so the handles are at shoulder level. Grasp the handles with your hands facing inwards. This will be your starting position.\nIn a semicircular motion, pull your hands out to your side and back, contracting your rear delts.\nKeep your arms slightly bent throughout the movement, with all of the motion occurring at the shoulder joint.\nPause at the rear of the movement, and slowly return the weight to the starting position."],["Reverse_Plate_Curls","Reverse Plate Curls","","Kraft","Sonstiges",[3],[6],"kraft",2,"Start by standing straight with a weighted plate held by both hands and arms fully extended. Use a pronated grip (palms facing down) and make sure your fingers grab the rough side of the plate while your thumb grabs the smooth side. Note: For the best results, grab the weighted plate at an 11:00 and 1:00 o'clock position.\nYour feet should be shoulder width apart from each other and the weighted plate should be near the groin area. This is the starting position.\nSlowly lift the plate up while keeping the elbows in and the upper arms stationary until your biceps and forearms touch while exhaling. The plate should be evenly aligned with your torso at this point.\nFeel the contraction for a second and begin to lower the weight back down to the starting position while inhaling\nRepeat for the recommended amount of repetitions."],["Reverse_Triceps_Bench_Press","Reverse Triceps Bench Press","","Kraft","Langhantel",[16],[5,14],"kraft",2,"Lie back on a flat bench. Using a close, supinated grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked extended in front of you and perpendicular to the floor. This will be your starting position.\nAs you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that as opposed to a regular bench press, you keep the elbows close to the torso at all times in order to maximize triceps involvement.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the bar back in the rack."],["Rhomboids-SMR","Rhomboids-SMR","","Dehnen","Faszienrolle",[11],[15],"zeit",2,"Lay down with your back on the floor. Place a foam roll underneath your upper back, and cross your arms in front of you, protracting your shoulders. This will be your starting position.\nRaise your hips off of the ground, placing your weight onto the foam roll. Shift your weight to one side at a time, rolling over your middle and upper back. Pause at points of tension for 10-30 seconds."],["Rickshaw_Carry","Rickshaw Carry","","Strongman","Sonstiges",[6],[0,4,7,8,10,13,15],"kraft",2,"Position the frame at the starting point, and load with the appropriate weight. Standing in the center of the frame, begin by gripping the handles and driving through your heels to lift the frame. Ensure your chest and head are up and your back is straight.\nImmediately begin walking briskly with quick, controlled steps. Keep your chest up and head forward, and make sure you continue breathing. Bring the frame to the ground after you have reached the end point."],["Rickshaw_Deadlift","Rickshaw Deadlift","","Strongman","Sonstiges",[13],[6,7,8,10,15],"kraft",2,"Load the frame with the desired weight. Center yourself between the handles. You feet should be about hip width apart. Bend at the hips to grip the handles, allowing your shoulder blades to protract.\nWith your feet and your grip set, take a big breath and then lower your hips and flex the knees. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward. As the weight comes up, pull your shoulder blades together as you drive your hips forward.\nLower the weight by bending at the hips and guiding it to the ground."],["Ring_Dips","Ring Dips","","Kraft","Sonstiges",[16],[5,14],"kraft",2,"Grip a ring in each hand, and then take a small jump to help you get into the starting position with your arms locked out.\nBegin by flexing the elbow, lowering your body until your arms break 90 degrees. Avoid swinging, and maintain good posture throughout the descent.\nReverse the motion by extending the elbow, pushing yourself back up into the starting position.\nRepeat for the desired number of repetitions."],["Rocket_Jump","Rocket Jump","","Plyometrie","Körpergewicht",[13],[4,8],"body",2,"Begin in a relaxed stance with your feet shoulder width apart and hold your arms close to the body.\nTo initiate the move, squat down halfway and explode back up as high as possible.\nFully extend your entire body, reaching overhead as far as possible. As you land, absorb your impact through the legs."],["Rocking_Standing_Calf_Raise","Rocking Standing Calf Raise","","Kraft","Langhantel",[4],[],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place it on the back of your shoulders (slightly below the neck).\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance. Also maintain a straight back and keep the knees with a slight bend; never locked. This will be your starting position.\nRaise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending (other than the slight initial bend we created during positioning) at any time. Hold the contracted position by a second before you start to go back down.\nGo back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.\nNow lift your toes by contracting the tibia muscles in the front of the calves as you breathe out.\nHold for a second and bring them back down as you breathe in.\nRepeat for the recommended amount of repetitions."],["Rocky_Pull-Ups_Pulldowns","Rocky Pull-Ups/Pulldowns","","Kraft","Sonstiges",[9],[3,11,14],"kraft",2,"Grab the pull-up bar with the palms facing forward using a wide grip.\nAs you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.\nPull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.\nAfter a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.\nNow repeat the same movements as described above except this time your torso will remain straight as you go up and the bar will touch the back of the neck instead of the upper chest. Tip: Use the head to lean forward slightly as it will help you properly execute this portion of the exercise.\nOnce you have lowered yourself back down to the starting position, repeat the exercise for the prescribed amount of repetitions in your program."],["Romanian_Deadlift","Romanian Deadlift","Rumänisches Kreuzheben","Kraft","Langhantel",[8],[4,7,10],"kraft",2,"Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.\nBend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.\nKeeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.\nOnce you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement.\nRepeat for the recommended amount of repetitions."],["Romanian_Deadlift_from_Deficit","Romanian Deadlift from Deficit","","Gewichtheben","Langhantel",[8],[6,7,10,15],"kraft",2,"Begin standing while holding a bar at arm's length in front of you. You can stand on a raised platform to increase the range of motion.\nBegin by flexing the knees slightly, and then flex at the hip, moving your butt back as far as possible, lowering the torso as far as flexibility allows. The back should remain in absolute extension at all times, and the bar should remain in contact with the legs. If done properly, there should be heavy tension felt in the hamstrings.\nReverse the motion to return to the starting position."],["Rope_Climb","Rope Climb","Seilklettern","Kraft","Sonstiges",[9],[3,6,11,14],"kraft",2,"Grab the rope with both hands above your head. Pull down on the rope as you take a small jump.\nWrap the rope around one leg, using your feet to pinch the rope. Reach up as high as possible with your arms, gripping the rope tightly.\nRelease the rope from your feet as you pull yourself up with your arms, bringing your knees towards your chest.\nResecure your feet on the rope, and then stand up to take another high hold on the rope. Continue until you reach the top of the rope.\nTo lower yourself, loosen the grip of your feet on the rope as you slide down using a hand over hand motion."],["Rope_Crunch","Rope Crunch","","Kraft","Kabelzug",[0],[],"kraft",2,"Kneel 1-2 feet in front of a cable system with a rope attached.\nAfter selecting an appropriate weight, grasp the rope with both hands reaching overhead. Your torso should be upright in the starting position.\nTo begin, flex at the spine, attempting to bring your rib cage to your legs as you pull the cable down.\nPause at the bottom of the motion, and then slowly return to the starting position.\nThese can be done with twists or to the side to hit the obliques."],["Rope_Jumping","Rope Jumping","","Cardio","Sonstiges",[13],[4,8],"cardio",2,"Hold an end of the rope in each hand. Position the rope behind you on the ground. Raise your arms up and turn the rope over your head bringing it down in front of you. When it reaches the ground, jump over it. Find a good turning pace that can be maintained. Different speeds and techniques can be used to introduce variation.\nRope jumping is exciting, challenges your coordination, and requires a lot of energy. A 150 lb person will burn about 350 calories jumping rope for 30 minutes, compared to over 450 calories running."],["Rope_Straight-Arm_Pulldown","Rope Straight-Arm Pulldown","","Kraft","Kabelzug",[9],[],"kraft",2,"Attach a rope to a high pulley and make your weight selection. Stand a couple feet back from the pulley with your feet staggered and take the rope with both hands. Lean forward from the hip, keeping your back straight, with your arms extended up in front of you. This will be your starting position.\nKeeping your arms straight, extend the shoulder to pull the rope down to your thighs.\nPause at the bottom of the motion, squeezing your lats.\nReturn to the starting position without allowing the weight to fully rest on the stack."],["Round_The_World_Shoulder_Stretch","Round The World Shoulder Stretch","","Dehnen","Sonstiges",[14],[3,5],"zeit",2,"Stand up straight with your legs together, holding a bodybar or broomstick.\nHold the pole behind your hips with a wider than shoulder width grip. Your palms should be down and your thumbs facing out.\nSlowly lift your arms up behind your head. Don't force it if it gets hard to lift further."],["Rowing_Stationary","Rowing, Stationary","Rudergerät","Cardio","Maschine",[13],[3,4,7,8,10,11],"cardio",2,"To begin, seat yourself on the rower. Make sure that your heels are resting comfortably against the base of the foot pedals and that the straps are secured. Select the program that you wish to use, if applicable. Sit up straight and bend forward at the hips.\nThere are three phases of movement when using a rower. The first phase is when you come forward on the rower. Your knees are bent and against your chest. Your upper body is leaning slightly forward while still maintaining good posture. Next, push against the foot pedals and extend your legs while bringing your hands to your upper abdominal area, squeezing your shoulders back as you do so. To avoid straining your back, use primarily your leg and hip muscles.\nThe recovery phase simply involves straightening your arms, bending the knees, and bringing your body forward again as you transition back into the first phase."],["Runners_Stretch","Runner's Stretch","","Dehnen","Ohne",[8],[4],"zeit",2,"It's easiest to get into this stretch if you start standing up, put one leg behind you, and slowly lower your torso down to the floor.\nKeep the front heel on the floor (if it lifts up, scoot your other leg further back).\nPlace your hands on either side of your front leg. To get more out of this stretch, push your butt up toward the ceiling, and then gradually lower it back toward the floor. You'll Stretch the hip flexor of the back leg and the hamstring and buttocks of the front."],["Running_Treadmill","Running, Treadmill","Laufen (Laufband, DB)","Cardio","Maschine",[13],[4,7,8],"lauf",2,"To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.\nTreadmills offer convenience, cardiovascular benefits, and usually have less impact than running outside. A 150 lb person will burn over 450 calories running 8 miles per hour for 30 minutes. Maintain proper posture as you run, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],["Russian_Twist","Russian Twist","Russian Twist","Kraft","Körpergewicht",[0],[10],"body",2,"Lie down on the floor placing your feet either under something that w
