"Kraft","Langhantel",[14],[0,4,5,8,13,16],"kraft",2,"Position a bar into landmine or, lacking one, securely anchor it in a corner. Load the bar to an appropriate weight and position the handle attachment on the bar.\nRaise the bar from the floor, taking the handles to your shoulders. This will be your starting position.\nIn an athletic stance, squat by flexing your hips and setting your hips back, keeping your arms flexed.\nReverse the motion by powerfully extending through the hips, knees, and ankles, while also extending the elbows to straighten the arms. This movement should be done explosively, coming out of the squat to full extension as powerfully as possible.\nReturn to the starting position."],["Lateral_Bound","Lateral Bound","","Plyometrie","Körpergewicht",[2],[1,4,7,8,13],"body",2,"Assume a half squat position facing 90 degrees from your direction of travel. This will be your starting position.\nAllow your lead leg to do a countermovement inward as you shift your weight to the outside leg.\nImmediately push off and extend, attempting to bound to the side as far as possible.\nUpon landing, immediately push off in the opposite direction, returning to your original start position.\nContinue back and forth for several repetitions."],["Lateral_Box_Jump","Lateral Box Jump","","Plyometrie","Sonstiges",[2],[1,4,7,8,13],"kraft",2,"Assume a comfortable standing position, with a short box positioned next to you. This will be your starting position.\nQuickly dip into a quarter squat to initiate the stretch reflex, and immediately reverse direction to jump up and to the side.\nBring your knees high enough to ensure your feet have good clearance over the box.\nLand on the center of the box, using your legs to absorb the impact.\nCarefully jump down to the other side of the box, and continue going back and forth for several repetitions."],["Lateral_Cone_Hops","Lateral Cone Hops","","Plyometrie","Sonstiges",[2],[1,4,7,8,13],"kraft",2,"Position a number of cones in a row several feet apart.\nStand next to the end of the cones, facing 90 degrees to the direction of travel. This will be your starting position.\nBegin the jump by dipping with the knees to initiate a stretch reflex, and immediately reverse direction to push off the ground, jumping up and sideways over the cone.\nUse your legs to absorb impact upon landing, and rebound into the next jump, continuing down the row of cones."],["Lateral_Raise_-_With_Bands","Lateral Raise - With Bands","","Kraft","Bänder",[14],[],"kraft",2,"To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles using a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The handles should be resting on the sides of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.\nUse your side shoulders to lift the handles to the sides as you exhale. Continue to lift the handles until they are slightly above parallel. Tip: As you lift the handles, slightly tilt the hand as if you were pouring water and keep your arms extended. Also, keep your torso stationary and pause for a second at the top of the movement.\nLower the handles back down slowly to the starting position. Inhale as you perform this portion of the movement.\nRepeat for the recommended amount of repetitions."],["Latissimus_Dorsi-SMR","Latissimus Dorsi-SMR","","Dehnen","Faszienrolle",[9],[],"zeit",2,"While lying on the floor, place a foam roll under your back and to one side, just behind your arm pit. This will be your starting position.\nKeep the arm of the side being stretched behind and to the side of you as you shift your weight onto your lats, keeping your upper body off of the ground. Hold for 10-30 seconds, and switch sides."],["Leg-Over_Floor_Press","Leg-Over Floor Press","","Kraft","Kettlebell",[5],[14,16],"kraft",2,"Lie on the floor with one kettlebell in place on your chest, holding it by the handle. Extend leg on working side over leg on non-working side.Your free arm can be extended out to your side for support.\nPress the kettlebll into a locked out position.\nLower the weight until the elbow touches the ground, keeping the kettlebell above the elbow. Repeat for the desired number of repetitions."],["Leg-Up_Hamstring_Stretch","Leg-Up Hamstring Stretch","","Dehnen","Ohne",[8],[],"zeit",2,"Lie flat on your back, bend one knee, and put that foot flat on the floor to stabilize your spine.\nExtend the other leg in the air. If you're tight, you wont be able to straighten it. That's okay. Extend the knee so that the sole of the lifted foot faces the ceiling (or as close as you can get it).\nSlowly straighten the legs as much as possible and then pull the leg toward your nose. Switch sides."],["Leg_Extensions","Leg Extensions","Beinstrecker","Kraft","Maschine",[13],[],"kraft",2,"For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.\nUsing your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.\nSlowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.\nRepeat for the recommended amount of times."],["Leg_Lift","Leg Lift","","Kraft","Körpergewicht",[7],[8],"body",2,"While standing up straight with both feet next to each other at around shoulder width, grab a sturdy surface such as the sides of a squat rack or the top of a chair to brace yourself and keep balance.\nWith or without an ankle weight, lift one leg behind you as if performing a leg curl but standing up while keeping the other leg straight. Breathe out as you perform this movement.\nSlowly bring the raised leg back to the floor as you breathe in.\nRepeat for the recommended amount of repetitions.\nRepeat the movement with the opposite leg."],["Leg_Press","Leg Press","Beinpresse","Kraft","Maschine",[13],[4,7,8],"kraft",2,"Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).\nLower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.\nAs you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.\nPushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.\nRepeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],["Leg_Pull-In","Leg Pull-In","Knieanzug","Kraft","Körpergewicht",[0],[],"body",2,"Lie on an exercise mat with your legs extended and your hands either palms facing down next to you or under your glutes. Tip: My preference is with the hands next to me. This will be your starting position.\nBend your knees and pull your upper thighs into your midsection as you breathe out. Continue the motion until your knees are around chest level. Contract your abs as you execute this movement and hold for a second at the top. Tip: As you perform the motion, the lower legs (calves) should always remain parallel to the floor.\nReturn to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Leverage_Chest_Press","Leverage Chest Press","","Kraft","Maschine",[5],[14,16],"kraft",2,"Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.\nYour chest and head should be up and your shoulder blades retracted. This will be your starting position.\nPress the handles forward by extending through the elbow.\nAfter a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],["Leverage_Deadlift","Leverage Deadlift","","Kraft","Maschine",[13],[7,8],"kraft",2,"Load the pins to an appropriate weight. Position yourself directly between the handles. Grasp the bottom handles with a comfortable grip, and then lower your hips as you take a breath. Look forward with your head and keep your chest up. This will be your starting position.\nReturn the weight to the starting position."],["Leverage_Decline_Chest_Press","Leverage Decline Chest Press","","Kraft","Maschine",[5],[14,16],"kraft",2,"Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.\nPress the handles forward by extending through the elbow.\nAfter a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],["Leverage_High_Row","Leverage High Row","","Kraft","Maschine",[11],[9],"kraft",2,"Load an appropriate weight onto the pins and adjust the seat height so that you can just reach the handles above you. Adjust the knee pad to help keep you down. Grasp the handles with a pronated grip. This will be your starting position.\nPull the handles towards your torso, retracting your shoulder blades as you flex the elbow.\nPause at the bottom of the motion, and then slowly return the handles to the starting position.\nFor multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],["Leverage_Incline_Chest_Press","Leverage Incline Chest Press","","Kraft","Maschine",[5],[14,16],"kraft",2,"Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.\nPress the handles forward by extending through the elbow.\nAfter a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],["Leverage_Iso_Row","Leverage Iso Row","","Kraft","Maschine",[9],[3,11],"kraft",2,"Load an appropriate weight onto the pins and adjust the seat height so that the handles are at chest level. Grasp the handles with either a neutral or pronated grip. This will be your starting position.\nPull the handles towards your torso, retracting your shoulder blades as you flex the elbow.\nPause at the bottom of the motion, and then slowly return the handles to the starting position. For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],["Leverage_Shoulder_Press","Leverage Shoulder Press","","Kraft","Maschine",[14],[16],"kraft",2,"Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the shoulders at the beginning of the motion. Your chest and head should be up and handles held with a pronated grip. This will be your starting position.\nPress the handles upward by extending through the elbow.\nAfter a brief pause at the top, return the weight to just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],["Leverage_Shrug","Leverage Shrug","","Kraft","Maschine",[15],[6],"kraft",2,"Load the pins to an appropriate weight. Position yourself directly between the handles.\nGrasp the top handles with a comfortable grip, and then lower your hips as you take a breath. Look forward with your head and keep your chest up.\nDrive through the floor with your heels, extending your hips and knees as you rise to a standing position. Keep your arms straight throughout the movement, finishing with your shoulders back. This will be your starting position.\nRaise the weight by shrugging the shoulders towards your ears, moving straight up and down.\nPause at the top of the motion, and then return the weight to the starting position."],["Linear_3-Part_Start_Technique","Linear 3-Part Start Technique","","Plyometrie","Ohne",[8],[4,13],"kraft",2,"This drill helps you accelerate as quickly as possible into a sprint from a dead stop. It helps to use a line to start from. Begin with two feet on the line. Place your left foot with the toe next to your right ankle. Place your right foot 4-6 inches behind the left.\nPlace your right hand onto the line, and thing bring your nose close to your left knee.\nSquat down as you lean foward, your head being lower than your hips and your weight loaded onto the left leg. This will be your starting position.\nTake your left hand up so that it is parallel to the ground, pointing behind you, and explode out when ready."],["Linear_Acceleration_Wall_Drill","Linear Acceleration Wall Drill","","Plyometrie","Ohne",[8],[4,7,13],"kraft",2,"Lean at around 45 degrees against a wall. Your feet should be together, glutes contracted.\nBegin by lifting your right knee quickly, pausing, and then driving it straight down into the ground.\nSwitch legs, raising the opposite knee, and then attacking the ground straight down.\nRepeat once more with your right leg, and as soon as the right foot strikes the ground hammer them out rapidly, alternating left and right as fast as you can."],["Linear_Depth_Jump","Linear Depth Jump","","Plyometrie","Sonstiges",[13],[4,7,8],"kraft",2,"You will need two boxes or benches spaced a few feet away from each other. Begin by standing on one box facing towards the other platform.\nTo initiate the movement, gently drop down to the ground between your platforms, allowing the knees and hips to flex.\nReverse the motion by exploding, extending through the hips, knees, and ankles to jump onto the other platform.\nLand softly, asborbing the impact through the legs."],["Log_Lift","Log Lift","","Strongman","Sonstiges",[14],[0,5,7,8,10,11,13,15,16],"kraft",2,"Begin standing with the log in front of you. Grasp the handles, and begin to clean the log. As you are bent over to start the clean, attempt to get the log as high as possible, pulling it into your chest. Extend through the hips and knees to bring it up to complete the clean.\nPush your head back and look up, creating a shelf on your chest to rest the log. Begin the press by dipping, flexing slightly through the knees and reversing the motion. This push press will generate momentum to start the log moving vertically. Continue by extending through the elbows to press the log above your head. There are no strict rules on form, so use whatever techniques you are most efficient with. As the log is pressed, ensure that you push your head through on each repetition, looking forward.\nRepeat as many times as possible. Attempt to control the descent of the log as it is returned to the ground."],["London_Bridges","London Bridges","","Kraft","Sonstiges",[9],[3,6,11],"kraft",2,"Attach a climbing rope to a high beam or cross member. Below it, ensure that the smith machine bar is locked in place with the safeties and cannot move. Alternatively, a secure box could also be utilized.\nStand on the bar, using the rope to balance yourself. This will be your starting position.\nKeeping your body straight, lean back and lower your body by slowly going hand over hand with the rope. Continue until you are perpendicular to the ground.\nKeeping your body straight, reverse the motion, going hand over hand back to the starting position."],["Looking_At_Ceiling","Looking At Ceiling","","Dehnen","Ohne",[13],[],"zeit",2,"Kneel on the floor, holding your heels with both hands.\nLift your buttocks up and forward while bringing your head back to look up at the ceiling, to give an arch in your back."],["Low_Cable_Crossover","Low Cable Crossover","","Kraft","Kabelzug",[5],[14],"kraft",2,"To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.\nStep forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.\nWith a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.\nReturn your arms back to the starting position after a brief pause."],["Low_Cable_Triceps_Extension","Low Cable Triceps Extension","","Kraft","Kabelzug",[16],[],"kraft",2,"Select the desired weight and lay down face up on the bench of a seated row machine that has a rope attached to it. Your head should be pointing towards the attachment.\nGrab the outside of the rope ends with your palms facing each other (neutral grip).\nPosition your elbows so that they are bent at a 90 degree angle and your upper arms are perpendicular (90 degree angle) to your torso. Tip: Keep the elbows in and make sure that the upper arms point to the ceiling while your forearms point towards the pulley above your head. This will be your starting position.\nAs you breathe out, extend your lower arms until they are straight and vertical. The upper arms and elbows remain stationary throughout the movement. Only the forearms should move. Contract the triceps hard for a second.\nAs you breathe in slowly return to the starting position.\nRepeat for the recommended amount of repetitions."],["Low_Pulley_Row_To_Neck","Low Pulley Row To Neck","","Kraft","Kabelzug",[14],[3,11,15],"kraft",2,"Sit on a low pulley row machine with a rope attachment.\nGrab the ends of the rope using a palms-down grip and sit with your back straight and your knees slightly bent. Tip: Keep your back almost completely vertical and your arms fully extended in front of you. This will be your starting position.\nWhile keeping your torso stationary, lift your elbows and start bending them as you pull the rope towards your neck while exhaling. Throughout the movement your upper arms should remain parallel to the floor. Tip: Continue this motion until your hands are almost next to your ears (the forearms will not be parallel to the floor at the end of the movement as they will be angled a bit upwards) and your elbows are out away from your sides.\nAfter holding for a second or so at the contracted position, come back slowly to the starting position as you inhale. Tip: Again, during no part of the movement should the torso move.\nRepeat for the recommended amount of repetitions."],["Lower_Back-SMR","Lower Back-SMR","","Dehnen","Faszienrolle",[10],[],"zeit",2,"In a seated position, place a foam roll under your lower back. Cross your arms in front of you and protract your shoulders. This will be your starting position.\nRaise your hips off of the floor and lean back, keeping your weight on your lower back. Now shift your weight slightly to one side, keeping your weight off of the spine and on the muscles to the side of it. Roll over your lower back, holding points of tension for 10-30 seconds. Repeat on the other side."],["Lower_Back_Curl","Lower Back Curl","","Dehnen","Körpergewicht",[0],[],"zeit",2,"Lie on your stomach with your arms out to your sides. This will be your starting position.\nUsing your lower back muscles, extend your spine lifting your chest off of the ground. Do not use your arms to push yourself up. Keep your head up during the movement. Repeat for 10-20 repetitions."],["Lunge_Pass_Through","Lunge Pass Through","","Kraft","Kettlebell",[8],[4,7,13],"kraft",2,"Stand with your torso upright holding a kettlebell in your right hand. This will be your starting position.\nStep forward with your left foot and lower your upper body down by flexing the hip and the knee, keeping the torso upright. Lower your back knee until it nearly touches the ground.\nAs you lunge, pass the kettlebell under your front leg to your opposite hand.\nPressing through the heel of your foot, return to the starting position.\nRepeat the movement for the recommended amount of repetitions, alternating legs."],["Lunge_Sprint","Lunge Sprint","","Kraft","Maschine",[13],[4,7,8],"kraft",2,"Adjust a bar in a Smith machine to an appropriate height. Position yourself under the bar, racking it across the back of your shoulders. Unrack the bar, and then split your feet, moving one foot forward and one foot back. This will be your starting position.\nLower your back knee nearly to the ground, flexing the knees and lowering your hips as you do so.\nAt the bottom of the descent, immediately reverse direction. Explosively drive through the heel of your front foot with light pressure from your back foot. Jump up and reverse the position of your legs.\nRepeat for the recommended amount of repetitions."],["Lying_Bent_Leg_Groin","Lying Bent Leg Groin","","Dehnen","Sonstiges",[2],[],"zeit",2,"Lie on your back with your knees bent and the soles of the feet pressed together. Have your partner hold your knees. This will be your starting position.\nAttempt to squeeze your knees together, while your partner prevents any movement from occurring.\nAfter 10-20 seconds, relax your muscles as your partner gently pushes your knees towards the floor. Be sure to inform your helper when the stretch is adequate to prevent injury or overstretching."],["Lying_Cable_Curl","Lying Cable Curl","","Kraft","Kabelzug",[3],[],"kraft",2,"Grab a straight bar or E-Z bar attachment that is attached to the low pulley with both hands, using an underhand (palms facing up) shoulder-width grip.\nLie flat on your back on top of an exercise mat in front of the weight stack with your feet flat against the frame of the pulley machine and your legs straight.\nWith your arms extended and your elbows close to your body slightly bend your arms. This will be your starting position.\nWhile keeping your upper arms stationary and the elbows close to your body, curl the bar up slowly toward your chest as you breathe out and you squeeze the biceps.\nAfter a second squeeze at the top of the movement, slowly return to the starting position.\nRepeat for the recommended amount of repetitions."],["Lying_Cambered_Barbell_Row","Lying Cambered Barbell Row","","Kraft","Langhantel",[11],[3,9,15],"kraft",2,"Place a cambered bar underneath an exercise bench.\nLie face down on the exercise bench and grab the bar using a palms down (pronated grip) that is wider than shoulder width. This will be your starting position.\nAs you exhale row the bar up as you keep the elbows close to your body to either your chest, in order to target the upper mid back, or to your stomach if targeting the lats is your goal.\nAfter a second hold at the top, lower back down to the starting position slowly as you inhale."],["Lying_Close-Grip_Bar_Curl_On_High_Pulley","Lying Close-Grip Bar Curl On High Pulley","","Kraft","Kabelzug",[3],[],"kraft",2,"Place a flat bench in front of a high pulley or lat pulldown machine.\nHold the straight bar attachment using an underhand grip (palms up) that is about shoulder width.\nLie on your back with your head over the end of the bench.\nNow extend your arms straight above your shoulders. Your torso and your arms should make a 90-degree angle and the elbows should be in. This will be your starting position.\nAs you breathe out, curl the bar down in a semicircular motion until it touches your chin. Squeeze the biceps for a second at the top contracted position. Tip: As you execute this motion only the forearms should move. At no time should the upper arms be moving at all. They are to remain perpendicular throughout the movement.\nReturn to starting position slowly.\nRepeat for the recommended amount of repetitions."],["Lying_Close-Grip_Barbell_Triceps_Extension_Behind_The_Head","Lying Close-Grip Barbell Triceps Extension Behind The Head","","Kraft","Langhantel",[16],[],"kraft",2,"While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head close to the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.\nExtend your arms in front of you and slowly bring the bar back in a semi circular motion (while keeping the arms extended) to a position over your head. At the end of this step your arms should be overhead and parallel to the floor. This will be your starting position. Tip: Keep your elbows in at all times.\nAs you inhale, lower the bar by bending at the elbows and while keeping the upper arm stationary. Keep lowering the bar until your forearms are perpendicular to the floor.\nAs you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion until the lower arms are also parallel to the floor. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times.\nRepeat for the recommended amount of repetitions."],["Lying_Close-Grip_Barbell_Triceps_Press_To_Chin","Lying Close-Grip Barbell Triceps Press To Chin","","Kraft","SZ-Stange",[16],[],"kraft",2,"While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head off the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.\nExtend your arms in front of you as you hold the barbell over your chest. The arms should be perpendicular to your torso (90-degree angle). This will be your starting position.\nAs you inhale, lower the bar in a semi-circular motion by bending at the elbows and while keeping the upper arm stationary and elbows in. Keep lowering the bar until it lightly touches your chin.\nAs you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times.\nRepeat for the recommended amount of repetitions."],["Lying_Crossover","Lying Crossover","","Dehnen","Körpergewicht",[1],[],"zeit",2,"Lie on your back with your legs extended.\nCross one leg over your body with the knee bent, attempting to touch the knee to the ground. Your partner should kneel beside you, holding your shoulder down with one hand and controlling the crossed leg with the other. this will be your starting position.\nAttempt to raise the bent knee off of the ground as your partner prevents any actual movement.\nAfter 10-20 seconds, relax the leg as your partner gently presses the knee towards the floor. Repeat with the other side."],["Lying_Dumbbell_Tricep_Extension","Lying Dumbbell Tricep Extension","","Kraft","Kurzhantel",[16],[5,14],"kraft",2,"Lie on a flat bench while holding two dumbbells directly in front of you. Your arms should be fully extended at a 90-degree angle from your torso and the floor. The palms should be facing in and the elbows should be tucked in. This is the starting position.\nAs you breathe in and you keep the upper arms stationary with the elbows in, slowly lower the weight until the dumbbells are near your ears.\nAt that point, while keeping the elbows in and the upper arms stationary, use the triceps to bring the weight back up to the starting position as you breathe out.\nRepeat for the recommended amount of repetitions."],["Lying_Face_Down_Plate_Neck_Resistance","Lying Face Down Plate Neck Resistance","","Kraft","Sonstiges",[12],[],"kraft",2,"Lie face down with your whole body straight on a flat bench while holding a weight plate behind your head. Tip: You will need to position yourself so that your shoulders are slightly above the end of a flat bench in order for the upper chest, neck and face to be off the bench. This will be your starting position.\nWhile keeping the plate secure on the back of your head slowly lower your head (as in saying \"yes\") as you breathe in.\nRaise your head back up to the starting position in a semi-circular motion as you breathe out. Hold the contraction for a second.\nRepeat for the recommended amount of repetitions."],["Lying_Face_Up_Plate_Neck_Resistance","Lying Face Up Plate Neck Resistance","","Kraft","Sonstiges",[12],[],"kraft",2,"Lie face up with your whole body straight on a flat bench while holding a weight plate on top of your forehead. Tip: You will need to position yourself so that your shoulders are slightly above the end of a flat bench in order for the traps, neck and head to be off the bench. This will be your starting position.\nWhile keeping the plate secure on your forehead slowly lower your head back in a semi-circular motion as you breathe in.\nRaise your head back up to the starting position in a semi-circular motion as you breathe out. Hold the contraction for a second.\nRepeat for the recommended amount of repetitions."],["Lying_Glute","Lying Glute","","Dehnen","Körpergewicht",[7],[1],"zeit",2,"Lie on your back with your partner kneeling beside you.\nFlex the hip of one leg, raising it off of the floor. Rotate the leg so the foot is over the opposite hip, the lower leg perpendicular to your body. Your partner should hold the knee and ankle in place. This will be your starting position.\nAttempt to push your leg towards your partner, who should be preventing any actual movement of the leg.\nAfter 10-20 seconds, completely relax as your partner gently pushes the ankle and knee towards your chest. Be sure to inform your helper when the stretch is adequate to prevent injury or overstretching."],["Lying_Hamstring","Lying Hamstring","","Dehnen","Sonstiges",[8],[4],"zeit",2,"Lie on your back with your legs extended. Your partner should be kneeling beside you. Raise one leg up towards the ceiling and have your partner hold the ankle. Your partner can use their shoulder to brace your leg if necessary. This will be your starting position.\nWith your partner holding your leg in place, attempt to flex the knee, contracting the hamstrings for 10-20 seconds.\nThen relax your leg, allowing your partner to gently push the leg towards your head. Be sure to inform your helper when the stretch is adequate to prevent injury or overstretching. Switch sides once complete."],["Lying_High_Bench_Barbell_Curl","Lying High Bench Barbell Curl","","Kraft","Langhantel",[3],[],"kraft",2,"Lie face forward on a tall flat bench while holding a barbell with a supinated grip (palms facing up). Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles. Your upper body should be positioned in a way that the upper chest is over the end of the bench and the barbell is hanging in front of you with the arms extended and perpendicular to the floor. This will be your starting position.\nWhile keeping the elbows in and the upper arms stationary, curl the weight up in a semi-circular motion as you contract the biceps and exhale. Hold at the top of the movement for a second.\nAs you inhale, slowly go back to the starting position. Tip: Maintain full control of the weight at all times and avoid any swinging. Remember, only the forearms should move throughout the movement.\nRepeat for the recommended amount of repetitions."],["Lying_Leg_Curls","Lying Leg Curls","Beinbeuger liegend","Kraft","Maschine",[8],[],"kraft",2,"Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.\nKeeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.\nAs you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.\nAs you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."],["Lying_Machine_Squat","Lying Machine Squat","","Kraft","Maschine",[13],[4,7,8],"kraft",2,"Adjust the leg machine to a height that will allow you to get inside it with your knees bent and the thighs slightly below parallel.\nOnce you select the weight, position yourself inside the machine face up with the knees bent and thighs slightly below parallel to the platform. Make sure that the knees do not go past the toes. The angle created between the hamstrings and the calves should be one that is slightly less than 90 degrees (since your starting position requires you to start slightly below parallel). Your back and your head should be resting on the machine while your shoulders are pressed under the shoulder pads.\nPlace your hands by the handles and position your feet slightly pointing out at a shoulder width position. This will be your starting position.\nWhile pressing with the balls of the feet as you breathe out, make your whole body erect as you squeeze the quads. Hold the contracted position for a second. Tip: Since you are starting below parallel, you can opt to use your hands to help you up by pressing on your thighs only on the first repetition.\nSlowly squat down as you inhale but instead of going all the way down to the starting position, just stop once your thighs are parallel to the platform. The angle between your hamstrings and calves should be a 90-degree angle.\nRepeat for the recommended amount of repetitions."],["Lying_One-Arm_Lateral_Raise","Lying One-Arm Lateral Raise","","Kraft","Kurzhantel",[14],[],"kraft",2,"While holding a dumbbell in one hand, lay with your chest down on a flat bench. The other hand can be used to hold to the leg of the bench for stability.\nPosition the palm of the hand that is holding the dumbbell in a neutral manner (palms facing your torso) as you keep the arm extended with the elbow slightly bent. This will be your starting position.\nNow raise the arm with the dumbbell to the side until your elbow is at shoulder height and your arm is roughly parallel to the floor as you exhale. Tip: Maintain your arm perpendicular to the torso while keeping your arm extended throughout the movement. Also, keep the contraction at the top for a second.\nSlowly lower the dumbbell to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Lying_Prone_Quadriceps","Lying Prone Quadriceps","","Dehnen","Körpergewicht",[13],[],"zeit",2,"Lay face down on the floor with your partner kneeling beside you. Flex one knee and raise that leg off the ground, attempting to touch your glutes with your foot. Your partner should hold the knee and ankle. This will be your starting position.\nAttempt to extend your knee while your partner prevents any actual movement.\nAfter 10-20 seconds, relax your muscles as your partner gently pushes the foot towards your glutes, further stretching the quadriceps and hip flexors.\nAfter 10-20 seconds, switch sides."],["Lying_Rear_Delt_Raise","Lying Rear Delt Raise","","Kraft","Kurzhantel",[14],[],"kraft",2,"While holding a dumbbell in each hand, lay with your chest down on a flat bench.\nPosition the palms of the hands in a neutral manner (palms facing your torso) as you keep the arms extended with the elbows slightly bent. This will be your starting position.\nNow raise the arms to the side until your elbows are at shoulder height and your arms are roughly parallel to the floor as you exhale. Tip: Maintain your arms perpendicular to the torso while keeping them extended throughout the movement. Also, keep the contraction at the top for a second.\nSlowly lower the dumbbells to the starting position as you inhale.\nRepeat for the recommended amount of repetitions and then switch to the other arm."],["Lying_Supine_Dumbbell_Curl","Lying Supine Dumbbell Curl","","Kraft","Kurzhantel",[3],[],"kraft",2,"Lie down on a flat bench face up while holding a dumbbell in each arm on top of your thighs.\nBring the dumbbells to the sides with the arms extended and the palms of the hands facing your thighs (neutral grip).\nWhile keeping the arms close to your torso and elbows in, slowly lower your arms (as you keep them extended with a slight bend at the elbows) as far down towards the floor as you can go. Once you cannot go down any further, lock your upper arms in that position and that will be your starting position.\nAs you breathe out, slowly begin to curl the weights up as you simultaneously rotate your wrists so that the palms of the hands face up. Continue curling the weight until your biceps are fully contracted and squeeze hard at the top position for a second. Tip: Only the forearms should move. Upper arms should remain stationary and elbows should stay in throughout the movement.\nReturn back to the starting position very slowly."],["Lying_T-Bar_Row","Lying T-Bar Row","","Kraft","Maschine",[11],[3,9],"kraft",2,"Load up the T-bar Row Machine with the desired weight and adjust the leg height so that your upper chest is at the top of the pad. Tip: In some machines all you can do is stand on the appropriate step that allows you to be at a height that has the upper chest at the top of the pad.\nLay face down on the pad and grab the handles. You can either use a palms down, palms up, or palms in position depending on what part of your back you want to emphasize.\nLift the bar off the rack and extend your arms in front of you. This will be your starting position.\nAs you exhale slowly pull the weight up and squeeze your back at the top of the movement. Tip: Keep the upper arms as close to the torso as possible throughout the movement in order to better engage the back muscles. Also, do not lift your body off of the pad at any time and refrain from using the biceps to lift the weight.\nAfter a second contraction at the top of the movement, as you inhale, slowly go back down to the starting position.\nRepeat for the recommended amount of repetitions."],["Lying_Triceps_Press","Lying Triceps Press","French Press / Skull Crusher","Kraft","SZ-Stange",[16],[],"kraft",2,"Lie on a flat bench with either an e-z bar (my preference) or a straight bar placed on the floor behind your head and your feet on the floor.\nGrab the bar behind you, using a medium overhand (pronated) grip, and raise the bar in front of you at arms length. Tip: The arms should be perpendicular to the torso and the floor. The elbows should be tucked in. This is the starting position.\nAs you breathe in, slowly lower the weight until the bar lightly touches your forehead while keeping the upper arms and elbows stationary.\nAt that point, use the triceps to bring the weight back up to the starting position as you breathe out.\nRepeat for the recommended amount of repetitions."],["Machine_Bench_Press","Machine Bench Press","Brustpresse (Maschine)","Kraft","Maschine",[5],[14,16],"kraft",2,"Sit down on the Chest Press Machine and select the weight.\nStep on the lever provided by the machine since it will help you to bring the handles forward so that you can grab the handles and fully extend the arms.\nGrab the handles with a palms-down grip and lift your elbows so that your upper arms are parallel to the floor to the sides of your torso. Tip: Your forearms will be pointing forward since you are grabbing the handles. Once you bring the handles forward and extend the arms you will be at the starting position.\nNow bring the handles back towards you as you breathe in.\nPush the handles away from you as you flex your pecs and you breathe out. Hold the contraction for a second before going back to the starting position.\nRepeat for the recommended amount of reps.\nWhen finished step on the lever again and slowly get the handles back to their original place."],["Machine_Bicep_Curl","Machine Bicep Curl","","Kraft","Maschine",[3],[],"kraft",2,"Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.\nPerform the movement by flexing the elbow, pulling your lower arm towards your upper arm.\nPause at the top of the movement, and then slowly return the weight to the starting position.\nAvoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked."],["Machine_Preacher_Curls","Machine Preacher Curls","","Kraft","Maschine",[3],[],"kraft",2,"Sit down on the Preacher Curl Machine and select the weight.\nPlace the back of your upper arms (your triceps) on the preacher pad provided and grab the handles using an underhand grip (palms facing up). Tip: Make sure that when you place the arms on the pad you keep the elbows in. This will be your starting position.\nNow lift the handles as you exhale and you contract the biceps. At the top of the position make sure that you hold the contraction for a second. Tip: Only the forearms should move. The upper arms should remain stationary and on the pad at all times.\nLower the handles slowly back to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Machine_Shoulder_Military_Press","Machine Shoulder (Military) Press","","Kraft","Maschine",[14],[16],"kraft",2,"Sit down on the Shoulder Press Machine and select the weight.\nGrab the handles to your sides as you keep the elbows bent and in line with your torso. This will be your starting position.\nNow lift the handles as you exhale and you extend the arms fully. At the top of the position make sure that you hold the contraction for a second.\nLower the handles slowly back to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Machine_Triceps_Extension","Machine Triceps Extension","","Kraft","Maschine",[16],[],"kraft",2,"Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.\nPerform the movement by extending the elbow, pulling your lower arm away from your upper arm.\nPause at the completion of the movement, and then slowly return the weight to the starting position.\nAvoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked."],["Medicine_Ball_Chest_Pass","Medicine Ball Chest Pass","","Plyometrie","Medizinball",[5],[14,16],"kraft",2,"You will need a partner for this exercise. Lacking one, this movement can be performed against a wall.\nBegin facing your partner holding the medicine ball at your torso with both hands.\nPull the ball to your chest, and reverse the motion by extending through the elbows. For sports applications, you can take a step as you throw.\nYour partner should catch the ball, and throw it back to you.\nReceive the throw with both hands at chest height."],["Medicine_Ball_Full_Twist","Medicine Ball Full Twist","","Plyometrie","Medizinball",[0],[14],"kraft",2,"For this exercise you will need a medicine ball and a partner. Stand back to back with your partner, spaced 2-3 feet apart. This will be your starting position.\nHold the ball in front of the trunk. Open the hips and turn the shoulders at the same time as your partner.\nFor full rotation, you and your partner should twist in the same direction, i.e. counter-clockwise.\nPass the ball to your partner, and both of you can now twist in the opposite direction to repeat the procedure."],["Medicine_Ball_Scoop_Throw","Medicine Ball Scoop Throw","","Plyometrie","Medizinball",[14],[0,8,13],"kraft",2,"Assume a semisquat stance with a medicine ball in your hands. Your arms should hang so the ball is near your feet.\nBegin by thrusting the hips forward as you extend through the legs, jumping up.\nAs you do, swing your arms up and over your head, keeping them extended, releasing the ball at the peak of your movement. The goal is to throw the ball the greatest distance behind you."],["Middle_Back_Shrug","Middle Back Shrug","","Kraft","Kurzhantel",[11],[],"kraft",2,"Lie facedown on an incline bench while holding a dumbbell in each hand. Your arms should be fully extended hanging down and pointing towards the floor. The palms of your hands should be facing each other. This will be your starting position.\nAs you exhale, squeeze your shoulder blades together and hold the contraction for a full second. Tip: This movement is just like the reverse action of a hug, or trying to perform rear laterals as if you had no arms.\nAs you inhale go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Middle_Back_Stretch","Middle Back Stretch","","Dehnen","Ohne",[11],[0,9,10],"zeit",2,"Stand so your feet are shoulder width apart and your hands are on your hips.\nTwist at your waist until you feel a stretch. Hold for 10 to 15 seconds, then twist to the other side."],["Mixed_Grip_Chin","Mixed Grip Chin","","Kraft","Sonstiges",[11],[3,9],"kraft",2,"Using a spacing that is just about 1 inch wider than shoulder width, grab a pull-up bar with the palms of one hand facing forward and the palms of the other hand facing towards you. This will be your starting position.\nNow start to pull yourself up as you exhale. Tip: With the arm that has the palms facing up concentrate on using the back muscles in order to perform the movement. The elbow of that arm should remain close to the torso. With the other arm that has the palms facing forward, the elbows will be away but in line with the torso. You will concentrate on using the lats to pull your body up.\nAfter a second contraction at the top, start to slowly come down as you inhale.\nRepeat for the recommended amount of repetitions.\nOn the following set, switch grips; so if you had the right hand with the palms facing you and the left one with the palms facing forward, on the next set you will have the palms facing forward for the right hand and facing you for the left."],["Monster_Walk","Monster Walk","","Kraft","Bänder",[1],[],"kraft",2,"Place a band around both ankles and another around both knees. There should be enough tension that they are tight when your feet are shoulder width apart.\nTo begin, take short steps forward alternating your left and right foot.\nAfter several steps, do just the opposite and walk backward to where you started."],["Mountain_Climbers","Mountain Climbers","Mountain Climbers","Plyometrie","Ohne",[13],[5,8,14],"kraft",2,"Begin in a pushup position, with your weight supported by your hands and toes. Flexing the knee and hip, bring one leg until the knee is approximately under the hip. This will be your starting position.\nExplosively reverse the positions of your legs, extending the bent leg until the leg is straight and supported by the toe, and bringing the other foot up with the hip and knee flexed. Repeat in an alternating fashion for 20-30 seconds."],["Moving_Claw_Series","Moving Claw Series","","Plyometrie","Ohne",[8],[4,13],"kraft",2,"This move helps prepare your running form to help you excel at sprinting. As you run, be sure to flex the knee, aiming to kick your glutes as the hip extends.\nReload the quad as the leg moves back forward, attacking the ground on the next step.\nEnsure that as you run, you block with the arms, punching through in a rapid 1-2 motion."],["Muscle_Snatch","Muscle Snatch","","Gewichtheben","Langhantel",[8],[7,10,13,14,16],"kraft",2,"Begin with a loaded barbell held at the mid thigh position with a wide grip. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar. This will be the starting position.\nBegin the pull by driving through the front of the heels, raising the bar. Transition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body.\nContinue raising the bar to the overhead position, without rebending the knees."],["Muscle_Up","Muscle Up","Muscle-Up","Kraft","Sonstiges",[9],[0,3,6,11,14,15,16],"body",2,"Grip the rings using a false grip, with the base of your palms on top of the rings. Initiate a pull up by pulling the elbows down to your side, flexing the elbows.\nAs you reach the top position of the pull-up, pull the rings to your armpits as you roll your shoulders forward, allowing your elbows to move straight back behind you. This puts you into the proper position to continue into the dip portion of the movement.\nMaintaining control and stability, extend through the elbow to complete the motion.\nUse care when lowering yourself to the ground."],["Narrow_Stance_Hack_Squats","Narrow Stance Hack Squats","","Kraft","Maschine",[13],[4,7,8],"kraft",2,"Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.\nPosition your legs in the platform using a less than shoulder width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.\nPlace your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).\nNow straighten your legs without locking the knees. This will be your starting position.\nBegin to slowly lower the unit by bending the knees as you maintain a straight posture with the head up (back on the pad at all times). Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement.\nBegin to raise the unit as you exhale by pushing the floor with mainly with the heels of your feet as you straighten the legs again and go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Narrow_Stance_Leg_Press","Narrow Stance Leg Press","","Kraft","Maschine",[13],[4,7,8],"kraft",2,"Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a less-than-shoulder-width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.\nLower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.\nAs you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.\nPushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.\nRepeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],["Narrow_Stance_Squats","Narrow Stance Squats","","Kraft","Langhantel",[13],[4,7,8,10],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a less-than-shoulder-width narrow stance with the toes slightly pointed out. Feet should be around 3-6 inches apart. Keep your head up at all times (looking down will get you off balance) and maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).\nBegin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Natural_Glute_Ham_Raise","Natural Glute Ham Raise","","Kraft","Körpergewicht",[8],[4,7,10],"body",2,"Using the leg pad of a lat pulldown machine or a preacher bench, position yourself so that your ankles are under the pads, knees on the seat, and you are facing away from the machine. You should be upright and maintaining good posture.\nThis will be your starting position. Lower yourself under control until your knees are almost completely straight.\nRemaining in control, raise yourself back up to the starting position.\nIf you are unable to complete a rep, use a band, a partner, or push off of a box to aid in completing a repetition."],["Neck-SMR","Neck-SMR","","Dehnen","Sonstiges",[12],[],"zeit",2,"Using a muscle roller or a rolling pin, place the roller behind your head and against your neck. Make sure that you do not place the roller directly against the spine, but turned slightly so that the roller is pressed against the muscles to either side of the spine. This will be your starting position.\nStarting at the top of your neck, slowly roll down the muscles of your neck, pausing at points of tension for 10-30 seconds."],["Neck_Press","Neck Press","","Kraft","Langhantel",[5],[14,16],"kraft",2,"Lie back on a flat bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over your neck with your arms locked. This will be your starting position.\nAs you breathe in, come down slowly until you feel the bar on your neck.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the bar back in the rack."],["Oblique_Crunches","Oblique Crunches","","Kraft","Körpergewicht",[0],[],"body",2,"Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put one hand beside your head and the other to the side against the floor.\nMake sure your feet are elevated and resting on a flat surface.\nNow lift the shoulder in which your hand is touching your head.\nSimply elevate your shoulder and body upward until you touch your knee. For example, if you have your right hand besides your head, then you want to elevate your body upwards until your right elbow touches your left knee. The same variation can be applied doing the inverse and using your left elbow to touch your right knee.\nAfter your knee touches your elbow, lower your body until you have reached the starting position.\nRemember to breathe in during the eccentric (lowering) part of the exercise and to breathe out during the concentric (upward) part of the exercise.\nContinue alternating in this manner until all of the recommended repetitions for each side have been completed."],["Oblique_Crunches_-_On_The_Floor","Oblique Crunches - On The Floor","","Kraft","Körpergewicht",[0],[],"body",2,"Start out by lying on your right side with your legs lying on top of each other. Make sure your knees are bent a little bit.\nPlace your left hand behind your head.\nOnce you are in this set position, begin by moving your left elbow up as you would perform a normal crunch except this time the main emphasis is on your obliques.\nCrunch as high as you can, hold the contraction for a second and then slowly drop back down into the starting position.\nRemember to breathe in during the eccentric (lowering) part of the exercise and to breathe out during the concentric (elevation) part of the exercise."],["Olympic_Squat","Olympic Squat","","Gewichtheben","Langhantel",[13],[4,7,8],"kraft",2,"Begin with a barbell supported on top of the traps. The chest should be up, and the head facing forward. Adopt a hip width stance with the feet turned out as needed.\nDescend by flexing the knees, refraining from moving the hips back as much as possible. This requires that the knees travel forward; ensure that they stay aligned with the feet. The goal is to keep the torso as upright as possible. Continue all the way down, keeping the weight on the front of the heel.\nAt the moment the upper legs contact the lower, reverse the motion, driving the weight upward."],["On-Your-Back_Quad_Stretch","On-Your-Back Quad Stretch","","Dehnen","Sonstiges",[13],[],"zeit",2,"Lie on a flat bench or step, and hang one leg and arm over the side.\nBend the knee and hold the top of the foot. As you do this, be careful not to arch your lower back.\nPull the belly button to the spine to stay in neutral. Press your foot down and into your hand. To add the hip stretch, lift the hip of the leg you're holding up toward the ceiling.\nSwitch sides."],["On_Your_Side_Quad_Stretch","On Your Side Quad Stretch","","Dehnen","Ohne",[13],[],"zeit",2,"Start off by lying on your right side, with your right knee bent at a 90-degree angle resting on the floor in front of you (this stabilizes the torso).\nBend your left knee behind you and hold your left foot with your left hand. To stretch your hip flexor, press your left hip forward as you push your left foot back into your hand. Switch sides."],["One-Arm_Dumbbell_Row","One-Arm Dumbbell Row","Einarmiges Rudern (Kurzhantel)","Kraft","Kurzhantel",[11],[3,9,14],"kraft",2,"Choose a flat bench and place a dumbbell on each side of it.\nPlace the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.\nUse the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.\nPull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.\nLower the resistance straight down to the starting position. Breathe in as you perform this step.\nRepeat the movement for the specified amount of repetitions.\nSwitch sides and repeat again with the other arm."],["One-Arm_Flat_Bench_Dumbbell_Flye","One-Arm Flat Bench Dumbbell Flye","","Kraft","Kurzhantel",[5],[],"kraft",2,"Lie down on a flat bench with a dumbbell in one hand resting on top of your thigh. The palm of your hand with the dumbbell in it should be at a neutral grip.\nBy using your thighs to help you get the dumbbell up, clean the dumbbell so that you can hold it in front of you with your lifting arm being fully extended. Remember to maintain a neutral grip with this exercise. Your non lifting hand should be to the side holding the flat bench for better support. This will be your starting position.\nYour arm with the weight should have a slight bend on your elbow in order to prevent stress at the biceps tendon. Begin by lowering your arm with the weight in it out in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, your lifting arm should remain stationary; the movement should only occur at the shoulder joint.\nReturn your lifting arm back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.\nHold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions.\nSwitch arms and repeat the exercise."],["One-Arm_High-Pulley_Cable_Side_Bends","One-Arm High-Pulley Cable Side Bends","","Kraft","Kabelzug",[0],[],"kraft",2,"Connect a standard handle to a tower. Move cable to highest pulley position.\nStand with side to cable. With one hand, reach up and grab handle with underhand grip.\nPull down cable until elbow touches your side and the handle is by your shoulder.\nPosition feet hip-width apart. Place free hand on hip to help gauge pivot point.\nKeep arm in static position. Contract oblique to bring the weight down in a side crunch.\nOnce you reach maximum contraction, slowly release the weight to the starting position. The weight stack should never be unloaded in a resting position. The aim is constant tension during the set.\nRepeat to failure.\nThen, reposition and repeat the same series of movements on the opposite side."],["One-Arm_Incline_Lateral_Raise","One-Arm Incline Lateral Raise","","Kraft","Kurzhantel",[14],[],"kraft",2,"Lie down sideways on an incline bench press with a dumbbell in the hand. Make sure the shoulder is pressing against the incline bench and the arm is lying across your body with the palm around your navel.\nHold a dumbbell in your uppermost arm while keeping it extended in front of you parallel to the floor. This is your starting position.\nWhile keeping the dumbbell parallel to the floor at all times, perform a lateral raise. Your arm should travel straight up until it is pointing at the ceiling. Tip: Exhale as you perform this movement. Hold the dumbbell in the position and feel the contraction in the shoulders for a second.\nWhile inhaling lower the weight across your body back into the starting position.\nRepeat the movement for the prescribed amount of repetitions.\nSwitch arms and repeat the movement."],["One-Arm_Kettlebell_Clean","One-Arm Kettlebell Clean","","Kraft","Kettlebell",[8],[7,10,14,15],"kraft",2,"Place a kettlebell between your feet. As you bend down to grab the kettlebell, push your butt back and keep your eyes looking forward.\nClean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.\nReturn the weight to the starting position."],["One-Arm_Kettlebell_Clean_and_Jerk","One-Arm Kettlebell Clean and Jerk","","Kraft","Kettlebell",[14],[],"kraft",2,"Hold a kettlebell by the handle.\nClean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward.\nDip your body by bending the knees, keeping your torso upright.\nImmediately reverse direction, driving through the heels, in essence jumping to create momentum. As you do so, press the kettlebell overhead to lockout by extending the arms, using your body's momentum to move the weight.\nReceive the weight overhead by returning to a squat position underneath the weight.\nKeeping the weight overhead, return to a standing position. Lower the weight to the floor to perform the next repetition."],["One-Arm_Kettlebell_Floor_Press","One-Arm Kettlebell Floor Press","","Kraft","Kettlebell",[5],[16],"kraft",2,"Lie on the floor holding a kettlebell with one hand, with your upper arm supported by the floor. The palm should be facing in.\nPress the kettlebell straight up toward the ceiling, rotating your wrist.\nLower the kettlebell back to the starting position and repeat."],["One-Arm_Kettlebell_Jerk","One-Arm Kettlebell Jerk","","Kraft","Kettlebell",[14],[4,13,16],"kraft",2,"Hold a kettlebell by the handle. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward. This will be your starting position.\nDip your body by bending the knees, keeping your torso upright.\nImmediately reverse direction, driving through the heels, in essence jumping to create momentum. As you do so, press the kettlebell overhead to lockout by extending the arms, using your body's momentum to move the weight. Receive the weight overhead by returning to a squat position underneath the weight. Keeping the weight overhead, return to a standing position.\nLower the weight to perform the next repetition."],["One-Arm_Kettlebell_Military_Press_To_The_Side","One-Arm Kettlebell Military Press To The Side","","Kraft","Kettlebell",[14],[16],"kraft",2,"Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces inward. This will be your starting position.\nLook at the kettlebell and press it up and out until it is locked out overhead.\nLower the kettlebell back to your shoulder under control and repeat. Make sure to contract your lat, butt, and stomach forcefully for added stability and strength."],["One-Arm_Kettlebell_Para_Press","One-Arm Kettlebell Para Press","","Kraft","Kettlebell",[14],[16],"kraft",2,"Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward. This will be your starting position.\nHold the kettlebell with the elbow out to the side, and press it up and out until it is locked out overhead.\nLower the kettlebell back to your shoulder under control and repeat. Make sure to contract your lat, butt, and stomach forcefully for added stability and strength."],["One-Arm_Kettlebell_Push_Press","One-Arm Kettlebell Push Press","","Kraft","Kettlebell",[14],[4,13,16],"kraft",2,"Hold a kettlebell by the handle. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward. This will be your starting position.\nDip your body by bending the knees, keeping your torso upright.\nImmediately reverse direction, driving through the heels, in essence jumping to create momentum. As you do so, press the kettlebell overhead to lockout by extending the arms, using your body's momentum to move the weight. Lower the weight to perform the next repetition."],["One-Arm_Kettlebell_Row","One-Arm Kettlebell Row","","Kraft","Kettlebell",[11],[3,9],"kraft",2,"Place a kettlebell in front of your feet. Bend your knees slightly and then push your butt out as much as possible as you bend over to get in the starting position. Grab the kettlebell and pull it to your stomach, retracting your shoulder blade and flexing the elbow. Keep your back straight. Lower and repeat."],["One-Arm_Kettlebell_Snatch","One-Arm Kettlebell Snatch","","Kraft","Kettlebell",[14],[4,7,8,10,15,16],"kraft",2,"Place a kettlebell between your feet. Bend your knees and push your butt back to get in the proper starting position.\nLook straight ahead and swing the kettlebell back between your legs.\nImmediately reverse the direction and drive through with your hips and knees, accelerating the kettlebell upward. As the kettlebell rises to your shoulder rotate your hand and punch straight up, using momentum to receive the weight locked out overhead."],["One-Arm_Kettlebell_Split_Jerk","One-Arm Kettlebell Split Jerk","","Kraft","Kettlebell",[14],[7,8,13,16],"kraft",2,"Hold a kettlebell by the handle. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward. This will be your starting position.\nDip your body by bending the knees, keeping your torso upright.\nImmediately reverse direction, driving through the heels, in essence jumping to create momentum. As you do so, press the kettlebell overhead to lockout by extending the arms, using your body's momentum to move the weight.\nReceive the weight overhead by returning to a squat position underneath the weight, positioning one leg in front of you and one leg behind you.\nKeeping the weight overhead, return to a standing position and bring your feet together. Lower the weight to perform the next repetition."],["One-Arm_Kettlebell_Split_Snatch","One-Arm Kettlebell Split Snatch","","Kraft","Kettlebell",[14],[8,13],"kraft",2,"Hold a kettlebell in one hand by the handle.\nSquat towards the floor, and then reverse the motion, extending the hips, knees, and finally the ankles, to raise the kettlebell overhead.\nAfter fully extending the body, descend into a lunge position to receive the weights overhead, one leg forward and one leg back. Ensure you drive through with your hips and lock the ketttlebells overhead in one uninterrupted motion.\nReturn to a standing position, holding the weight overhead, and bring the feet together. Lower the weight to return to the starting position."],["One-Arm_Kettlebell_Swings","One-Arm Kettlebell Swings","Kettlebell Swing einarmig","Kraft","Kettlebell",[8],[4,7,10,14],"kraft",2,""],["One-Arm_Long_Bar_Row","One-Arm Long Bar Row","","Kraft","Langhantel",[11],[3,9],"kraft",2,"Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.\nStand next to the bar, and take a grip with one hand close to the collar. Using your hips and legs, rise to a standing position.\nAssume a bent-knee stance with your hips back and your chest up. Your arm should be extended. This will be your starting position.\nPull the weight to your side by retracting the shoulder and flexing the elbow. Do not jerk the weight or cheat during the movement.\nAfter a brief pause, return to the starting position."],["One-Arm_Medicine_Ball_Slam","One-Arm Medicine Ball Slam","","Kraft","Medizinball",[0],[9,14],"kraft",2,"Start in a standing position with a staggered, athletic stance. Hold a medicine ball in one hand, on the same side as your back leg. This will be your starting position.\nBegin by winding the arm, raising the medicine ball above your head. As you do so, extend through the hips, knees, and ankles to load up for the slam.\nAt peak extension, flex the shoulders, spine, and hips to throw the ball hard into the ground directly in front of you.\nCatch the ball on the bounce and continue for the desired number of repetitions."],["One-Arm_Open_Palm_Kettlebell_Clean","One-Arm Open Palm Kettlebell Clean","","Kraft","Kettlebell",[8],[6,7,10,13,14],"kraft",2,"Place one kettlebell between your feet.\nGrab the handle with one hand and raise the kettlebell rapidly, let it flip so that the ball of the kettlebell lands in the palm of your hand.\nThrow the kettlebell out in front of you and catch the handle with one hand.\nTake the kettlebell to the floor and repeat. Make sure to work both arms."],["One-Arm_Overhead_Kettlebell_Squats","One-Arm Overhead Kettlebell Squats","","Kraft","Kettlebell",[13],[4,7,8,14],"kraft",2,"Clean and press a kettlebell with one arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so. Press the weight overhead by extending through the elbow.This will be your starting position.\nLooking straight ahead and keeping a kettlebell locked out above you, flex the knees and hips and lower your torso between your legs, keeping your head and chest up.\nPause at the bottom position for a second before rising back to the top, driving through the heels of your feet."],["One-Arm_Side_Deadlift","One-Arm Side Deadlift","","Kraft","Langhantel",[13],[0,4,7,8,10,15],"kraft",2,"Stand to the side of a barbell next to its center. Bend your knees and lower your body until you are able to reach the barbell.\nGrasp the bar as if you were grabbing a briefcase (palms facing you since the bar is sideways). You may need a wrist wrap if you are using a significant amount of weight. This is your starting position.\nUse your legs to help lift the barbell up while exhaling. Your arms should extend fully as bring the barbell up until you are in a standing position.\nSlowly bring the barbell back down while inhaling. Tip: Make sure to bend your knees while lowering the weight to avoid any injury from occurring.\nRepeat for the recommended amount of repetitions.\nSwitch arms and repeat the movement."],["One-Arm_Side_Laterals","One-Arm Side Laterals","","Kraft","Kurzhantel",[14],[],"kraft",2,"Pick a dumbbell and place it in one of your hands. Your non lifting hand should be used to grab something steady such as an incline bench press. Lean towards your lifting arm and away from the hand that is gripping the incline bench as this will allow you to keep your balance.\nStand with a straight torso and have the dumbbell by your side at arm's length with the palm of the hand facing you. This will be your starting position.\nWhile maintaining the torso stationary (no swinging), lift the dumbbell to your side with a slight bend on the elbow and your hand slightly tilted forward as if pouring water in a glass. Continue to go up until you arm is parallel to the floor. Exhale as you execute this movement and pause for a second at the top.\nLower the dumbbell back down slowly to the starting position as you inhale.\nRepeat for the recommended amount of repetitions.\nSwitch arms and repeat the exercise."],["One-Legged_Cable_Kickback","One-Legged Cable Kickback","","Kraft","Kabelzug",[7],[8],"kraft",2,"Hook a leather ankle cuff to a low cable pulley and then attach the cuff to your ankle.\nFace the weight stack from a distance of about two feet, grasping the steel frame for support.\nWhile keeping your knees and hips bent slightly and your abs tight, contract your glutes to slowly \"kick\" the working leg back in a semicircular arc as high as it will comfortably go as you breathe out. Tip: At full extension, squeeze your glutes for a second in order to achieve a peak contraction.\nNow slowly bring your working leg forward, resisting the pull of the cable until you reach the starting position.\nRepeat for the recommended amount of repetitions.\nSwitch legs and repeat the movement for the other side."],["One_Arm_Against_Wall","One Arm Against Wall","","Dehnen","Ohne",[9],[],"zeit",2,"From a standing position, place a bent arm against a wall or doorway.\nSlowly lean toward your arm until you feel a stretch in your lats."],["One_Arm_Chin-Up","One Arm Chin-Up","","Kraft","Sonstiges",[11],[3,6,9],"kraft",2,"For this exercise, start out by placing a towel around a chin up bar.\nGrab the chin-up bar with your palm facing you. One hand will be grabbing the chin-up bar and the other will be grabbing the towel.\nBring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.v\nPull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.\nAfter a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.\nRepeat this motion for the prescribed amount of repetitions.\nSwitch arms and repeat the movement."],["One_Arm_Dumbbell_Bench_Press","One Arm Dumbbell Bench Press","","Kraft","Kurzhantel",[5],[14,16],"kraft",2,"Lie down on a flat bench with a dumbbell in one hand on top of your thigh.\nBy using your thigh to help you get the dumbbell up, clean the dumbbell up so that you can hold it in front of you at shoulder width. Use the hand you are not lifting with to help position the dumbbell over you properly.\nOnce at shoulder width, rotate your wrist forward so that the palm of your hand is facing away from you. This will be your starting position.\nBring down the weights slowly to your side as you breathe in. Keep full control of the dumbbell at all times. Tip: Use the hand that you are not lifting with to help keep the dumbbell balance as you may struggle a bit at first. Only use your non-lifting hand if it is needed. Otherwise, keep it resting to the side.\nAs you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions of your training program.\nSwitch arms and repeat the movement."],["One_Arm_Dumbbell_Preacher_Curl","One Arm Dumbbell Preacher Curl","","Kraft","Kurzhantel",[3],[],"kraft",2,"Grab a dumbbell with the right arm and place the upper arm on top of the preacher bench or the incline bench. The dumbbell should be held at shoulder length. This will be your starting position.\nAs you breathe in, slowly lower the dumbbell until your upper arm is extended and the biceps is fully stretched.\nAs you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the dumbbell is at shoulder height. Again, remember that to en
