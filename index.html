 starting position as you simultaneously lift the right dumbbell.\nContinue alternating in this fashion until all of the recommended amount of repetitions have been performed for each arm."],["Front_Incline_Dumbbell_Raise","Front Incline Dumbbell Raise","","Kraft","Kurzhantel",[14],[],"kraft",2,"Sit down on an incline bench with the incline set anywhere between 30 to 60 degrees while holding a dumbbell on each hand. Tip: You can change the angle to hit the muscle a little differently each time.\nExtend your arms straight in front of you and have your palms facing down with the dumbbells raised about 1 inch above your thighs. This will be your starting position.\nSlowly raise the dumbbells straight up until they are slightly above your shoulders, while keeping your elbows locked. Squeeze at the top for a second and make sure you breathe out during this portion of the movement. Tip: Keep your head resting down against the bench and your legs on the floor at all times.\nLower the arms back to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Front_Leg_Raises","Front Leg Raises","","Dehnen","Körpergewicht",[8],[],"zeit",2,"Stand next to a chair or other support, holding on with one hand.\nSwing your leg forward, keeping the leg straight. Continue with a downward swing, bringing the leg as far back as your flexibility allows. Repeat 5-10 times, and then switch legs."],["Front_Plate_Raise","Front Plate Raise","","Kraft","Sonstiges",[14],[],"kraft",2,"While standing straight, hold a barbell plate in both hands at the 3 and 9 o'clock positions. Your palms should be facing each other and your arms should be extended and locked with a slight bend at the elbows and the plate should be down near your waist in front of you as far as you can go. Tip: The arms will remain in this position throughout the exercise. This will be your starting position.\nSlowly raise the plate as you exhale until it is a little above shoulder level. Hold the contraction for a second. Tip: make sure that you do not swing the weight or bend at the elbows. Your torso should remain stationary throughout the movement as well.\nAs you inhale, slowly lower the plate back down to the starting position.\nRepeat for the recommended amount of repetitions."],["Front_Raise_And_Pullover","Front Raise And Pullover","","Kraft","Langhantel",[5],[9,14,16],"kraft",2,"Lie on a flat bench while holding a barbell using a palms down grip that is about 15 inches apart.\nPlace the bar on your upper thighs, extend your arms and lock them while keeping a slight bend on the elbows. This will be your starting position.\nNow raise the weight using a semicircular motion and keeping your arms straight as you inhale. Continue the same movement until the bar is on the other side above your head . (Tip: the bar will travel approximately 180-degrees). At this point your arms should be parallel to the floor with the palms of your hands facing the ceiling.\nNow return the barbell to the starting position by reversing the motion as you exhale.\nRepeat for the recommended amount of repetitions."],["Front_Squat_Clean_Grip","Front Squat (Clean Grip)","Frontkniebeuge","Kraft","Langhantel",[13],[0,7,8],"kraft",2,"To begin, first set the bar in a rack slightly below shoulder level. Rest the bar on top of the deltoids, pushing into the clavicles, and lightly touching the throat. Your hands should be in a clean grip, touching the bar only with your fingers to help keep it in position.\nLift the bar off the rack by first pushing with your legs and at the same time straightening your torso. Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head and elbows up at all times. This will be your starting position.\nBend at the knees, sitting down between your legs. Continue down until your hamstrings are on your calves. Keep your knees aligned with your feet by consciously using your abductors to push your knees out as you squat.\nBegin to raise the bar as you exhale by pushing the floor mainly with the heel or middle of your foot as you straighten the legs again and return to the starting position."],["Front_Squats_With_Two_Kettlebells","Front Squats With Two Kettlebells","","Kraft","Kettlebell",[13],[4,7],"kraft",2,"Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so.\nLooking straight ahead at all times, squat as low as you can and pause at the bottom. As you squat down, push your knees out. You should squat between your legs, keeping an upright torso, with your head and chest up.\nRise back up by driving through your heels and repeat."],["Front_Two-Dumbbell_Raise","Front Two-Dumbbell Raise","","Kraft","Kurzhantel",[14],[],"kraft",2,"Pick a couple of dumbbells and stand with a straight torso and the dumbbells on front of your thighs at arms length with the palms of the hand facing your thighs. This will be your starting position.\nWhile maintaining the torso stationary (no swinging), lift the dumbbells to the front with a slight bend on the elbow and the palms of the hands always facing down. Continue to go up until you arms are slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top.\nAs you inhale, lower the dumbbells back down slowly to the starting position.\nRepeat for the recommended amount of repetitions."],["Full_Range-Of-Motion_Lat_Pulldown","Full Range-Of-Motion Lat Pulldown","","Kraft","Kabelzug",[9],[3,11,14],"kraft",2,"Either standing or seated on a high bench, grasp two stirrup cables that are attached to the high pulleys. Grab with the opposing hand so your arms are crisscrossed about you and your palms are facing forward.\nKeeping your chest up and maintaining a slight arch in your lower back, pull the handles down as if you were doing a regular pulldown. The range of motion will be more of an arc. During the movement, rotate your hands so that in the bottom position your palms face each other rather than forward. Return slowly to the starting position and repeat."],["Gironda_Sternum_Chins","Gironda Sternum Chins","","Kraft","Sonstiges",[9],[3,11],"kraft",2,"Grasp the pull-up bar with a shoulder width underhand grip.\nNow hang with your arms fully extended and stick your chest out and lean back. Tip: You will be leaning back throughout the entire movement. This will be your starting position.\nStart pulling yourself towards the bar with your spine arched throughout the movement and your head leaning back as far away from the bar as possible. Exhale as you perform this portion of the movement. Tip: At the upper end of the movement, your hips and legs will be at about a 45-degree angle to the floor.\nKeep pulling until your collarbone passes the bar and your lower chest or sternum area touches it. Hold that contraction for a second. Tip: By the time you've completed this portion of the movement; your head will be parallel to the floor.\nSlowly start going back to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Glute_Ham_Raise","Glute Ham Raise","","Powerlifting","Maschine",[8],[4,7],"kraft",2,"Begin by adjusting the equipment to fit your body. Place your feet against the footplate in between the rollers as you lie facedown. Your knees should be just behind the pad.\nStart from the bottom of the movement. Keep your back arched as you begin the movement by flexing the knees. Drive your toes into the foot plate as you do so. Keep your upper body straight, and continue until your body is upright.\nReturn to the starting position, keeping your descent under control."],["Glute_Kickback","Glute Kickback","","Kraft","Körpergewicht",[7],[8],"body",2,"Kneel on the floor or an exercise mat and bend at the waist with your arms extended in front of you (perpendicular to the torso) in order to get into a kneeling push-up position but with the arms spaced at shoulder width. Your head should be looking forward and the bend of the knees should create a 90-degree angle between the hamstrings and the calves. This will be your starting position.\nAs you exhale, lift up your right leg until the hamstrings are in line with the back while maintaining the 90-degree angle bend. Contract the glutes throughout this movement and hold the contraction at the top for a second. Tip: At the end of the movement the upper leg should be parallel to the floor while the calf should be perpendicular to it.\nGo back to the initial position as you inhale and now repeat with the left leg.\nContinue to alternate legs until all of the recommended repetitions have been performed."],["Goblet_Squat","Goblet Squat","Goblet Squat","Kraft","Kettlebell",[13],[4,7,8,14],"kraft",2,"Stand holding a light kettlebell by the horns close to your chest. This will be your starting position.\nSquat down between your legs until your hamstrings are on your calves. Keep your chest and head up and your back straight.\nAt the bottom position, pause and use your elbows to push your knees out. Return to the starting position, and repeat for 10-20 repetitions."],["Good_Morning","Good Morning","","Powerlifting","Langhantel",[8],[0,7,10],"kraft",2,"Begin with a bar on a rack at shoulder height. Rack the bar across the rear of your shoulders as you would a power squat, not on top of your shoulders. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Step back from the rack.\nBegin by bending at the hips, moving them back as you bend over to near parallel. Keep your back arched and your cervical spine in proper alignment.\nReverse the motion by extending through the hips with your glutes and hamstrings. Continue until you have returned to the starting position."],["Good_Morning_off_Pins","Good Morning off Pins","","Powerlifting","Langhantel",[8],[0,7,10],"kraft",2,"Begin with a bar on a rack at about the same height as your stomach. Bend over underneath the bar and rack the bar across the rear of your shoulders as you would a power squat, not on top of your shoulders. At the proper height, you should be near parallel to the floor when bent over. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Keep your back arched and your cervical spine in proper alignment.\nBegin the motion by extending through the hips with your glutes and hamstrings, and you are standing with the weight. Slowly lower the weight back to the pins returning to the starting position."],["Gorilla_Chin_Crunch","Gorilla Chin/Crunch","","Kraft","Körpergewicht",[0],[3,9],"body",2,"Hang from a chin-up bar using an underhand grip (palms facing you) that is slightly wider than shoulder width.\nNow bend your knees at a 90 degree angle so that the calves are parallel to the floor while the thighs remain perpendicular to it. This will be your starting position.\nAs you exhale, pull yourself up while crunching your knees up at the same time until your knees are at chest level. You will stop going up as soon as your nose is at the same level as the bar. Tip: When you get to this point you should also be finishing the crunch at the same time.\nSlowly start to inhale as you return to the starting position.\nRepeat for the recommended amount of repetitions."],["Groin_and_Back_Stretch","Groin and Back Stretch","","Dehnen","Ohne",[2],[],"zeit",2,"Sit on the floor with your knees bent and feet together.\nInterlock your fingers behind your head. This will be your starting position.\nCurl downwards, bringing your elbows to the inside of your thighs. After a brief pause, return to the starting position with your head up and your back straight. Repeat for 10-20 repetitions."],["Groiners","Groiners","","Dehnen","Körpergewicht",[2],[],"zeit",2,"Begin in a pushup position on the floor. This will be your starting position.\nUsing both legs, jump forward landing with your feet next to your hands. Keep your head up as you do so.\nReturn to the starting position and immediately repeat the movement, continuing for 10-20 repetitions."],["Hack_Squat","Hack Squat","Hackenschmidt","Kraft","Maschine",[13],[4,7,8],"kraft",2,"Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.\nPosition your legs in the platform using a shoulder width medium stance with the toes slightly pointed out. Tip: Keep your head up at all times and also maintain the back on the pad at all times.\nPlace your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).\nNow straighten your legs without locking the knees. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).\nBegin to slowly lower the unit by bending the knees as you maintain a straight posture with the head up (back on the pad at all times). Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the unit as you exhale by pushing the floor with mainly with the heel of your foot as you straighten the legs again and go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Hammer_Curls","Hammer Curls","Hammercurls","Kraft","Kurzhantel",[3],[],"kraft",2,"Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.\nThe palms of the hands should be facing your torso. This will be your starting position.\nNow, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.\nAfter the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position.\nRepeat for the recommended amount of repetitions."],["Hammer_Grip_Incline_DB_Bench_Press","Hammer Grip Incline DB Bench Press","","Kraft","Kurzhantel",[5],[14,16],"kraft",2,"Lie back on an incline bench with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.\nBy using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them at shoulder width.\nOnce at shoulder width, keep the palms of your hands with a neutral grip (palms facing each other). Keep your elbows flared out with the upper arms in line with the shoulders (perpendicular to the torso) and the elbows bent creating a 90-degree angle between the upper arm and the forearm. This will be your starting position.\nNow bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbells at all times.\nAs you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the dumbbells back in your thighs and then on the floor. This is the safest manner to dispose of the dumbbells."],["Hamstring-SMR","Hamstring-SMR","","Dehnen","Faszienrolle",[8],[],"zeit",2,"In a seated position, extend your legs over a foam roll so that it is position on the back of the upper legs. Place your hands to the side or behind you to help support your weight. This will be your starting position.\nUsing your hands, lift your hips off of the floor and shift your weight on the foam roll to one leg. Relax the hamstrings of the leg you are stretching.\nRoll over the foam from below the hip to above the back of the knee, pausing at points of tension for 10-30 seconds. Repeat for the other leg."],["Hamstring_Stretch","Hamstring Stretch","","Dehnen","Ohne",[8],[],"zeit",2,"Lie on your back with one leg extended above you, with the hip at ninety degrees. Keep the other leg flat on the floor.\nLoop a belt, band, or rope over the ball of your foot. This will be your starting position.\nPull on the belt to create tension in the calves and hamstrings. Hold this stretch for 10-30 seconds, and repeat with the other leg."],["Handstand_Push-Ups","Handstand Push-Ups","Handstand-Liegestütze","Kraft","Körpergewicht",[14],[16],"body",2,"With your back to the wall bend at the waist and place both hands on the floor at shoulder width.\nKick yourself up against the wall with your arms straight. Your body should be upside down with the arms and legs fully extended. Keep your whole body as straight as possible. Tip: If doing this for the first time, have a spotter help you. Also, make sure that you keep facing the wall with your head, rather than looking down.\nSlowly lower yourself to the ground as you inhale until your head almost touches the floor. Tip: It is of utmost importance that you come down slow in order to avoid head injury.\nPush yourself back up slowly as you exhale until your elbows are nearly locked.\nRepeat for the recommended amount of repetitions."],["Hang_Clean","Hang Clean","","Gewichtheben","Langhantel",[13],[4,6,7,8,10,14,15],"kraft",2,"Begin with a shoulder width, double overhand or hook grip, with the bar hanging at the mid thigh position. Your back should be straight and inclined slightly forward.\nBegin by aggressively extending through the hips, knees and ankles, driving the weight upward. As you do so, shrug your shoulders towards your ears.\nImmediately recover by driving through the heels, keeping the torso upright and elbows up. Continue until you have risen to a standing position."],["Hang_Clean_-_Below_the_Knees","Hang Clean - Below the Knees","","Gewichtheben","Langhantel",[13],[4,6,7,8,10,14,15],"kraft",2,"Begin with a shoulder width, double overhand or hook grip, with the bar hanging just below the knees. Your back should be straight and inclined slightly forward.\nBegin by aggressively extending through the hips, knees and ankles, driving the weight upward. As you do so, shrug your shoulders towards your ears. As full extension is achieved, transition into the third pull by aggressively shrugging and flexing the arms with the elbows up and out.\nAt peak extension, aggressively pull yourself down, rotating your elbows under the bar as you do so. Receive the bar in a front squat position, the depth of which is dependent upon the height of the bar at the end of the third pull. The bar should be racked onto the protracted shoulders, lightly touching the throat with the hands relaxed. Continue to descend to the bottom squat position, which will help in the recovery.\nImmediately recover by driving through the heels, keeping the torso upright and elbows up. Continue until you have risen to a standing position."],["Hang_Snatch","Hang Snatch","","Gewichtheben","Langhantel",[8],[0,4,6,7,10,13,14,15],"kraft",2,"Begin with a wide grip on the bar, with an overhand or hook grip. The feet should be directly below the hips with the feet turned out. Your knees should be slightly bent, and the torso inclined forward. The spine should be fully extended and the head facing forward. The bar should be at the hips. This will be your starting position.\nAggressively extend through the legs and hips. At peak extension, shrug the shoulders and allow the elbows to flex to the side.\nAs you move your feet into the receiving position, forcefully pull yourself below the bar as you elevate the bar overhead. Receive the bar with your body as low as possible and the arms fully extended overhead.\nReturn to a standing position with the weight overhead. Follow by returning the weight to the ground under control."],["Hang_Snatch_-_Below_Knees","Hang Snatch - Below Knees","","Gewichtheben","Langhantel",[8],[0,4,6,7,10,13,14,15],"kraft",2,"Begin with a wide grip on the bar, with an overhand or hook grip. The feet should be directly below the hips with the feet turned out. Your knees should be slightly bent, and the torso inclined forward. The spine should be fully extended and the head facing forward. The bar should be just below the knees. This will be your starting position.\nAggressively extend through the legs and hips. At peak extension, shrug the shoulders and allow the elbows to flex to the side.\nAs you move your feet into the receiving position, forcefully pull yourself below the bar as you elevate the bar overhead. Receive the bar with your body as low as possible and the arms fully extended overhead.\nReturn to a standing position with the weight overhead, and then return the weight to the floor under control."],["Hanging_Bar_Good_Morning","Hanging Bar Good Morning","","Powerlifting","Langhantel",[8],[0,7,10],"kraft",2,"Begin with a bar on a rack at about the same height as your stomach. Suspend the bar using chains or suspension straps.\nBend over underneath the bar and rack the bar across the rear of your shoulders as you would a power squat, not on top of your traps. At the proper height, you should be near parallel to the floor when bent over. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Keep your back arched and your cervical spine in proper alignment.\nBegin the motion by extending through the hips with your glutes and hamstrings, and you are standing with the weight.\nSlowly lower the weight back to the starting position, where it is supported by the chains."],["Hanging_Leg_Raise","Hanging Leg Raise","Beinheben hängend","Kraft","Körpergewicht",[0],[],"body",2,"Hang from a chin-up bar with both arms extended at arms length in top of you using either a wide grip or a medium grip. The legs should be straight down with the pelvis rolled slightly backwards. This will be your starting position.\nRaise your legs until the torso makes a 90-degree angle with the legs. Exhale as you perform this movement and hold the contraction for a second or so.\nGo back slowly to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions."],["Hanging_Pike","Hanging Pike","","Kraft","Körpergewicht",[0],[],"body",2,"Hang from a chin-up bar with your legs and feet together using an overhand grip (palms facing away from you) that is slightly wider than shoulder width. Tip: You may use wrist wraps in order to facilitate holding on to the bar.\nNow bend your knees at a 90 degree angle and bring the upper legs forward so that the calves are perpendicular to the floor while the thighs remain parallel to it. This will be your starting position.\nPull your legs up as you exhale until you almost touch your shins with the bar above you. Tip: Try to straighten your legs as much as possible while at the top.\nLower your legs as slowly as possible until you reach the starting position. Tip: Avoid swinging and using momentum at all times.\nRepeat for the recommended amount of repetitions."],["Heaving_Snatch_Balance","Heaving Snatch Balance","","Gewichtheben","Langhantel",[13],[0,6,7,8,14,16],"kraft",2,"This drill helps you learn the snatch. Begin by holding a light weight across the back of the shoulders. Your feet should be slightly wider than hip width apart with the feet turned out, the same position that you would perform a squat with.\nBegin by dipping with the knees slightly, and popping back up to briefly unload the bar. Drive yourself underneath the bar, elevating it overhead as you descend into a full squat.\nReturn to a standing position."],["Heavy_Bag_Thrust","Heavy Bag Thrust","","Plyometrie","Sonstiges",[5],[0,14,16],"kraft",2,"Utilize a heavy bag for this exercise. Assume an upright stance next to the bag, with your feet staggered, fairly wide apart. Place your hand on the bag at about chest height. This will be your starting position.\nBegin by twisting at the waist, pushing the bag forward as hard as possible. Perform this move quickly, pushing the bag away from your body.\nReceive the bag as it swings back by reversing these steps."],["High_Cable_Curls","High Cable Curls","","Kraft","Kabelzug",[3],[],"kraft",2,"Stand between a couple of high pulleys and grab a handle in each arm. Position your upper arms in a way that they are parallel to the floor with the palms of your hands facing you. This will be your starting position.\nCurl the handles towards you until they are next to your ears. Make sure that as you do so you flex your biceps and exhale. The upper arms should remain stationary and only the forearms should move. Hold for a second in the contracted position as you squeeze the biceps.\nSlowly bring back the arms to the starting position.\nRepeat for the recommended amount of repetitions."],["Hip_Circles_prone","Hip Circles (prone)","","Dehnen","Körpergewicht",[1],[2],"zeit",2,"Position yourself on your hands and knees on the ground. Maintaining good posture, raise one bent knee off of the ground. This will be your starting position.\nKeeping the knee in a bent position, rotate the femur in an arc, attempting to make a big circle with your knee.\nPerform this slowly for a number of repetitions, and repeat on the other side."],["Hip_Extension_with_Bands","Hip Extension with Bands","","Kraft","Bänder",[7],[8],"kraft",2,"Secure one end of the band to the lower portion of a post and attach the other to one ankle.\nFacing the attachment point of the band, hold on to the column to stabilize yourself.\nKeeping your head and your chest up, move the resisted leg back as far as you can while keeping the knee straight.\nReturn the leg to the starting position."],["Hip_Flexion_with_Band","Hip Flexion with Band","","Kraft","Bänder",[13],[],"kraft",2,"Secure one end of the band to the lower portion of a post and attach the other to one ankle.\nFace away from the attachment point of the band.\nKeeping your head and your chest up, raise your knee up to 90 degrees and pause.\nReturn the leg to the starting position."],["Hip_Lift_with_Band","Hip Lift with Band","","Powerlifting","Bänder",[7],[4,8],"kraft",2,"After choosing a suitable band, lay down in the middle of the rack, after securing the band on either side of you. If your rack doesn't have pegs, the band can be secured using heavy dumbbells or similar objects, just ensure they won't move.\nAdjust your position so that the band is directly over your hips. Bend your knees and place your feet flat on the floor. Your hands can be on the floor or holding the band in position.\nKeeping your shoulders on the ground, drive through your heels to raise your hips, pushing into the band as high as you can.\nPause at the top of the motion, and return to the starting position."],["Hug_A_Ball","Hug A Ball","","Dehnen","Gymnastikball",[10],[4,7],"zeit",2,"Seat yourself on the floor.\nStraddle an exercise ball between both legs and lower your hips down toward the floor.\nHug your arms around the ball to support your body. Adjust your legs so that your feet are flat on the floor and your knees line up over your ankles. Keep a good grip on the ball so it doesn't roll away from you and send you back onto your buttocks."],["Hug_Knees_To_Chest","Hug Knees To Chest","","Dehnen","Ohne",[10],[7],"zeit",2,"Lie down on your back and pull both knees up to your chest.\nHold your arms under the knees, not over (that would put to much pressure on your knee joints).\nSlowly pull the knees toward your shoulders. This also stretches your buttocks muscles."],["Hurdle_Hops","Hurdle Hops","","Plyometrie","Sonstiges",[8],[1,2,4,7,8],"kraft",2,"Set up a row of hurdles or other small barriers, placing them a few feet apart.\nStand in front of the first hurdle with your feet shoulder width apart. This will be your starting position.\nBegin by jumping with both feet over the first hurdle, swinging both arms as you jump.\nAbsorb the impact of landing by bending the knees, rebounding out of the first leap by jumping over the next hurdle. Continue until you have jumped over all of the hurdles."],["Hyperextensions_Back_Extensions","Hyperextensions (Back Extensions)","Rückenstrecker (Hyperextensions)","Kraft","Sonstiges",[10],[7,8],"kraft",2,"Lie face down on a hyperextension bench, tucking your ankles securely under the footpads.\nAdjust the upper pad if possible so your upper thighs lie flat across the wide pad, leaving enough room for you to bend at the waist without any restriction.\nWith your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.\nStart bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you feel a nice stretch on the hamstrings and you can no longer keep going without a rounding of the back. Tip: Never round the back as you perform this exercise. Also, some people can go farther than others. The key thing is that you go as far as your body allows you to without rounding the back.\nSlowly raise your torso back to the initial position as you inhale. Tip: Avoid the temptation to arch your back past a straight line. Also, do not swing the torso at any time in order to protect the back from injury.\nRepeat for the recommended amount of repetitions."],["Hyperextensions_With_No_Hyperextension_Bench","Hyperextensions With No Hyperextension Bench","","Kraft","Körpergewicht",[10],[7,8],"body",2,"With someone holding down your legs, slide yourself down to the edge a flat bench until your hips hang off the end of the bench. Tip: Your entire upper body should be hanging down towards the floor. Also, you will be in the same position as if you were on a hyperextension bench but the range of motion will be shorter due to the height of the flat bench vs. that of the hyperextension bench.\nWith your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.\nStart bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you almost touch the floor or you feel a nice stretch on the hamstrings (whichever comes first). Tip: Never round the back as you perform this exercise.\nSlowly raise your torso back to the initial position as you exhale. Tip: Avoid the temptation to arch your back past a straight line. Also, do not swing the torso at any time in order to protect the back from injury.\nRepeat for the recommended amount of repetitions."],["IT_Band_and_Glute_Stretch","IT Band and Glute Stretch","","Dehnen","Sonstiges",[1],[],"zeit",2,"Loop a belt, rope, or band around one of your feet, and swing that leg across your body to the opposite side, keeping the leg extended as you lay on the ground. This will be your starting position.\nKeeping your foot off of the floor, pull on the belt, using the tension to pull the toes up. Hold for 10-20 seconds, and repeat on the other side."],["Iliotibial_Tract-SMR","Iliotibial Tract-SMR","","Dehnen","Faszienrolle",[1],[],"zeit",2,"Lay on your side, with the bottom leg placed onto a foam roller between the hip and the knee. The other leg can be crossed in front of you.\nPlace as much of your weight as is tolerable onto your bottom leg; there is no need to keep your bottom leg in contact with the ground. Be sure to relax the muscles of the leg you are stretching.\nRoll your leg over the foam from you hip to your knee, pausing for 10-30 seconds at points of tension. Repeat with the opposite leg."],["Inchworm","Inchworm","","Dehnen","Körpergewicht",[8],[],"zeit",2,"Stand with your feet close together. Keeping your legs straight, stretch down and put your hands on the floor directly in front of you. This will be your starting position.\nBegin by walking your hands forward slowly, alternating your left and your right. As you do so, bend only at the hip, keeping your legs straight.\nKeep going until your body is parallel to the ground in a pushup position.\nNow, keep your hands in place and slowly take short steps with your feet, moving only a few inches at a time.\nContinue walking until your feet are by hour hands, keeping your legs straight as you do so."],["Incline_Barbell_Triceps_Extension","Incline Barbell Triceps Extension","","Kraft","Langhantel",[16],[6],"kraft",2,"Hold a barbell with an overhand grip (palms down) that is a little closer together than shoulder width.\nLie back on an incline bench set at any angle between 45-75-degrees.\nBring the bar overhead with your arms extended and elbows in. The arms should be in line with the torso above the head. This will be your starting position.\nNow lower the bar in a semicircular motion behind your head until your forearms touch your biceps. Inhale as you perform this movement. Tip: Keep your upper arms stationary and close to your head at all times. Only the forearms should move.\nReturn to the starting position as you breathe out and you contract the triceps. Hold the contraction for a second.\nRepeat for the recommended amount of repetitions."],["Incline_Bench_Pull","Incline Bench Pull","","Kraft","Langhantel",[11],[9,14],"kraft",2,"Grab a dumbbell in each hand and lie face down on an incline bench that is set to an incline that is approximately 30 degrees.\nLet the arms hang to your sides fully extended as they point to the floor.\nTurn the wrists until your hands have a pronated (palms down) grip.\nNow flare the elbows out. This will be your starting position.\nAs you breathe out, start to pull the dumbbells up as if you are doing a reverse bench press. You will do this by bending at the elbows and bringing the upper arms up as you let the forearms hang. Continue this motion until the upper arms are at the same level as your back. Tip: The elbows will come out to the side and your upper arms and torso should make the letter \"T\" at the top of the movement. Hold the contraction at the top for a second.\nSlowly go back down to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions."],["Incline_Cable_Chest_Press","Incline Cable Chest Press","","Kraft","Kabelzug",[5],[14,16],"kraft",2,"Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.\nBegin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.\nAfter pausing at full extension, return to the starting position, keeping tension on the cables."],["Incline_Cable_Flye","Incline Cable Flye","","Kraft","Kabelzug",[5],[14],"kraft",2,"To get yourself into the starting position, set the pulleys at the floor level (lowest level possible on the machine that is below your torso).\nPlace an incline bench (set at 45 degrees) in between the pulleys, select a weight on each one and grab a pulley on each hand.\nWith a handle on each hand, lie on the incline bench and bring your hands together at arms length in front of your face. This will be your starting position.\nWith a slight bend of your elbows (in order to prevent stress at the biceps tendon), lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary. The movement should only occur at the shoulder joint.\nReturn your arms back to the starting position as you squeeze your chest muscles and exhale. Hold the contracted position for a second. Tip: Make sure to use the same arc of motion used to lower the weights.\nRepeat the movement for the prescribed amount of repetitions."],["Incline_Dumbbell_Bench_With_Palms_Facing_In","Incline Dumbbell Bench With Palms Facing In","","Kraft","Kurzhantel",[5],[14,16],"kraft",2,"Lie back on an incline bench with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.\nBy using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them at shoulder width.\nOnce at shoulder width, keep the palms of your hands with a neutral grip (palms facing each other). Keep your elbows flared out with the upper arms in line with the shoulders (perpendicular to the torso) and the elbows bent creating a 90-degree angle between the upper arm and the forearm. This will be your starting position.\nNow bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbells at all times.\nAs you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the dumbbells back in your thighs and then on the floor. This is the safest manner to dispose of the dumbbells."],["Incline_Dumbbell_Curl","Incline Dumbbell Curl","","Kraft","Kurzhantel",[3],[],"kraft",2,"Sit back on an incline bench with a dumbbell in each hand held at arms length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.\nWhile holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second.\nSlowly begin to bring the dumbbells back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions."],["Incline_Dumbbell_Flyes","Incline Dumbbell Flyes","","Kraft","Kurzhantel",[5],[14],"kraft",2,"Hold a dumbbell on each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.\nExtend your arms above you with a slight bend at the elbows.\nNow rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.\nAs you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.\nAs you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint.\nRepeat for the recommended amount of repetitions."],["Incline_Dumbbell_Flyes_-_With_A_Twist","Incline Dumbbell Flyes - With A Twist","","Kraft","Kurzhantel",[5],[14],"kraft",2,"Hold a dumbbell in each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.\nExtend your arms above you with a slight bend at the elbows.\nNow rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.\nAs you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.\nAs you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint.\nRepeat for the recommended amount of repetitions."],["Incline_Dumbbell_Press","Incline Dumbbell Press","Schrägbankdrücken (Kurzhantel)","Kraft","Kurzhantel",[5],[14,16],"kraft",2,"Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.\nThen, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.\nOnce you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.\nBe sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.\nLock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the dumbbells back on your thighs and then on the floor. This is the safest manner to release the dumbbells."],["Incline_Hammer_Curls","Incline Hammer Curls","","Kraft","Kurzhantel",[3],[],"kraft",2,"Seat yourself on an incline bench with a dumbbell in each hand. You should pressed firmly against he back with your feet together. Allow the dumbbells to hang straight down at your side, holding them with a neutral grip. This will be your starting position.\nInitiate the movement by flexing at the elbow, attempting to keep the upper arm stationary.\nContinue to the top of the movement and pause, then slowly return to the start position."],["Incline_Inner_Biceps_Curl","Incline Inner Biceps Curl","","Kraft","Kurzhantel",[3],[],"kraft",2,"Hold a dumbbell in each hand and lie back on an incline bench.\nThe dumbbells should be at arm's length hanging at your sides and your palms should be facing out. This will be your starting position.\nNow as you exhale curl the weight outward and up while keeping your forearms in line with your side deltoids. Continue the curl until the dumbbells are at shoulder height and to the sides of your deltoids. Tip: The end of the movement should look similar to a double biceps pose.\nAfter a second contraction at the top of the movement, start to inhale and slowly lower the weights back to the starting position using the same path used to bring them up.\nRepeat for the recommended amount of repetitions."],["Incline_Push-Up","Incline Push-Up","Liegestütze erhöht","Kraft","Körpergewicht",[5],[14,16],"body",2,"Stand facing bench or sturdy elevated platform. Place hands on edge of bench or platform, slightly wider than shoulder width.\nPosition forefoot back from bench or platform with arms and body straight. Arms should be perpendicular to body. Keeping body straight, lower chest to edge of box or platform by bending arms.\nPush body up until arms are extended. Repeat."],["Incline_Push-Up_Close-Grip","Incline Push-Up Close-Grip","","Kraft","Körpergewicht",[16],[5,14],"body",2,"Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.\nPlace your hands next to one another on the bar.\nPosition your feet back from the bar with arms and body straight. This will be your starting position.\nKeeping your body straight, lower your chest to the bar by bending the arms.\nReturn to the starting position by extending the elbows, pressing yourself back up."],["Incline_Push-Up_Depth_Jump","Incline Push-Up Depth Jump","","Plyometrie","Sonstiges",[5],[14,16],"kraft",2,"For this drill you will need a box about 12 inches high, and two thick mats or aerobics steps.\nPlace the steps just outside of your shoulders, and place your feet on top of the box so that you are in an incline pushup position, your hands just inside the steps. This will be your starting position.\nBegin by bending at the elbows to lower your body, quickly reversing position to push your body off of the ground. As you leave the ground, move your hands onto the steps, bending your elbows to absorb the impact.\nRepeat the motion to return to the starting position."],["Incline_Push-Up_Medium","Incline Push-Up Medium","","Kraft","Körpergewicht",[5],[0,14,16],"body",2,"Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.\nPlace your hands on the bar, with your hands about shoulder width apart.\nPosition your feet back from the bar with arms and body straight. This will be your starting position.\nKeeping your body straight, lower your chest to the bar by bending the arms.\nReturn to the starting position by extending the elbows, pressing yourself back up."],["Incline_Push-Up_Reverse_Grip","Incline Push-Up Reverse Grip","","Kraft","Körpergewicht",[5],[0,14,16],"body",2,"Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.\nPlace your hands on the bar palms up, with your hands about shoulder width apart.\nPosition your feet back from the bar with arms and body straight. This will be your starting position.\nKeeping your body straight, lower your chest to the bar by bending the arms.\nReturn to the starting position by extending the elbows, pressing yourself back up."],["Incline_Push-Up_Wide","Incline Push-Up Wide","","Kraft","Körpergewicht",[5],[0,14,16],"body",2,"Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.\nPlace your hands on the bar, with your hands wider than shoulder width.\nPosition your feet back from the bar with arms and body straight. Your arms should be perpendicular to the body. This will be your starting position.\nKeeping your body straight, lower your chest to the bar by bending the arms.\nReturn to the starting position by extending the elbows, pressing yourself back up."],["Intermediate_Groin_Stretch","Intermediate Groin Stretch","","Dehnen","Sonstiges",[8],[],"zeit",2,"Lie on your back with your legs extended. Loop a belt, rope, or band around one of your feet, and swing that leg as far to the side as you can. This will be your starting position.\nPull gently on the belt to create tension in your groin and hamstring muscles. Hold for 10-20 seconds, and repeat on the other side."],["Intermediate_Hip_Flexor_and_Quad_Stretch","Intermediate Hip Flexor and Quad Stretch","","Dehnen","Sonstiges",[13],[],"zeit",2,"Lie face down on the floor, with a rope, belt, or band looped around one foot.\nFlex the knee and extend the hip of the leg to be stretched, using both hands to pull on the belt. Your knee and your hip should come off of the floor, creating tension in the hip flexors and quadriceps. Hold the stretch for 10-20 seconds, and repeat on the other leg."],["Internal_Rotation_with_Band","Internal Rotation with Band","","Kraft","Bänder",[14],[],"kraft",2,"Choke the band around a post. The band should be at the same height as your elbow. Stand with your right side to the band a couple of feet away.\nGrasp the end of the band with your right hand, and keep your elbow pressed firmly to your side. We recommend you hold a pad or foam roll in place with your elbow to keep it firmly in position.\nWith your upper arm in position, your elbow should be flexed to 90 degrees with your hand reaching away from your torso. This will be your starting position.\nExecute the movement by rotating your arm in a forehand motion, keeping your elbow in place.\nContinue as far as you are able, pause, and then return to the starting position."],["Inverted_Row","Inverted Row","Australian Pull-Ups (Inverted Row)","Kraft","Ohne",[11],[9],"body",2,"Position a bar in a rack to about waist height. You can also use a smith machine.\nTake a wider than shoulder width grip on the bar and position yourself hanging underneath the bar. Your body should be straight with your heels on the ground with your arms fully extended. This will be your starting position.\nBegin by flexing the elbow, pulling your chest towards the bar. Retract your shoulder blades as you perform the movement.\nPause at the top of the motion, and return yourself to the start position.\nRepeat for the desired number of repetitions."],["Inverted_Row_with_Straps","Inverted Row with Straps","","Kraft","Sonstiges",[11],[3,9],"kraft",2,"Hang a rope or suspension straps from a rack or other stable object. Grasp the ends and position yourself in a supine position hanging from the ropes. Your body should be straight with your heels on the ground with your arms fully extended. This will be your starting position.\nBegin by flexing the elbow, pulling your chest to your hands. Retract your shoulder blades as you perform the movement.\nPause at the top of the motion, and return yourself to the start position.\nRepeat for the desired number of repetitions."],["Iron_Cross","Iron Cross","","Kraft","Kurzhantel",[14],[5,7,8,10,13,15],"kraft",2,""],["Iron_Crosses_stretch","Iron Crosses (stretch)","","Dehnen","Ohne",[13],[],"zeit",2,"Lie face down on the floor, with your arms extended out to your side, palms pressed to the floor. This will be your starting position.\nTo begin, flex one knee and bring that leg across the back of your body, attempting to touch it to the ground near the opposite hand.\nPromptly return the leg to the starting postion, and quickly repeat with the other leg. Continue alternating for 10-20 repetitions."],["Isometric_Chest_Squeezes","Isometric Chest Squeezes","","Plyometrie","Körpergewicht",[5],[14,16],"body",2,"While either seating or standing, bend your arms at a 90-degree angle and place the palms of your hands together in front of your chest. Tip: Your hands should be open with the palms together and fingers facing forward (perpendicular to your torso).\nPush both hands against each other as you contract your chest. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.\nHold for the recommended number of seconds.\nNow release the tension slowly.\nRest for the recommended amount of time and repeat."],["Isometric_Neck_Exercise_-_Front_And_Back","Isometric Neck Exercise - Front And Back","","Kraft","Körpergewicht",[12],[],"body",2,"With your head and neck in a neutral position (normal position with head erect facing forward), place both of your hands on the front side of your head.\nNow gently push forward as you contract the neck muscles but resisting any movement of your head. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.\nHold for the recommended number of seconds.\nNow release the tension slowly.\nRest for the recommended amount of time and repeat with your hands placed on the back side of your head."],["Isometric_Neck_Exercise_-_Sides","Isometric Neck Exercise - Sides","","Kraft","Körpergewicht",[12],[],"body",2,"With your head and neck in a neutral position (normal position with head erect facing forward), place your left hand on the left side of your head.\nNow gently push towards the left as you contract the left neck muscles but resisting any movement of your head. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.\nHold for the recommended number of seconds.\nNow release the tension slowly.\nRest for the recommended amount of time and repeat with your right hand placed on the right side of your head."],["Isometric_Wipers","Isometric Wipers","","Kraft","Körpergewicht",[5],[0,14,16],"body",2,"Assume a push-up position, supporting your weight on your hands and toes while keeping your body straight. Your hands should be just outside of shoulder width. This will be your starting position.\nBegin by shifting your body weight as far to one side as possible, allowing the elbow on that side to flex as you lower your body.\nReverse the motion by extending the flexed arm, pushing yourself up and then dropping to the other side.\nRepeat for the desired number of repetitions."],["JM_Press","JM Press","","Kraft","Langhantel",[16],[5,14],"kraft",2,"Start the exercise the same way you would a close grip bench press. You will lie on a flat bench while holding a barbell at arms length (fully extended) with the elbows in. However, instead of having the arms perpendicular to the torso, make sure the bar is set in a direct line above the upper chest. This will be your starting position.\nNow beginning from a fully extended position lower the bar down as if performing a lying triceps extension. Inhale as you perform this movement. When you reach the half way point, let the bar roll back about one inch by moving the upper arms towards your legs until they are perpendicular to the torso. Tip: Keep the bend at the elbows constant as you bring the upper arms forward.\nAs you exhale, press the bar back up by using the triceps to perform a close grip bench press.\nNow go back to the starting position and start over.\nRepeat for the recommended amount of repetitions."],["Jackknife_Sit-Up","Jackknife Sit-Up","","Kraft","Körpergewicht",[0],[],"body",2,"Lie flat on the floor (or exercise mat) on your back with your arms extended straight back behind your head and your legs extended also. This will be your starting position.\nAs you exhale, bend at the waist while simultaneously raising your legs and arms to meet in a jackknife position. Tip: The legs should be extended and lifted at approximately a 35-45 degree angle from the floor and the arms should be extended and parallel to your legs. The upper torso should be off the floor.\nWhile inhaling, lower your arms and legs back to the starting position.\nRepeat for the recommended amount of repetitions."],["Janda_Sit-Up","Janda Sit-Up","","Kraft","Körpergewicht",[0],[],"body",2,"Position your body on the floor in the basic sit-up position; knees to a ninety degree angle with feet flat on the floor and arms either crossed over your chest or to the sides. This will be your starting position.\nAs you strongly tighten your glutes and hamstrings, fill your lungs with air and in a slow (three to six second count) ascent, slowly exhale. Tip: It is important to tighten the glutes and hamstrings as this will cause the hip flexors to be inactivated in a process called reciprocal inhibition, which basically means that opposite muscles to the contracted ones will relax.\nAs you inhale, slowly go back in a controlled manner to the starting position.\nRepeat for the recommended amount of repetitions."],["Jefferson_Squats","Jefferson Squats","","Kraft","Langhantel",[13],[4,7,8,10,15],"kraft",2,"Place a barbell on the floor.\nStand in the middle of the bar length wise.\nBend down by bending at the knees and keeping your back straight and grasp the front of the bar with your right hand. Your palm should be in (neutral grip) facing the left side.\nGrasp the rear of the bar with your left hand. The palm of your hand should be in neutral grip alignment (palms facing the right side). Tip: Ensure that your grip is even on the bar. Your torso should be positioned right in the middle of the bar and the distance between your torso and your right hand (which should be at the front) should be the same as the distance between your torso and your left hand (which should be to your back).\nNow stand straight up with the weight. Tip: Your feet should be shoulder width apart and your toes slightly pointed out.\nSquat down by bending at the knees and keeping your back straight until your upper thighs are parallel with the floor. Tip: Keep your back as vertical as possible with the floor and your head up. Also remember to not let your knees go past your toes. Inhale during this portion of the movement.\nNow drive yourself back up to the starting position by pushing with the feet . Tip: Keep the bar hanging at arm's length and your elbows locked with a slight bend. The arms only serve as hooks. Avoid doing any lifting with them. Do the lifting with your thighs; not your arms."],["Jerk_Balance","Jerk Balance","","Gewichtheben","Langhantel",[14],[7,8,13,16],"kraft",2,"This drill helps you learn to drive yourself low enough during the jerk and corrects those who move backward during the movement. Begin with the bar racked in the jerk position, with the shoulders forward, torso upright, and the feet split slightly apart.\nInitiate the movement as you would a normal jerk, dipping at the knees while keeping your torso vertical, and driving back up forcefully, using momentum and not your arms to elevate the weight.\nKeep the rear foot in place, using it to drive your body forward into a full split as you jerk the weight. Recover by standing up with the weight overhead."],["Jerk_Dip_Squat","Jerk Dip Squat","","Gewichtheben","Langhantel",[13],[0,4],"kraft",2,"This movement strengthens the dip portion of the jerk. Begin with the bar racked in the jerk position, with the shoulders forward to create a shelf and the bar lightly contacting the throat. The feet should be directly under the hips, with the feet turned out as is comfortable.\nKeeping the torso vertical, dip by flexing the knees, allowing them to travel forward and without moving the hips to the rear. The dip should not be excessive. Return the weight to the starting position by driving forcefully though the feet."],["Jogging_Treadmill","Jogging, Treadmill","Joggen (Laufband)","Cardio","Maschine",[13],[7,8],"lauf",2,"To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.\nTreadmills offer convenience, cardiovascular benefits, and usually have less impact than jogging outside. A 150 lb person will burn almost 250 calories jogging for 30 minutes, compared to more than 450 calories running. Maintain proper posture as you jog, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],["Keg_Load","Keg Load","","Strongman","Sonstiges",[10],[0,3,4,6,7,8,11,13,14,15],"kraft",2,"To load kegs, place the desired number a distance from the loading platform, typically 30-50 feet.\nBegin by grabbing the close handle of the first keg, tilting it onto its side to grab the opposite edge of the bottom of the keg. Lift the keg up to your chest.\nThe higher you can place the keg, the faster you should be able to move to the platform. Shouldering is usually not allowed. Be sure to keep a firm hold on the keg. Move as quickly as possible to the platform, and load it, extending through your hips, knees, and ankles to get it as high as possible.\nReturn to the starting position to retrieve the next keg, and repeat until the event is completed."],["Kettlebell_Arnold_Press","Kettlebell Arnold Press","","Kraft","Kettlebell",[14],[16],"kraft",2,"Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you raise the kettlebell towards your shoulder. The palm should be facing inward.\nLooking straight ahead, press the kettlebell out and overhead, rotating your wrist so that your palm faces forward at the top of the motion.\nReturn the kettlebell to the starting position, with the palm facing in."],["Kettlebell_Dead_Clean","Kettlebell Dead Clean","","Kraft","Kettlebell",[8],[4,7,10,13,15],"kraft",2,"Place kettlebell between your feet. To get in the starting position, push your butt back and look straight ahead.\nClean the kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.\nLower the kettlebell, keeping the hamstrings loaded by keeping your back straight and your butt out."],["Kettlebell_Figure_8","Kettlebell Figure 8","","Kraft","Kettlebell",[0],[8,14],"kraft",2,"Place one kettlebell between your legs and take a wider than shoulder width stance. Bend over by pushing your butt out and keeping your back flat.\nPick up a kettlebell and pass it to your other hand between your legs. The receiving hand should reach from behind the legs. Go back and forth for several repetitions."],["Kettlebell_Halo","Kettlebell Halo","","Kraft","Kettlebell",[14],[15,11,0,16],"kraft",0,"Stand tall with your feet hip-width apart. Hold a kettlebell upside down by the horns, with the bell above your hands and close to your chest. Brace your abdominals and squeeze your glutes so your ribcage stays down. This is your starting position.\nKeeping your elbows close to your head, move the kettlebell up past one ear and around behind your head.\nContinue the circle past the opposite ear and back down to the starting position in front of your chest, letting the bell pass close to your body throughout.\nComplete the prescribed number of circles in one direction, then repeat the same number in the opposite direction.\nMove slowly and keep your head, hips and lower back still. If your lower back arches or the bell drifts far from your head, use a lighter weight."],["Kettlebell_Halo_With_Overhead_Extension","Kettlebell Halo with Overhead Extension","","Kraft","Kettlebell",[14,16],[15,11,0],"kraft",0,"Stand tall with your feet hip-width apart. Hold a kettlebell upside down by the horns, with the bell above your hands and close to your chest. Brace your abdominals and squeeze your glutes so your ribcage stays down. This is your starting position.\nKeeping your elbows close to your head, move the kettlebell up past one ear and around until it sits behind your head. Pause here.\nFrom this position, extend your elbows to press the kettlebell up and overhead until your arms are straight, keeping your upper arms alongside your head.\nBend your elbows to lower the kettlebell back to the pause position behind your head, under control.\nContinue the circle past the opposite ear and back down to the starting position in front of your chest to complete one repetition.\nAlternate the direction of the circle on each repetition. Keep your head, hips and lower back still throughout; if your lower back arches or you cannot reach the overhead position without leaning back, use a lighter weight or perform the halo and the extension as separate exercises."],["Kettlebell_Hang_Clean","Kettlebell Hang Clean","","Kraft","Kettlebell",[8],[4,7,10,14,15],"kraft",2,"Place kettlebell between your feet. To get in the starting position, push your butt back and look straight ahead.\nClean kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.\nLower kettlebell to a hanging position between your legs while keeping the hamstrings loaded. Keep your head up at all times."],["Kettlebell_One-Legged_Deadlift","Kettlebell One-Legged Deadlift","","Kraft","Kettlebell",[8],[7,10],"kraft",2,"Hold a kettlebell by the handle in one hand. Stand on one leg, on the same side that you hold the kettlebell.\nKeeping that knee slightly bent, perform a stiff legged deadlift by bending at the hip, extending your free leg behind you for balance.\nContinue lowering the kettlebell until you are parallel to the ground, and then return to the upright position."],["Kettlebell_Overhead_Triceps_Extension","Kettlebell Overhead Triceps Extension","","Kraft","Kettlebell",[16],[14,0],"kraft",0,"Stand with your feet hip-width apart, holding a kettlebell by the horns with both hands. Press it overhead until your arms are extended, with the bell hanging behind your hands.\nBrace your abdominals and keep your upper arms vertical and close to your head. This is your starting position.\nBend at the elbows to lower the kettlebell behind your head, going as far as your shoulder mobility allows without your elbows flaring outward.\nExtend your elbows to press the kettlebell back to the starting position, keeping your upper arms still throughout.\nKeep your ribcage down and avoid arching your lower back as you extend."],["Kettlebell_Pass_Between_The_Legs","Kettlebell Pass Between The Legs","","Kraft","Kettlebell",[0],[7,8,14],"kraft",2,"Place one kettlebell between your legs and take a comfortable stance. Bend over by pushing your butt out and keeping your back flat.\nPick up a kettlebell and pass it to your other hand between your legs, in the fashion of a \"W\". Go back and forth for several repetitions."],["Kettlebell_Pirate_Ships","Kettlebell Pirate Ships","","Kraft","Kettlebell",[14],[0],"kraft",2,"With a wide stance, hold a kettlebell with both hands. Allow it to hang at waist level with your arms extended. This will be your starting position.\nInitiate the movement by turning to one side, swinging the kettlebell to head height. Briefly pause at the top of the motion.\nAllow the bell to drop as you rotate to the opposite side, again raising the kettlebell to head height.\nRepeat for the desired amount of repetitions."],["Kettlebell_Pistol_Squat","Kettlebell Pistol Squat","","Kraft","Kettlebell",[13],[4,7,8,14],"kraft",2,"Pick up a kettlebell with two hands and hold it by the horns. Hold one leg off of the floor and squat down on the other.\nSquat down by flexing the knee and sitting back with the hips, holding the kettlebell up in front of you.\nHold the bottom position for a second and then reverse the motion, driving through the heel and keeping your head and chest up.\nLower yourself again and repeat."],["Kettlebell_Seated_Press","Kettlebell Seated Press","","Kraft","Kettlebell",[14],[16],"kraft",2,"Sit on the floor and spread your legs out comfortably.\nClean one kettlebell to your shoulder.\nPress the kettlebell up and out until it is locked out overhead. Return to the starting position."],["Kettlebell_Seesaw_Press","Kettlebell Seesaw Press","","Kraft","Kettlebell",[14],[16],"kraft",2,"Clean two kettlebells two your shoulders.\nPress one kettlebell.\nLower the kettlebell and immediately press the other kettlebell. Make sure to do the same amount of reps on both sides."],["Kettlebell_Sumo_High_Pull","Kettlebell Sumo High Pull","Kettlebell Sumo High Pull","Kraft","Kettlebell",[15],[2,7,8,13,14],"kraft",2,"Place a kettlebell on the ground between your feet. Position your feet in a wide stance, and grasp the kettlebell with two hands. Set your hips back as far as possible, with your knees bent. Keep your chest and head up. This will be your starting position.\nBegin by extending the hips and knees, simultaneously pulling the kettlebell to your shoulders, raising your elbows as you do so. Reverse the motion to return to the starting position."],["Kettlebell_Thruster","Kettlebell Thruster","","Kraft","Kettlebell",[14],[13,16],"kraft",2,"Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so. This will be your starting position.\nBegin to squat by flexing your hips and knees, lowering your hips between your legs. Maintain an upright, straight back as you descend as low as you can.\nAt the bottom, reverse direction and squat by extending your knees and hips, driving through your heels. As you do so, press both kettlebells overhead by extending your arms straight up, using the momentum from the squat to help drive the weights upward.\nAs you begin the next repetition, return the weights to the shoulders."],["Kettlebell_Turkish_Get-Up_Lunge_style","Kettlebell Turkish Get-Up (Lunge style)","","Kraft","Kettlebell",[14],[0,8,13,16],"kraft",2,"Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.\nKeeping the kettlebell locked out at all times, pivot to the opposite side and use your non- working arm to assist you in driving forward to the lunge position. Using your free hand, push yourself to a seated position, then progressing to one knee.\nWhile looking up at the kettlebell, slowly stand up. Reverse the motion back to the starting position and repeat."],["Kettlebell_Turkish_Get-Up_Squat_style","Kettlebell Turkish Get-Up (Squat style)","","Kraft","Kettlebell",[14],[0,4,8,13,16],"kraft",2,"Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.\nKeeping the kettlebell locked out at all times, pivot to the opposite side and use your non- working arm to assist you in driving forward to the lunge position.\nUsing your free hand, push yourself to a seated position, then progressing to your feet. While looking up at the kettlebell, slowly stand up. Reverse the motion back to the starting position and repeat."],["Kettlebell_Windmill","Kettlebell Windmill","","Kraft","Kettlebell",[0],[7,8,14,16],"kraft",2,"Place a kettlebell in front of your lead foot and clean and press it overhead with your opposite arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders. Rotate your wrist as you do so, so that the palm faces forward. Press it overhead by extending the elbow.\nKeeping the kettlebell locked out at all times, push your butt out in the direction of the locked out kettlebell. Turn your feet out at a forty-five degree angle from the arm with the locked out kettlebell. Bending at the hip to one side, sticking your butt out, slowly lean until you can touch the floor with your free hand. Keep your eyes on the kettlebell that you hold over your head at all times.\nPause for a second after reaching the ground and reverse the motion back to the starting position."],["Kipping_Muscle_Up","Kipping Muscle Up","","Kraft","Sonstiges",[9],[0,3,6,11,14,15,16],"kraft",2,"Grip the rings using a false grip, with the base of your palms on top of the rings.\nBegin with a movement swinging your legs backward slightly.\nCounter that movement by swinging your legs forward and up, jerking your chin and chest back, pulling yourself up with both arms as you do so. As you reach the top position of the pull-up, pull the rings to your armpits as you roll your shoulders forward, allowing your elbows to move straight back behind you. This puts you into the proper position to continue into the dip portion of the movement.\nMaintaining control and stability, extend through the elbow to complete the motion.\nUse care when lowering yourself to the ground."],["Knee_Across_The_Body","Knee Across The Body","","Dehnen","Ohne",[7],[1,10],"zeit",2,"Lie down on the floor with your right leg straight. Bend your left leg and lower it across your body, holding the knee down toward the floor with your right hand. (The knee doesn't need to touch the floor if you're tight.)\nPlace your left arm comfortably beside you and turn your head to the left. Imagine you have a weight tied to your tailbone. let your tailbone fall back toward the floor as your chest reaches in the opposite direction to stretch your lower back. Switch sides."],["Knee_Circles","Knee Circles","","Dehnen","Körpergewicht",[4],[8,13],"zeit",2,"Stand with your legs together and hands by your waist.\nNow move your knees in a circular motion as you breathe normally.\nRepeat for the recommended amount of repetitions."],["Knee_Hip_Raise_On_Parallel_Bars","Knee/Hip Raise On Parallel Bars","","Kraft","Sonstiges",[0],[],"kraft",2,"Position your body on the vertical leg raise bench so that your forearms are resting on the pads next to the torso and holding on to the handles. Your arms will be bent at a 90 degree angle.\nThe torso should be straight with the lower back pressed against the pad of the machine and the legs extended pointing towards the floor. This will be your starting position.\nNow as you breathe out, lift your legs up as you keep them extended. Continue this movement until your legs are roughly parallel to the floor and then hold the contraction for a second. Tip: Do not use any momentum or swinging as you perform this exercise.\nSlowly go back to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions."],["Knee_Tuck_Jump","Knee Tuck Jump","","Plyometrie","Körpergewicht",[8],[1,2,4,7,13],"body",2,"Begin in a comfortable standing position with your knees slightly bent. Hold your hands in front of you, palms down with your fingertips together at chest height. This will be your starting position.\nRapidly dip down into a quarter squat and immediately explode upward. Drive the knees towards the chest, attempting to touch them to the palms of the hands.\nJump as high as you can, raising your knees up, and then ensure a good land be re-extending your legs, absorbing impact through be allowing the knees to rebend."],["Kneeling_Arm_Drill","Kneeling Arm Drill","","Plyometrie","Ohne",[14],[0],"kraft",2,"This drill helps increase arm efficiency during the run. Begin kneeling, left foot in front, right knee down. Apply pressure through the front heel to keep your glutes and hamstrings activated.\nBegin by blocking the arms in long, pendulum like swings. Close the arm angle, blocking with the arms as you would when jogging, progressing to a run and finally a sprint.\nAs soon as your hands pass the hip, accelerate them forward during the sprinting motion to move them as quickly as possible.\nSwitch knees and repeat."],["Kneeling_Cable_Crunch_With_Alternating_Oblique_Twists","Kneeling Cable Crunch With Alternating Oblique Twists","","Kraft","Kabelzug",[0],[],"kraft",2,"Connect a rope attachment to a high pulley cable and position a mat on the floor in front of it.\nGrab the rope with both hands and kneel approximately two feet back from the tower.\nPosition the rope behind your head with your hands by your ears.\nKeep your hands in the same place, contract your abs and pull downward on the rope in a crunching movement until your elbows reach your knees.\nPause briefly at the bottom and rise up in a slow and controlled manner until you reach the starting position.\nRepeat the same downward movement until you're halfway down, at which time you'll begin rotating one of your elbows to the opposite knee.\nAgain, pause briefly at the bottom and rise up in a slow and controlled manner until you reach the starting position.\nRepeat the same movement as before, but alternate the other elbow to the opposite knee.\nContinue this series of movements to failure."],["Kneeling_Cable_Triceps_Extension","Kneeling Cable Triceps Extension","","Kraft","Kabelzug",[16],[],"kraft",2,"Place a bench sideways in front of a high pulley machine.\nHold a straight bar attachment above your head with your hands about 6 inches apart with your palms facing down.\nFace away from the machine and kneel.\nPlace your head and the back of your upper arms on the bench. Your elbows should be bent with the forearms pointing towards the high pulley. This will be your starting position.\nWhile keeping your upper arms close to your head at all times with the elbows in, press the bar out in a semicircular motion until the elbows are locked and your arms are parallel to the floor. Contract the triceps hard and keep this position for a second. Exhale as you perform this movement.\nSlowly return to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions."],["Kneeling_Forearm_Stretch","Kneeling Forearm Stretch","","Dehnen","Ohne",[6],[],"zeit",2,"Start by kneeling on a mat with your palms flat and your fingers pointing back toward your knees.\nSlowly lean back keeping your palms flat on the floor until you feel a stretch in your wrists and forearms. Hold for 20-30 seconds."],["Kneeling_High_Pulley_Row","Kneeling High Pulley Row","","Kraft","Kabelzug",[9],[3,11],"kraft",2,"Select the appropriate weight using a pulley that is above your head. Attach a rope to the cable and kneel a couple of feet away, holding the rope out in front of you with both arms extended. This will be your starting position.\nInitiate the movement by flexing the elbows and fully retracting your shoulders, pulling the rope toward your upper chest with your elbows out.\nAfter pausing briefly, slowly return to the starting position."],["Kneeling_Hip_Flexor","Kneeling Hip Flexor","","Dehnen","Ohne",[13],[13],"zeit",2,"Kneel on a mat and bring your right knee up so the bottom of your foot is on the floor and extend your left leg out behind you so the top of your foot is on the floor.\nShift your weight forward until you feel a stretch in your hip. Hold for 15 seconds, then repeat for your other side."],["Kneeling_Jump_Squat","Kneeling Jump Squat","","Gewichtheben","Langhantel",[7],[4,8,13],"kraft",2,"Begin kneeling on the floor with a barbell racked across the back of your shoulders, or you can use your body weight for this exercise. This can be done inside of a power rack to make unracking easier.\nSit back with your hips until your glutes touch your feet, keeping your head and chest up.\nExplode up with your hips, generating enough power to land with your feet flat on the floor.\nContinue with the squat by driving through your heels and extending the knees to come to a standing position."],["Kneeling_Single-Arm_High_Pulley_Row","Kneeling Single-Arm High Pulley Row","","Kraft","Kabelzug",[9],[3,11],"kraft",2,"Attach a single handle to a high pulley and make your weight selection.\nKneel in front of the cable tower, taking the cable with one hand with your arm extended. This will be your starting position.\nStarting with your palm facing forward, pull the weight down to your torso by flexing the elbow and retract the shoulder blade. As you do so, rotate the wrist so that at the completion of the movement, your palm is now facing you.\nAfter a brief pause, return to the starting position."],["Kneeling_Squat","Kneeling Squat","","Powerlifting","Langhantel",[7],[0,8,10],"kraft",2,"Set the bar to the proper height in a power rack. Kneel behind the bar; it may be beneficial to put a mat down to pad your knees. Slide under the bar, racking it across the back of your shoulders. Your shoulder blades should be retracted and the bar tight across your back. Unrack the weight.\nWith your head looking forward, sit back with your butt until you touch your calves.\nReverse the motion, returning the torso to an upright position."],["Landmine_180s","Landmine 180's","","Kraft","Langhantel",[0],[7,10,14],"kraft",2,"Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.\nRaise the bar from the floor, taking it to shoulder height with both hands with your arms extended in front of you. Adopt a wide stance. This will be your starting position.\nPerform the movement by rotating the trunk and hips as you swing the weight all the way down to one side. Keep your arms extended throughout the exercise.\nReverse the motion to swing the weight all the way to the opposite side.\nContinue alternating the movement until the set is complete."],["Landmine_Linear_Jammer","Landmine Linear Jammer","",
