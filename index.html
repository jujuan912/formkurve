<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Formkurve</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f6fb;--card:#ffffff;--card2:#eef2f8;--line:#e3e8f0;--text:#152033;--mute:#5d6b80;--dim:#9aa5b5;
  --acc:#10b981;--accInk:#ffffff;--accSoft:#d9f7ec;--accDeep:#047857;
  --teal:#14b8a6;--blue:#3b82f6;--warn:#f43f5e;--pink:#ec4899;--violet:#8b5cf6;--amber:#f59e0b;--orange:#f97316;
  --grid:#e8edf4;--shadow:0 1px 2px #1520330d,0 6px 20px #1520330a;
  --r:20px;--pad:16px;--safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,system-ui,sans-serif;font-variant-numeric:tabular-nums}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:#fff}
input::placeholder{color:#a9b3c2}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(var(--safeT) + 6px) 0 calc(88px + var(--safeB))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px var(--pad) 8px;position:sticky;top:0;background:linear-gradient(var(--bg) 82%,#f3f6fb00);z-index:5}
header.top h1{font-size:28px;margin:0;letter-spacing:-.6px;font-weight:850}
header.top .sub{color:var(--mute);font-size:13.5px;font-weight:550}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.page{padding:0 var(--pad)}
.card{background:var(--card);border-radius:var(--r);padding:15px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .lnk,.lnk{color:var(--accDeep);text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}.dim{color:var(--dim)}.small{font-size:12.5px}.tiny{font-size:11px}
.big{font-size:28px;font-weight:850;letter-spacing:-.5px}
.mid{font-size:18px;font-weight:750}
.acc{color:var(--accDeep)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:14px;background:var(--card);font-weight:700;border:1.5px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,#10b981,#14b8a6);color:#fff;border-color:transparent;box-shadow:0 4px 14px #10b98140}
.btn.danger{color:var(--warn);border-color:#fbd0d9;background:#fff5f7}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:13px;white-space:nowrap;font-weight:650;color:var(--mute)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.seg{display:flex;background:#e4e9f1;border-radius:14px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px #15203318}
.list>*{border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;width:100%;text-align:left}
.thumb{width:46px;height:46px;border-radius:13px;background:var(--card2);flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.thumb img{width:100%;height:100%;object-fit:cover;background:#fff}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mute);font-weight:700;white-space:nowrap}
.badge.acc{background:var(--accSoft);color:var(--accDeep)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:14px;padding:10px 11px}
.stat .v{font-size:19px;font-weight:850;letter-spacing:-.3px}
.stat .l{font-size:11.5px;color:var(--mute);margin-top:1px}
.bar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--mute);margin:0 0 4px;font-weight:700}
.empty{color:var(--mute);text-align:center;padding:22px 8px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + var(--safeB));z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:10.5px;font-weight:700}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accDeep)}
nav.tabs button.on svg{background:var(--accSoft);border-radius:10px;padding:2px;width:36px;height:28px}
.scrim{position:fixed;inset:0;background:#15203355;z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;box-shadow:0 -10px 40px #15203322}
.sheet.full{height:100vh;max-height:100vh;border-radius:0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px var(--pad) 10px;background:var(--card);border-radius:24px 24px 0 0;border-bottom:1px solid var(--line)}
.sheet.full .sh{border-radius:0;padding-top:calc(var(--safeT) + 12px)}
.sheet .sh h2{font-size:18px;margin:0;font-weight:850;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .sb{overflow-y:auto;padding:14px var(--pad) calc(24px + var(--safeB));-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.wex{background:var(--card);border-radius:var(--r);padding:13px;margin-bottom:12px;box-shadow:var(--shadow)}
.wex .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.wex .hd .nm{font-weight:800;color:var(--text);flex:1;min-width:0;font-size:15.5px}
.lastline{font-size:12.5px;color:var(--mute);background:var(--card2);border-radius:10px;padding:6px 9px;margin-bottom:6px}
.sugg{display:flex;align-items:center;gap:8px;font-size:12.5px;background:#fff7e6;color:#92400e;border-radius:10px;padding:6px 9px;margin-bottom:8px}
.sugg button{margin-left:auto;font-weight:800;color:#b45309;white-space:nowrap}
table.sets{width:100%;border-collapse:collapse}
table.sets th{font-size:10.5px;color:var(--mute);font-weight:800;text-align:center;padding:4px 2px;text-transform:uppercase;letter-spacing:.03em}
table.sets td{padding:3px 2px;text-align:center}
table.sets td input{padding:8px 3px;text-align:center;border-radius:9px;font-weight:700}
table.sets tr.done td{background:var(--accSoft)}
table.sets tr.done td:first-child{border-radius:10px 0 0 10px}
table.sets tr.done td:last-child{border-radius:0 10px 10px 0}
table.sets tr.done input{background:#fff}
.setno{font-weight:850;color:var(--mute);font-size:13px;width:28px;border-radius:8px;padding:5px 0}
.setno.w{color:var(--amber)}
.prev{font-size:11.5px;color:var(--dim);white-space:nowrap}
.chk{width:34px;height:33px;border-radius:9px;background:var(--card2);display:grid;place-items:center;color:var(--dim)}
.chk.on{background:var(--acc);color:#fff}
.chk svg{width:18px;height:18px}
.resttimer{position:sticky;bottom:0;background:#fff;border:2px solid var(--acc);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-top:8px;box-shadow:0 8px 24px #10b98133}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--dim);text-align:center;font-weight:800;padding-bottom:2px}
.cal .d{aspect-ratio:1/1.1;border-radius:11px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px;font-size:12.5px;font-weight:700}
.cal .d.out{opacity:.3}
.cal .d.today{outline:2px solid var(--acc)}
.cal .d.tr{background:var(--accSoft)}
.cal .d .ds{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .d .ds i{width:7px;height:7px;border-radius:50%}
.cal .d .hb{display:flex;gap:2px;width:76%}
.cal .d .hb b{flex:1;height:3px;border-radius:2px;background:#d5dce7}
.habit{flex:1;min-width:46%;border-radius:16px;padding:12px;background:var(--card2);border:2px solid transparent;text-align:left;transition:.15s}
.habit.on{border-color:var(--hc,var(--acc));background:#fff;box-shadow:0 4px 14px #15203312}
.habit .t{font-weight:800;font-size:14px}
.habit .st{font-size:12px;color:var(--mute);margin-top:2px}
.wdots{display:flex;gap:4px;margin-top:8px}
.wdots i{flex:1;height:7px;border-radius:4px;background:#d9e0ea}
.wdots i.on{background:var(--hc,var(--acc))}
.wdots i.td{outline:1.5px solid var(--mute);outline-offset:1px}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wstrip .c{background:var(--card2);border-radius:12px;padding:6px 2px;text-align:center;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:3px}
.wstrip .c.td{outline:2px solid var(--acc)}
.wstrip .c .n{font-size:11px;color:var(--mute);font-weight:800}
.wstrip .c .p{font-size:9.5px;line-height:1.15;font-weight:650;word-break:break-word}
.wstrip .c .s{font-size:15px}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safeB));background:var(--text);color:#fff;padding:11px 17px;border-radius:14px;font-weight:700;z-index:90;box-shadow:0 8px 30px #15203340;animation:up .2s;max-width:90vw;text-align:center}
.exImg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.exImg img{width:100%;border-radius:14px;background:#fff;aspect-ratio:4/3;object-fit:cover;box-shadow:var(--shadow)}
.exHero{border-radius:20px;height:150px;display:grid;place-items:center;font-size:72px;margin-bottom:12px;color:#fff}
.chart{width:100%;display:block}
.chart text{fill:var(--mute);font-size:10px}
.mus-wrap{display:flex;gap:6px;justify-content:center}
.mus-wrap svg{width:48%;max-width:210px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2);position:relative}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .dt{position:absolute;left:4px;bottom:4px;font-size:10px;background:#000a;color:#fff;padding:1px 5px;border-radius:5px}
video#scanv{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
.scanbox{position:relative}
.scanbox .ln{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--warn);box-shadow:0 0 12px var(--warn)}
.hm-grid{display:grid;gap:3px;font-size:11px}
.hm-grid .h{text-align:center;color:var(--dim);font-weight:800}
.hm-grid .c{border-radius:6px;text-align:center;padding:5px 0;font-weight:800;font-size:11px;min-height:24px;line-height:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;text-align:left}
.kv:first-child{border-top:0}
.kv b{font-weight:750;text-align:right}
.pr{color:#b45309}
.livebar{background:linear-gradient(135deg,#10b981,#14b8a6);color:#fff;border-radius:16px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:14px;width:100%;box-shadow:0 6px 18px #10b98140}
.swtch{width:46px;height:28px;border-radius:99px;background:#d5dce7;position:relative;flex:none;transition:.15s}
.swtch::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px #0003}
.swtch.on{background:var(--acc)}.swtch.on::after{left:21px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
.hero{border-radius:24px;padding:18px;color:#fff;margin-bottom:14px;background:linear-gradient(135deg,#10b981 0%,#14b8a6 45%,#3b82f6 100%);box-shadow:0 10px 28px #14b8a640;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:#ffffff1f}
.hero .big{font-size:24px}
.hero .btn{background:#ffffffeb;color:var(--accDeep);border:0}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.count{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:100;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hyrow{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;align-items:center;padding:3px 0}
.hyrow .lbl{font-size:13.5px;font-weight:650}
.hyrow .lbl.run{color:var(--blue)}
</style>
</head>

<script>window.__EXDB={"m":["abdominals","abductors","adductors","biceps","calves","chest","forearms","glutes","hamstrings","lats","lower back","middle back","neck","quadriceps","shoulders","traps","triceps"],"x":[["3_4_Sit-Up","3/4 Sit-Up","","Kraft","Körpergewicht",[0],[],"body",2,"Lie down on the floor and secure your feet. Your legs should be bent at the knees.\nPlace your hands behind or to the side of your head. You will begin with your back on the ground. This will be your starting position.\nFlex your hips and spine to raise your torso toward your knees.\nAt the top of the contraction your torso should be perpendicular to the ground. Reverse the motion, going only ¾ of the way down.\nRepeat for the recommended amount of repetitions."],["90_90_Hamstring","90/90 Hamstring","","Dehnen","Körpergewicht",[8],[4],"zeit",2,"Lie on your back, with one leg extended straight out.\nWith the other leg, bend the hip and knee to 90 degrees. You may brace your leg with your hands if necessary. This will be your starting position.\nExtend your leg straight into the air, pausing briefly at the top. Return the leg to the starting position.\nRepeat for 10-20 repetitions, and then switch to the other leg."],["Ab_Crunch_Machine","Ab Crunch Machine","","Kraft","Maschine",[0],[],"kraft",2,"Select a light resistance and sit down on the ab machine placing your feet under the pads provided and grabbing the top handles. Your arms should be bent at a 90 degree angle as you rest the triceps on the pads provided. This will be your starting position.\nAt the same time, begin to lift the legs up as you crunch your upper torso. Breathe out as you perform this movement. Tip: Be sure to use a slow and controlled motion. Concentrate on using your abs to move the weight while relaxing your legs and feet.\nAfter a second pause, slowly return to the starting position as you breathe in.\nRepeat the movement for the prescribed amount of repetitions."],["Ab_Roller","Ab Roller","Bauchroller (Ab Wheel)","Kraft","Sonstiges",[0],[14],"kraft",2,"Hold the Ab Roller with both hands and kneel on the floor.\nNow place the ab roller on the floor in front of you so that you are on all your hands and knees (as in a kneeling push up position). This will be your starting position.\nSlowly roll the ab roller straight forward, stretching your body into a straight position. Tip: Go down as far as you can without touching the floor with your body. Breathe in during this portion of the movement.\nAfter a pause at the stretched position, start pulling yourself back to the starting position as you breathe out. Tip: Go slowly and keep your abs tight at all times."],["Adductor","Adductor","","Dehnen","Faszienrolle",[2],[],"zeit",2,"Lie face down with one leg on a foam roll.\nRotate the leg so that the foam roll contacts against your inner thigh. Shift as much weight onto the foam roll as can be tolerated.\nWhile trying to relax the muscles if the inner thigh, roll over the foam between your hip and knee, holding points of tension for 10-30 seconds. Repeat with the other leg."],["Adductor_Groin","Adductor/Groin","","Dehnen","Ohne",[2],[],"zeit",2,"Lie on your back with your feet raised towards the ceiling.\nHave your partner hold your feet or ankles. Abduct your legs as far as you can. This will be your starting position.\nAttempt to squeeze your legs together for 10 or more seconds, while your partner prevents you from doing so.\nNow, relax the muscles in your legs as your partner pushes your feet apart, stretching as far as is comfortable for you. Be sure to let your partner know when the stretch is adequate to prevent overstretching or injury."],["Advanced_Kettlebell_Windmill","Advanced Kettlebell Windmill","","Kraft","Kettlebell",[0],[7,8,14],"kraft",2,"Clean and press a kettlebell overhead with one arm.\nKeeping the kettlebell locked out at all times, push your butt out in the direction of the locked out kettlebell. Keep the non-working arm behind your back and turn your feet out at a forty-five degree angle from the arm with the kettlebell.\nLower yourself as far as possible.\nPause for a second and reverse the motion back to the starting position."],["Air_Bike","Air Bike","Air Bike","Kraft","Körpergewicht",[0],[],"body",2,"Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put your hands beside your head. Be careful however to not strain with the neck as you perform it. Now lift your shoulders into the crunch position.\nBring knees up to where they are perpendicular to the floor, with your lower legs parallel to the floor. This will be your starting position.\nNow simultaneously, slowly go through a cycle pedal motion kicking forward with the right leg and bringing in the knee of the left leg. Bring your right elbow close to your left knee by crunching to the side, as you breathe out.\nGo back to the initial position as you breathe in.\nCrunch to the opposite side as you cycle your legs and bring closer your left elbow to your right knee and exhale.\nContinue alternating in this manner until all of the recommended repetitions for each side have been completed."],["All_Fours_Quad_Stretch","All Fours Quad Stretch","","Dehnen","Körpergewicht",[13],[13],"zeit",2,"Start off on your hands and knees, then lift your leg off the floor and hold the foot with your hand.\nUse your hand to hold the foot or ankle, keeping the knee fully flexed, stretching the quadriceps and hip flexors.\nFocus on extending your hips, thrusting them towards the floor. Hold for 10-20 seconds and then switch sides."],["Alternate_Hammer_Curl","Alternate Hammer Curl","","Kraft","Kurzhantel",[3],[6],"kraft",2,"Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.\nThe palms of the hands should be facing your torso. This will be your starting position.\nWhile holding the upper arm stationary, curl the right weight forward while contracting the biceps as you breathe out. Continue the movement until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.\nSlowly begin to bring the dumbbells back to starting position as your breathe in.\nRepeat the movement with the left hand. This equals one repetition.\nContinue alternating in this manner for the recommended amount of repetitions."],["Alternate_Heel_Touchers","Alternate Heel Touchers","","Kraft","Körpergewicht",[0],[],"body",2,"Lie on the floor with the knees bent and the feet on the floor around 18-24 inches apart. Your arms should be extended by your side. This will be your starting position.\nCrunch over your torso forward and up about 3-4 inches to the right side and touch your right heel as you hold the contraction for a second. Exhale while performing this movement.\nNow go back slowly to the starting position as you inhale.\nNow crunch over your torso forward and up around 3-4 inches to the left side and touch your left heel as you hold the contraction for a second. Exhale while performing this movement and then go back to the starting position as you inhale. Now that both heels have been touched, that is considered 1 repetition.\nContinue alternating sides in this manner until all prescribed repetitions are done."],["Alternate_Incline_Dumbbell_Curl","Alternate Incline Dumbbell Curl","","Kraft","Kurzhantel",[3],[6],"kraft",2,"Sit down on an incline bench with a dumbbell in each hand being held at arms length. Tip: Keep the elbows close to the torso.This will be your starting position.\nWhile holding the upper arm stationary, curl the right weight forward while contracting the biceps as you breathe out. As you do so, rotate the hand so that the palm is facing up. Continue the movement until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.\nSlowly begin to bring the dumbbell back to starting position as your breathe in.\nRepeat the movement with the left hand. This equals one repetition.\nContinue alternating in this manner for the recommended amount of repetitions."],["Alternate_Leg_Diagonal_Bound","Alternate Leg Diagonal Bound","","Plyometrie","Ohne",[13],[1,2,4,7,8],"kraft",2,"Assume a comfortable stance with one foot slightly in front of the other.\nBegin by pushing off with the front leg, driving the opposite knee forward and as high as possible before landing. Attempt to cover as much distance to each side with each bound.\nIt may help to use a line on the ground to guage distance from side to side.\nRepeat the sequence with the other leg."],["Alternating_Cable_Shoulder_Press","Alternating Cable Shoulder Press","","Kraft","Kabelzug",[14],[16],"kraft",2,"Move the cables to the bottom of the tower and select an appropriate weight.\nGrasp the cables and hold them at shoulder height, palms facing forward. This will be your starting position.\nKeeping your head and chest up, extend through the elbow to press one side directly over head.\nAfter pausing at the top, return to the starting position and repeat on the opposite side."],["Alternating_Deltoid_Raise","Alternating Deltoid Raise","","Kraft","Kurzhantel",[14],[],"kraft",2,"In a standing position, hold a pair of dumbbells at your side.\nKeeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.\nReturn the weights to your side.\nOn the next repetition, raise the weights laterally, raising them out to your side to about shoulder height.\nReturn the weights to the starting position and continue alternating to the front and side."],["Alternating_Floor_Press","Alternating Floor Press","","Kraft","Kettlebell",[5],[0,14,16],"kraft",2,"Lie on the floor with two kettlebells next to your shoulders.\nPosition one in place on your chest and then the other, gripping the kettlebells on the handle with the palms facing forward.\nExtend both arms, so that the kettlebells are being held above your chest. Lower one kettlebell, bringing it to your chest and turn the wrist in the direction of the locked out kettlebell.\nRaise the kettlebell and repeat on the opposite side."],["Alternating_Hang_Clean","Alternating Hang Clean","","Kraft","Kettlebell",[8],[3,4,6,7,10,15],"kraft",2,"Place two kettlebells between your feet. To get in the starting position, push your butt back and look straight ahead.\nClean one kettlebell to your shoulder and hold on to the other kettlebell in a hanging position. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders. Rotate your wrist as you do so.\nLower the cleaned kettlebell to a hanging position and clean the alternate kettlebell. Repeat."],["Alternating_Kettlebell_Press","Alternating Kettlebell Press","","Kraft","Kettlebell",[14],[16],"kraft",2,"Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so.\nPress one directly overhead by extending through the elbow, turning it so the palm faces forward while holding the other kettlebell stationary .\nLower the pressed kettlebell to the starting position and immediately press with your other arm."],["Alternating_Kettlebell_Row","Alternating Kettlebell Row","","Kraft","Kettlebell",[11],[3,9],"kraft",2,"Place two kettlebells in front of your feet. Bend your knees slightly and push your butt out as much as possible. As you bend over to get into the starting position grab both kettlebells by the handles.\nPull one kettlebell off of the floor while holding on to the other kettlebell. Retract the shoulder blade of the working side, as you flex the elbow, drawing the kettlebell towards your stomach or rib cage.\nLower the kettlebell in the working arm and repeat with your other arm."],["Alternating_Renegade_Row","Alternating Renegade Row","","Kraft","Kettlebell",[11],[0,3,5,9,16],"kraft",2,"Place two kettlebells on the floor about shoulder width apart. Position yourself on your toes and your hands as though you were doing a pushup, with the body straight and extended. Use the handles of the kettlebells to support your upper body. You may need to position your feet wide for support.\nPush one kettlebell into the floor and row the other kettlebell, retracting the shoulder blade of the working side as you flex the elbow, pulling it to your side.\nThen lower the kettlebell to the floor and begin the kettlebell in the opposite hand. Repeat for several reps."],["Ankle_Circles","Ankle Circles","","Dehnen","Ohne",[4],[],"zeit",2,"Use a sturdy object like a squat rack to hold yourself.\nLift the right leg in the air (just around 2 inches from the floor) and perform a circular motion with the big toe. Pretend that you are drawing a big circle with it. Tip: One circle equals 1 repetition. Breathe normally as you perform the movement.\nWhen you are done with the right foot, then repeat with the left leg."],["Ankle_On_The_Knee","Ankle On The Knee","","Dehnen","Ohne",[7],[],"zeit",2,"From a lying position, bend your knees and keep your feet on the floor.\nPlace your ankle of one foot on your opposite knee.\nGrasp the thigh or knee of the bottom leg and pull both of your legs into the chest. Relax your neck and shoulders. Hold for 10-20 seconds and then switch sides."],["Anterior_Tibialis-SMR","Anterior Tibialis-SMR","","Dehnen","Sonstiges",[4],[],"zeit",2,"Begin seated on the ground with your legs bent and your feet on the floor.\nUsing a Muscle Roller or a rolling pin, apply pressure to the muscles on the outside of your shins. Work from just below the knee to above the ankle, pausing at points of tension for 10-30 seconds. Repeat on the other leg."],["Anti-Gravity_Press","Anti-Gravity Press","","Kraft","Langhantel",[14],[11,15,16],"kraft",2,"Place a bar on the ground behind the head of an incline bench.\nLay on the bench face down. With a pronated grip, pick the barbell up from the floor. Flex the elbows, performing a reverse curl to bring the bar near your chest. This will be your starting position.\nTo begin, press the barbell out in front of your head by extending your elbows. Keep your arms parallel to the ground throughout the movement.\nReturn to the starting position and repeat to complete the set."],["Arm_Circles","Arm Circles","","Dehnen","Ohne",[14],[15],"zeit",2,"Stand up and extend your arms straight out by the sides. The arms should be parallel to the floor and perpendicular (90-degree angle) to your torso. This will be your starting position.\nSlowly start to make circles of about 1 foot in diameter with each outstretched arm. Breathe normally as you perform the movement.\nContinue the circular motion of the outstretched arms for about ten seconds. Then reverse the movement, going the opposite direction."],["Arnold_Dumbbell_Press","Arnold Dumbbell Press","Arnold Press","Kraft","Kurzhantel",[14],[16],"kraft",2,"Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.\nNow to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.\nContinue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.\nAfter a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement.\nRepeat for the recommended amount of repetitions."],["Around_The_Worlds","Around The Worlds","","Kraft","Kurzhantel",[5],[14],"kraft",2,"Lay down on a flat bench holding a dumbbell in each hand with the palms of the hands facing towards the ceiling. Tip: Your arms should be parallel to the floor and next to your thighs. To avoid injury, make sure that you keep your elbows slightly bent. This will be your starting position.\nNow move the dumbbells by creating a semi-circle as you displace them from the initial position to over the head. All of the movement should happen with the arms parallel to the floor at all times. Breathe in as you perform this portion of the movement.\nReverse the movement to return the weight to the starting position as you exhale."],["Atlas_Stone_Trainer","Atlas Stone Trainer","","Strongman","Sonstiges",[10],[3,6,7,8,13],"kraft",2,"This trainer is effective for developing Atlas Stone strength for those who don't have access to stones, and are typically made from bar ends or heavy pipe.\nBegin by loading the desired weight onto the bar. Straddle the weight, wrapping your arms around the implement, bending at the hips.\nBegin by pulling the weight up past the knees, extending through the hips. As the weight clears the knees, it can be lapped by resting it on your thighs and sitting back, hugging it tightly to your chest.\nFinish the movement by extending through your hips and knees to raise the weight as high as possible. The weight can be returned to the lap or to the ground for successive repetitions."],["Atlas_Stones","Atlas Stones","","Strongman","Sonstiges",[10],[0,2,3,4,6,7,8,11,13,15],"kraft",2,"Begin with the atlas stone between your feet. Bend at the hips to wrap your arms vertically around the Atlas Stone, attempting to get your fingers underneath the stone. Many stones will have a small flat portion on the bottom, which will make the stone easier to hold.\nPulling the stone into your torso, drive through the back half of your feet to pull the stone from the ground.\nAs the stone passes the knees, lap it by sitting backward, pulling the stone on top of your thighs.\nSit low, getting the stone high onto your chest as you change your grip to reach over the stone. Stand, driving through with your hips. Close distance to the loading platform, and lean back, extending the hips to get the stone as high as possible."],["Axle_Deadlift","Axle Deadlift","","Strongman","Sonstiges",[10],[6,7,8,11,13,15],"kraft",2,"Approach the bar so that it is centered over your feet. You feet should be about hip width apart. Bend at the hip to grip the bar at shoulder width, allowing your shoulder blades to protract. Typically, you would use an over/under grip.\nWith your feet and your grip set, take a big breath and then lower your hips and flex the knees until your shins contact the bar. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward.\nAfter the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.\nLower the bar by bending at the hips and guiding it to the floor."],["Back_Flyes_-_With_Bands","Back Flyes - With Bands","","Kraft","Bänder",[14],[11,16],"kraft",2,"Run a band around a stationary post like that of a squat rack.\nGrab the band by the handles and stand back so that the tension in the band rises.\nExtend and lift the arms straight in front of you. Tip: Your arms should be straight and parallel to the floor while perpendicular to your torso. Your feet should be firmly planted on the floor spread at shoulder width. This will be your starting position.\nAs you exhale, move your arms to the sides and back. Keep your arms extended and parallel to the floor. Continue the movement until the arms are extended to your sides.\nAfter a pause, go back to the original position as you inhale.\nRepeat for the recommended amount of repetitions."],["Backward_Drag","Backward Drag","","Strongman","Sonstiges",[13],[4,6,7,8,10],"kraft",2,"Load a sled with the desired weight, attaching a rope or straps to the sled that you can hold onto.\nBegin the exercise by moving backwards for a given distance. Leaning back, extend through the legs for short steps to move as quickly as possible."],["Backward_Medicine_Ball_Throw","Backward Medicine Ball Throw","","Plyometrie","Medizinball",[14],[],"kraft",2,"This exercise is best done with a partner. If you lack a partner, the ball can be thrown and retrieved or thrown against a wall.\nBegin standing a few meters in front of your partner, both facing the same direction. Begin holding the ball between your legs.\nSquat down and then forcefully reverse direction, coming to full extension and you toss the ball over your head to your partner.\nYour partner can then roll the ball back to you. Repeat for the desired number of repetitions."],["Balance_Board","Balance Board","","Kraft","Sonstiges",[4],[8,13],"kraft",2,"Place a balance board in front of you.\nStand up on it and try to balance yourself.\nHold the balance for as long as desired."],["Ball_Leg_Curl","Ball Leg Curl","","Kraft","Gymnastikball",[8],[4,7],"kraft",2,"Begin on the floor laying on your back with your feet on top of the ball.\nPosition the ball so that when your legs are extended your ankles are on top of the ball. This will be your starting position.\nRaise your hips off of the ground, keeping your weight on the shoulder blades and your feet.\nFlex the knees, pulling the ball as close to you as you can, contracting the hamstrings.\nAfter a brief pause, return to the starting position."],["Band_Assisted_Pull-Up","Band Assisted Pull-Up","","Kraft","Sonstiges",[9],[0,6,11],"kraft",2,"Choke the band around the center of the pullup bar. You can use different bands to provide varying levels of assistance.\nPull the end of the band down, and place one bent knee into the loop, ensuring it won't slip out. Take a medium to wide grip on the bar. This will be your starting position.\nPull yourself upward by contracting the lats as you flex the elbow. The elbow should be driven to your side. Pull to the front, attempting to get your chin over the bar. Avoid swinging or jerking movements.\nAfter a brief pause, return to the starting position."],["Band_Good_Morning","Band Good Morning","","Powerlifting","Bänder",[8],[7,10],"kraft",2,"Using a 41 inch band, stand on one end, spreading your feet a small amount. Bend at the hips to loop the end of the band behind your neck. This will be your starting position.\nKeeping your legs straight, extend through the hips to come to a near vertical position.\nEnsure that you do not round your back as you go down back to the starting position."],["Band_Good_Morning_Pull_Through","Band Good Morning (Pull Through)","","Powerlifting","Bänder",[8],[7,10],"kraft",2,"Loop the band around a post. Standing a little ways away, loop the opposite end around the neck. Your hands can help hold the band in position.\nBegin by bending at the hips, getting your butt back as far as possible. Keep your back flat and bend forward to about 90 degrees. Your knees should be only slightly bent.\nReturn to the starting position be driving through with the hips to come back to a standing position."],["Band_Hip_Adductions","Band Hip Adductions","","Kraft","Bänder",[2],[],"kraft",2,"Anchor a band around a solid post or other object.\nStand with your left side to the post, and put your right foot through the band, getting it around the ankle.\nStand up straight and hold onto the post if needed. This will be your starting position.\nKeeping the knee straight, raise your right legs out to the side as far as you can.\nReturn to the starting position and repeat for the desired rep count.\nSwitch sides."],["Band_Pull_Apart","Band Pull Apart","","Kraft","Bänder",[14],[11,15],"kraft",2,"Begin with your arms extended straight out in front of you, holding the band with both hands.\nInitiate the movement by performing a reverse fly motion, moving your hands out laterally to your sides.\nKeep your elbows extended as you perform the movement, bringing the band to your chest. Ensure that you keep your shoulders back during the exercise.\nPause as you complete the movement, returning to the starting position under control."],["Band_Skull_Crusher","Band Skull Crusher","","Kraft","Bänder",[16],[],"kraft",2,"Secure a band to the base of a rack or the bench. Lay on the bench so that the band is lined up with your head.\nTake hold of the band, raising your elbows so that the upper arm is perpendicular to the floor. With the elbow flexed, the band should be above your head. This will be your starting position.\nExtend through the elbow to straighten your arm, keeping your upper arm in place. Pause at the top of the motion, and return to the starting position."],["Barbell_Ab_Rollout","Barbell Ab Rollout","","Kraft","Langhantel",[0],[10,14],"kraft",2,"For this exercise you will need to get into a pushup position, but instead of having your hands of the floor, you will be grabbing on to an Olympic barbell (loaded with 5-10 lbs on each side) instead. This will be your starting position.\nWhile keeping a slight arch on your back, lift your hips and roll the barbell towards your feet as you exhale. Tip: As you perform the movement, your glutes should be coming up, you should be keeping the abs tight and should maintain your back posture at all times. Also your arms should be staying perpendicular to the floor throughout the movement. If you don't, you will work out your shoulders and back more than the abs.\nAfter a second contraction at the top, start to roll the barbell back forward to the starting position slowly as you inhale.\nRepeat for the recommended amount of repetitions."],["Barbell_Ab_Rollout_-_On_Knees","Barbell Ab Rollout - On Knees","","Kraft","Langhantel",[0],[10,14],"kraft",2,"Hold an Olympic barbell loaded with 5-10lbs on each side and kneel on the floor.\nNow place the barbell on the floor in front of you so that you are on all your hands and knees (as in a kneeling push up position). This will be your starting position.\nSlowly roll the barbell straight forward, stretching your body into a straight position. Tip: Go down as far as you can without touching the floor with your body. Breathe in during this portion of the movement.\nAfter a second pause at the stretched position, start pulling yourself back to the starting position as you breathe out. Tip: Go slowly and keep your abs tight at all times."],["Barbell_Bench_Press_-_Medium_Grip","Barbell Bench Press - Medium Grip","Bankdrücken (Langhantel)","Kraft","Langhantel",[5],[14,16],"kraft",2,"Lie back on a flat bench. Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.\nFrom the starting position, breathe in and begin coming down slowly until the bar touches your middle chest.\nAfter a brief pause, push the bar back to the starting position as you breathe out. Focus on pushing the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position at the top of the motion, hold for a second and then start coming down slowly again. Tip: Ideally, lowering the weight should take about twice as long as raising it.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the bar back in the rack."],["Barbell_Curl","Barbell Curl","Bizepscurl (Langhantel)","Kraft","Langhantel",[3],[6],"kraft",2,"Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.\nWhile holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.\nContinue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.\nSlowly begin to bring the bar back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions."],["Barbell_Curls_Lying_Against_An_Incline","Barbell Curls Lying Against An Incline","","Kraft","Langhantel",[3],[],"kraft",2,"Lie against an incline bench, with your arms holding a barbell and hanging down in a horizontal line. This will be your starting position.\nWhile keeping the upper arms stationary, curl the weight up as high as you can while squeezing the biceps. Breathe out as you perform this portion of the movement. Tip: Only the forearms should move. Do not swing the arms.\nAfter a second contraction, slowly go back to the starting position as you inhale. Tip: Make sure that you go all of the way down.\nRepeat for the recommended amount of repetitions."],["Barbell_Deadlift","Barbell Deadlift","Kreuzheben","Kraft","Langhantel",[10],[4,6,7,8,9,11,13,15],"kraft",2,"Stand in front of a loaded barbell.\nWhile keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.\nWhile holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.\nGo back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.\nPerform the amount of repetitions prescribed in the program."],["Barbell_Full_Squat","Barbell Full Squat","Kniebeuge tief (Langhantel)","Kraft","Langhantel",[13],[4,7,8,10],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just above shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a shoulder-width medium stance with the toes slightly pointed out. Keep your head up at all times and maintain a straight back. This will be your starting position.\nBegin to slowly lower the bar by bending the knees and sitting back with your hips as you maintain a straight posture with the head up. Continue down until your hamstrings are on your calves. Inhale as you perform this portion of the movement.\nBegin to raise the bar as you exhale by pushing the floor with the heel or middle of your foot as you straighten the legs and extend the hips to go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Barbell_Glute_Bridge","Barbell Glute Bridge","Glute Bridge (Langhantel)","Powerlifting","Langhantel",[7],[4,8],"kraft",2,"Begin seated on the ground with a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise. Roll the bar so that it is directly above your hips, and lay down flat on the floor.\nBegin the movement by driving through with your heels, extending your hips vertically through the bar. Your weight should be supported by your upper back and the heels of your feet.\nExtend as far as possible, then reverse the motion to return to the starting position."],["Barbell_Guillotine_Bench_Press","Barbell Guillotine Bench Press","","Kraft","Langhantel",[5],[14,16],"kraft",2,"Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over your neck with your arms locked. This will be your starting position.\nAs you breathe in, bring the bar down slowly until it is about 1 inch from your neck.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the bar back in the rack."],["Barbell_Hack_Squat","Barbell Hack Squat","Hack Squat (Langhantel)","Kraft","Langhantel",[13],[4,6,8],"kraft",2,"Stand up straight while holding a barbell behind you at arms length and your feet at shoulder width. Tip: A shoulder width grip is best with the palms of your hands facing back. You can use wrist wraps for this exercise for a better grip. This will be your starting position.\nWhile keeping your head and eyes up and back straight, squat until your upper thighs are parallel to the floor. Breathe in as you slowly go down.\nPressing mainly with the heel of the foot and squeezing the thighs, go back up as you breathe out.\nRepeat for the recommended amount of repetitions."],["Barbell_Hip_Thrust","Barbell Hip Thrust","Hip Thrust (Langhantel)","Powerlifting","Langhantel",[7],[4,8],"kraft",2,"Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.\nRoll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.\nBegin the movement by driving through your feet, extending your hips vertically through the bar. Your weight should be supported by your shoulder blades and your feet. Extend as far as possible, then reverse the motion to return to the starting position."],["Barbell_Incline_Bench_Press_-_Medium_Grip","Barbell Incline Bench Press - Medium Grip","Schrägbankdrücken (Langhantel)","Kraft","Langhantel",[5],[14,16],"kraft",2,"Lie back on an incline bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.\nAs you breathe in, come down slowly until you feel the bar on you upper chest.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly again. Tip: it should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the bar back in the rack."],["Barbell_Incline_Shoulder_Raise","Barbell Incline Shoulder Raise","","Kraft","Langhantel",[14],[5],"kraft",2,"Lie back on an Incline Bench. Using a medium width grip (a grip that is slightly wider than shoulder width), lift the bar from the rack and hold it straight over you with your arms straight. This will be your starting position.\nWhile keeping the arms straight, lift the bar by protracting your shoulder blades, raising the shoulders from the bench as you breathe out.\nBring back the bar to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions."],["Barbell_Lunge","Barbell Lunge","","Kraft","Langhantel",[13],[4,7,8],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>\nUsing mainly the heel of your foot, push up and go back to the starting position as you exhale.\nRepeat the movement for the recommended amount of repetitions and then perform with the left leg."],["Barbell_Rear_Delt_Row","Barbell Rear Delt Row","","Kraft","Langhantel",[14],[3,9,11],"kraft",2,"Stand up straight while holding a barbell using a wide (higher than shoulder width) and overhand (palms facing your body) grip.\nBend knees slightly and bend over as you keep the natural arch of your back. Let the arms hang in front of you as they hold the bar. Once your torso is parallel to the floor, flare the elbows out and away from your body. Tip: Your torso and your arms should resemble the letter \"T\". Now you are ready to begin the exercise.\nWhile keeping the upper arms perpendicular to the torso, pull the barbell up towards your upper chest as you squeeze the rear delts and you breathe out. Tip: When performed correctly, this exercise should resemble a bench press in reverse. Also, refrain from using your biceps to do the work. Focus on targeting the rear delts; the arms should only act as hooks.\nSlowly go back to the initial position as you breathe in.\nRepeat for the recommended amount of repetitions."],["Barbell_Rollout_from_Bench","Barbell Rollout from Bench","","Kraft","Langhantel",[0],[7,8,9,14],"kraft",2,"Place a loaded barbell on the ground, near the end of a bench. Kneel with both legs on the bench, and take a medium to narrow grip on the barbell. This will be your starting position.\nTo begin, extend through the hips to slowly roll the bar forward. As you roll out, flex the shoulder to roll the bar above your head. Ensure that your arms remain extended throughout the movement.\nWhen the bar has been moved as far forward as possible, return to the starting position."],["Barbell_Seated_Calf_Raise","Barbell Seated Calf Raise","","Kraft","Langhantel",[4],[],"kraft",2,"Place a block about 12 inches in front of a flat bench.\nSit on the bench and place the ball of your feet on the block.\nHave someone place a barbell over your upper thighs about 3 inches above your knees and hold it there. This will be your starting position.\nRaise up on your toes as high as possible as you squeeze the calves and as you breathe out.\nAfter a second contraction, slowly go back to the starting position. Tip: To get maximum benefit stretch your calves as far as you can.\nRepeat for the recommended amount of repetitions."],["Barbell_Shoulder_Press","Barbell Shoulder Press","Schulterdrücken (Langhantel)","Kraft","Langhantel",[14],[5,16],"kraft",2,"Sit on a bench with back support in a squat rack. Position a barbell at a height that is just above your head. Grab the barbell with a pronated grip (palms facing forward).\nOnce you pick up the barbell with the correct grip width, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.\nLower the bar down to the shoulders slowly as you inhale.\nLift the bar back up to the starting position as you exhale.\nRepeat for the recommended amount of repetitions."],["Barbell_Shrug","Barbell Shrug","Shrugs (Langhantel)","Kraft","Langhantel",[15],[],"kraft",2,"Stand up straight with your feet at shoulder width as you hold a barbell with both hands in front of you using a pronated grip (palms facing the thighs). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for a better grip. This will be your starting position.\nRaise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps.\nSlowly return to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions."],["Barbell_Shrug_Behind_The_Back","Barbell Shrug Behind The Back","","Kraft","Langhantel",[15],[6,11],"kraft",2,"Stand up straight with your feet at shoulder width as you hold a barbell with both hands behind your back using a pronated grip (palms facing back). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for better grip. This will be your starting position.\nRaise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps. The arms should remain stretched out at all times.\nSlowly return to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions."],["Barbell_Side_Bend","Barbell Side Bend","","Kraft","Langhantel",[0],[10],"kraft",2,"Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be shoulder width apart. This will be your starting position.\nWhile keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.\nNow repeat the movement but bending to the left instead. Hold for a second and come back to the starting position.\nRepeat for the recommended amount of repetitions."],["Barbell_Side_Split_Squat","Barbell Side Split Squat","","Kraft","Langhantel",[13],[4,8,10],"kraft",2,"Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be placed wide apart with the foot of the lead leg angled out to the side. This will be your starting position.\nLower your body towards the side of your angled foot by bending the knee and hip of your lead leg and while keeping the opposite leg only slightly bent. Breathe in as you lower your body.\nReturn to the starting position by extending the hip and knee of the lead leg. Breathe out as you perform this movement.\nAfter performing the recommended amount of reps, repeat the movement with the opposite leg."],["Barbell_Squat","Barbell Squat","Kniebeuge (Langhantel)","Kraft","Langhantel",[13],[4,7,8,10],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).\nBegin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Barbell_Squat_To_A_Bench","Barbell Squat To A Bench","","Kraft","Langhantel",[13],[4,7,8,10],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first place a flat bench or a box behind you. The flat bench is used to teach you to set your hips back and to hit depth.\n\nThen, set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).\nBegin to slowly lower the bar by bending the knees and sitting your hips back as you maintain a straight posture with the head up. Continue down until you slightly touch the bench behind you. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs and extend the hips to go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Barbell_Step_Ups","Barbell Step Ups","","Kraft","Langhantel",[13],[4,7,8,13],"kraft",2,"Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck) and stand upright behind an elevated platform (such as the one used for spotting behind a flat bench). This is your starting position.\nPlace the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.\nStep down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.\nRepeat with the right leg for the recommended amount of repetitions and then perform with the left leg."],["Barbell_Walking_Lunge","Barbell Walking Lunge","","Kraft","Langhantel",[13],[4,7,8],"kraft",2,"Begin standing with your feet shoulder width apart and a barbell across your upper back.\nStep forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.\nDrive through the heel of your lead foot and extend both knees to raise yourself back up.\nStep forward with your rear foot, repeating the lunge on the opposite leg."],["Battling_Ropes","Battling Ropes","","Kraft","Sonstiges",[14],[5,6],"kraft",2,"For this exercise you will need a heavy rope anchored at its center 15-20 feet away. Standing in front of the rope, take an end in each hand with your arms extended at your side. This will be your starting position.\nInitiate the movement by rapidly raising one arm to shoulder level as quickly as you can.\nAs you let that arm drop to the starting position, raise the opposite side.\nContinue alternating your left and right arms, whipping the ropes up and down as fast as you can."],["Bear_Crawl_Sled_Drags","Bear Crawl Sled Drags","","Strongman","Sonstiges",[13],[4,7,8],"kraft",2,"Wearing either a harness or a loose weight belt, attach the chain to the back so that you will be facing away from the sled. Bend down so that your hands are on the ground. Your back should be flat and knees bent. This is your starting position.\nBegin by driving with legs, alternating left and right. Use your hands to maintain balance and to help pull. Try to keep your back flat as you move over a given distance."],["Behind_Head_Chest_Stretch","Behind Head Chest Stretch","","Dehnen","Sonstiges",[5],[14],"zeit",2,"Sit upright on the floor with your partner behind you.\nPlace your hands behind your hand, and push your elbows back as far as you can. Your partner should hold your elbows. This will be your starting position.\nGently attempt to pull your elbows forward with your hands still behind your head for 10 or more seconds. Your partner should prevent your elbows from moving.\nNow, relax your muscles and have your partner gently pull the elbows back as far as it comfortable for you. Be sure to let your partner know when the stretch is adequate to prevent overstretching or injury."],["Bench_Dips","Bench Dips","Bankdips","Kraft","Körpergewicht",[16],[5,14],"body",2,"For this exercise you will need to place a bench behind your back. With the bench perpendicular to your body, and while looking away from it, hold on to the bench on its edge with the hands fully extended, separated at shoulder width. The legs will be extended forward, bent at the waist and perpendicular to your torso. This will be your starting position.\nSlowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.\nUsing your triceps to bring your torso up again, lift yourself back to the starting position.\nRepeat for the recommended amount of repetitions."],["Bench_Jump","Bench Jump","","Plyometrie","Körpergewicht",[13],[4,7,8],"body",2,"Begin with a box or bench 1-2 feet in front of you. Stand with your feet shoulder width apart. This will be your starting position.\nPerform a short squat in preparation for the jump; swing your arms behind you.\nRebound out of this position, extending through the hips, knees, and ankles to jump as high as possible. Swing your arms forward and up.\nJump over the bench, landing with the knees bent, absorbing the impact through the legs.\nTurn around and face the opposite direction, then jump back over the bench."],["Bench_Press_-_Powerlifting","Bench Press - Powerlifting","","Powerlifting","Langhantel",[16],[5,6,9,14],"kraft",2,"Begin by lying on the bench, getting your head beyond the bar if possible. Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.\nHowever wide your grip, it should cover the ring on the bar. Pull the bar out of the rack without protracting your shoulders. Focus on squeezing the bar and trying to pull it apart.\nLower the bar to your lower chest or upper stomach. The bar, wrist, and elbow should stay in line at all times.\nPause when the barbell touches your torso, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."],["Bench_Press_-_With_Bands","Bench Press - With Bands","","Kraft","Bänder",[5],[14,16],"kraft",2,"Using a flat bench secure a band under the leg of the bench that is nearest to your head.\nOnce the band is secure, grab it by both handles and lie down on the bench.\nExtend your arms so that you are holding the band handles in front of you at shoulder width.\nOnce at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.\nBring down the handles slowly until your elbow forms a 90 degree angle. Keep full control at all times.\nAs you breathe out, bring the handles up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions of your training program."],["Bench_Press_with_Chains","Bench Press with Chains","","Powerlifting","Langhantel",[16],[5,9,14],"kraft",2,"Adjust the leader chain, shortening it to the desired length.Place the chains on the sleeves of the bar.\nLying on the bench, get your head beyond the bar if possible. Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement. However wide your grip, it should cover the ring on the bar.\nPull the bar out of the rack without protracting your shoulders. Focus on squeezing the bar and trying to pull it apart. Lower the bar to your lower chest or upper stomach. The bar, wrist, and elbow should stay in line at all times.\nPause when the barbell touches your torso, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."],["Bench_Sprint","Bench Sprint","","Plyometrie","Sonstiges",[13],[4,7,8],"kraft",2,"Stand on the ground with one foot resting on a bench or box with your heel close to the edge.\nPush off with your foot on top of the bench, extending through the hip and knee.\nLand with the opposite foot on top of the box, returning your other foot back to the start position.\nContinue alternating from one foot to another to complete the set."],["Bent-Arm_Barbell_Pullover","Bent-Arm Barbell Pullover","","Kraft","Langhantel",[9],[5,9,14,16],"kraft",2,"Lie on a flat bench with a barbell using a shoulder grip width.\nHold the bar straight over your chest with a bend in your arms. This will be your starting position.\nWhile keeping your arms in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.\nAt that point, bring the barbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.\nHold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."],["Bent-Arm_Dumbbell_Pullover","Bent-Arm Dumbbell Pullover","","Kraft","Kurzhantel",[5],[9,14,16],"kraft",2,"Place a dumbbell standing up on a flat bench.\nEnsuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.\nGrasp the dumbbell with both hands and hold it straight over your chest with a bend in your arms. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position. Caution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.\nWhile keeping your arms locked in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.\nAt that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.\nHold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."],["Bent-Knee_Hip_Raise","Bent-Knee Hip Raise","","Kraft","Körpergewicht",[0],[],"body",2,"Lay flat on the floor with your arms next to your sides.\nNow bend your knees at around a 75 degree angle and lift your feet off the floor by around 2 inches.\nUsing your lower abs, bring your knees in towards you as you maintain the 75 degree angle bend in your legs. Continue this movement until you raise your hips off of the floor by rolling your pelvis backward. Breathe out as you perform this portion of the movement. Tip: At the end of the movement your knees will be over your chest.\nSqueeze your abs at the top of the movement for a second and then return to the starting position slowly as you breathe in. Tip: Maintain a controlled motion at all times.\nRepeat for the recommended amount of repetitions."],["Bent_Over_Barbell_Row","Bent Over Barbell Row","Rudern vorgebeugt (Langhantel)","Kraft","Langhantel",[11],[3,9,14],"kraft",2,"Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.\nNow, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.\nThen inhale and slowly lower the barbell back to the starting position.\nRepeat for the recommended amount of repetitions."],["Bent_Over_Dumbbell_Rear_Delt_Raise_With_Head_On_Bench","Bent Over Dumbbell Rear Delt Raise With Head On Bench","","Kraft","Kurzhantel",[14],[],"kraft",2,"Stand up straight while holding a dumbbell in each hand and with an incline bench in front of you.\nWhile keeping your back straight and maintaining the natural arch of your back, lean forward until your forehead touches the bench in front of you. Let the arms hang in front of you perpendicular to the ground. The palms of your hands should be facing each other and your torso should be parallel to the floor. This will be your starting position.\nKeeping your torso forward and stationary, and the arms straight with a slight bend at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. Caution: avoid swinging the torso or bringing the arms back as opposed to the side.\nAfter a one second contraction at the top, slowly lower the dumbbells back to the starting position.\nRepeat the recommended amount of repetitions."],["Bent_Over_Low-Pulley_Side_Lateral","Bent Over Low-Pulley Side Lateral","","Kraft","Kabelzug",[14],[10,11,15],"kraft",2,"Select a weight and hold the handle of the low pulley with your right hand.\nBend at the waist until your torso is nearly parallel to the floor. Your legs should be slightly bent with your left hand placed on your lower left thigh. Your right arm should be hanging from your shoulder in front of you and with a slight bend at the elbow. This will be your starting position.\nRaise your right arm, elbow slightly bent, to the side until the arm is parallel to the floor and in line with your right ear. Breathe out as you perform this step.\nSlowly lower the weight back to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions and repeat the movement with the other arm."],["Bent_Over_One-Arm_Long_Bar_Row","Bent Over One-Arm Long Bar Row","","Kraft","Langhantel",[11],[3,9,10,15],"kraft",2,"Put weight on one of the ends of an Olympic barbell. Make sure that you either place the other end of the barbell in the corner of two walls; or put a heavy object on the ground so the barbell cannot slide backward.\nBend forward until your torso is as close to parallel with the floor as you can and keep your knees slightly bent.\nNow grab the bar with one arm just behind the plates on the side where the weight was placed and put your other hand on your knee. This will be your starting position.\nPull the bar straight up with your elbow in (to maximize back stimulation) until the plates touch your lower chest. Squeeze the back muscles as you lift the weight up and hold for a second at the top of the movement. Breathe out as you lift the weight. Tip: Do not allow for any swinging of the torso. Only the arm should move.\nSlowly lower the bar to the starting position getting a nice stretch on the lats. Tip: Do not let the plates touch the floor. To ensure the best range of motion, I recommend using small plates (25-lb ones) as opposed to larger plates (like 35-45lb ones).\nRepeat for the recommended amount of repetitions and switch arms."],["Bent_Over_Two-Arm_Long_Bar_Row","Bent Over Two-Arm Long Bar Row","","Kraft","Langhantel",[11],[3,9],"kraft",2,"Put weight on one of the ends of an Olympic barbell. Make sure that you either place the other end of the barbell in the corner of two walls; or put a heavy object on the ground so the barbell cannot slide backward.\nBend forward until your torso is as close to parallel with the floor as you can and keep your knees slightly bent.\nNow grab the bar with both arms just behind the plates on the side where the weight was placed and put your other hand on your knee. This will be your starting position.\nPull the bar straight up with your elbows in (to maximize back stimulation) until the plates touch your lower chest. Squeeze the back muscles as you lift the weight up and hold for a second at the top of the movement. Breathe out as you lift the weight. Tip: Use a stirrup or double handle cable attachment by hooking it under the end of the bar.\nSlowly lower the bar to the starting position getting a nice stretch on the lats. Tip: Do not let the plates touch the floor. To ensure the best range of motion, I recommend using small plates (25-lb ones) as opposed to larger plates (like 35-45lb ones).\nRepeat for the recommended amount of repetitions."],["Bent_Over_Two-Dumbbell_Row","Bent Over Two-Dumbbell Row","","Kraft","Kurzhantel",[11],[3,9,14],"kraft",2,"With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.\nWhile keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.\nSlowly lower the weight again to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Bent_Over_Two-Dumbbell_Row_With_Palms_In","Bent Over Two-Dumbbell Row With Palms In","","Kraft","Kurzhantel",[11],[3,9],"kraft",2,"With a dumbbell in each hand (palms facing each other), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straig
