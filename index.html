vement, extend through the elbow to to straighten your arms, ensuring that you keep your upper arm in place.\nPause, and then return to the starting position."],["Speed_Box_Squat","Speed Box Squat","","Powerlifting","Langhantel",[13],[4,7,8],"kraft",2,"Attach bands to the bar that are securely anchored near the ground. You may need to choke the bands to get adequate tension.\nUse a box of an appropriate height for this exercise. Load the bar to a weight that still requires effort, but isn't so heavy that speed is compromised. Typically, that will be between 50-70% of your one rep max.\nPosition the bar on your upper back, shoulder blades retracted, back arched and everything tight head to toe. This will be the starting position.\nUnrack the bar and position yourself in front of the box. Sit back with your hips until you are seated on the box, ensuring that you descend under control and don't crash onto the surface.\nPause briefly, and explode off of the box, extending through the hips and knees."],["Speed_Squats","Speed Squats","","Kraft","Langhantel",[13],[4,7,8,10],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance which targets overall development; however you can choose any of the three stances discussed in the foot stances section).\nBegin to lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the bar as fast as possible without involving momentum as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position. Note: You should perform these exercises as fast as possible but without breaking perfect form and without involving momentum.\nRepeat for the recommended amount of repetitions."],["Spell_Caster","Spell Caster","","Kraft","Kurzhantel",[0],[7,14],"kraft",2,"Hold a dumbbell in each hand with a pronated grip. Your feet should be wide with your hips and knees extended. This will be your starting position.\nBegin the movement by pulling both of the dumbbells to one side next to your hip, rotating your torso.\nKeeping your arms straight and the dumbbells parallel to the ground, rotate your torso to swing the weights to your opposite side.\nContinue alternating, rotating from one side to the other until the set is complete."],["Spider_Crawl","Spider Crawl","","Kraft","Körpergewicht",[0],[5,14,16],"body",2,"Begin in a prone position on the floor. Support your weight on your hands and toes, with your feet together and your body straight. Your arms should be bent to 90 degrees. This will be your starting position.\nInitiate the movement by raising one foot off of the ground. Externally rotate the leg and bring the knee toward your elbow, as far forward as possible.\nReturn this leg to the starting position and repeat on the opposite side."],["Spider_Curl","Spider Curl","","Kraft","SZ-Stange",[3],[],"kraft",2,"Start out by setting the bar on the part of the preacher bench that you would normally sit on. Make sure to align the barbell properly so that it is balanced and will not fall off.\nMove to the front side of the preacher bench (the part where the arms usually lay) and position yourself to lay at a 45 degree slant with your torso and stomach pressed against the front side of the preacher bench.\nMake sure that your feet (especially the toes) are well positioned on the floor and place your upper arms on top of the pad located on the inside part of the preacher bench.\nUse your arms to grab the barbell with a supinated grip (palms facing up) at about shoulder width apart or slightly closer from each other.\nSlowly begin to lift the barbell upwards and exhale. Hold the contracted position for a second as you squeeze the biceps.\nSlowly begin to bring the barbell back to the starting position as your breathe in. .\nRepeat for the recommended amount of repetitions."],["Spinal_Stretch","Spinal Stretch","","Dehnen","Ohne",[11],[9,10,12,15],"zeit",2,"Sit in a chair so your back is straight and your feet planted on the floor.\nInterlace your fingers behind your head, elbows out and your chin down.\nTwist your upper body to one side about 3 times as far as you can. Then lean forward and twist your torso to reach your elbow to the floor on the inside of your knee.\nReturn to upright position and then repeat for your other side."],["Split_Clean","Split Clean","","Gewichtheben","Langhantel",[13],[4,6,7,8,10,14,15],"kraft",2,"With a barbell on the floor close to the shins, take an overhand grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.\nBegin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. Move the weight with control as you continue to above the knees.\nNext comes the second pull, the main source of acceleration for the clean. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward. There should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back, with the arms still extended.\nAs full extension is achieved, transition into the third pull by aggressively shrugging and flexing the arms with the elbows up and out. At peak extension, aggressively pull yourself down, rotating your elbows under the bar as you do so.\nReceive the bar with the feet split, aggressively moving one foot forward and one foot back. The bar should be racked onto the protracted shoulders, lightly touching the throat with the hands relaxed. Continue to descend to the bottom position, which will help in the recovery.\nImmediately recover by driving through the heels, keeping the torso upright and elbows up. Bring the feet together as you stand up."],["Split_Jerk","Split Jerk","","Gewichtheben","Langhantel",[13],[7,8,14,16],"kraft",2,"Standing with the weight racked on the front of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward.\nGo down only slightly, and reverse direction as powerfully as possible. Drive through the heels create as much speed and force as possible, and be sure to move your head out of the way as the bar leaves the shoulders. At this moment as the feet leave the floor, the feet must be placed into the receiving position as quickly as possible.\nIn the brief moment the feet are not actively driving against the platform, the athlete's effort to push the bar up will drive them down. The feet should be moved to a split stance, one foot forward, one foot back, with the knees partially bent. Receive the bar with the arms locked out overhead.\nReturn to a standing position, bringing the feet together."],["Split_Jump","Split Jump","","Plyometrie","Körpergewicht",[13],[4,7,8],"body",2,"Assume a lunge stance position with one foot forward with the knee bent, and the rear knee nearly touching the ground.\nEnsure that the front knee is over the midline of the foot.\nExtending through both legs, jump as high as possible, swinging your arms to gain lift.\nAs you jump, bring your feet together, and move them back to their initial positions as you land.\nAbsorb the impact by reverting back to the starting position."],["Split_Snatch","Split Snatch","","Gewichtheben","Langhantel",[8],[4,6,7,8,10,13,14,15,16],"kraft",2,"Begin with a loaded barbell on the floor. The bar should be close to or touching the shins, and a wide grip should be taken on the bar. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar. This will be the starting position.\nBegin the first pull by driving through the front of the heels, raising the bar from the ground. The back angle should stay the same until the bar passes the knees.\nTransition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body. At peak extension, shrug the shoulders and allow the elbows to flex to the side.\nAs you move your feet into the receiving position, forcefully pull yourself below the bar as you elevate the bar overhead. The feet should move forcefully to a split position, one foot forward one foot back. Receive the bar with your body as low as possible and the arms fully extended overhead.\nKeeping the bar aligned over the front of the heels, your head and chest up, drive through heels of the feet to move to a standing position, bringing your feet together.\nCarefully return the weight to floor."],["Split_Squat_with_Dumbbells","Split Squat with Dumbbells","Split Squat (Kurzhantel)","Kraft","Kurzhantel",[13],[7,8],"kraft",2,"Position yourself into a staggered stance with the rear foot elevated and front foot forward.\nHold a dumbbell in each hand, letting them hang at the sides. This will be your starting position.\nBegin by descending, flexing your knee and hip to lower your body down. Maintain good posture througout the movement. Keep the front knee in line with the foot as you perform the exercise.\nAt the bottom of the movement, drive through the heel to extend the knee and hip to return to the starting position."],["Split_Squats","Split Squats","","Dehnen","Ohne",[8],[4,7,13],"zeit",2,"Being in a standing position. Jump into a split leg position, with one leg forward and one leg back, flexing the knees and lowering your hips slightly as you do so.\nAs you descend, immediately reverse direction, standing back up and jumping, reversing the position of your legs. Repeat 5-10 times on each leg."],["Squat_Jerk","Squat Jerk","","Kraft","Langhantel",[13],[4,7,8,14,16],"kraft",2,"Standing with the weight racked on the front of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward. Go down only slightly, and reverse direction as powerfully as possible. Drive through the heels create as much speed and force as possible, and be sure to move your head out of the way as the bar leaves the shoulders.\nAt this moment as the feet leave the floor, the feet must be placed into the receiving position as quickly as possible. In the brief moment the feet are not actively driving against the platform, the athlete's effort to push the bar up will drive them down. The feet should move forcefully to just outside the hips, turned out as necessary. Receive the bar with your body in a full squat and the arms fully extended overhead.\nKeeping the bar aligned over the front of the heels, your head and chest up, drive throught heels of the feet to move to a standing position. Carefully return the weight to floor."],["Squat_with_Bands","Squat with Bands","","Powerlifting","Langhantel",[13],[2,4,7,8,10],"kraft",2,"Set up the bands on the sleeves, secured to either band pegs, the rack, or dumbbells so that there is appropriate tension.\nBegin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wide for more emphasis on the back, glutes, adductors, and hamstrings. Keep your head facing forward.\nWith your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips as much as possible. Ideally, your shins should be perpendicular to the ground. Lower bar position necessitates a greater torso lean to keep the bar over the heels. Continue until you break parallel, which is defined as the crease of the hip being in line with the top of the knee.\nKeeping the weight on your heels and pushing your feet and knees out, drive upward as you lead the movement with your head. Continue upward, maintaining tightness head to toe, until you have returned to the starting position."],["Squat_with_Chains","Squat with Chains","","Powerlifting","Langhantel",[13],[2,4,7,8,10],"kraft",2,"To set up the chains, begin by looping the leader chain over the sleeves of the bar. The heavy chain should be attached using a snap hook. Adjust the length of the lead chain so that a few links are still on the floor at the top of the movement.\nBegin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wide for more emphasis on the back, glutes, adductors, and hamstrings. Keep your head facing forward.\nWith your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips as much as possible. Ideally, your shins should be perpendicular to the ground. Lower bar position necessitates a greater torso lean to keep the bar over the heels. Continue until you break parallel, which is defined as the crease of the hip being in line with the top of the knee.\nKeeping the weight on your heels and pushing your feet and knees out, drive upward as you lead the movement with your head. Continue upward, maintaining tightness head to toe, until you have returned to the starting position."],["Squat_with_Plate_Movers","Squat with Plate Movers","","Kraft","Langhantel",[13],[1,2,4,7,8],"kraft",2,"To begin, first set the bar on a rack to just below shoulder level. Position a weight plate on the ground a couple feet back from the rack. Once the bar is loaded, step under it and place the back of your shoulders across it.\nHold on to the bar with both hands and lift it off the rack by first pushing with your legs and at the same time straighten your torso.\nStep away from the rack and adopt a wide stance with the toes slightly pointed out, with one foot on the weight plate. Keep your head up at all times. This will be your starting position.\nBegin to slowly lower the bar by bending the knees and hips. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees.\nRaise the bar as you exhale by pushing the floor with the heels of your feet as you extend the hips and knees.\nAt the top of the movement, side step, bringing your feet together on the opposite side of the plate.\nUsing your inside foot, push the weight plate, sliding it across the floor to where you were just standing.\nPlace your inside foot on the weight plate, adopting a wide stance for the next repetition."],["Squats_-_With_Bands","Squats - With Bands","","Kraft","Bänder",[13],[4,7,8,10],"kraft",2,"To start out, make sure that the exercise band is at an even split between both the left and right side of the body. To do this, use your hands to grab both sides of the band and place both feet in the middle of the band. Your feet should be shoulder width apart from each other.\nWhen holding the bands, they should be the same height on each side. You should be using a pronated grip (palms facing forward) and have the handles of the bands next to your face for this exercise. This is the starting position.\nSlowly start to bend the knees and lower the legs so that your thighs are parallel to the floor while exhaling.\nUse the heel of your feet to push your body up to the starting position as you exhale.\nRepeat for the recommended amount of repetitions."],["Stairmaster","Stairmaster","","Cardio","Maschine",[13],[4,7,8],"cardio",2,"To begin, step onto the stairmaster and select the desired option from the menu. You can choose a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise.\nPump your legs up and down in an established rhythm, driving the pedals down but not all the way to the floor. It is recommended that you maintain your grip on the handles so that you don't fall. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity.\nStairmasters offer convenience, cardiovascular benefits, and usually have less impact than running outside. They are typically much harder than other cardio equipment. A 150 lb person will typically burn over 300 calories in 30 minutes, compared to about 175 calories walking."],["Standing_Alternating_Dumbbell_Press","Standing Alternating Dumbbell Press","","Kraft","Kurzhantel",[14],[16],"kraft",2,"Stand with a dumbbell in each hand. Raise the dumbbells to your shoulders with your palms facing forward and your elbows pointed out. This will be your starting position.\nExtend one arm to press the dumbbell straight up, keeping your off hand in place. Do not lean or jerk the weight during the movement.\nAfter a brief pause, return the weight to the starting position.\nRepeat for the opposite side, continuing to alternate between arms."],["Standing_Barbell_Calf_Raise","Standing Barbell Calf Raise","","Kraft","Langhantel",[4],[],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the bar on the back of your shoulders (slightly below the neck).\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: For better range of motion you may also place the ball of your feet on a wooden block but be careful as this option requires more balance and a sturdy block.\nRaise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.\nGo back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.\nRepeat for the recommended amount of repetitions."],["Standing_Barbell_Press_Behind_Neck","Standing Barbell Press Behind Neck","","Kraft","Langhantel",[14],[16],"kraft",2,"This exercise is best performed inside a squat rack for easier pick up of the bar. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Your back should be kept straight while performing this exercise. This will be your starting position.\nElevate the barbell overhead by fully extending your arms while breathing out.\nHold the contraction for a second and lower the barbell back down to the starting position by inhaling.\nRepeat for the recommended amount of repetitions."],["Standing_Bent-Over_One-Arm_Dumbbell_Triceps_Extension","Standing Bent-Over One-Arm Dumbbell Triceps Extension","","Kraft","Kurzhantel",[16],[14],"kraft",2,"With a dumbbell in one hand and the palm facing your torso, bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up.\nThe upper arm should be close to the torso and parallel to the floor while the forearm is pointing towards the floor as the hand holds the weight. Tip: There should be a 90-degree angle between the forearm and the upper arm. This is your starting position.\nKeeping the upper arms stationary, use the triceps to lift the weights as you exhale until the forearms are parallel to the floor and the whole arm is extended. Like many other arm exercises, only the forearm moves.\nAfter a second contraction at the top, slowly lower the dumbbell back to the starting position as you inhale.\nRepeat the movement for the prescribed amount of repetitions.\nSwitch arms and repeat the exercise."],["Standing_Bent-Over_Two-Arm_Dumbbell_Triceps_Extension","Standing Bent-Over Two-Arm Dumbbell Triceps Extension","","Kraft","Kurzhantel",[16],[],"kraft",2,"With a dumbbell in each hand and the palms facing your torso, bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up. The upper arms should be close to the torso and parallel to the floor while the forearms are pointing towards the floor as the hands hold the weights. Tip: There should be a 90-degree angle between the forearms and the upper arm. This is your starting position.\nKeeping the upper arms stationary, use the triceps to lift the weights as you exhale until the forearms are parallel to the floor and the whole arms are extended. Like many other arm exercises, only the forearm moves.\nAfter a second contraction at the top, slowly lower the dumbbells back to their starting position as you inhale.\nRepeat the movement for the prescribed amount of repetitions."],["Standing_Biceps_Cable_Curl","Standing Biceps Cable Curl","","Kraft","Kabelzug",[3],[],"kraft",2,"Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.\nWhile holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.\nSlowly begin to bring the curl bar back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions."],["Standing_Biceps_Stretch","Standing Biceps Stretch","","Dehnen","Sonstiges",[3],[5,14],"zeit",2,"Clasp your hands behind your back with your palms together, straighten arms and then rotate them so your palms face downward.\nRaise your arms up and hold until you feel a stretch in your biceps."],["Standing_Bradford_Press","Standing Bradford Press","","Kraft","Langhantel",[14],[16],"kraft",2,"Place a loaded bar at shoulder level in a rack. With a pronated grip at shoulder width, begin with the bar racked across the front of your shoulders. This is your starting position.\nInitiate the lift by extending the elbows to press the bar overhead. Avoid locking out the elbow as you move the weight behind your head.\nLower the bar down to the back of the head until your elbow forms a right angle.\nLift the bar back over your head by extending the elbows\nLower the bar down to the starting position.\nAlternate in this manner until you complete the recommended amount of repetitions."],["Standing_Cable_Chest_Press","Standing Cable Chest Press","","Kraft","Kabelzug",[5],[14,16],"kraft",2,"Position dual pulleys to chest height and select an appropriate weight. Stand a foot or two in front of the cables, holding one in each hand. You can stagger your stance for better stability.\nPosition the upper arm at a 90 degree angle with the shoulder blades together. This will be your starting position.\nKeeping the rest of the body stationary, extend through the elbows to press the handles forward, drawing them together in front of you.\nPause at the top of the motion, and return to the starting position."],["Standing_Cable_Lift","Standing Cable Lift","","Kraft","Kabelzug",[0],[14],"kraft",2,"Connect a standard handle on a tower, and move the cable to the lowest pulley position.\nWith your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.\nWith your feet positioned shoulder width apart, squat down and grab the handle with both hands. Your arms should still be fully extended.\nIn one motion, pull the handle up and across your body until your arms are in a fully-extended position above your head.\nKeep your back straight and your arms close to your body as you pivot your back foot and straighten your legs to get a full range of motion.\nRetract your arms and then your body. Return to the neutral position in a slow and controlled manner.\nRepeat to failure.\nThen, reposition and repeat the same series of movements on the opposite side."],["Standing_Cable_Wood_Chop","Standing Cable Wood Chop","","Kraft","Kabelzug",[0],[14],"kraft",2,"Connect a standard handle to a tower, and move the cable to the highest pulley position.\nWith your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.\nWith your feet positioned shoulder width apart, reach upward with your other hand and grab the handle with both hands. Your arms should still be fully extended.\nIn one motion, pull the handle down and across your body to your front knee while rotating your torso.\nKeep your back and arms straight and core tight while you pivot your back foot and bend your knees to get a full range of motion.\nMaintain your stance and straight arms. Return to the neutral position in a slow and controlled manner.\nRepeat to failure.\nThen, reposition and repeat the same series of movements on the opposite side."],["Standing_Calf_Raises","Standing Calf Raises","Wadenheben stehend","Kraft","Maschine",[4],[],"kraft",2,"Adjust the padded lever of the calf raise machine to fit your height.\nPlace your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.\nRaise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.\nGo back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.\nRepeat for the recommended amount of repetitions."],["Standing_Concentration_Curl","Standing Concentration Curl","","Kraft","Kurzhantel",[3],[6],"kraft",2,"Taking a dumbbell in your working hand, lean forward. Allow your working arm to hang perpendicular to the ground with the elbow pointing out. This will be your starting position.\nFlex the elbow to curl the weight, keeping the upper arm stationary. At the top of the repetition, flex the biceps and pause.\nLower the dumbbell back to the starting position.\nRepeat the movement for the prescribed amount of repetitions."],["Standing_Dumbbell_Calf_Raise","Standing Dumbbell Calf Raise","","Kraft","Kurzhantel",[4],[],"kraft",2,"Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor. This will be your starting position.\nWith the toes pointing either straight (to hit all parts equally), inwards (for emphasis on the outer head) or outwards (for emphasis on the inner head), raise the heels off the floor as you exhale by contracting the calves. Hold the top contraction for a second.\nAs you inhale, go back to the starting position by slowly lowering the heels.\nRepeat for the recommended amount of times."],["Standing_Dumbbell_Press","Standing Dumbbell Press","","Kraft","Kurzhantel",[14],[16],"kraft",2,"Standing with your feet shoulder width apart, take a dumbbell in each hand. Raise the dumbbells to head height, the elbows out and about 90 degrees. This will be your starting position.\nMaintaining strict technique with no leg drive or leaning back, extend through the elbow to raise the weights together directly above your head.\nPause, and slowly return the weight to the starting position."],["Standing_Dumbbell_Reverse_Curl","Standing Dumbbell Reverse Curl","","Kraft","Kurzhantel",[3],[6],"kraft",2,"To begin, stand straight with a dumbbell in each hand using a pronated grip (palms facing down). Your arms should be fully extended while your feet are shoulder width apart from each other. This is the starting position.\nWhile holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the muscle.\nSlowly begin to bring the dumbbells back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions."],["Standing_Dumbbell_Straight-Arm_Front_Delt_Raise_Above_Head","Standing Dumbbell Straight-Arm Front Delt Raise Above Head","","Kraft","Kurzhantel",[14],[],"kraft",2,"Hold the dumbbells in front of your thighs, palms facing your thighs.\nKeep your arms straight with a slight bend at the elbows but keep them locked. This will be your starting position.\nRaise the dumbbells in a semicircular motion to arm's length overhead as you exhale.\nSlowly return to the starting position using the same path as you inhale.\nRepeat for the recommended amount of repetitions."],["Standing_Dumbbell_Triceps_Extension","Standing Dumbbell Triceps Extension","","Kraft","Kurzhantel",[16],[],"kraft",2,"To begin, stand up with a dumbbell held by both hands. Your feet should be about shoulder width apart from each other. Slowly use both hands to grab the dumbbell and lift it over your head until both arms are fully extended.\nThe resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hands should be facing up towards the ceiling. This will be your starting position.\nKeeping your upper arms close to your head with elbows in and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.\nGo back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.\nRepeat for the recommended amount of repetitions."],["Standing_Dumbbell_Upright_Row","Standing Dumbbell Upright Row","","Kraft","Kurzhantel",[15],[3,14],"kraft",2,"Grasp a dumbbell in each hand with a pronated (palms forward) grip that is slightly less than shoulder width. The dumbbells should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.\nUse your side shoulders to lift the dumbbells as you exhale. The dumbbells should be close to the body as you move it up and the elbows should drive the motion. Continue to lift them until they nearly touch your chin. Tip: Your elbows should drive the motion. As you lift the dumbbells, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.\nLower the dumbbells back down slowly to the starting position. Inhale as you perform this portion of the movement.\nRepeat for the recommended amount of repetitions."],["Standing_Elevated_Quad_Stretch","Standing Elevated Quad Stretch","","Dehnen","Sonstiges",[13],[],"zeit",2,"Start by standing with your back about two to three feet away from a bench or step.\nLift one leg behind you and rest your foot on the step,either on your instep or the ball of your foot, whichever you find most comfortable.\nKeep your supporting knee slightly bent and avoid letting that knee extend out beyond your toes. Switch sides."],["Standing_Front_Barbell_Raise_Over_Head","Standing Front Barbell Raise Over Head","","Kraft","Langhantel",[14],[],"kraft",2,"To begin, stand straight with a barbell in your hands. You should grip the bar with palms facing down and a closer than shoulder width grip apart from each other.\nYour feet should be shoulder width apart from each other. Your elbows should be slightly bent. This is the starting position.\nLift the barbell up until it is directly over your head while exhaling. Make sure to keep your elbows slightly bent when performing each repetition.\nOnce you feel the contraction, begin to lower the barbell back down to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Standing_Gastrocnemius_Calf_Stretch","Standing Gastrocnemius Calf Stretch","","Dehnen","Ohne",[4],[8],"zeit",2,"Place your right heel on a step with your knee extended and lean forward to grab your right toe with your right hand. Your left knee should be slightly bent and your back should be straight.\nSupport your weight on your left leg and place your left hand on your left thigh.\nPull your right toes toward your knee until you feel a stretch in your calf."],["Standing_Hamstring_and_Calf_Stretch","Standing Hamstring and Calf Stretch","","Dehnen","Sonstiges",[8],[],"zeit",2,"Being by looping a belt, band, or rope around one foot. While standing, place that foot forward.\nBend your back leg, while keeping the front one straight. Now raise the toes of your front foot off of the ground and lean forward.\nUsing the belt, pull on the top of the foot to increase the stretch in the calf. Hold for 10-20 seconds and repeat with the other foot."],["Standing_Hip_Circles","Standing Hip Circles","","Dehnen","Körpergewicht",[1],[2],"zeit",2,"Begin standing on one leg, holding to a vertical support.\nRaise the unsupported knee to 90 degrees. This will be your starting position.\nOpen the hip as far as possible, attempting to make a big circle with your knee.\nPerform this movement slowly for a number of repetitions, and repeat on the other side."],["Standing_Hip_Flexors","Standing Hip Flexors","","Dehnen","Ohne",[13],[],"zeit",2,"Stand up straight with the spine vertical, the left foot slightly in front of the right.\nBend both knees and lift the back heel off the floor as you press the right hip forward. You can't get a thorough, deep stretch in this position, however, because it's hard to relax the hip flexor and stand on it at the same time. Switch sides."],["Standing_Inner-Biceps_Curl","Standing Inner-Biceps Curl","","Kraft","Kurzhantel",[3],[],"kraft",2,"Stand up with a dumbbell in each hand being held at arms length. The elbows should be close to the torso. Your legs should be at about shoulder's width apart from each other.\nRotate the palms of the hands so that they are facing inward in a neutral position. This will be your starting position.\nWhile holding the upper arms stationary, curl the weights out while contracting the biceps as you breathe out. Your wrist should turn so that when the weights are fully elevated you have supinated grip (palms facing up).\nOnly the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: Keep the forearms aligned with your outer deltoids.\nHold the contracted position for a second as you squeeze the biceps.\nSlowly begin to bring the dumbbells back to the starting position as your breathe in. Remember to rotate the wrists as you lower the weight in order to switch back to a neutral grip.\nRepeat for the recommended amount of repetitions."],["Standing_Lateral_Stretch","Standing Lateral Stretch","","Dehnen","Ohne",[0],[],"zeit",2,"Take a slightly wider than hip distance stance with your knees slightly bent.\nPlace your right hand on your right hip to support the spine.\nRaise your left arm in a vertical line and place your left hand behind your head. Keep it there as you incline your torso to the right.\nKeep your weight evenly distributed between both legs (don't lean into your left hip). Switch sides."],["Standing_Leg_Curl","Standing Leg Curl","","Kraft","Maschine",[8],[],"kraft",2,"Adjust the machine lever to fit your height and lie with your torso bent at the waist facing forward around 30-45 degrees (since an angled position is more favorable for hamstrings recruitment) with the pad of the lever on the back of your right leg (just a few inches under the calves) and the front of the right leg on top of the machine pad.\nKeeping the torso bent forward, ensure your leg is fully stretched and grab the side handles of the machine. Position your toes straight. This will be your starting position.\nAs you exhale, curl your right leg up as far as possible without lifting the upper leg from the pad. Once you hit the fully contracted position, hold it for a second.\nAs you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions.\nPerform the same exercise now for the left leg."],["Standing_Long_Jump","Standing Long Jump","","Plyometrie","Körpergewicht",[13],[4,7,8],"body",2,"This drill is best done in sand or other soft landing surface. Ensure that you are able to measure distance. Stand in a partial squat stance with feet shoulder width apart.\nUtilizing a big arm swing and a countermovement of the legs, jump forward as far as you can.\nAttempt to land with your feet out in front you, reaching as far as possible with your legs.\nMeasure the distance from your landing point to the starting point and track results."],["Standing_Low-Pulley_Deltoid_Raise","Standing Low-Pulley Deltoid Raise","","Kraft","Kabelzug",[14],[6],"kraft",2,"Start by standing to the right side of a low pulley row. Use your left hand to come across the body and grab a single handle attached to the low pulley with a pronated grip (palms facing down). Rest your arm in front of you. Your right hand should grab the machine for better support and balance.\nMake sure that your back is erect and your feet are shoulder width apart from each other. This is the starting position.\nBegin to use the left hand and come across your body out until it is elevated to shoulder height while exhaling.\nFeel the contraction at the top for a second and begin to slowly lower the handle back down to the original starting position while inhaling.\nRepeat for the recommended amount of repetitions.\nSwitch arms and repeat the exercise."],["Standing_Low-Pulley_One-Arm_Triceps_Extension","Standing Low-Pulley One-Arm Triceps Extension","","Kraft","Kabelzug",[16],[5,14],"kraft",2,"Grab a single handle with your left arm next to the low pulley machine. Turn away from the machine keeping the handle to the side of your body with your arm fully extended. Now use both hands to elevate the single handle directly above the head with the palm facing forward. Keep your upper arm completely vertical (perpendicular to the floor) and put your right hand on your left elbow to help keep it steady. This is the starting position.\nKeeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.\nGo back to the starting position by using the triceps to raise the single handle. Breathe out as you perform this step.\nRepeat for the recommended amount of repetitions.\nSwitch arms and repeat the exercise."],["Standing_Military_Press","Standing Military Press","Schulterdrücken stehend (Military Press)","Kraft","Langhantel",[14],[16],"kraft",2,"Start by placing a barbell that is about chest high on a squat rack. Once you have selected the weights, grab the barbell using a pronated (palms facing forward) grip. Make sure to grip the bar wider than shoulder width apart from each other.\nSlightly bend the knees and place the barbell on your collar bone. Lift the barbell up keeping it lying on your chest. Take a step back and position your feet shoulder width apart from each other.\nOnce you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.\nLower the bar down to the collarbone slowly as you inhale.\nLift the bar back up to the starting position as you exhale.\nRepeat for the recommended amount of repetitions."],["Standing_Olympic_Plate_Hand_Squeeze","Standing Olympic Plate Hand Squeeze","","Kraft","Sonstiges",[6],[3],"kraft",2,"To begin, stand straight while holding a weight plate by the ridge at arm's length in each hand using a neutral grip (palms facing in). You feet should be shoulder width apart from each other. This will be your starting position.\nLower the plates until the fingers are nearly extended but can still hold weights. Inhale as you lower the plates.\nNow raise the plates back to the starting position as you exhale by closing your hands.\nRepeat for the recommended amount of repetitions prescribed in your program."],["Standing_One-Arm_Cable_Curl","Standing One-Arm Cable Curl","","Kraft","Kabelzug",[3],[],"kraft",2,"Start out by grabbing single handle next to the low pulley machine. Make sure you are far enough from the machine so that your arm is supporting the weight.\nMake sure that your upper arm is stationary, perpendicular to the floor with elbows in and palms facing forward. Your non lifting arm should be grabbing your waist. This will allow you to keep your balance.\nSlowly begin to curl the single handle upwards while keeping the upper arm stationary until your forearm touches your bicep while exhaling. Tip: Only the forearm should move.\nHold the contraction position as you squeeze the bicep and then lower the single handle back down to the starting position as you inhale.\nRepeat for the recommended amount of repetitions.\nSwitch arms while performing this exercise."],["Standing_One-Arm_Dumbbell_Curl_Over_Incline_Bench","Standing One-Arm Dumbbell Curl Over Incline Bench","","Kraft","Kurzhantel",[3],[],"kraft",2,"Stand on the back side of an incline bench as if you were going to be a spotter for someone. Have a dumbbell in one hand and rest it across the incline bench with a supinated (palms up) grip.\nPosition your non lifting hand at the corner or side of the incline bench. The chest should be pressed against the top part of the incline and your feet should be pressed against the floor at a wide stance. This is the starting position.\nWhile holding the upper arm stationary, curl the dumbbell upward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a second.\nSlowly begin to bring the dumbbells back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions.\nSwitch arms while performing this exercise."],["Standing_One-Arm_Dumbbell_Triceps_Extension","Standing One-Arm Dumbbell Triceps Extension","","Kraft","Kurzhantel",[16],[5,14],"kraft",2,"To begin, stand up with a dumbbell held in one hand. Your feet should be about shoulder width apart from each other. Now fully extend the arm with the dumbbell over your head. Tip: The small finger of your hand should be facing the ceiling and the palm of your hand should be facing forward. The dumbbell should be above your head.\nThis will be your starting position.\nKeeping your upper arm close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearm touch your bicep. Tip: The upper arm should remain stationary and only the forearm should move. Breathe in as you perform this step.\nGo back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.\nRepeat for the recommended amount of repetitions.\nSwitch arms and repeat the exercise."],["Standing_Overhead_Barbell_Triceps_Extension","Standing Overhead Barbell Triceps Extension","","Kraft","Langhantel",[16],[14],"kraft",2,"To begin, stand up holding a barbell or e-z bar using a pronated grip (palms facing forward) with your hands closer than shoulder width apart from each other. Your feet should be about shoulder width apart.\nNow elevate the barbell above your head until your arms are fully extended. Keep your elbows in. This will be your starting position.\nKeeping your upper arms close to your head and elbows in, perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.\nGo back to the starting position by using the triceps to raise the barbell. Breathe out as you perform this step.\nRepeat for the recommended amount of repetitions."],["Standing_Palm-In_One-Arm_Dumbbell_Press","Standing Palm-In One-Arm Dumbbell Press","","Kraft","Kurzhantel",[14],[16],"kraft",2,"Start by having a dumbbell in one hand with your arm fully extended to the side using a neutral grip. Use your other arm to hold on to an incline bench to keep your balance.\nYour feet should be shoulder width apart from each other. Now slowly lift the dumbbell up until you create a 90 degree angle with your arm. Note: Your forearm should be perpendicular to the floor. Continue to maintain a neutral grip throughout the entire exercise.\nSlowly lift the dumbbell up until your arm is fully extended. This the starting position.\nWhile inhaling lower the weight down until your arm is at a 90 degree angle again.\nFeel the contraction for a second and then lift the weight back up towards the starting position while exhaling. Remember to hold on to the incline bench and keep your feet positioned to keep balance during the exercise.\nRepeat for the recommended amount of repetitions.\nSwitch arms and repeat the exercise."],["Standing_Palms-In_Dumbbell_Press","Standing Palms-In Dumbbell Press","","Kraft","Kurzhantel",[14],[16],"kraft",2,"Start by having a dumbbell in each hand with your arm fully extended to the side using a neutral grip. Your feet should be shoulder width apart from each other. Now slowly lift the dumbbells up until you create a 90 degree angle with your arms. Note: Your forearms should be perpendicular to the floor. This the starting position.\nContinue to maintain a neutral grip throughout the entire exercise. Slowly lift the dumbbells up until your arms are fully extended.\nWhile inhaling lower the weights down until your arm is at a 90 degree angle again.\nRepeat for the recommended amount of repetitions."],["Standing_Palms-Up_Barbell_Behind_The_Back_Wrist_Curl","Standing Palms-Up Barbell Behind The Back Wrist Curl","","Kraft","Langhantel",[6],[],"kraft",2,"Start by standing straight and holding a barbell behind your glutes at arm's length while using a pronated grip (palms will be facing back away from the glutes) and having your hands shoulder width apart from each other.\nYou should be looking straight forward while your feet are shoulder width apart from each other. This is the starting position.\nWhile exhaling, slowly elevate the barbell up by curling your wrist in a semi-circular motion towards the ceiling. Note: Your wrist should be the only body part moving for this exercise.\nHold the contraction for a second and lower the barbell back down to the starting position while inhaling.\nRepeat for the recommended amount of repetitions.\nWhen finished, lower the barbell down to the squat rack or the floor by bending the knees. Tip: It is easiest to either pick it up from a squat rack or have a partner hand it to you."],["Standing_Pelvic_Tilt","Standing Pelvic Tilt","","Dehnen","Ohne",[10],[7],"zeit",2,"Start off with your feet hip-distance apart.\nBend your knees slightly to keep them soft and springy.\nYou may want to move your pelvis forward and backward and back few times before holding the tailbone forward in this stretch."],["Standing_Rope_Crunch","Standing Rope Crunch","","Kraft","Kabelzug",[0],[],"kraft",2,"Attach a rope to a high pulley and select an appropriate weight.\nStand with your back to the cable tower. Take the rope with both hands over your shoulders, holding it to your upper chest. This will be your starting position.\nPerform the movement by flexing the spine, crunching the weight down as far as you can.\nHold the peak contraction for a moment before returning to the starting position."],["Standing_Soleus_And_Achilles_Stretch","Standing Soleus And Achilles Stretch","","Dehnen","Ohne",[4],[],"zeit",2,"Stand with your feet hip-distance apart, one foot slightly in front of the other.\nBend both knees, keeping your back heel on the floor. Switch sides."],["Standing_Toe_Touches","Standing Toe Touches","","Dehnen","Ohne",[8],[4],"zeit",2,"Stand with some space in front and behind you.\nBend at the waist, keeping your legs straight, until you can relax and let your upper body hang down in front of you. Let your arms and hands hang down naturally. Hold for 10 to 20 seconds."],["Standing_Towel_Triceps_Extension","Standing Towel Triceps Extension","","Kraft","Körpergewicht",[16],[],"body",2,"To begin, stand up with both arms fully extended above the head holding one end of a towel with both hands. Your elbows should be in and the arms perpendicular to the floor with the palms facing each other while your feet should be shoulder width apart from each other. This is the starting position.\nNow communicate with your partner so that he/she can grip the other side of the towel to apply resistance. Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.\nGo back to the starting position by using the triceps to raise the towel. Breathe out as you perform this step.\nRepeat for the recommended amount of repetitions."],["Standing_Two-Arm_Overhead_Throw","Standing Two-Arm Overhead Throw","","Plyometrie","Medizinball",[14],[5,9],"kraft",2,"Stand with your feet shoulder width apart holding a medicine ball in both hands. To begin, reach the medicine ball deep behind your head as you bend the knees slightly and lean back.\nViolently throw the ball forward, flexing at the hip and using your whole body to complete the movement.\nThe medicine ball can be thrown to a partner or to a wall, receiving it as it bounces back."],["Star_Jump","Star Jump","","Plyometrie","Körpergewicht",[13],[4,7,8,14],"body",2,"Begin in a relaxed stance with your feet shoulder width apart and hold your arms close to the body.\nTo initiate the move, squat down halfway and explode back up as high as possible. Fully extend your entire body, spreading your legs and arms away from the body.\nAs you land, bring your limbs back in and absorb your impact through the legs."],["Step-up_with_Knee_Raise","Step-up with Knee Raise","","Kraft","Körpergewicht",[7],[8,13],"body",2,"Stand facing a box or bench of an appropriate height with your feet together. This will be your starting position.\nBegin the movement by stepping up, putting your left foot on the top of the bench. Extend through the hip and knee of your front leg to stand up on the box. As you stand on the box with your left leg, flex your right knee and hip, bringing your knee as high as you can.\nReverse this motion to step down off the box, and then repeat the sequence on the opposite leg."],["Step_Mill","Step Mill","","Cardio","Maschine",[13],[4,7,8],"cardio",2,"To begin, step onto the stepmill and select the desired option from the menu. You can choose a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Use caution so that you don't trip as you climb the stairs. It is recommended that you maintain your grip on the handles so that you don't fall.\nStepmills offer convenience, cardiovascular benefits, and usually have less impact than running outside while offering a similar rate of calories burned. They are typically much harder than other cardio equipment. A 150 lb person will typically burn over 300 calories in 30 minutes, compared to about 175 calories walking."],["Stiff-Legged_Barbell_Deadlift","Stiff-Legged Barbell Deadlift","Kreuzheben gestreckte Beine","Kraft","Langhantel",[8],[7,10],"kraft",2,"Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight.\nStand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.\nKeeping the knees stationary, lower the barbell to over the top of your feet by bending at the hips while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Inhale as you perform this movement.\nStart bringing your torso up straight again by extending your hips until you are back at the starting position. Exhale as you perform this movement.\nRepeat for the recommended amount of repetitions."],["Stiff-Legged_Dumbbell_Deadlift","Stiff-Legged Dumbbell Deadlift","","Kraft","Kurzhantel",[8],[7,10],"kraft",2,"Grasp a couple of dumbbells holding them by your side at arm's length.\nStand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.\nKeeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement\nStart bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.\nRepeat for the recommended amount of repetitions."],["Stiff_Leg_Barbell_Good_Morning","Stiff Leg Barbell Good Morning","","Kraft","Langhantel",[10],[7,8],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a shoulder width medium stance. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position.\nKeeping your legs stationary, move your torso forward by bending at the hips while inhaling. Lower your torso until it is parallel with the floor.\nBegin to raise the bar as you exhale by elevating your torso back to the starting position.\nRepeat for the recommended amount of repetitions."],["Stomach_Vacuum","Stomach Vacuum","","Dehnen","Körpergewicht",[0],[],"zeit",2,"To begin, stand straight with your feet shoulder width apart from each other. Place your hands on your hips. This is the starting position.\nNow slowly inhale as much air as possible and then start to exhale as much as possible while bringing your stomach in as much as possible and hold this position. Try to visualize your navel touching your backbone.\nOne isometric contraction is around 20 seconds. During the 20 second hold, try to breathe normally. Then inhale and bring your stomach back to the starting position.\nOnce you have practiced this exercise, try to perform this exercise for longer than 20 seconds. Tip: You can work your way up to 40-60 seconds.\nRepeat for the recommended amount of sets."],["Straight-Arm_Dumbbell_Pullover","Straight-Arm Dumbbell Pullover","","Kraft","Kurzhantel",[5],[9,14,16],"kraft",2,"Place a dumbbell standing up on a flat bench.\nEnsuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.\nGrasp the dumbbell with both hands and hold it straight over your chest at arms length. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position.\nCaution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.\nWhile keeping your arms straight, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.\nAt that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.\nHold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."],["Straight-Arm_Pulldown","Straight-Arm Pulldown","Überzüge am Kabel","Kraft","Kabelzug",[9],[],"kraft",2,"You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.\nBend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.\nWhile keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.\nWhile keeping the arms straight, go back to the starting position while breathing in.\nRepeat for the recommended amount of repetitions."],["Straight_Bar_Bench_Mid_Rows","Straight Bar Bench Mid Rows","","Kraft","Langhantel",[11],[3,9],"kraft",2,"Place a loaded barbell on the end of a bench. Standing on the bench behind the bar, take a medium, pronated grip. Stand with your hips back and chest up, maintaining a neutral spine. This will be your starting position.\nRow the bar to your torso by retracting the shoulder blades and flexing the elbows. Use a controlled movement with no jerking.\nAfter a brief pause, slowly return the bar to the starting position, ensuring to go all the way down."],["Straight_Raises_on_Incline_Bench","Straight Raises on Incline Bench","","Kraft","Langhantel",[14],[15],"kraft",2,"Place a bar on the ground behind the head of an incline bench.\nLay on the bench face down. With a pronated grip, pick the barbell up from the floor, keeping your arms straight. Allow the bar to hang straight down. This will be your starting position.\nTo begin, raise the barbell out in front of your head while keeping your arms extended.\nReturn to the starting position."],["Stride_Jump_Crossover","Stride Jump Crossover","","Plyometrie","Sonstiges",[13],[1,2,4,8],"kraft",2,"Stand to the side of a box with your inside foot on top of it, close to the edge.\nBegin by swinging the arms upward as you push through the top leg, jumping upward as high as possible. Attempt to drive the opposite knee upward.\nLand in the opposite position that you started, on the opposite side of the box. The foot that was initially on the box will now be on the ground, with the opposite foot now on the box.\nRepeat the movement, crossing back over to the other side."],["Sumo_Deadlift","Sumo Deadlift","Sumo-Kreuzheben","Powerlifting","Langhantel",[8],[2,6,7,10,11,13,15],"kraft",2,"Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.\nTake a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.\nAs the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.\nReturn the weight to the ground by bending at the hips and controlling the weight on the way down."],["Sumo_Deadlift_with_Bands","Sumo Deadlift with Bands","","Powerlifting","Langhantel",[8],[2,6,7,10,11,13,15],"kraft",2,"To deadlift with short bands, simply loop them over the bar before you start, and step into them to set up. Ensure that they under the back half of your foot, directly where you are driving into the floor.\nBegin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip.\nTake a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.\nAs the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.\nReturn the weight to the ground by bending at the hips and controlling the weight on the way down."],["Sumo_Deadlift_with_Chains","Sumo Deadlift with Chains","","Powerlifting","Langhantel",[8],[1,2,6,7,10,11,13,15],"kraft",2,"You can attach the chains to the sleeves of the bar, or just drape the middle over the bar so there is a greater weight increase as you lift. Attempt to keep the ends of the chains away from the plates so you don't hit them when you lower the weight.\nBegin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.\nTake a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.\nAs the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.\nReturn the weight to the ground by bending at the hips and controlling the weight on the way down."],["Superman","Superman","Superman","Dehnen","Körpergewicht",[10],[7,8],"zeit",2,"To begin, lie straight and face down on the floor or exercise mat. Your arms should be fully extended in front of you. This is the starting position.\nSimultaneously raise your arms, legs, and chest off of the floor and hold this contraction for 2 seconds. Tip: Squeeze your lower back to get the best results from this exercise. Remember to exhale during this movement. Note: When holding the contracted position, you should look like superman when he is flying.\nSlowly begin to lower your arms, legs and chest back down to the starting position while inhaling.\nRepeat for the recommended amount of repetitions prescribed in your program."],["Supine_Chest_Throw","Supine Chest Throw","","Plyometrie","Medizinball",[16],[5,14],"kraft",2,"This drill is great for chest passes when you lack a partner or a wall of sufficient strength. Lay on the ground on your back with your knees bent.\nBegin with the ball on your chest, held with both hands on the bottom.\nExplode up, extending through the elbow to throw the ball directly above you as high as possible.\nCatch the ball with both hands as it comes down."],["Supine_One-Arm_Overhead_Throw","Supine One-Arm Overhead Throw","","Plyometrie","Medizinball",[0],[5,9,14],"kraft",2,"Lay on the ground on your back with your knees bent. Hold the ball with one hand, extending the arm fully behind your head. This will be your starting position.\nInitiate the movement at the shoulder, throwing the ball directly forward of you as you sit up, attempting to go for maximum distance.\nThe ball can be thrown to a partner or bounced off of a wall."],["Supine_Two-Arm_Overhead_Throw","Supine Two-Arm Overhead Throw","","Plyometrie","Medizinball",[0],[5,9,14],"kraft",2,"Lay on the ground on your back with your knees bent.\nHold the ball with both hands, extending the arms fully behind your head. This will be your starting position.\nInitiate the movement at the shoulder, throwing the ball directly forward of you as you sit up, attempting to go for maximum distance.\nThe ball can be thrown to a partner or bounced off of a wall."],["Suspended_Fallout","Suspended Fallout","","Kraft","Sonstiges",[0],[5,10,14],"kraft",2,"Adjust the straps so the handles are at an appropriate height, below waist level.\nBegin standing and grasping the handles. Lean into the straps, moving to an incline push-up position. This will be your starting position.\nKeeping your arms straight, lean further into the suspension straps, bringing your body closer to the ground, allowing your shoulders to extend, raising your arms up and over your head.\nMaintain a neutral spine and keep the rest of your body straight, your shoulders being the only joints allowed to move.\nPause during the peak contraction, and then return to the starting position."],["Suspended_Push-Up","Suspended Push-Up","","Kraft","Sonstiges",[5],[14,16],"kraft",2,"Anchor your suspension straps securely to the top of a rack or other object.\nLeaning into the straps, take a handle in each hand and move into a push-up plank position. You should be as close to parallel to the ground as you can manage with your arms fully extended, maintaining good posture.\nMaintaining a straight, rigid torso, descend slowly by allowing the elbows to flex.\nContinue until your elbows break 90 degrees, pausing before you extend to return to the starting position."],["Suspended_Reverse_Crunch","Suspended Reverse Crunch","","Kraft","Sonstiges",[0],[],"kraft",2,"Secure a set of suspension straps with the handles hanging about a foot off of the ground. Move yourself into a pushup plank position facing away from the rack.\nPlace your feet into the handles. You should maintain a straight posture, not allowing the hips to sag. This will be your starting position.\nBegin the movement by flexing the knees and hips, drawing the knees to your torso. As you do so, anteriorly tilt your pelvis, allowing your spine to flex.\nAt the top of the controlled motion, return to the starting position."],["Suspended_Row","Suspended Row","","Kraft","Sonstiges",[11],[3,9],"kraft",2,"Suspend your straps at around chest height. Take a handle in each hand and lean back. Keep your body erect and your head and chest up. Your arms should be fully extended. This will be your starting position.\nBegin by flexing the elbow to initiate the movement. Protract your shoulder blades as you do so.\nAt the completion of the motion pause, and then return to the starting position."],["Suspended_Split_Squat","Suspended Split Squat","","Kraft","Sonstiges",[13],[1,2,4,7,8],"kraft",2,"Suspend your straps so the handles are 18-30 inches from the floor.\nFacing away from the setup, place your rear foot into the handle behind you. Keep your head looking forward and your chest up, with your knee slightly bent. This will be your starting position.\nDescend by flexing the knee and hips, lowering yourself to the ground. Keep your weight on the heel of your foot and maintain your posture throughout the exercise.\nAt the bottom of the movement, reverse the motion, extending through the hip and knee to return to the starting position."],["Svend_Press","Svend Press","","Kraft","Sonstiges",[5],[6,14,16],"kraft",2,"Begin in a standing position.\nPress two lightweight plates together with your hands. Hold the plates together close to your chest to create an isometric contraction in your chest muscles. Your fingers should be pointed forward. This is your starting position.\nSqueeze the plates between your palms and extend your arms directly out in front of you in a controlled motion.\nPause at the top of the motion, and then slowly return to the starting position."],["T-Bar_Row_with_Handle","T-Bar Row with Handle","T-Bar Rudern","Kraft","Langhantel",[11],[3,9],"kraft",2,"Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.\nStand over the bar, and position a Double D row handle around the bar next to the collar. Using your hips and legs, rise to a standing position.\nAssume a wide stance with your hips back and your chest up. Your arms should be extended. This will be your starting position.\nPull the weight to your upper abdomen by retracting the shoulder blades and flexing the elbows. Do not jerk the weight or cheat during the movement.\nAfter a brief pause, return to the starting position."],["Tate_Press","Tate Press","","Kraft","Kurzhantel",[16],[5,14],"kraft",2,"Lie down on a flat bench with a dumbbell in each hand on top of your thighs. The palms of your hand will be facing each other.\nBy using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them in front of you at shoulder width. Note: when holding the dumbbells in front of you, make sure your arms are wider than shoulder width apart from each other using a pronated (palms forward) grip. Allow your elbows to point out. This is your starting position.\nKeeping the upper arms stationary, slowly move the dumbbells in and down in a semi circular motion until they touch the upper chest while inhaling. Keep full control of the dumbbells at all times and do not move the upper arms nor rest the dumbbells on the chest.\nAs you breathe out, move the dumbbells up using your triceps and the same semi-circular motion but in reverse. Attempt to keep the dumbbells together as they move up. Lock your arms in the contracted position, hold for a second and then start coming down again slowly again. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions of your training program."],["The_Straddle","The Straddle","","Dehnen","Ohne",[8],[2,4],"zeit",2,"Begin in a seated, upright position. Start by extending your legs in front of you in a V.\nWith your hands on the floor, lean forward as far as possible. Hold for 10 to 20 seconds."],["Thigh_Abductor","Thigh Abductor","Abduktoren-Maschine","Kraft","Maschine",[1],[7],"kraft",2,"To begin, sit down on the abductor machine and select a weight you are comfortable with. When your legs are positioned properly, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.\nSlowly press against the machine with your legs to move them away from each other while exhaling.\nFeel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary to prevent any injuries from occurring.\nRepeat for the recommended amount of repetitions."],["Thigh_Adductor","Thigh Adductor","Adduktoren-Maschine","Kraft","Maschine",[2],[7,8],"kraft",2,"To begin, sit down on the adductor machine and select a weight you are comfortable with. When your legs are positioned properly on the leg pads of the machine, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.\nSlowly press against the machine with your legs to move them towards each other while exhaling.\nFeel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary and avoid fast jerking motions in order to prevent any injuries from occurring.\nRepeat for the recommended amount of repetitions."],["Tire_Flip","Tire Flip","","Strongman","Sonstiges",[13],[4,5,6,7,8,10,14,15,16],"kraft",2,"Begin by gripping the bottom of the tire on the tread, and position your feet back a bit. Your chest should be driving into the tire.\nTo lift the tire, extend through the hips, knees, and ankles, driving into the tire and up.\nAs the tire reaches a 45 degree angle, step forward and drive a knee into the tire. As you do so adjust your grip to the upper portion of the tire and push it forward as hard as possible to complete the turn. Repeat as necessary."],["Toe_Touchers","Toe Touchers","Toe Touches","Dehnen","Körpergewicht",[0],[],"zeit",2,"To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down.\nYour legs should be touching each other. Slowly elevate your legs up in the air until they are almost perpendicular to the floor with a slight bend at the knees. Your feet should be parallel to the floor.\nMove your arms so that they are fully extended at a 45 degree angle from the floor. This is the starting position.\nWhile keeping your lower back pressed against the floor, slowly lift your torso and use your hands to try and touch your toes. Remember to exhale while perform this part of the exercise.\nSlowly begin to lower your torso and arms back down to the starting position while inhaling. Remember to keep your arms straight out pointing towards your toes.\nRepeat for the recommended amount of repetitions."],["Torso_Rotation","Torso Rotation","","Dehnen","Gymnastikball",[0],[],"zeit",2,"Stand upright holding an exercise ball with both hands. Extend your arms so the ball is straight out in front of you. This will be your starting position.\nRotate your torso to one side, keeping your eyes on the ball as you move. Now, rotate back to the opposite direction. Repeat for 10-20 repetitions."],["Trail_Running_Walking","Trail Running/Walking","","Cardio","Ohne",[13],[4,7,8],"cardio",2,"Running or hiking on trails will get the blood pumping and heart beating almost immediately. Make sure you have good shoes. While you use the muscles in your calves and buttocks to pull yourself up a hill, the knees, joints and ankles absorb the bulk of the pounding coming back down. Take smaller steps as you walk downhill, keep your knees bent to reduce the impact and slow down to avoid falling.\nA 150 lb person can burn over 200 calories for 30 minutes walking uphill, compared to 175 on a flat surface. If running the trail, a 150 lb person can burn well over 500 calories in 30 minutes."],["Trap_Bar_Deadlift","Trap Bar Deadlift","","Kraft","Sonstiges",[13],[7,8],"kraft",2,"For this exercise load a trap bar, also known as a hex bar, to an appropriate weight resting on the ground. Stand in the center of the apparatus and grasp both handles.\nLower your hips, look forward with your head and keep your chest up.\nBegin the movement by driving through the heels and extend your hips and knees. Avoid rounding your back at all times.\nAt the completion of the movement, lower the weight back to the ground under control."],["Tricep_Dumbbell_Kickback","Tricep Dumbbell Kickback","","Kraft","Kurzhantel",[16],[],"kraft",2,"Start with a dumbbell in each hand and your palms facing your torso. Keep your back straight with a slight bend in the knees and bend forward at the waist. Your torso should be almost parallel to the floor. Make sure to keep your head up. Your upper arms should be close to your torso and parallel to the floor. Your forearms should be pointed towards the floor as you hold the weights. There should be a 90-degree angle formed between your forearm and upper arm. This is your starting position.\nNow, while keeping your upper arms stationary, exhale and use your triceps to lift the weights until the arm is fully extended. Focus on moving the forearm.\nAfter a brief pause at the top contraction, inhale and slowly lower the dumbbells back down to the starting position.\nRepeat the movement for the prescribed amount of repetitions."],["Tricep_Side_Stretch","Tricep Side Stretch","","Dehnen","Ohne",[16],[14],"zeit",2,"Bring right arm across your body and over your left shoulder, holding your elbow with your left hand, until you feel a stretch in your tricep. Then repeat for your other arm."],["Triceps_Overhead_Extension_with_Rope","Triceps Overhead Extension with Rope","","Kraft","Kabelzug",[16],[],"kraft",2,"Attach a rope to a low pulley. After selecting an appropriate weight, grasp the rope with both hands and face away from the cable.\nPosition your hands behind your head with your elbows point straight up. Your elbows should start out
