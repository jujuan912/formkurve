flexed, and you can stagger your stance and lean gently away from the machine to create greater stability. This will be your starting position.\nTo perform the movement, extend through the elbow while keeping the upper arm in position, raising your hands above your head.\nSqueeze your triceps at the top of the movement, and slowly lower the weight back to the start position."],["Triceps_Pushdown","Triceps Pushdown","Trizepsdrücken am Kabel","Kraft","Kabelzug",[16],[],"kraft",2,"Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.\nStanding upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.\nUsing the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.\nAfter a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step.\nRepeat for the recommended amount of repetitions."],["Triceps_Pushdown_-_Rope_Attachment","Triceps Pushdown - Rope Attachment","Trizepsdrücken am Seil","Kraft","Kabelzug",[16],[],"kraft",2,"Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).\nStanding upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.\nUsing the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.\nAfter holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step.\nRepeat for the recommended amount of repetitions."],["Triceps_Pushdown_-_V-Bar_Attachment","Triceps Pushdown - V-Bar Attachment","","Kraft","Kabelzug",[16],[],"kraft",2,"Attach a V-Bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.\nStanding upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. The thumbs should be higher than the small finger. This is your starting position.\nUsing the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.\nAfter a second hold at the contracted position, bring the V-Bar slowly up to the starting point. Breathe in as you perform this step.\nRepeat for the recommended amount of repetitions."],["Triceps_Stretch","Triceps Stretch","","Dehnen","Ohne",[16],[9],"zeit",2,"Reach your hand behind your head, grasp your elbow and gently pull. Hold for 10 to 20 seconds, then switch sides."],["Tuck_Crunch","Tuck Crunch","","Kraft","Körpergewicht",[0],[],"body",2,"To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down.\nYour legs should be crossed by wrapping one ankle around the other. Slowly elevate your legs up in the air until your thighs are perpendicular to the floor with a slight bend at the knees. Note: Your knees and toes should be parallel to the floor as opposed to the thighs.\nMove your arms from the floor and cross them so they are resting on your chest. This is the starting position.\nWhile keeping your lower back pressed against the floor, slowly lift your torso. Remember to exhale while perform this part of the exercise.\nSlowly begin to lower your torso back down to the starting position while inhaling.\nRepeat for the recommended amount of repetitions."],["Two-Arm_Dumbbell_Preacher_Curl","Two-Arm Dumbbell Preacher Curl","","Kraft","Kurzhantel",[3],[],"kraft",2,"Grab a dumbbell with each arm and place the upper arms on top of the preacher bench or the incline bench. The dumbbell should be held at shoulder length. This will be your starting position.\nAs you breathe in, slowly lower the dumbbells until your upper arm is extended and the biceps is fully stretched.\nAs you exhale, use the biceps to curl the weights up until your biceps is fully contracted and the dumbbells are at shoulder height.\nSqueeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions."],["Two-Arm_Kettlebell_Clean","Two-Arm Kettlebell Clean","","Kraft","Kettlebell",[14],[4,7,8,10,15],"kraft",2,"Place two kettlebells between your feet. To get in the starting position, push your butt back and look straight ahead.\nClean the kettlebells to your shoulders by extending through the legs and hips as you raise the kettlebells towards your shoulders. Rotate your wrists as you do so.\nLower the kettlebells back to the starting position and repeat."],["Two-Arm_Kettlebell_Jerk","Two-Arm Kettlebell Jerk","","Kraft","Kettlebell",[14],[4,13,16],"kraft",2,"Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you swing the kettlebells towards your shoulders. Rotate your wrists as you do so, so that the palms face forward. Squat down a few inches and reverse the motion rapidly driving both kettlebells overhead. Immediately after the initial push, squat down again and get under the kettlebells. Once the kettlebells are locked out, stand upright to complete the exercise."],["Two-Arm_Kettlebell_Military_Press","Two-Arm Kettlebell Military Press","","Kraft","Kettlebell",[14],[16],"kraft",2,"Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you swing the kettlebells towards your shoulders. Rotate your wrists as you do so, so that the palms face forward.\nPress the kettlebells up and out. As the kettlebells pass your head, lean into the weights so that the kettlebells are racked behind your head. Make sure to contract your lats, butt, and stomach for added stability."],["Two-Arm_Kettlebell_Row","Two-Arm Kettlebell Row","","Kraft","Kettlebell",[11],[3,9],"kraft",2,"Place two kettlebells in front of your feet. Bend your knees slightly and then push your butt out as much as possible as you bend over to get in the starting position.\nGrab both kettlebells and pull them to your stomach, retracting your shoulder blades and flexing the elbows. Keep your back straight. Lower and repeat."],["Underhand_Cable_Pulldowns","Underhand Cable Pulldowns","","Kraft","Kabelzug",[9],[3,11,14],"kraft",2,"Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.\nGrab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.\nAs you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.\nAs you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.\nAfter a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.\nRepeat this motion for the prescribed amount of repetitions."],["Upper_Back-Leg_Grab","Upper Back-Leg Grab","","Dehnen","Ohne",[8],[10,11],"zeit",2,"While seated, bend forward to hug your thighs from underneath with both arms.\nKeep your knees together and your legs extended out as you bring your chest down to your knees. You can also stretch your middle back by pulling your back away from your knees as your hugging them."],["Upper_Back_Stretch","Upper Back Stretch","","Dehnen","Ohne",[11],[11],"zeit",2,"Clasp fingers together with your thumbs pointing down, round your shoulders as you reach your hands forward."],["Upright_Barbell_Row","Upright Barbell Row","Aufrechtes Rudern","Kraft","Langhantel",[14],[15],"kraft",2,"Grasp a barbell with an overhand grip that is slightly less than shoulder width. The bar should be resting on the top of your thighs with your arms extended and a slight bend in your elbows. Your back should also be straight. This will be your starting position.\nNow exhale and use the sides of your shoulders to lift the bar, raising your elbows up and to the side. Keep the bar close to your body as you raise it. Continue to lift the bar until it nearly touches your chin. Tip: Your elbows should drive the motion, and should always be higher than your forearms. Remember to keep your torso stationary and pause for a second at the top of the movement.\nLower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.\nRepeat for the recommended amount of repetitions."],["Upright_Cable_Row","Upright Cable Row","","Kraft","Kabelzug",[15],[14],"kraft",2,"Grasp a straight bar cable attachment that is attached to a low pulley with a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The bar should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.\nUse your side shoulders to lift the cable bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.\nLower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.\nRepeat for the recommended amount of repetitions."],["Upright_Row_-_With_Bands","Upright Row - With Bands","","Kraft","Bänder",[15],[14],"kraft",2,"To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles using a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The handles should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.\nUse your side shoulders to lift the handles as you exhale. The handles should be close to the body as you move them up. Continue to lift the handles until they nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the handles, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.\nLower the handles back down slowly to the starting position. Inhale as you perform this portion of the movement.\nRepeat for the recommended amount of repetitions."],["Upward_Stretch","Upward Stretch","","Dehnen","Ohne",[14],[5,9],"zeit",2,"Extend both hands straight above your head, palms touching.\nSlowly push your hands up and back, keeping your back straight."],["V-Bar_Pulldown","V-Bar Pulldown","Latziehen V-Griff","Kraft","Kabelzug",[9],[3,11,14],"kraft",2,"Sit down on a pull-down machine with a V-Bar attached to the top pulley.\nAdjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.\nGrab the V-bar with the palms facing each other (a neutral grip). Stick your chest out and lean yourself back slightly (around 30-degrees) in order to better engage the lats. This will be your starting position.\nUsing your lats, pull the bar down as you squeeze your shoulder blades. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion. Tip: Keep the torso stationary throughout the movement.\nAfter a second hold on the contracted position, slowly bring the bar back to the starting position as you breathe in.\nRepeat for the prescribed number of repetitions."],["V-Bar_Pullup","V-Bar Pullup","","Kraft","Körpergewicht",[9],[3,11,14],"body",2,"Start by placing the middle of the V-bar in the middle of the pull-up bar (assuming that the pull-up station you are using does not have neutral grip handles). The V-Bar handles will be facing down so that you can hang from the pull-up bar through the use of the handles.\nOnce you securely place the V-bar, take a hold of the bar from each side and hang from it. Stick your chest out and lean yourself back slightly in order to better engage the lats. This will be your starting position.\nUsing your lats, pull your torso up while leaning your head back slightly so that you do not hit yourself with the chin-up bar. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion.\nAfter a second hold on the contracted position, slowly lower your body back to the starting position as you breathe in.\nRepeat for the prescribed number of repetitions."],["Vertical_Swing","Vertical Swing","","Plyometrie","Kurzhantel",[8],[7,13,14],"kraft",2,"Allow the dumbbell to hang at arms length between your legs, holding it with both hands. Keep your back straight and your head up.\nSwing the dumbbell between your legs, flexing at the hips and bending the knees slightly.\nPowerfully reverse the motion by extending at the hips, knees, and ankles to propel yourself upward, swinging the dumbell over your head.\nAs you land, absorb the impact through your legs and draw the dumbbell to your torso before the next repetition."],["Walking_Treadmill","Walking, Treadmill","","Cardio","Maschine",[13],[4,7,8],"cardio",2,"To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.\nTreadmills offer convenience, cardiovascular benefits, and usually have less impact than walking outside. When walking, you should move at a moderate to fast pace, not a leisurely one. Being an activity of lower intensity, walking doesn't burn as many calories as some other activities, but still provides great benefit. A 150 lb person will burn about 175 calories walking 4 miles per hour for 30 minutes, compared to 450 calories running twice as fast. Maintain proper posture as you walk, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],["Weighted_Ball_Hyperextension","Weighted Ball Hyperextension","","Kraft","Gymnastikball",[10],[7,8,11],"kraft",2,"To begin, lie down on an exercise ball with your torso pressing against the ball and parallel to the floor. The ball of your feet should be pressed against the floor to help keep you balanced. Place a weighted plate under your chin or behind your neck. This is the starting position.\nSlowly raise your torso up by bending at the waist and lower back. Remember to exhale during this movement.\nHold the contraction on your lower back for a second and lower your torso back down to the starting position while inhaling.\nRepeat for the recommended amount of repetitions prescribed in your program."],["Weighted_Ball_Side_Bend","Weighted Ball Side Bend","","Kraft","Gymnastikball",[0],[],"kraft",2,"To begin, lie down on an exercise ball with your left side of the torso (waist, hips and shoulder) pressed against the ball.\nYour feet should be on the floor while your legs are crossed and hanging from the ball. Hold a weighted plate with your right hand directly to the right side of your head. Tip: Make sure the smooth side of the plate is resting against your head.\nPlace your left arm across your torso so that your palm is on your obliques. There should be a right angle between your left forearm and upper arm. This is the starting position.\nRaise the side of your torso up by laterally flexing at the waist while exhaling.\nHold the contraction for a second and slowly lower yourself back down to the starting position while inhaling.\nRepeat for the recommended amount of repetitions.\nSwitch sides and repeat the exercise."],["Weighted_Bench_Dip","Weighted Bench Dip","","Kraft","Sonstiges",[16],[5,14],"kraft",2,"For this exercise you will need to place a bench behind your back and another one in front of you. With the benches perpendicular to your body, hold on to one bench on its edge with the hands close to your body, separated at shoulder width. Your arms should be fully extended.\nThe legs will be extended forward on top of the other bench. Your legs should be parallel to the floor while your torso is to be perpendicular to the floor. Have your partner place the dumbbell on your lap. Note: This exercise is best performed with a partner as placing the weight on your lap can be challenging and cause injury without assistance. This will be your starting position.\nSlowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.\nUsing your triceps to bring your torso up again, lift yourself back to the starting position while exhaling.\nRepeat for the recommended amount of repetitions."],["Weighted_Crunches","Weighted Crunches","","Kraft","Medizinball",[0],[],"kraft",2,"Lie flat on your back with your feet flat on the ground or resting on a bench with your knees bent at a 90 degree angle.\nHold a weight to your chest, or you may hold it extended above your torso. This will be your starting position.\nNow, exhale and slowly begin to roll your shoulders off the floor. Your shoulders should come up off the floor about 4 inches while your lower back remains on the floor.\nAt the top of the movement, flex your abdominals and hold for a brief pause.\nThen inhale and slowly lower yourself back down to the starting position."],["Weighted_Jump_Squat","Weighted Jump Squat","","Kraft","Langhantel",[13],[4,7,8,10],"kraft",2,"Position a lightly loaded barbell across the back of your shoulders. You could also use a weighted vest, sandbag, or other type of resistance for this exercise.\nThe weight should be light enough that it doesn't slow you down significantly. Your feet should be just outside of shoulder width with your head and chest up. This will be your starting position.\nUsing a countermovement, squat partially down and immediately reverse your direction to explode off of the ground, extending through your hips, knees, and ankles. Maintain good posture throughout the jump.\nAs you return to the ground, absorb the impact through your legs."],["Weighted_Pull_Ups","Weighted Pull Ups","Klimmzüge mit Gewicht","Kraft","Sonstiges",[9],[3,11],"body",2,"Attach a weight to a dip belt and secure it around your waist. Grab the pull-up bar with the palms of your hands facing forward. For a medium grip, your hands should be spaced at shoulder width. Both arms should be extended in front of you holding the bar at the chosen grip.\nYou'll want to bring your torso back about 30 degrees while creating a curvature in your lower back and sticking your chest out. This will be your starting position.\nNow, exhale and pull your torso up until your head is above your hands. Concentrate on squeezing yourshoulder blades back and down as you reach the top contracted position.\nAfter a brief moment at the top contracted position, inhale and slowly lower your torso back to the starting position with your arms extended and your lats fully stretched."],["Weighted_Sissy_Squat","Weighted Sissy Squat","","Kraft","Langhantel",[13],[4,7,8],"kraft",2,"Standing upright, with feet at shoulder width and toes raised, use one hand to hold onto the beams of a squat rack and the opposite arm to hold a plate on top of your chest. This is your starting position.\nAs you use one arm to hold yourself, bend at the knees and slowly lower your torso toward the ground by bringing your pelvis and knees forward. Inhale as you go down and stop when your upper and lower legs almost create a 90-degree angle. Hold the stretch position for a second.\nAfter your one second hold, use your thigh muscles to bring your torso back up to the starting position. Exhale as you move up.\nRepeat for the recommended amount of times."],["Weighted_Sit-Ups_-_With_Bands","Weighted Sit-Ups - With Bands","","Kraft","Sonstiges",[0],[],"kraft",2,"Start out by strapping the bands around the base of the decline bench. Place the handles towards the inside of the decline bench so that when lying down, you can reach for both of them.\nPosition your legs through the decline machine until they are secured. Now reach for the exercise bands with both hands. Use a pronated (palms forward) grip to grasp the handles. Position them near your collar bone and rotate your wrist to a neutral grip (palms facing the torso). Note: Your arms should remain stationary throughout the exercise. This is the starting position.\nMove your torso upward until your upper body is perpendicular to the floor while exhaling. Hold the contraction for a second and lower your upper body back down to the starting position while inhaling.\nRepeat for the recommended amount of repetitions."],["Weighted_Squat","Weighted Squat","","Kraft","Sonstiges",[13],[4,7,8],"kraft",2,"Start by positioning two flat benches shoulder width apart from each other. Stand on top of them and wrap the weighted belt around your waist with the amount of weight you feel comfortable with. Make sure your toes are facing out.\nOnce you are standing straight up with the weight hanging in between your legs, position your arms so that they are fully extended to the side of your body. This is the starting position.\nBegin by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that are perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to move the body back up by pushing the floor of the flat bench with the ball of your foot mainly as you straighten the legs again and go back to the starting position. Exhale as you perform this portion of the exercise.\nRepeat for the recommended amount of repetitions."],["Wide-Grip_Barbell_Bench_Press","Wide-Grip Barbell Bench Press","","Kraft","Langhantel",[5],[14,16],"kraft",2,"Lie back on a flat bench with feet firm on the floor. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.\nAs you breathe in, come down slowly until you feel the bar on your middle chest.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions."],["Wide-Grip_Decline_Barbell_Bench_Press","Wide-Grip Decline Barbell Bench Press","","Kraft","Langhantel",[5],[14,16],"kraft",2,"Lie back on a decline bench with the feet securely locked at the front of the bench. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.\nAs you breathe in, come down slowly until you feel the bar on your lower chest.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions."],["Wide-Grip_Decline_Barbell_Pullover","Wide-Grip Decline Barbell Pullover","","Kraft","Langhantel",[5],[14,16],"kraft",2,"Lie down on a decline bench with both legs securely locked in position. Reach for the barbell behind the head using a pronated grip (palms facing out). Make sure to grab the barbell wider than shoulder width apart for this exercise. Slowly lift the barbell up from the floor by using your arms.\nWhen positioned properly, your arms should be fully extended and perpendicular to the floor. This is the starting position.\nBegin by moving the barbell back down in a semicircular motion as if you were going to place it on the floor, but instead, stop when the arms are parallel to the floor. Tip: Keep the arms fully extended at all times. The movement should only happen at the shoulder joint. Inhale as you perform this portion of the movement.\nNow bring the barbell up while exhaling until you are back at the starting position. Remember to keep full control of the barbell at all times.\nRepeat the movement for the prescribed amount of repetitions of your training program.\nWhen finished with your set, slowly lower the barbell back down until it is level with your head and release it."],["Wide-Grip_Lat_Pulldown","Wide-Grip Lat Pulldown","Latziehen breit","Kraft","Kabelzug",[9],[3,11,14],"kraft",2,"Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.\nGrab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.\nAs you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.\nAs you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.\nAfter a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.\nRepeat this motion for the prescribed amount of repetitions."],["Wide-Grip_Pulldown_Behind_The_Neck","Wide-Grip Pulldown Behind The Neck","","Kraft","Kabelzug",[9],[3,11,14],"kraft",2,"Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.\nGrab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.\nAs you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso and head forward. Think of an imaginary line from the center of the bar down to the back of your neck. This is your starting position.\nAs you breathe out, bring the bar down until it touches the back of your neck by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.\nAfter a second on the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.\nRepeat this motion for the prescribed amount of repetitions."],["Wide-Grip_Rear_Pull-Up","Wide-Grip Rear Pull-Up","","Kraft","Körpergewicht",[9],[3,11,14],"body",2,"Grab the pull-up bar with the palms facing forward using a wide grip.\nAs you have both arms extended in front of you holding the bar, bring your torso forward and head so that there is an imaginary line from the pull-up bar to the back of your neck. This is your starting position.\nPull your torso up until the bar is near the back of your neck. To do this, draw the shoulders and upper arms down and back while slightly leaning your head forward. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.\nAfter a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.\nRepeat this motion for the prescribed amount of repetitions."],["Wide-Grip_Standing_Barbell_Curl","Wide-Grip Standing Barbell Curl","","Kraft","Langhantel",[3],[],"kraft",2,"Stand up with your torso upright while holding a barbell at the wide outer handle. The palm of your hands should be facing forward. The elbows should be close to the torso. This will be your starting position.\nWhile holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.\nContinue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.\nSlowly begin to bring the bar back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions."],["Wide_Stance_Barbell_Squat","Wide Stance Barbell Squat","","Kraft","Langhantel",[13],[4,7,8,10],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a wider-than-shoulder-width stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance, and also maintain a straight back. This will be your starting position.\nBegin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Wide_Stance_Stiff_Legs","Wide Stance Stiff Legs","","Gewichtheben","Langhantel",[8],[2,7,10],"kraft",2,"Begin with a barbell loaded on the floor. Adopt a wide stance, and then bend at the hips to grab the bar. Your hips should be as far back as possible, and your legs nearly straight. Keep your back straight, and your head and chest up. This will be your starting position.\nBegin the movement be engaging the hips, driving them forward as you allow the arms to hang straight. Continue until you are standing straight up, and then slowly return the weight to the starting position. For successive reps, the weight need not touch the floor."],["Wind_Sprints","Wind Sprints","","Kraft","Körpergewicht",[0],[],"body",2,"Hang from a pull-up bar using a pronated grip. Your arms and legs should be extended. This will be your starting position.\nBegin by quickly raising one knee as high as you can. Do not swing your body or your legs. 3\nImmediately reverse the motion, returning that leg to the starting position. Simultaneously raise the opposite knee as high as possible.\nContinue alternating between legs until the set is complete."],["Windmills","Windmills","","Dehnen","Ohne",[1],[7,8,10],"zeit",2,"Lie on your back with your arms extended out to the sides and your legs straight. This will be your starting position.\nLift one leg and quickly cross it over your body, attempting to touch the ground near the opposite hand.\nReturn to the starting position, and repeat with the opposite leg. Continue to alternate for 10-20 repetitions."],["Worlds_Greatest_Stretch","World's Greatest Stretch","","Dehnen","Ohne",[8],[4,7,13],"zeit",2,"This is a three-part stretch. Begin by lunging forward, with your front foot flat on the ground and on the toes of your back foot. With your knees bent, squat down until your knee is almost touching the ground. Keep your torso erect, and hold this position for 10-20 seconds.\nNow, place the arm on the same side as your front leg on the ground, with the elbow next to the foot. Your other hand should be placed on the ground, parallel to your lead leg, to help support you during this portion of the stretch.\nAfter 10-20 seconds, place your hands on either side of your front foot. Raise the toes of the front foot off of the ground, and straighten your leg. You may need to reposition your rear leg to do so. Hold for 10-20 seconds, and then repeat the entire sequence for the other side."],["Wrist_Circles","Wrist Circles","","Dehnen","Körpergewicht",[6],[],"zeit",2,"Start by standing straight with your feet being shoulder width apart from each other. Elevate your arms to the side of you until they are fully extended and parallel to the floor at a height that is evenly aligned with your shoulders. Tip: Your torso and arms should form the letter \"T: Your palms should be facing down. This is the starting position.\nKeeping your entire body stationary except for the wrists, begin to rotate both wrists forward in a circular motion. Tip: Pretend that you are trying to draw circles by using your hands as the brush. Breathe normally as you perform this exercise.\nRepeat for the recommended amount of repetitions."],["Wrist_Roller","Wrist Roller","","Kraft","Sonstiges",[6],[14],"kraft",2,"To begin, stand straight up grabbing a wrist roller using a pronated grip (palms facing down). Your feet should be shoulder width apart.\nSlowly lift both arms until they are fully extended and parallel to the floor in front of you. Note: Make sure the rope is not wrapped around the roller. Your entire body should be stationary except for the forearms. This is the starting position.\nRotate one wrist at a time in an upward motion to bring the weight up to the bar by rolling the rope around the roller.\nOnce the weight has reached the bar, slowly begin to lower the weight back down by rotating the wrist in a downward motion until the weight reaches the starting position.\nRepeat for the prescribed amount of repetitions in your program."],["Wrist_Rotations_with_Straight_Bar","Wrist Rotations with Straight Bar","","Kraft","Langhantel",[6],[],"kraft",2,"Hold a barbell with both hands and your palms facing down; hands spaced about shoulder width. This will be your starting position.\nAlternating between each of your hands, perform the movement by extending the wrist as though you were rolling up a newspaper. Continue alternating back and forth until failure.\nReverse the motion by flexing the wrist, rolling the opposite direction. Continue the alternating motion until failure."],["Yoke_Walk","Yoke Walk","","Strongman","Sonstiges",[13],[0,1,2,4,7,8,10],"kraft",2,"The yoke is usually done with a yoke apparatus, but is sometimes seen with refrigerators or other heavy objects.\nBegin by racking the apparatus across the back of the shoulders. With your head looking forward and back arched, lift the yoke by driving through the heels.\nBegin walking as quickly as possible using short, quick steps. You may hold the side posts of the yoke to help steady it and hold it in position. Continue for the given distance as fast as possible, usually 75-100 feet."],["Zercher_Squats","Zercher Squats","","Kraft","Langhantel",[13],[4,7,8],"kraft",2,"This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. The correct height should be anywhere above the waist but below the chest. Once the correct height is chosen and the bar is loaded, lock your hands together and place the bar on top of your arms in between the forearm and upper arm.\nLift the bar up so that it is resting on top of your forearms. If you are holding the bar properly, it should look as if you have your arms crossed but with a bar running across them.\nStep away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).\nBegin to lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the bar as you exhale by pushing the floor with the ball of your foot mainly as you straighten the legs again and go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Zottman_Curl","Zottman Curl","","Kraft","Kurzhantel",[3],[6],"kraft",2,"Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.\nMake sure the palms of the hands are facing each other. This will be your starting position.\nWhile holding the upper arm stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Your wrist should rotate so that you have a supinated (palms up) grip. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level.\nHold the contracted position for a second as you squeeze the biceps.\nNow during the contracted position, rotate your wrist until you now have a pronated (palms facing down) grip with the thumb at a higher position than the pinky.\nSlowly begin to bring the dumbbells back down using the pronated grip.\nAs the dumbbells close your thighs, start rotating the wrist so that you go back to a neutral (palms facing your body) grip.\nRepeat for the recommended amount of repetitions."],["Zottman_Preacher_Curl","Zottman Preacher Curl","","Kraft","Kurzhantel",[3],[6],"kraft",2,"Grab a dumbbell in each hand and place your upper arms on top of the preacher bench or the incline bench. The dumbbells should be held at shoulder height and the elbows should be flexed. Hold the dumbbells with the palms of your hands facing down. This will be your starting position.\nAs you breathe in, slowly lower the dumbbells keeping the palms down until your upper arm is extended and your biceps are fully stretched.\nNow rotate your wrists once you are at the bottom of the movement so that the palms of the hands are facing up.\nAs you exhale, use your biceps to curl the weights up until they are fully contracted and the dumbbells are at shoulder height. Again, remember that to ensure full contraction you need to bring that small finger higher than the thumb.\nSqueeze the biceps hard for a second at the contracted position and rotate your wrists so that the palms are facing down again.\nRepeat for the recommended amount of repetitions."],["c_run_out","Laufen (Outdoor)","Laufen (Outdoor)","Laufen","Ohne",[13,8,4,7],[0],"lauf",2,"Lockerer Dauerlauf, Tempo- oder Long-Run im Freien.","Trail_Running_Walking"],["c_run_in","Laufen (Indoor / Laufband)","Laufen (Indoor / Laufband)","Laufen","Maschine",[13,8,4,7],[0],"lauf",2,"Laufband-Einheit; Steigung bei Bedarf als Höhenmeter eintragen.","Running_Treadmill"],["c_run_berg","Berglauf / Trail","Berglauf / Trail","Laufen","Ohne",[13,8,4,7],[0,10],"lauf",2,"Läufe mit vielen Höhenmetern – Höhenmeter mit eintragen.","Trail_Running_Walking"],["c_run_int","Intervalllauf","Intervalllauf","Laufen","Ohne",[13,8,4,7],[0],"lauf",2,"Intervalle z. B. 6×800 m; Gesamtdistanz inkl. Trabpausen eintragen.","Trail_Running_Walking" const sheets = [];

  const sb=$('.sb',sc); sb.innerHTML=html;

/* ---------- Mini-Charts (SVG, offline) ---------- */
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function barChart(data,opt={}){
  const W=340,H=opt.h||150,pl=34,pb=18,pt=10,pr=4;
  if(!data.length) return '<div class="empty">Keine Daten</div>';
  const maxV=niceMax(Math.max(opt.goal||0,...data.map(d=>Math.max(d.v||0,d.v2||0)))*1.05);
  const cw=(W-pl-pr)/data.length, bw=Math.max(2,Math.min(26,cw*0.68));
  const y=v=>pt+(H-pt-pb)*(1-v/maxV);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){ const v=maxV*i/3, yy=y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${pl-4}" y="${yy+3}" text-anchor="end">${opt.yfmt?opt.yfmt(v):fmtK(Math.round(v))}</text>`; }
  const step=Math.ceil(data.length/(opt.maxLabels||8));
  data.forEach((d,i)=>{
    const x=pl+cw*i+(cw-bw)/2;
    const h=(H-pt-pb)-(y(d.v||0)-pt);
    s+=`<rect x="${x}" y="${y(d.v||0)}" width="${bw}" height="${Math.max(d.v?2:0,h)}" rx="4" fill="${d.c||opt.color||'var(--acc)'}"><title>${esc(d.l)}: ${opt.tip?opt.tip(d.v):fmt(d.v,1)}</title></rect>`;
    if(i%step===0) s+=`<text x="${pl+cw*i+cw/2}" y="${H-4}" text-anchor="middle">${esc(d.l)}</text>`;
  });
  if(opt.goal){ const gy=y(opt.goal); s+=`<line x1="${pl}" x2="${W-pr}" y1="${gy}" y2="${gy}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${W-pr}" y="${gy-3}" text-anchor="end" style="fill:var(--warn)">Ziel ${opt.goal}</text>`; }
  return s+'</svg>';
}
function lineChart(pts,opt={}){
  pts=pts.filter(p=>p.y!=null&&isFinite(p.y));
  if(pts.length<1) return '<div class="empty">Noch keine Daten im Zeitraum</div>';
  const W=340,H=opt.h||160,pl=opt.pl||44,pb=18,pt=10,pr=8;
  const xs=pts.map(p=>pd(p.x).getTime()); let x0=Math.min(...xs),x1=Math.max(...xs); if(x0===x1){x0-=864e5*3;x1+=864e5*3;}
  let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y)); if(opt.goal!=null&&opt.showGoal){ y0=Math.min(y0,opt.goal); y1=Math.max(y1,opt.goal); }
  const padY=(y1-y0)*0.12||Math.abs(y1)*0.05||1; y0-=padY; y1+=padY; if(opt.zero) y0=Math.min(0,y0);
  const X=t=>pl+(W-pl-pr)*(t-x0)/(x1-x0), Y=v=>pt+(H-pt-pb)*(1-(v-y0)/(y1-y0));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){ const v=y0+(y1-y0)*i/3, yy=Y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${pl-4}" y="${yy+3}" text-anchor="end">${opt.yfmt?opt.yfmt(v):fmt(v,Math.abs(y1-y0)<10?1:0)}</text>`; }
  for(let i=0;i<=3;i++){ const t=x0+(x1-x0)*i/3; const d=new Date(t); s+=`<text x="${X(t)}" y="${H-4}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${d.getDate()}.${MON[d.getMonth()]}${(x1-x0)>3e10?' '+String(d.getFullYear()).slice(2):''}</text>`; }
  const path=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+','+Y(p.y).toFixed(1)).join('');
  const c=opt.color||'var(--acc)';
  if(pts.length>1) s+=`<path d="${path} L${X(xs[xs.length-1]).toFixed(1)},${H-pb} L${X(xs[0]).toFixed(1)},${H-pb}Z" fill="${c}" opacity=".1"/><path d="${path}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{ s+=`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="${pts.length>40?2:3.2}" fill="#fff" stroke="${c}" stroke-width="2"><title>${dLabel(p.x)}: ${opt.yfmt?opt.yfmt(p.y):fmt(p.y,1)}</title></circle>`; });
  if(opt.extra) s+=opt.extra(X,Y,H,pb);
  if(opt.goal!=null){ const gy=Y(opt.goal); if(gy>pt&&gy<H-pb) s+=`<line x1="${pl}" x2="${W-pr}" y1="${gy}" y2="${gy}" stroke="var(--warn)" stroke-dasharray="4 3"/>`; }
  return s+'</svg>';
}
function ring(val,max,size=118,color='var(--acc)',inner=''){

}

/* ---- Sätze & Workouts ---- */
function bw(){ const m=latestMeasure('weight'); return m?m.weight:S.profile.weight; }
function setVol(set,t){
  if(set.kind==='w') return 0;
  if(t==='kraft') return (set.w||0)*(set.r||0);
  if(t==='body') return S.settings.bodyVol ? ((bw()||0)+(set.w||0))*(set.r||0) : (set.w||0)*(set.r||0);
  if(t==='carry') return (set.w||0)*((set.m||0)/10);
  return 0;
}
function e1rm(w,r){ if(!w||!r) return 0; if(r===1) return w; return w*(1+Math.min(r,15)/30); }
function wVolume(w){ let v=0; for(const e of w.ex){ const t=exType(e.ex); for(const s of e.sets) v+=setVol(s,t); } return v; }
function wSets(w){ let n=0; for(const e of w.ex) n+= exType(e.ex)==='hyrox'?1:e.sets.filter(s=>s.kind!=='w').length; return n; }
function wRun(w){ let km=0,min=0,hm=0; for(const e of w.ex){ const t=exType(e.ex);
    if(t==='lauf') for(const s of e.sets){ km+=s.km||0; min+=s.min||0; hm+=s.hm||0; }
    if(t==='hyrox') for(const s of e.sets) if(isHyRun(s.seg)&&s.min){ km+=1; min+=s.min; } }
  return {km,min,hm}; }
function hyTotal(sets){ return sets.reduce((q,s)=>q+(s.min||0),0); }
function hyComplete(sets){ for(let i=0;i<16;i++) if(!sets.some(s=>s.seg===i&&s.min)) return false; return true; }
function wsIn(a,b){ return S.workouts.filter(w=>w.date>=a&&w.date<=b); }
function sortedWorkouts(){ return [...S.workouts].sort((a,b)=>(b.date+String(b.start||0).padStart(15,'0')).localeCompare(a.date+String(a.start||0).padStart(15,'0'))); }
function lastSession(ex,excludeId){
  let best=null; for(const w of S.workouts){ if(w.id===excludeId) continue; for(const e of w.ex) if(e.ex===ex&&e.sets.length&&(!best||w.date>best.date||(w.date===best.date&&(w.start||0)>(best.start||0)))) best={date:w.date,start:w.start,sets:e.sets}; }
  return best;
}

/* ---- Progressions-Vorschlag ---- */
function suggestFor(ex,target){
  const last=lastSession(ex); if(!last) return null;
  const t=exType(ex), x=EX.get(ex)||{}; const ws=last.sets.filter(s=>s.kind!=='w');
  if(!ws.length) return null;
  const rp=ws.filter(s=>s.rpe); const avgRpe=rp.length?rp.reduce((q,s)=>q+s.rpe,0)/rp.length:null;
  const tr=parseInt(target)||null;
  if(t==='kraft'||(t==='body'&&ws.some(s=>s.w))){
    const W=Math.max(...ws.map(s=>s.w||0)); if(!W) return null;
    const atW=ws.filter(s=>(s.w||0)===W); const minR=Math.min(...atW.map(s=>s.r||0)); const goalR=tr||Math.max(...atW.map(s=>s.r||0));
    if(minR>=goalR&&(avgRpe==null||avgRpe<=9)){
      const inc=['Kurzhantel','Kettlebell'].includes(x.eq)?2:W<20?1:2.5;
      return {w:Math.round((W+inc)*100)/100,r:goalR,txt:`Alle Sätze mit ${fmt(W,1)} kg × ${goalR} geschafft${avgRpe?` (Ø RPE ${fmt(avgRpe,1)})`:''} → heute <b>${fmt(W+inc,1)} kg × ${goalR}</b>`};
    }
    return {w:W,r:Math.min(goalR,minR+1),txt:`Gewicht halten: <b>${fmt(W,1)} kg</b>, Ziel <b>${Math.min(goalR,minR+1)} Wdh</b> in jedem Satz`};
  }
  if(t==='body'){ const maxR=Math.max(...ws.map(s=>s.r||0)); if(!maxR) return null;
    if(maxR>=15) return {w:2.5,r:Math.max(6,maxR-6),txt:`${maxR} Wdh geschafft → mit <b>+2,5 kg</b> Zusatzgewicht probieren`};
    return {r:maxR+1,txt:`Letztes Mal max. ${maxR} Wdh → heute <b>${maxR+1} Wdh</b>`}; }
  if(t==='zeit'){ const m=Math.max(...ws.map(s=>s.sec||0)); if(!m) return null; return {sec:m+5,txt:`Letztes Mal ${m} s → heute <b>${m+5} s</b>`}; }
  return null;
}

/* ---- Übungs-Statistik ---- */
function exHistory(id,from='0000',to='9999'){
  const out=[];
  for(const w of S.workouts){ if(w.date<from||w.date>to) continue; for(const e of w.ex) if(e.ex===id){ const sets=e.sets.filter(s=>s.kind!=='w'); if(sets.length) out.push({w,date:w.date,sets}); } }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function exStats(id,from){
  const t=exType(id), H=exHistory(id,from);
  const st={t,sessions:H.length,sets:0,reps:0,vol:0,maxW:0,maxWdate:null,maxR:0,maxRdate:null,bestSetVol:0,bestSetVolTxt:'',bestSessVol:0,bestSessDate:null,e1:0,e1date:null,
    maxSec:0,totSec:0,km:0,min:0,hm:0,maxKm:0,maxKmDate:null,bestPace:0,bestPaceDate:null,maxHm:0,maxM:0,rpeN:0,rpeSum:0,last:H.length?H[H.length-1].date:null,first:H.length?H[0].date:null,series:[],
    hyBest:null,hyBestDate:null,hySeg:[]};
  for(const h of H){
    let sv=0,sMaxW=0,sE1=0,sKm=0,sMin=0,sMaxR=0,sSec=0,sRpe=0,sRpeN=0;
    if(t==='hyrox'){ const full=hyComplete(h.sets); const tot=hyTotal(h.sets); if(full&&tot&&(!st.hyBest||tot<st.hyBest)){st.hyBest=tot;st.hyBestDate=h.date;}
      for(const s of h.sets) if(s.min&&(!st.hySeg[s.seg]||s.min<st.hySeg[s.seg])) st.hySeg[s.seg]=s.min;
      const runs=h.sets.filter(s=>isHyRun(s.seg)&&s.min); st.series.push({x:h.date,total:full?tot:null,run:runs.length?runs.reduce((q,s)=>q+s.min,0)/runs.length:null}); continue; }
    for(const s of h.sets){
      st.sets++;
      const v=setVol(s,t); sv+=v; st.vol+=v; st.reps+=s.r||0;
      if((s.w||0)>st.maxW){st.maxW=s.w;st.maxWdate=h.date;}
      if((s.r||0)>st.maxR){st.maxR=s.r;st.maxRdate=h.date;}
      if(v>st.bestSetVol){st.bestSetVol=v;st.bestSetVolTxt=(s.w?fmt(s.w,1)+' kg × ':'')+(s.r||0);}
      const e=e1rm(s.w,s.r); if(e>st.e1){st.e1=e;st.e1date=h.date;} sE1=Math.max(sE1,e);
      sMaxW=Math.max(sMaxW,s.w||0); sMaxR=Math.max(sMaxR,s.r||0);
      if(s.rpe){ st.rpeN++; st.rpeSum+=s.rpe; sRpe+=s.rpe; sRpeN++; }
      if(s.sec){ st.totSec+=s.sec; if(s.sec>st.maxSec) st.maxSec=s.sec; sSec=Math.max(sSec,s.sec); }
      if(s.km){ st.km+=s.km; sKm+=s.km; } if(s.min){ st.min+=s.min; sMin+=s.min; } if(s.hm){ st.hm+=s.hm; st.maxHm=Math.max(st.maxHm,s.hm); }
      if(s.m) st.maxM=Math.max(st.maxM,s.m);
      if(s.km>=1&&s.min){ const p=s.min/s.km; if(!st.bestPace||p<st.bestPace){st.bestPace=p;st.bestPaceDate=h.date;} }
    }
    if(sv>st.bestSessVol){st.bestSessVol=sv;st.bestSessDate=h.date;}
    if(sKm>st.maxKm){st.maxKm=sKm;st.maxKmDate=h.date;}
    st.series.push({x:h.date,vol:sv,maxW:sMaxW,e1:sE1,maxR:sMaxR,km:sKm,pace:sKm?sMin/sKm:null,min:sMin,sec:sSec,rpe:sRpeN?sRpe/sRpeN:null});
  }
  return st;
}
/* Rekorde, die in einem Workout aufgestellt wurden */
function prsOf(w){
  const out=[];
  const before=o=>o.id!==w.id&&(o.date<w.date||(o.date===w.date&&(o.start||0)<(w.start||0)));
  for(const e of w.ex){
    const t=exType(e.ex); const sets=e.sets.filter(s=>s.kind!=='w'); if(!sets.length) continue;
    const prevW=S.workouts.filter(o=>before(o)&&o.ex.some(x=>x.ex===e.ex)); if(!prevW.length) continue;
    const n=exName(e.ex);
    if(t==='hyrox'){ if(!hyComplete(sets)) continue; const tot=hyTotal(sets); const pb=Math.min(...prevW.map(o=>o.ex.find(x=>x.ex===e.ex).sets).filter(hyComplete).map(hyTotal)); if(tot&&isFinite(pb)&&tot<pb) out.push(`${n}: Neue Bestzeit ${minFmt(tot)}`); continue; }
    const prev={maxW:0,e1:0,maxR:0,km:0,pace:0,sec:0};
    for(const o of prevW) for(const oe of o.ex) if(oe.ex===e.ex) for(const s of oe.sets){ if(s.kind==='w') continue;
        prev.maxW=Math.max(prev.maxW,s.w||0); prev.e1=Math.max(prev.e1,e1rm(s.w,s.r)); prev.maxR=Math.max(prev.maxR,s.r||0); prev.km=Math.max(prev.km,s.km||0); prev.sec=Math.max(prev.sec,s.sec||0);
        if(s.km>=1&&s.min){ const p=s.min/s.km; if(!prev.pace||p<prev.pace) prev.pace=p; } }
    const cur={maxW:0,e1:0,maxR:0,km:0,pace:0,sec:0};
    for(const s of sets){ cur.maxW=Math.max(cur.maxW,s.w||0); cur.e1=Math.max(cur.e1,e1rm(s.w,s.r)); cur.maxR=Math.max(cur.maxR,s.r||0); cur.km=Math.max(cur.km,s.km||0); cur.sec=Math.max(cur.sec,s.sec||0); if(s.km>=1&&s.min){const p=s.min/s.km; if(!cur.pace||p<cur.pace) cur.pace=p;} }
    if(t==='kraft'||t==='carry'){ if(cur.maxW>prev.maxW) out.push(`${n}: Bestes Gewicht ${fmt(cur.maxW,1)} kg`); else if(cur.e1>prev.e1+0.01) out.push(`${n}: Geschätztes 1RM ${fmt(cur.e1,1)} kg`); }
    if(t==='body'&&cur.maxR>prev.maxR) out.push(`${n}: Meiste Wdh. ${cur.maxR}`);
    if(t==='body'&&cur.maxW>prev.maxW&&prev.maxW>0) out.push(`${n}: Zusatzgewicht ${fmt(cur.maxW,1)} kg`);
    if(t==='zeit'&&cur.sec>prev.sec) out.push(`${n}: Längste Zeit ${secFmt(cur.sec)}`);
    if((t==='lauf'||t==='cardio')&&cur.km>prev.km) out.push(`${n}: Längste Distanz ${fmt(cur.km,2)} km`);
    if(t==='lauf'&&cur.pace&&prev.pace&&cur.pace<prev.pace) out.push(`${n}: Schnellste Pace ${paceFmt(cur.pace)}`);
  }
  return out;
}

/* ---- Laufen: Bestzeiten & Prognose ---- */
const DISTS=[[5,'5 km'],[10,'10 km'],[21.0975,'Halbmarathon'],[42.195,'Marathon']];
function runEfforts(from='0000'){
  const out=[];
  for(const w of S.workouts){ if(w.date<from) continue; for(const e of w.ex) if(exType(e.ex)==='lauf'&&e.ex!=='c_walk') for(const s of e.sets) if(s.km>=1&&s.min) out.push({date:w.date,km:s.km,min:s.min,src:exName(e.ex)}); }
  for(const r of S.events) if(r.date>=from&&r.km&&r.result) out.push({date:r.date,km:r.km,min:r.result,src:r.name||'Wettkampf',race:true});
  return out;
}
function bestTimes(){
  const ef=runEfforts();
  return DISTS.map(([D,l])=>{ let best=null;
    for(const e of ef){ if(e.km<D*0.99||e.km>D*1.15) continue; const t=e.min*D/e.km; if(!best||t<best.t) best={t,date:e.date,src:e.src,race:e.race,exact:Math.abs(e.km-D)<D*0.02}; }
    return {D,l,best}; });
}
function predict(){
  const ef=runEfforts(addDays(today(),-120)).filter(e=>e.km>=3);
  return DISTS.map(([D,l])=>{ let best=null;
    for(const e of ef){ const t=e.min*Math.pow(D/e.km,1.06); if(!best||t<best.t) best={t,base:e}; }
    return {D,l,p:best}; });
}

function muscleSets(from,to='9999'){
  const m={}; MUS.forEach(k=>m[k]=0);
  for(const w of wsIn(from,to)) for(const e of w.ex){ const x=EX.get(e.ex); if(!x) continue; const n=x.t==='hyrox'?2:e.sets.filter(s=>s.kind!=='w').length; if(!n) continue;
    x.p.forEach(k=>m[k]+=n); x.s.forEach(k=>m[k]+=n*0.5); }
  return m;
}

function plannedIn(plan,a,b){ let n=0; for(let d=a; d<=b; d=addDays(d,1)) if(plan.days.includes(wdIdx(d))) n++; return n; }

function adherence(a,b){

function trainingWeek(){
  const p=S.profile;
  if(p.trainSrc==='ist'){
    const a=addDays(today(),-27), ws=wsIn(a,today()); let kraftMin=0,runKm=0,cardioMin=0;
    for(const w of ws){ const r=wRun(w); runKm+=r.km; const hasK=w.ex.some(e=>['kraft','body','carry','zeit'].includes(exType(e.ex)));
      let cMin=0; for(const e of w.ex) if(exType(e.ex)==='cardio') for(const s of e.sets) cMin+=s.min||0;
      cardioMin+=cMin; if(hasK) kraftMin+=Math.max(0,(w.dur||0)-r.min-cMin); }
    return {kraftH:kraftMin/60/4, runKm:runKm/4, cardioH:cardioMin/60/4, src:'Ø deiner Workouts der letzten 4 Wochen'};
  }
  if(p.trainSrc==='plaene'){
    let kraftH=0,runKm=0,cardioH=0;
    for(const pl of S.plans){ const n=pl.days.length; if(!n) continue; let k=false;
      for(const it of pl.items){ const t=exType(it.ex), v=num(String(it.reps||'').match(/[\d.,]+/)?.[0]);
        if(t==='lauf') runKm+=n*(v||8)*(it.sets||1);
        else if(t==='cardio') cardioH+=n*(v||45)/60*(it.sets||1);
        else if(t==='hyrox'){ runKm+=n*8; kraftH+=n*0.6; }
        else k=true; }
      if(k) kraftH+=n*p.kraftMin/60; }
    return {kraftH,runKm,cardioH,src:'aus deinen Trainingsplänen'};
  }
  return {kraftH:p.kraftPerWeek*p.kraftMin/60, runKm:p.runKm, cardioH:p.cardioMin/60, src:'manuelle Eingabe'};
}
function needs(){
  const p=S.profile, w=bw()||p.weight;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const base=bmr*p.pal;
  const tw=trainingWeek();
  const kWeek=(5-1)*w*tw.kraftH + 1.0*w*tw.runKm + (7-1)*w*tw.cardioH;
  const tDay=kWeek/7, tdee=base+tDay;
  const adj = p.goal==='ab'? -p.rate*7700/7 : p.goal==='auf'? p.rate*7700/7 : 0;
  const kcal=Math.round((tdee+adj)/10)*10;
  const prot=Math.round(p.protPerKg*w);
  const fat=Math.round(kcal*p.fatPct/100/9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const fib=Math.round(kcal/1000*14);
  const sug=Math.round(kcal*0.1/4);
  const water=Math.round((w*35 + (tw.kraftH+tw.cardioH+tw.runKm*6/60)*700/7)/50)*50;
  return {w,bmr:Math.round(bmr),base:Math.round(base),kWeek:Math.round(kWeek),tDay:Math.round(tDay),tdee:Math.round(tdee),adj:Math.round(adj),kcal,p:prot,c:carb,f:fat,fib,sug,salt:6,water,tw};
}

function download(name,text,type='text/plain'){
  const blob=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function csv(rows){ const c=v=>{ if(v==null) return ''; if(typeof v==='number') return String(v).replace('.',','); const s=String(v); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  return '﻿'+rows.map(r=>r.map(c).join(';')).join('\r\n'); }
async function doExport(kind){
  const d=today();
  if(kind==='json'||kind==='jsonp'){
    const out={app:'Formkurve',exported:new Date().toISOString(),data:S};
    if(kind==='jsonp') out.photos=await photoAll();
    download(`formkurve-backup-${d}.json`,JSON.stringify(out),'application/json'); return;
  }
  if(kind==='sets'){
    const rows=[['Datum','Workout','Plan','Übung','Kategorie','Typ','Satz','Aufwärmsatz','kg','Wdh','RPE','Sekunden','km','Minuten','Höhenmeter','Puls','Meter','Hyrox-Abschnitt','Volumen (kg)','e1RM (kg)']];
    for(const w of sortedWorkouts().reverse()){ const pl=S.plans.find(p=>p.id===w.planId);
      for(const e of w.ex){ const x=EX.get(e.ex)||{}; const t=exType(e.ex); e.sets.forEach((s,i)=>rows.push([w.date,w.name,pl?pl.name:'',exName(e.ex),x.cat||'',t,i+1,s.kind==='w'?'ja':'',s.w,s.r,s.rpe,s.sec,s.km,s.min!=null?r1(s.min*100)/100:null,s.hm,s.hr,s.m,s.seg!=null?HY_SEG[s.seg]:'',r1(setVol(s,t)),s.w&&s.r?r1(e1rm(s.w,s.r)):null])); } }
    download(`formkurve-saetze-${d}.csv`,csv(rows),'text/csv'); return;
  }
  if(kind==='ws'){
    const rows=[['Datum','Workout','Plan','Dauer (min)','Übungen','Sätze','Volumen (kg)','Lauf km','Lauf min','Höhenmeter','Rekorde','Notiz']];
    for(const w of sortedWorkouts().reverse()){ const pl=S.plans.find(p=>p.id===w.planId); const r=wRun(w); rows.push([w.date,w.name,pl?pl.name:'',w.dur,w.ex.length,wSets(w),Math.round(wVolume(w)),r1(r.km),r1(r.min),r.hm,(w.prs||[]).join(' | '),w.note||'']); }
    download(`formkurve-workouts-${d}.csv`,csv(rows),'text/csv'); return;
  }
  if(kind==='food'){
    const rows=[['Datum','Mahlzeit','Lebensmittel','Marke','Menge (g)','kcal','Protein','KH','Fett','Ballaststoffe','Zucker','Salz']];
    for(const k of Object.keys(S.diary).sort()){ for(const e of S.diary[k].entries) rows.push([k,MEALS[e.meal]||e.meal,e.name,e.brand||'',e.g,r1(e.n.kcal),r1(e.n.p),r1(e.n.c),r1(e.n.f),r1(e.n.fib),r1(e.n.sug),r1(e.n.salt)]);
      if(S.diary[k].water) rows.push([k,'Wasser','Wasser','',S.diary[k].water,0,0,0,0,0,0,0]); }
    download(`formkurve-ernaehrung-${d}.csv`,csv(rows),'text/csv'); return;
  }
  if(kind==='meas'){
    const rows=[['Datum',...MEAS.map(m=>m[1]+' ('+m[2]+')'),'Notiz']];
    for(const m of [...S.measures].sort((a,b)=>a.date.localeCompare(b.date))) rows.push([m.date,...MEAS.map(x=>m[x[0]]),m.note||'']);
    download(`formkurve-messungen-${d}.csv`,csv(rows),'text/csv'); return;
  }
  if(kind==='hab'){
    const ids=[...new Set([...S.routines.map(r=>r.id),...Object.values(S.habits).flatMap(h=>Object.keys(h))])];
    const nm=id=>(S.routines.find(r=>r.id===id)||{name:id}).name;
    const rows=[['Datum',...ids.map(nm)]];
    for(const k of Object.keys(S.habits).sort()) rows.push([k,...ids.map(id=>S.habits[k][id]?1:0)]);
    download(`formkurve-routinen-${d}.csv`,csv(rows),'text/csv'); return;
  }
  if(kind==='ev'){
    const rows=[['Datum','Name','Art','km','Zielzeit','Ergebnis','Pace']];
    for(const e of [...S.events].sort((a,b)=>a.date.localeCompare(b.date))) rows.push([e.date,e.name,evType(e.type)[1],e.km||'',e.goal?minFmt(e.goal):'',e.result?minFmt(e.result):'',e.result&&e.km?paceFmt(e.result/e.km):'']);
    download(`formkurve-wettkaempfe-${d}.csv`,csv(rows),'text/csv');
  }
}
async function importBackup(file){
  if(!file) return;
  try{
    const j=JSON.parse(await file.text()); const data=j.data||j;
    if(!data.workouts||!data.plans) throw new Error('Kein Formkurve-Backup');
    if(!await confirmBox(`Backup vom ${j.exported?new Date(j.exported).toLocaleString('de-DE'):'?'} einspielen? Aktuelle Daten werden ersetzt.`,'Einspielen',true)) return;
    S=Object.assign(defaults(),data); const d=defaults(); for(const k of ['profile','track','settings']) S[k]=Object.assign(d[k],S[k]||{}); migrate(data); buildEx();
    if(j.photos){ await photoClear(); for(const p of j.photos) await photoPut(p.id,p.data); }
    save(true); closeAll(); render(); toast('Backup eingespielt');
  }catch(e){ toast('Import fehlgeschlagen: '+e.message,3500); }
}

  const orig=S.plans.find(p=>p.id===id);
  const p=orig?JSON.parse(JSON.stringify(orig)):{id:uid(),name:'',days:[],color:PLAN_COLORS[S.plans.length%PLAN_COLORS.length],items:[]};

     <div class="tiny dim" style="margin:-6px 0 10px">Ziel: Wdh. (z. B. 8 oder 8-10), bei Läufen km („8 km“), bei Cardio Minuten („45 min“) – fließt in den Kalorienbedarf ein.</div>
     <button class="btn block" id="pAdd" style="margin-bottom:16px">${sm(I.plus)} Übungen hinzufügen</button>

     ${orig?'<button class="btn block" id="pDup" style="margin-top:10px">Plan duplizieren</button>':''}`;

    $$('[data-day]',sb).forEach(x=>x.onclick=()=>{ const d=+x.dataset.day; p.days=p.days.includes(d)?p.days.filter(y=>y!==d):[...p.days,d].sort(); draw(); });
    $$('[data-col]',sb).forEach(x=>x.onclick=()=>{p.color=x.dataset.col;draw();});
    $$('[data-isets]',sb).forEach(x=>x.oninput=()=>p.items[+x.dataset.isets].sets=parseInt(x.value)||0);
    $$('[data-ireps]',sb).forEach(x=>x.oninput=()=>p.items[+x.dataset.ireps].reps=x.value);
    $$('[data-up]',sb).forEach(x=>x.onclick=()=>{const i=+x.dataset.up; if(i>0){[p.items[i-1],p.items[i]]=[p.items[i],p.items[i-1]];draw();}});
    $$('[data-dn]',sb).forEach(x=>x.onclick=()=>{const i=+x.dataset.dn; if(i<p.items.length-1){[p.items[i+1],p.items[i]]=[p.items[i],p.items[i+1]];draw();}});
    $$('[data-rm]',sb).forEach(x=>x.onclick=()=>{p.items.splice(+x.dataset.rm,1);draw();});

    const dup=$('#pDup',sb); if(dup) dup.onclick=()=>{ S.plans.push({...JSON.parse(JSON.stringify(orig)),id:uid(),name:orig.name+' (Kopie)',days:[]}); save(); closeSheet(); render(); toast('Plan dupliziert'); };
  };
  draw();
}

/* ---------- Übungsbibliothek ---------- */
function filterEx(q,mus,cat){
  const words=q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  let list=[...EX.values()];
  if(mus) list=list.filter(e=>e.p.includes(mus));
  if(cat) list=list.filter(e=>cat==='Eigene'?e.custom:e.cat===cat);
  if(words.length) list=list.filter(e=>{ const h=(e.name+' '+e.en+' '+e.cat+' '+e.eq+' '+e.p.map(m=>MUS_DE[m]).join(' ')).toLowerCase(); return words.every(w=>h.includes(w)); });
  const used=new Map(); for(const w of S.workouts) for(const e of w.ex) used.set(e.ex,(used.get(e.ex)||0)+1);
  const rank=e=>(used.get(e.id)||0)*100+(e.custom?50:0)+(e.de?20:0)+(e.id.startsWith('c_')?25:0);
  return list.sort((a,b)=>rank(b)-rank(a)||a.name.localeCompare(b.name,'de'));
}
function exThumb(e,size){
  const st=size?`style="width:${size}px;height:${size}px"`:'';
  if(e.photo) return `<div class="thumb" ${st}><img src="${e.photo}" alt=""></div>`;
  if(e.img) return `<div class="thumb" ${st}><img loading="lazy" src="${IMG}${encodeURIComponent(e.imgId||e.id)}/0.jpg" alt="" onerror="this.parentElement.remove()"></div>`;
  return '';
}
function exRow(e,extra=''){
  return `<button class="item" data-ex="${esc(e.id)}">${exThumb(e)}<div class="grow"><div style="font-weight:700">${esc(e.name)}</div><div class="small mute">${e.p.map(m=>MUS_DE[m]).join(', ')||e.cat} · ${esc(e.eq)}</div></div>${extra}</button>`;
}
function exFilterBar(){
  return `<input id="exQ" placeholder="🔎 Suchen (deutsch oder englisch) …" value="${esc(ui.exQ)}" style="margin-bottom:8px;background:var(--card)">
   <div class="chips" style="margin-bottom:6px">${['',...CATS].map(c=>`<button class="chip ${ui.exCat===c?'on':''}" data-cat="${c}">${c||'Alle'}</button>`).join('')}</div>
   <div class="chips" style="margin-bottom:10px">${['',...MUS].map(m=>`<button class="chip ${ui.exMus===m?'on':''}" data-mus="${m}">${m?MUS_DE[m]:'Alle Muskeln'}</button>`).join('')}</div>`;
}
function bindExFilter(root,redraw){
  const q=$('#exQ',root); q.oninput=()=>{ ui.exQ=q.value; ui.exLimit=60; redraw(true); };
  $$('[data-cat]',root).forEach(b=>b.onclick=()=>{ui.exCat=b.dataset.cat;ui.exLimit=60;redraw();});
  $$('[data-mus]',root).forEach(b=>b.onclick=()=>{ui.exMus=b.dataset.mus;ui.exLimit=60;redraw();});
}
function renderExLib(b){
  b.innerHTML=`<button class="btn block" id="newEx" style="margin-bottom:10px">${sm(I.plus)} Eigene Übung anlegen</button>${exFilterBar()}<div id="exList" class="card list" style="padding:4px 12px"></div>`;
  const drawList=()=>{
    const list=filterEx(ui.exQ,ui.exMus,ui.exCat);
    $('#exList',b).innerHTML=`<div class="small mute" style="padding:8px 0">${list.length} Übungen</div>`+list.slice(0,ui.exLimit).map(e=>exRow(e)).join('')+(list.length>ui.exLimit?`<button class="item" id="exMore" style="justify-content:center;color:var(--accDeep);font-weight:800">Mehr anzeigen</button>`:'');
    $$('[data-ex]',b).forEach(x=>x.onclick=()=>openExercise(x.dataset.ex));
    const m=$('#exMore',b); if(m) m.onclick=()=>{ui.exLimit+=100;drawList();};
  };
  const redraw=(listOnly)=>{ if(listOnly) return drawList(); renderExLib(b); };
  bindExFilter(b,redraw); drawList();
  $('#newEx',b).onclick=()=>editCustomEx(null);
}
function pickExercises(cb,single){
  const sel=[];
  const sb=openSheet(single?'Übung wählen':'Übungen hinzufügen','',{right:single?'':`<button class="btn pri sm" id="pkOk">Hinzufügen</button>`});
  const sheetEl=sb.parentElement;
  const drawList=()=>{
    const list=filterEx(ui.exQ,ui.exMus,ui.exCat);
    $('#pkList',sb).innerHTML=`<button class="item" id="pkNew" style="color:var(--accDeep);font-weight:800">${sm(I.plus,20)} Eigene Übung anlegen</button>`+list.slice(0,ui.exLimit).map(e=>exRow(e,sel.includes(e.id)?`<span class="chk on">${I.check}</span>`:'')).join('')+(list.length>ui.exLimit?`<button class="item" id="pkMore" style="justify-content:center;color:var(--accDeep);font-weight:800">Mehr anzeigen</button>`:'');
    $$('[data-ex]',sb).forEach(x=>x.onclick=()=>{ const id=x.dataset.ex; if(single){ closeSheet(); cb([id]); return; } const i=sel.indexOf(id); i>=0?sel.splice(i,1):sel.push(id); drawList(); const ok=$('#pkOk',sheetEl); if(ok) ok.textContent=sel.length?`Hinzufügen (${sel.length})`:'Hinzufügen'; });
    const m=$('#pkMore',sb); if(m) m.onclick=()=>{ui.exLimit+=100;drawList();};
    $('#pkNew',sb).onclick=()=>editCustomEx(null,id=>{ if(single){ closeSheet(); cb([id]); } else { sel.push(id); drawList(); } });
  };
  const full=()=>{ sb.innerHTML=`${exFilterBar()}<div id="pkList" class="list"></div>`; bindExFilter(sb,redraw); drawList(); };
  const redraw=(listOnly)=>listOnly?drawList():full();
  full();
  const ok=$('#pkOk',sheetEl); if(ok) ok.onclick=()=>{ if(!sel.length){toast('Keine Übung gewählt');return;} closeSheet(); cb(sel); };
}

     <div class="field"><label>Name</label><input id="cN" value="${esc(e.name)}" placeholder="z. B. Treppenläufe"></div>

     <div class="field"><label>Hauptmuskeln</label><div class="chips" style="flex-wrap:wrap">${MUS.map(m=>`<button class="chip ${e.p.includes(m)?'on':''}" data-p="${m}">${MUS_DE[m]}</button>`).join('')}</div></div>
     <div class="field"><label>Hilfsmuskeln</label><div class="chips" style="flex-wrap:wrap">${MUS.map(m=>`<button class="chip ${e.s.includes(m)?'on':''}" data-s="${m}">${MUS_DE[m]}</button>`).join('')}</div></div>

    const px=$('#cPhX',sb); if(px) px.onclick=()=>{e.photo=null;draw();};
    $$('[data-p]',sb).forEach(b=>b.onclick=()=>{ const m=b.dataset.p; e.p=e.p.includes(m)?e.p.filter(x=>x!==m):[...e.p,m]; e.s=e.s.filter(x=>x!==m); draw(); });
    $$('[data-s]',sb).forEach(b=>b.onclick=()=>{ const m=b.dataset.s; e.s=e.s.includes(m)?e.s.filter(x=>x!==m):[...e.s,m]; e.p=e.p.filter(x=>x!==m); draw(); });

/* ---------- Übungsdetail mit Statistik ---------- */
function openExercise(id,tab){
  const e=EX.get(id); if(!e) return;
  let cur=tab||(exHistory(id).length?'stats':'info'), rng='all', metric=null;
  const sb=openSheet(e.name,'');
  const draw=()=>{
    const st=exStats(id,rangeStart(rng)); const t=e.t;
    const imgs=e.photo?`<img src="${e.photo}" style="width:100%;border-radius:18px;margin-bottom:12px">`:
      e.img?`<div class="exImg">${[0,1].slice(0,Math.min(2,e.img)).map(i=>`<div><img src="${IMG}${encodeURIComponent(e.imgId||e.id)}/${i}.jpg" alt="" loading="lazy" onerror="this.parentElement.remove()"><div class="tiny mute" style="text-align:center;margin-top:3px">${i?'② Endposition':'① Startposition'}</div></div>`).join('')}</div>`
      :'';
    let body='';
    if(cur==='info'){
      body=`${imgs}<div class="row wrap" style="gap:6px;margin-bottom:10px"><span class="badge acc">${esc(e.cat)}</span><span class="badge">${esc(e.eq)}</span><span class="badge">${TYPE_DE[t]}</span>${e.custom?'<span class="badge">eigene</span>':''}</div>
       ${t==='hyrox'?`<div class="card"><h3>Abschnitte</h3>${HY_SEG.map((s,i)=>`<div class="kv small"><span style="color:${isHyRun(i)?'var(--blue)':'inherit'}">${s}</span></div>`).join('')}</div>`:''}
       ${musMini(e)}
       ${e.ins?`<div class="card"><h3>Anleitung${e.en&&!e.custom&&!e.id.startsWith('c_')?' <span class="mute" style="text-transform:none;letter-spacing:0">(Englisch, Originalquelle)</span>':''}</h3><ol style="margin:0;padding-left:18px;line-height:1.5">${e.ins.split('\n').map(s=>`<li style="margin-bottom:6px">${esc(s)}</li>`).join('')}</ol></div>`:''}
       ${e.en&&e.de?`<div class="small dim">Englisch: ${esc(e.en)}</div>`:''}
       ${e.custom?'<button class="btn block" id="exEdit" style="margin-top:10px">Bearbeiten</button>':''}`;
    } else if(cur==='stats'){
      const k=(v,l,sub)=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}${sub?` <span class="dim">· ${sub}</span>`:''}</div></div>`;
      let grid='', mets=[];
      if(t==='kraft'||t==='body'||t==='carry'){
        grid=k(fmt(st.maxW,1)+' kg',t==='body'?'Bestes Zusatzgew.':'Bestes Gewicht',st.maxWdate?dLabel(st.maxWdate):'')+k(st.maxR||'–','Meiste Wdh. (Satz)',st.maxRdate?dLabel(st.maxRdate):'')
          +k(fmt(st.e1,1)+' kg','Geschätztes 1RM',st.e1date?dLabel(st.e1date):'')+k(fmtK(Math.round(st.bestSetVol))+' kg','Bestes Satzvolumen',esc(st.bestSetVolTxt))
          +k(fmtK(Math.round(st.bestSessVol))+' kg','Bestes Einheitsvolumen',st.bestSessDate?dLabel(st.bestSessDate):'')+k(fmtK(Math.round(st.vol))+' kg','Gesamtvolumen')
          +k(fmt(st.reps),'Wdh. gesamt')+k(st.sets,'Sätze')+k(st.sessions,'Einheiten')
          +(st.sessions?k(fmt(st.vol/st.sessions),'Ø Volumen / Einheit')+k(fmt(st.sets/st.sessions,1),'Ø Sätze / Einheit'):'')
          +(st.rpeN?k(fmt(st.rpeSum/st.rpeN,1),'Ø RPE'):'')+(t==='carry'?k(fmt(st.maxM)+' m','Weiteste Strecke'):'');
        mets=[['maxW','Max. Gewicht'],['e1','1RM'],['vol','Volumen'],['maxR','Max. Wdh.'],['rpe','Ø RPE']];
      } else if(t==='zeit'){
        grid=k(secFmt(st.maxSec),'Längste Zeit')+k(secFmt(st.totSec),'Gesamtzeit')+k(st.sets,'Sätze')+k(st.sessions,'Einheiten')+(st.maxW?k(fmt(st.maxW,1)+' kg','Max. Zusatzgewicht'):'');
        mets=[['sec','Längste Zeit']];
      } else if(t==='hyrox'){
        grid=k(st.hyBest?minFmt(st.hyBest):'–','Beste Gesamtzeit',st.hyBestDate?dLabel(st.hyBestDate):'')+k(st.sessions,'Simulationen');
        mets=[['total','Gesamtzeit'],['run','Ø Laufsplit']];
      } else {
        grid=k(fmt(st.km,1)+' km','Distanz gesamt')+k(fmt(st.maxKm,2)+' km','Längste Einheit',st.maxKmDate?dLabel(st.maxKmDate):'')+k(paceFmt(st.km?st.min/st.km:0),'Ø Pace')
          +k(paceFmt(st.bestPace),'Schnellste Pace (≥1 km)',st.bestPaceDate?dLabel(st.bestPaceDate):'')+k(durFmt(st.min),'Zeit gesamt')+k(st.sessions,'Einheiten')
          +(t==='lauf'?k(fmt(st.hm)+' m','Höhenmeter gesamt')+k(fmt(st.maxHm)+' m','Meiste Hm (Einheit)'):'');
        mets=[['km','Distanz'],['pace','Pace'],['min','Dauer']];
      }
      metric=metric&&mets.some(m=>m[0]===metric)?metric:mets[0][0];
      const yfmt = metric==='pace'?(v=>paceFmt(v).replace(' /km','')):metric==='sec'?(v=>Math.round(v)+'s'):['total','run','min'].includes(metric)&&t!=='lauf'&&t!=='cardio'?(v=>minFmt(v)):null;
      body=`${chips('exR',RANGES.map(r=>[r[0],r[2]]),rng)}<div class="grid2" style="margin:12px 0">${grid}</div>
        ${t==='hyrox'&&st.hySeg.length?`<div class="card"><h3>Beste Splits</h3>${HY_SEG.map((s,i)=>st.hySeg[i]?`<div class="kv small"><span style="color:${isHyRun(i)?'var(--blue)':'inherit'}">${s}</span><b>${minFmt(st.hySeg[i])}</b></div>`:'').join('')}</div>`:''}
        <div class="card"><h3>Verlauf</h3>${chips('exM',mets,metric)}<div style="margin-top:8px">${lineChart(st.series.map(s=>({x:s.x,y:s[metric]||null})),{yfmt})}</div></div>
        ${st.last?`<div class="small mute">Erste Einheit ${dLabel(st.first)} · letzte ${dLabel(st.last)}</div>`:''}`;
    } else {
      const H=exHistory(id).reverse();
      body=H.length?H.map(h=>`<div class="card"><h3>${dLabel(h.date,true)} <span class="mute" style="text-transform:none;letter-spacing:0">${esc(h.w.name)}</span></h3>${t==='hyrox'?`<div class="kv"><b>Gesamt</b><b>${minFmt(hyTotal(h.sets))}</b></div>`:''}${h.sets.map((s,i)=>`<div class="kv"><span class="mute">${t==='hyrox'?HY_SEG[s.seg]:'Satz '+(i+1)}</span><b>${setTxt(s,t)}</b></div>`).join('')}</div>`).join(''):'<div class="empty">Noch nie trainiert.</div>';
    }
    sb.innerHTML=seg('exT',[['info','Info'],['stats','Statistik'],['hist','Verlauf']],cur)+body;
    bindSeg(sb,'exT',v=>{cur=v;draw();}); bindSeg(sb,'exR',v=>{rng=v;draw();}); bindSeg(sb,'exM',v=>{metric=v;draw();});
    const ed=$('#exEdit',sb); if(ed) ed.onclick=()=>editCustomEx(id);
  };
  draw();
}
function setTxt(s,t){
  const rpe=s.rpe?` · RPE ${fmt(s.rpe,1).replace(',0','')}`:'';
  if(t==='kraft') return `${fmt(s.w,1)} kg × ${s.r||0}${rpe}`;
  if(t==='body') return (s.w?`+${fmt(s.w,1)} kg × `:'')+`${s.r||0} Wdh${rpe}`;
  if(t==='zeit') return secFmt(s.sec)+(s.w?` · ${fmt(s.w,1)} kg`:'')+rpe;
  if(t==='carry') return `${fmt(s.w,1)} kg · ${fmt(s.m)} m`+(s.sec?` · ${secFmt(s.sec)}`:'')+rpe;
  if(t==='hyrox') return minFmt(s.min);
  const p=s.km&&s.min?' · '+paceFmt(s.min/s.km):'';
  return `${fmt(s.km,2)} km · ${minFmt(s.min)}${p}`+(s.hm?` · ${s.hm} Hm`:'')+(s.hr?` · ♥ ${s.hr}`:'');
}

/* ---------- Verlauf ---------- */
function renderHistory(b){
