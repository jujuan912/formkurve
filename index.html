/* ---------- Aktives Workout ---------- */
function newSet(){ return {done:false}; }
function newExEntry(ex,n,target){ const t=exType(ex); if(t==='hyrox') return {ex,note:'',target:'',sets:HY_SEG.map((_,i)=>({seg:i,done:false}))};
  return {ex,note:'',target:target||'',sets:Array.from({length:Math.max(1,n||(['lauf','cardio'].includes(t)?1:3))},newSet)}; }
async function startWorkout(planId,opt={}){
  if(S.active){ if(!await confirmBox(`Es läuft bereits „${S.active.name}“. Verwerfen und neu starten?`,'Neu starten',true)) return; }
  const plan=S.plans.find(p=>p.id===planId);
  const a={id:uid(),start:Date.now(),date:opt.date||today(),planId:plan?plan.id:null,name:plan?plan.name:(opt.from?opt.from.name:(opt.past?'Nachgetragenes Workout':'Freies Workout')),ex:[],note:'',past:!!opt.past};
  if(opt.from) a.ex=opt.from.ex.map(e=>newExEntry(e.ex,e.sets.length));
  else if(plan) a.ex=plan.items.map(it=>newExEntry(it.ex,it.sets,it.reps));
  S.active=a; save(); closeAll(); openWorkout();
  if(!a.ex.length) setTimeout(()=>addExToActive(),150);
}
let tick=null;
function addExToActive(){ pickExercises(ids=>{ S.active.ex.push(...ids.map(ex=>newExEntry(ex))); save(); drawWorkout(); }); }
function openWorkout(){
  if(!S.active) return;
  const a=S.active;
  openSheet(a.name,'',{full:true,sticky:true,left:`<button class="iconbtn" id="wMin" style="width:38px;height:38px">${sm(I.back,18)}</button>`,right:`<button class="btn pri sm" id="wFin">Beenden</button>`,onClose:()=>{clearInterval(tick);keepAwake(false);render();}});
  const sh=sheets[sheets.length-1].el;
  $('#wMin',sh).onclick=()=>closeSheet();
  $('#wFin',sh).onclick=finishWorkout;
  drawWorkout(); keepAwake(true);
  clearInterval(tick); tick=setInterval(updTimers,1000);
}
function updTimers(){
  const a=S.active; if(!a){clearInterval(tick);return;}
  const el=$('#wElapsed'); if(el&&!a.editId&&!a.past){ const s=Math.floor((Date.now()-a.start)/1000); el.textContent=`${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; }
  const rt=$('#restBox');
  if(a.restEnd){ const left=Math.ceil((a.restEnd-Date.now())/1000);
    if(left<=0){ a.restEnd=null; save(); beep(); toast('Pause vorbei – nächster Satz! 💪'); if(rt) rt.style.display='none'; }
    else if(rt){ rt.style.display='flex'; $('#restT').textContent=`${Math.floor(left/60)}:${pad(left%60)}`; $('#restBar').style.width=(100*left/(a.restDur||S.settings.rest))+'%'; } }
  else if(rt) rt.style.display='none';
}
function colsFor(t){
  const rpe=S.settings.rpe?[['rpe','RPE','decimal']]:[];
  return {kraft:[['w','kg','decimal'],['r','Wdh','numeric'],...rpe],body:[['w','+kg','decimal'],['r','Wdh','numeric'],...rpe],zeit:[['sec','Sek','numeric'],['w','+kg','decimal'],...rpe],
    lauf:[['km','km','decimal'],['min','Zeit','text'],['hm','Hm','numeric'],['hr','Puls','numeric']],cardio:[['km','km','decimal'],['min','Zeit','text'],['hr','Puls','numeric']],
    carry:[['w','kg','decimal'],['m','Meter','numeric'],['sec','Sek','numeric']]}[t];
}
function prevTxt(s,t){ if(!s) return '–'; if(t==='kraft') return `${fmt(s.w,1)}×${s.r||0}`; if(t==='body') return (s.w?`+${fmt(s.w,1)}×`:'')+(s.r||0); if(t==='zeit') return (s.sec||0)+'s'; if(t==='carry') return `${fmt(s.w)}kg·${s.m||0}m`; return '';}
const ph2=v=>v==null?'':String(Math.round(v*100)/100).replace('.',',');
function drawWorkout(){
  const sb=curSheet(); if(!sb||!S.active) return;
  const a=S.active; const scroll=sb.scrollTop;
  const vol=a.ex.reduce((acc,e)=>{const t=exType(e.ex); return acc+e.sets.filter(s=>s.done).reduce((x,s)=>x+setVol(s,t),0);},0);
  const doneSets=a.ex.reduce((acc,e)=>acc+e.sets.filter(s=>s.done).length,0);
  sb.innerHTML=`<div class="grid3" style="margin-bottom:12px"><div class="stat"><div class="v" id="wElapsed">${a.editId||a.past?'—':'0:00:00'}</div><div class="l">${a.editId?'Bearbeiten':a.past?'Nachtrag':'Dauer'}</div></div><div class="stat"><div class="v">${fmtK(Math.round(vol))}</div><div class="l">Volumen kg</div></div><div class="stat"><div class="v">${doneSets}</div><div class="l">Sätze ✓</div></div></div>
   ${a.ex.map((e,ei)=>drawExBlock(a,e,ei)).join('')}
   <button class="btn block" id="wAddEx" style="margin-bottom:10px">${sm(I.plus)} Übung hinzufügen</button>
   <div class="field"><label>Workout-Name</label><input id="wName" value="${esc(a.name)}" style="background:var(--card)"></div>
   <div class="field"><label>Notiz</label><textarea id="wNote" rows="2" placeholder="Wie lief's?" style="background:var(--card)">${esc(a.note||'')}</textarea></div>
   <button class="btn danger block" id="wDiscard">${a.editId?'Bearbeitung verwerfen':'Workout verwerfen'}</button>
   <div class="resttimer" id="restBox" style="display:none"><div class="grow"><div class="small mute">Pause ☕</div><div class="mid" id="restT">0:00</div><div class="bar" style="margin-top:4px"><i id="restBar"></i></div></div><button class="btn sm" data-rest="-15">−15</button><button class="btn sm" data-rest="15">+15</button><button class="btn sm pri" data-rest="0">Skip</button></div>`;
  sb.scrollTop=scroll;
  bindWorkout(sb,a);
  updTimers();
}
function drawExBlock(a,e,ei){

  const head=`<div class="hd">${x.id?exThumb(x,42):''}<button class="nm" data-info="${esc(e.ex)}" style="text-align:left">${esc(x.name)}${e.target?` <span class="small dim" style="font-weight:650">· Ziel ${esc(e.target)}</span>`:''}</button><button class="iconbtn" style="width:34px;height:34px;box-shadow:none;background:var(--card2)" data-exmenu="${ei}">${I.dots}</button></div>`;

      ${e.sets.map((s,si)=>`<div class="hyrow"><span class="lbl ${isHyRun(s.seg)?'run':''}">${HY_SEG[s.seg]}</span><input data-hy="${ei}:${si}" value="${s.min!=null?minFmt(s.min):''}" placeholder="${best[s.seg]?minFmt(best[s.seg]):'mm:ss'}" inputmode="text" style="text-align:center;padding:8px 4px;font-weight:700"><span class="chk ${s.min!=null?'on':''}">${I.check}</span></div>`).join('')}
      <div class="row between" style="margin-top:8px"><span class="small mute">Gesamt${hyComplete(e.sets)?'':' (unvollständig – zählt erst komplett als Bestzeit)'}</span><span class="mid" style="color:var(--orange)" id="hyTot${ei}">${tot?minFmt(tot):'–'}</span></div>
      <div class="tiny dim">Splits als mm:ss eingeben · Platzhalter = deine Bestzeit je Abschnitt</div></div>`;
  }
  const cols=colsFor(t); const prev=last?last.sets.filter(p=>p.kind!=='w'):[]; const showPrev=!['lauf','cardio'].includes(t);
  const lastLine=last?`<div class="lastline">🕑 Letztes Mal <b>${dLabel(last.date)}</b>: ${last.sets.filter(s=>s.kind!=='w').map(s=>setTxt(s,t).replace(/ · RPE.*/,'')).join(' · ')}</div>`:'';
  const sg=a.editId||a.past?null:suggestFor(e.ex,e.target);
  const sugg=sg?`<div class="sugg">💡 <span>${sg.txt}</span><button data-sugg="${ei}">Übernehmen</button></div>`:'';
  let n=0;
  return `<div class="wex">${head}${note}${lastLine}${sugg}
   <table class="sets"><tr><th>Satz</th>${showPrev?'<th>Vorher</th>':''}${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr>
   ${e.sets.map((s,si)=>{ const lab=s.kind==='w'?'W':String(++n); const pv=s.kind==='w'?null:prev[n-1];
     return `<tr class="${s.done?'done':''}"><td><button class="setno ${s.kind==='w'?'w':''}" data-setmenu="${ei}:${si}">${lab}</button></td>${showPrev?`<td class="prev">${prevTxt(pv,t)}</td>`:''}
     ${cols.map(c=>{ const v=s[c[0]]; const val=c[0]==='min'?(v!=null?minFmt(v):''):(v!=null?String(v).replace('.',','):'');
       let ph=c[0]==='min'?'mm:ss':pv&&pv[c[0]]!=null?ph2(pv[c[0]]):'';
       if(!ph&&c[0]==='r'&&e.target&&/^\d+/.test(e.target)) ph=e.target.match(/^\d+/)[0];
       if(c[0]==='rpe'&&!ph) ph='–';
       return `<td><input data-in="${ei}:${si}:${c[0]}" inputmode="${c[2]}" value="${esc(val)}" placeholder="${esc(ph)}"></td>`; }).join('')}
     <td><button class="chk ${s.done?'on':''}" data-chk="${ei}:${si}">${I.check}</button></td></tr>`; }).join('')}</table>
   ${t==='lauf'||t==='cardio'?(()=>{ const km=e.sets.reduce((q,s)=>q+(s.km||0),0), mn=e.sets.reduce((q,s)=>q+(s.min||0),0); return km&&mn?`<div class="small acc" style="margin-top:6px;font-weight:700">Pace ${paceFmt(mn/km)} · ${fmt(km,2)} km in ${minFmt(mn)}</div>`:'<div class="tiny dim" style="margin-top:4px">Zeit als mm:ss oder h:mm:ss eingeben</div>'; })():''}
   ${S.settings.rpe&&cols.some(c=>c[0]==='rpe')?'<div class="tiny dim" style="margin-top:4px">RPE: 10 = Maximum · 9 = 1 Wdh in Reserve · 8 = 2 Wdh in Reserve</div>':''}
   <button class="btn sm block" style="margin-top:8px" data-addset="${ei}">${sm(I.plus)} Satz</button></div>`;
}
function bindWorkout(sb,a){
  $$('[data-in]',sb).forEach(inp=>{ inp.oninput=()=>{ const [ei,si,k]=inp.dataset.in.split(':'); const s=a.ex[+ei].sets[+si]; s[k]=k==='min'?parseMin(inp.value):num(inp.value); if(s[k]==null) delete s[k]; save(); };
    inp.onfocus=()=>inp.select(); });
  $$('[data-hy]',sb).forEach(inp=>{ inp.onchange=()=>{ const [ei,si]=inp.dataset.hy.split(':').map(Number); const s=a.ex[ei].sets[si]; const v=parseMin(inp.value); if(v==null){ delete s.min; s.done=false; } else { s.min=v; s.done=true; } save(); drawWorkout(); }; });
  $$('[data-sugg]',sb).forEach(b=>b.onclick=()=>{ const e=a.ex[+b.dataset.sugg]; const sg=suggestFor(e.ex,e.target); if(!sg) return;
    e.sets.forEach(s=>{ if(s.done||s.kind==='w') return; if(sg.w!=null) s.w=sg.w; if(sg.r!=null) s.r=sg.r; if(sg.sec!=null) s.sec=sg.sec; }); save(); drawWorkout(); toast('Vorschlag eingetragen 👍'); });
  $$('[data-chk]',sb).forEach(b=>b.onclick=()=>{ const [ei,si]=b.dataset.chk.split(':').map(Number); const e=a.ex[ei], s=e.sets[si], t=exType(e.ex);
    if(!s.done){
      const row=b.closest('tr'); $$('input',row).forEach(inp=>{ const k=inp.dataset.in.split(':')[2]; if(s[k]==null&&inp.placeholder&&!['mm:ss','–'].includes(inp.placeholder)&&k!=='rpe'){ s[k]=num(inp.placeholder); } });
      const cols=colsFor(t); if(!cols.some(c=>c[0]!=='rpe'&&s[c[0]]!=null)){ toast('Erst Werte eintragen'); return; }
      s.done=true; if(S.settings.rest>0&&s.kind!=='w'&&!a.editId&&!a.past&&!['lauf','cardio'].includes(t)){ a.restDur=S.settings.rest; a.restEnd=Date.now()+S.settings.rest*1000; }
    } else s.done=false;
    save(); drawWorkout(); });
  $$('[data-addset]',sb).forEach(b=>b.onclick=()=>{ const e=a.ex[+b.dataset.addset]; e.sets.push(newSet()); save(); drawWorkout(); });
  $$('[data-info]',sb).forEach(b=>b.onclick=()=>openExercise(b.dataset.info,'info'));
  $$('[data-setmenu]',sb).forEach(b=>b.onclick=()=>{ const [ei,si]=b.dataset.setmenu.split(':').map(Number); const s=a.ex[ei].sets[si];
    const m=openSheet('Satz '+(si+1),`<div class="card list" style="padding:2px 12px"><button class="item" data-k="n">Normaler Satz</button><button class="item" data-k="w">🔥 Aufwärmsatz (zählt nicht in Statistik)</button><button class="item" data-k="dup">Satz duplizieren</button><button class="item" data-k="del" style="color:var(--warn)">Satz löschen</button></div>`);
    $$('[data-k]',m).forEach(x=>x.onclick=()=>{ const k=x.dataset.k; if(k==='n') delete s.kind; if(k==='w') s.kind='w'; if(k==='dup') a.ex[ei].sets.splice(si+1,0,{...s,done:false}); if(k==='del') a.ex[ei].sets.splice(si,1); save(); closeSheet(); drawWorkout(); }); });
  $$('[data-exmenu]',sb).forEach(b=>b.onclick=()=>{ const ei=+b.dataset.exmenu; const e=a.ex[ei];
    const m=openSheet(exName(e.ex),`<div class="card list" style="padding:2px 12px"><button class="item" data-k="stats">📊 Statistik & Rekorde</button><button class="item" data-k="note">📝 Notiz</button><button class="item" data-k="swap">🔁 Übung ersetzen</button><button class="item" data-k="up">▲ Nach oben</button><button class="item" data-k="dn">▼ Nach unten</button><button class="item" data-k="rm" style="color:var(--warn)">Übung entfernen</button></div>`);
    $$('[data-k]',m).forEach(x=>x.onclick=async()=>{ const k=x.dataset.k; closeSheet();
      if(k==='stats') return openExercise(e.ex,'stats');
      if(k==='note'){ const n=prompt('Notiz zur Übung',e.note||''); if(n!=null){e.note=n;save();drawWorkout();} return; }
      if(k==='swap') return pickExercises(ids=>{ a.ex[ei]=newExEntry(ids[0],e.sets.length,e.target); save(); drawWorkout(); },true);
      if(k==='up'&&ei>0) [a.ex[ei-1],a.ex[ei]]=[a.ex[ei],a.ex[ei-1]];
      if(k==='dn'&&ei<a.ex.length-1) [a.ex[ei+1],a.ex[ei]]=[a.ex[ei],a.ex[ei+1]];
      if(k==='rm'&&await confirmBox('Übung aus dem Workout entfernen?','Entfernen',true)) a.ex.splice(ei,1);
      save(); drawWorkout(); }); });
  $('#wAddEx',sb).onclick=addExToActive;
  $('#wName',sb).oninput=e=>{a.name=e.target.value;save();};
  $('#wNote',sb).oninput=e=>{a.note=e.target.value;save();};
  $('#wDiscard',sb).onclick=async()=>{ if(await confirmBox(a.editId?'Änderungen verwerfen?':'Workout verwerfen? Alle Einträge gehen verloren.','Verwerfen',true)){ S.active=null; save(); closeAll(); render(); } };
  $$('[data-rest]',sb).forEach(b=>b.onclick=()=>{ const v=+b.dataset.rest; if(!v) a.restEnd=null; else if(a.restEnd){ a.restEnd+=v*1000; a.restDur=Math.max(a.restDur,(a.restEnd-Date.now())/1000); } save(); updTimers(); });
}
function finishWorkout(){
  const a=S.active; if(!a) return;
  const clean=sets=>sets.map(({done,...r})=>r);
  let ex=a.ex.map(e=>({ex:e.ex,note:e.note||'',sets:clean(e.sets.filter(s=>s.done))})).filter(e=>e.sets.length);
  const anyDone=ex.length>0;
  if(!anyDone) ex=a.ex.map(e=>({ex:e.ex,note:e.note||'',sets:clean(e.sets.filter(s=>Object.keys(s).some(k=>!['done','kind','seg'].includes(k))))})).filter(e=>e.sets.length);
  if(!ex.length){ toast('Noch keine Sätze eingetragen'); return; }
  const elapsed=Math.max(1,Math.round((Date.now()-a.start)/60000));
  const runMin=ex.reduce((q,e)=>{ const t=exType(e.ex); return q+e.sets.reduce((x,s)=>x+(['lauf','cardio','hyrox'].includes(t)?(s.min||0):0),0); },0);
  const dur=a.editId||a.past?(a.dur||Math.round(runMin)||60):Math.max(elapsed,Math.round(runMin));
  const sb=openSheet('Workout speichern',`${anyDone?'':'<p class="small" style="color:var(--orange)">Keine Sätze abgehakt – es werden alle Sätze mit Werten gespeichert.</p>'}
   <div class="field"><label>Name</label><input id="fN" value="${esc(a.name)}"></div>
   <div class="grid2"><div class="field"><label>Datum</label><input type="date" id="fD" value="${a.date}" max="${today()}"></div><div class="field"><label>Dauer (Minuten)</label><input type="number" id="fM" value="${dur}"></div></div>
   <div class="field"><label>Zu Plan zuordnen</label><select id="fP"><option value="">– kein Plan (freies Workout) –</option>${S.plans.map(p=>`<option value="${p.id}" ${p.id===a.planId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
   <div class="small mute" style="margin-bottom:12px">${ex.length} Übungen · ${ex.reduce((q,e)=>q+e.sets.length,0)} Sätze</div>
   <button class="btn pri block" id="fSave">Speichern</button>`);
  $('#fSave',sb).onclick=()=>{
    const w={id:a.editId||a.id,date:$('#fD',sb).value||today(),start:a.start,dur:num($('#fM',sb).value)||0,planId:$('#fP',sb).value||null,name:$('#fN',sb).value||'Workout',note:a.note||'',ex};
    if(a.editId){ const i=S.workouts.findIndex(x=>x.id===a.editId); if(i>=0) S.workouts[i]=w; else S.workouts.push(w); } else S.workouts.push(w);
    w.prs=prsOf(w);
    S.active=null; save(true); closeAll(); clearInterval(tick); render();
    showSummary(w);
  };
}

    if(k==='copy'){ const y=(S.diary[addDays(date,-1)]||{entries:[]}).entries.filter(e=>e.meal===meal); if(!y.length){ toast('Gestern nichts eingetragen'); return; } const dd=dayOf(date); y.forEach(e=>dd.entries.push(cloneEntry(e))); save(); closeSheet(); render(); toast(`${y.length} Einträge kopiert ✓`); }

async function lookupCode(code,date,meal){
  const local=S.foods.find(f=>f.code===code)||S.recent.find(f=>f.code===code);
  if(local) return amountSheet(local,date,meal);
  try{ const f=await offProduct(code); if(f) return amountSheet(f,date,meal); }
  catch(e){ toast('Open Food Facts nicht erreichbar'); }
  const sb=openSheet('Produkt unbekannt',`<p>Der Barcode <b>${esc(code)}</b> ist nicht in Open Food Facts. Nährwerte von der Packung abtippen?</p><button class="btn pri block" id="mk">Lebensmittel anlegen</button>`);
  $('#mk',sb).onclick=()=>{ closeSheet(); editFood(null,code,f=>amountSheet(f,date,meal)); };
}
function offMap(p){
  if(!p) return null; const n=p.nutriments||{};
  let kcal=n['energy-kcal_100g']; if(kcal==null&&n.energy_100g!=null) kcal=n.energy_100g/4.184;
  if(kcal==null) return null;
  const g=k=>{ const v=n[k+'_100g']; return v==null||isNaN(v)?0:+v; };
  return {id:'off_'+p.code,code:p.code,name:p.product_name_de||p.product_name||'Unbenannt',brand:(p.brands||'').split(',')[0],
    per100:{kcal:+kcal,p:g('proteins'),c:g('carbohydrates'),f:g('fat'),fib:g('fiber'),sug:g('sugars'),salt:g('salt')},serving:p.serving_quantity?+p.serving_quantity:null};
}
const OFF_FIELDS='code,product_name,product_name_de,brands,nutriments,serving_quantity';
async function offProduct(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  if(!r.ok) return null; const j=await r.json(); return j.status===1?offMap(j.product):null;
}
async function offSearch(q){
  const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&lc=de&cc=de&fields=${OFF_FIELDS}`);
  if(!r.ok) throw new Error('HTTP '+r.status); const j=await r.json(); return (j.products||[]).map(offMap).filter(Boolean);
}

let scanStream=null, scanLoop=null, zxReader=null;
async function startScan(video,onCode,info,qr){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ info('Kamera nicht verfügbar (am Handy braucht die App eine https-Adresse). Barcode unten eintippen.'); return; }
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:qr?['qr_code']:['ean_13','ean_8','upc_a','upc_e','code_128']});
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); video.srcObject=scanStream; await video.play();
      info(qr?'QR-Code ins Bild halten …':'Barcode ins Bild halten …');
      let fired=false;
      scanLoop=setInterval(async()=>{ try{ const r=await det.detect(video); if(r.length&&!fired){ fired=true; onCode(r[0].rawValue); } }catch(e){} },300);
    } else {
      info('Lade Scanner …');
      await loadLib('lib/zxing.min.js','https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js',()=>!!window.ZXing);
      const hints=new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,qr?[ZXing.BarcodeFormat.QR_CODE]:[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);
      zxReader=new ZXing.BrowserMultiFormatReader(hints);
      info(qr?'QR-Code ins Bild halten …':'Barcode ins Bild halten …');
      let fired=false;
      await zxReader.decodeFromConstraints({video:{facingMode:'environment'}},video,(res)=>{ if(res&&!fired){ fired=true; onCode(res.getText()); } });
    }
  }catch(e){ info('Kamera-Fehler: '+(e.message||e.name)+' – Barcode unten eintippen.'); }
}
function stopScan(){ clearInterval(scanLoop); scanLoop=null; if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } if(zxReader){ try{zxReader.reset();}catch(e){} zxReader=null; } }

  const draw=()=>{ const n=calc();
    sb.innerHTML=`<div class="small mute" style="margin-bottom:10px">${esc(food.brand||'')}${food.code?' · EAN '+esc(food.code):''}</div>
      <div class="field"><label>Menge (g / ml)</label><input id="aG" type="number" inputmode="decimal" value="${g}" style="background:var(--card);font-size:20px;font-weight:800"></div>
      <div class="chips" style="margin-bottom:12px">${[food.serving?['s',food.serving,`1 Portion (${food.serving} g)`]:null,['',50],['',100],['',150],['',200],['',250],['',300]].filter(Boolean).map(x=>`<button class="chip ${g==x[1]?'on':''}" data-g="${x[1]}">${x[2]||x[1]+' g'}</button>`).join('')}</div>

      <div class="grid3" style="margin:12px 0">${[['kcal','kcal'],['p','Protein'],['c','KH'],['f','Fett'],['fib','Ballast.'],['sug','Zucker']].map(([k,l])=>`<div class="stat" style="background:var(--card)"><div class="v">${fmt(n[k],k==='kcal'?0:1)}</div><div class="l">${l}${k==='kcal'?'':' g'}</div></div>`).join('')}</div>
      <div class="row">${entry?'<button class="btn danger" id="aDel">Löschen</button>':''}<button class="btn pri grow" id="aOk">${entry?'Speichern':'Hinzufügen'}</button></div>
      ${food.id&&!food.id.startsWith('u_')?`<button class="btn block" id="aSave" style="margin-top:10px">⭐ Als eigenes Lebensmittel speichern</button>`:''}`;
    const gi=$('#aG',sb); gi.oninput=()=>{ g=num(gi.value)||0; const n2=calc(); $$('.stat .v',sb).forEach((el,i)=>{ const k=['kcal','p','c','f','fib','sug'][i]; el.textContent=fmt(n2[k],k==='kcal'?0:1); }); };
    $$('[data-g]',sb).forEach(b=>b.onclick=()=>{ g=+b.dataset.g; draw(); });
    $('#aM',sb).onchange=e=>m=e.target.value;
    $('#aOk',sb).onclick=()=>{
      if(!g){toast('Menge eingeben');return;}
      const day=dayOf(date);
      const slim={id:food.id,code:food.code,name:food.name,brand:food.brand,per100:food.per100,serving:food.serving};
      if(entry) Object.assign(entry,{g,meal:m,n:calc()});
      else day.entries.push({id:uid(),meal:m,name:food.name,brand:food.brand||'',g,n:calc(),food:slim});
      if(food.id) S.recent=[slim,...S.recent.filter(f=>f.id!==food.id)].slice(0,40);
      save(); closeAll(); render(); toast(entry?'Gespeichert':'Eingetragen ✓');
    };
    const d=$('#aDel',sb); if(d) d.onclick=()=>{ const day=S.diary[date]; day.entries=day.entries.filter(x=>x.id!==entry.id); save(); closeAll(); render(); };
    const sv=$('#aSave',sb); if(sv) sv.onclick=()=>editFood(null,food.code,f=>{ closeSheet(); amountSheet(f,date,m,entry); },food);
  };
  draw();
}
function editFood(existing,code,onSaved,template){

function musCol(v,max){ if(!v) return '#e3e8f0'; const r=Math.min(1,v/(max||1)); return `hsl(${150-r*130} ${70+r*15}% ${72-r*22}%)`; }
function bodySvg(m,max,side){
  const t=k=>`<title>${MUS_DE[k]}: ${fmt(m[k]||0,1)}</title>`;
  const E=(k,cx,cy,rx,ry,rot=0)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${musCol(m[k],max)}" ${rot?`transform="rotate(${rot} ${cx} ${cy})"`:''}>${t(k)}</ellipse>`;
  const P=(k,x,y,w,h,rx=4)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${musCol(m[k],max)}">${t(k)}</rect>`;
  let s=`<svg viewBox="0 0 120 240"><g fill="#f4f6fa" stroke="#d5dce7" stroke-width="1"><circle cx="60" cy="16" r="11"/><rect x="38" y="34" width="44" height="78" rx="14"/><rect x="18" y="40" width="14" height="72" rx="7"/><rect x="88" y="40" width="14" height="72" rx="7"/><rect x="37" y="104" width="21" height="120" rx="9"/><rect x="62" y="104" width="21" height="120" rx="9"/><circle cx="21" cy="120" r="5"/><circle cx="99" cy="120" r="5"/></g>`;
  s+=P('neck',54,26,12,9,3);
  if(side==='front'){
    s+=E('traps',46,37,7,3,-20)+E('traps',74,37,7,3,20)+E('shoulders',33,47,9,9)+E('shoulders',87,47,9,9)+E('chest',49,54,11,8)+E('chest',71,54,11,8)
      +E('biceps',25,70,5.5,11)+E('biceps',95,70,5.5,11)+E('forearms',22,96,5,13)+E('forearms',98,96,5,13)
      +P('abdominals',51,64,18,40,6)+E('abdominals',44,82,3.5,13)+E('abdominals',76,82,3.5,13)+E('abductors',41,114,5,9)+E('abductors',79,114,5,9)
      +E('quadriceps',47,142,9,24)+E('quadriceps',73,142,9,24)+E('adductors',56,130,3.5,14)+E('adductors',64,130,3.5,14)+E('calves',47,198,6,19)+E('calves',73,198,6,19);

      +E('shoulders',33,47,9,9)+E('shoulders',87,47,9,9)+E('triceps',25,70,5.5,11)+E('triceps',95,70,5.5,11)+E('forearms',22,96,5,13)+E('forearms',98,96,5,13)

  }
  return s+`<text x="60" y="236" text-anchor="middle" style="fill:var(--dim);font-size:9px">${side==='front'?'vorne':'hinten'}</text></svg>`;

function buckets(key){
  const r=RANGES.find(x=>x[0]===key); let a=rangeStart(key);
  if(key==='all'){ a=S.workouts.reduce((q,w)=>w.date<q?w.date:q,today()); }
  const out=[]; const t=today();
  if(r[1]&&r[1]<=6){ let m=monday(a); while(m<=t){ out.push({a:m,b:addDays(m,6),l:pd(m).getDate()+'.'+(pd(m).getMonth()+1)+'.'}); m=addDays(m,7); } }
  else { let m=monthStart(a); while(m<=t){ out.push({a:m,b:monthEnd(m),l:MON[pd(m).getMonth()]+(m.slice(5,7)==='01'?' '+m.slice(2,4):'')}); m=addMonths(m,1); } }
  return out;
}

function periodOf(mode,off){
  const t=today();
  if(mode==='woche'){ const a=addDays(monday(t),7*off); return {a,b:addDays(a,6),l:`KW ${isoWeek(a)} · ${dLabel(a)} – ${dLabel(addDays(a,6))}`}; }
  const a=addMonths(monthStart(t),off); return {a,b:monthEnd(a),l:`${MON_L[pd(a).getMonth()]} ${a.slice(0,4)}`};
}
function isoWeek(s){ const d=pd(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7); }

function periodSummary(a,b){
  const t=today(), ws=wsIn(a,b);
  const r={ws,n:ws.length,min:ws.reduce((q,w)=>q+(w.dur||0),0),vol:ws.reduce((q,w)=>q+wVolume(w),0),sets:ws.reduce((q,w)=>q+wSets(w),0),km:0,hm:0,runs:0};
  for(const w of ws){ const x=wRun(w); r.km+=x.km; r.hm+=x.hm; if(x.km) r.runs++; }
  r.days=new Set(ws.map(w=>w.date)).size;
  r.rout=S.routines.map(x=>routineCount(a,b<t?b:t,x.id));
  const nd=Object.keys(S.diary).filter(d=>d>=a&&d<=b&&S.diary[d].entries.length);
  r.foodDays=nd.length; r.kcal=nd.length?nd.reduce((q,d)=>q+dayTotals(d).kcal,0)/nd.length:null; r.prot=nd.length?nd.reduce((q,d)=>q+dayTotals(d).p,0)/nd.length:null;
  const ms=S.measures.filter(m=>m.date>=a&&m.date<=b&&m.weight!=null).sort((x,y)=>x.date.localeCompare(y.date));
  r.w0=ms.length?ms[0].weight:null; r.w1=ms.length?ms[ms.length-1].weight:null;
  r.prs=ws.flatMap(w=>(w.prs||[]).map(p=>({d:w.date,p})));
  r.ad=adherence(a,b<t?b:t);
  return r;
}

let idbP=null;
function idb(){ if(idbP) return idbP; idbP=new Promise((res,rej)=>{ const r=indexedDB.open('formkurve',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return idbP; }
async function idbDo(mode,fn){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction('photos',mode); const st=tx.objectStore('photos'); const r=fn(st); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); }); }
const photoPut=(id,d)=>idbDo('readwrite',s=>s.put(d,id));
const photoGetLocal=id=>idbDo('readonly',s=>s.get(id)).catch(()=>null);
async function photoGet(id){ const d=await photoGetLocal(id); if(d) return d; if(typeof syncPhotoFetch==='function'){ const r=await syncPhotoFetch(id); if(r){ await photoPut(id,r); return r; } } return null; }
const photoDel=id=>idbDo('readwrite',s=>s.delete(id));
const photoClear=()=>idbDo('readwrite',s=>s.clear()).catch(()=>{});
async function photoAll(){ const out=[]; for(const p of S.photos){ const d=await photoGet(p.id); if(d) out.push({id:p.id,data:d}); } return out; }
function compressImg(file,maxS=1280,q=0.82){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const s=Math.min(1,maxS/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',q)); }; img.onerror=()=>rej(new Error('Bild nicht lesbar')); img.src=u; }); }


/* ================= AUTOMATISCHE SICHERUNG (GitHub) =================
   Daten liegen als formkurve-daten.json im privaten Repo, Fotos als photos/<id>.jpg.
   Beim Öffnen wird geholt, jede Änderung wird ~10 s später hochgeladen.
   Haben beide Geräte gleichzeitig geändert, wird zusammengeführt (3-Wege-Abgleich über die IDs). */
const SYNC_KEY='formkurve_sync', DATA_PATH='formkurve-daten.json';
const COLLS=['workouts','plans','customEx','measures','photos','events','foods','meals','routines'];
const MAPS=['diary','habits'];
let SY={};
try{ SY=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}'); }catch(e){ SY={}; }
const sySave=()=>{ try{ localStorage.setItem(SYNC_KEY,JSON.stringify(SY)); }catch(e){} };
const syncOn=()=>!!(SY.owner&&SY.repo&&SY.token);
let syState='idle', syMsg='', syT=null, syBusy=null;

function cloudIcon(){
  const col=!syncOn()?'var(--orange)':syState==='err'?'var(--warn)':syState==='sync'?'var(--blue)':'var(--acc)';
  return `<span style="position:relative;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"/></svg><i style="position:absolute;right:-3px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:${col};border:2px solid #fff"></i></span>`;
}
function setSy(st,msg){ syState=st; syMsg=msg||''; const c=$('#cloud'); if(c) c.innerHTML=cloudIcon(); const s=$('#syStatus'); if(s) s.innerHTML=syStatusHtml(); }
function syStatusHtml(){
  if(!syncOn()) return '<span style="color:var(--orange);font-weight:700">Nicht eingerichtet – Daten liegen nur auf diesem Gerät.</span>';
  if(syState==='err') return `<span style="color:var(--warn);font-weight:700">⚠ ${esc(syMsg)}</span>`;
  if(syState==='sync') return '<span style="color:var(--blue);font-weight:700">Synchronisiere …</span>';
  return `<span style="color:var(--accDeep);font-weight:700">✓ Gesichert${SY.lastSync?' · '+agoTxt(SY.lastSync):''}</span>`;
}
function agoTxt(t){ const s=(Date.now()-t)/1000; if(s<60) return 'gerade eben'; if(s<3600) return `vor ${Math.round(s/60)} min`; if(s<86400) return `vor ${Math.round(s/3600)} h`; return new Date(t).toLocaleString('de-DE'); }

/* ---- Base64 (UTF-8) ---- */
function b64enc(str){ const b=new TextEncoder().encode(str); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(b64){ const bin=atob(b64.replace(/\s/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }

/* ---- GitHub-API ---- */
async function gh(path,opt={}){
  const base=(SY.api||'https://api.github.com')+`/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}`;
  const r=await fetch(base+(path?'/contents/'+path:''),{method:opt.method||'GET',cache:'no-store',body:opt.body,
    headers:{Authorization:'Bearer '+SY.token,Accept:opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  return r;
}
function ghErr(r){ return r.status===401?'Schlüssel ungültig oder abgelaufen – bitte neu eintragen':r.status===403?'Keine Berechtigung (Schlüssel braucht „Contents: Read and write“)':r.status===404?'Repository nicht gefunden – Name/Benutzer prüfen':'GitHub-Fehler '+r.status; }
async function pullRemote(){
  const r=await gh(DATA_PATH);
  if(r.status===404) return null;
  if(!r.ok) throw new Error(ghErr(r));
  const j=await r.json(); let txt;
  if(j.content&&j.encoding==='base64') txt=b64dec(j.content);
  else { const r2=await gh(DATA_PATH,{raw:true}); if(!r2.ok) throw new Error(ghErr(r2)); txt=await r2.text(); }
  return {sha:j.sha,doc:JSON.parse(txt)};
}
function snapshot(){ const {active,...rest}=S; return {app:'Formkurve',savedAt:Date.now(),device:navigator.userAgent.includes('iPhone')?'iPhone':'PC',data:rest}; }
function baseOf(d){ const b={}; for(const c of COLLS) b[c]=(d[c]||[]).map(x=>x.id); for(const m of MAPS) b[m]=Object.keys(d[m]||{}); return b; }

/* ---- 3-Wege-Zusammenführen ---- */
function mergeData(loc,rem,base){
  const out={...rem,...loc};
  for(const c of COLLS){
    const L=loc[c]||[], R=rem[c]||[], B=new Set((base&&base[c])||[]);
    const lm=new Map(L.map(x=>[x.id,x])), rm=new Map(R.map(x=>[x.id,x]));
    const res=[];
    for(const x of L){ if(!rm.has(x.id)&&B.has(x.id)) continue; res.push(x); }           // remote gelöscht
    for(const x of R){ if(lm.has(x.id)) continue; if(B.has(x.id)) continue; res.push(x); } // lokal gelöscht / neu remote
    out[c]=res;
  }
  for(const m of MAPS){
    const L=loc[m]||{}, R=rem[m]||{}, B=new Set((base&&base[m])||[]); const res={};
    for(const k in L){ if(!(k in R)&&B.has(k)) continue; res[k]=L[k]; }
    for(const k in R){ if(k in L||B.has(k)) continue; res[k]=R[k]; }
    if(m==='diary') for(const k in L) if(R[k]&&k in res){ const ids=new Set(L[k].entries.map(e=>e.id)); const add=R[k].entries.filter(e=>!ids.has(e.id)&&!(SY.baseDiary||[]).includes(e.id)); if(add.length) res[k]={...L[k],entries:[...L[k].entries,...add]}; }
    out[m]=res;
  }
  return out;
}
function applyData(data){
  const act=S.active; const d=defaults();
  S=Object.assign(d,data); for(const k of ['profile','track','settings']) S[k]=Object.assign(defaults()[k],data[k]||{});
  S.active=act; migrate(data); buildEx(); save(true,true);
}
function rememberBase(sha){ SY.sha=sha; SY.lastSync=Date.now(); SY.base=baseOf(S); SY.baseDiary=Object.values(S.diary).flatMap(d=>d.entries.map(e=>e.id)); SY.syncedMod=S.mod||0; sySave(); }

/* ---- Haupt-Ablauf ---- */
function syncSchedule(){ if(!syncOn()) return; clearTimeout(syT); syT=setTimeout(()=>syncNow(),10000); }
async function syncNow(opt={}){
  if(!syncOn()) return false;
  if(syBusy) return syBusy;
  syBusy=(async()=>{
    clearTimeout(syT); setSy('sync');
    try{
      for(let attempt=0;attempt<3;attempt++){
        const remote=await pullRemote();
        const dirty=(S.mod||0)>(SY.syncedMod||0);
        let changedRemote=remote&&remote.sha!==SY.sha;
        if(changedRemote){
          if(dirty&&SY.sha){ applyData(mergeData(snapshot().data,remote.doc.data,SY.base)); }
          else if(dirty&&!SY.sha){ applyData(mergeData(snapshot().data,remote.doc.data,null)); }
          else { applyData(remote.doc.data); rememberBase(remote.sha); if(!opt.quiet) render(); break; }
        } else if(!dirty&&remote){ SY.lastSync=Date.now(); sySave(); break; }
        // hochladen
        const body={message:`Formkurve-Sync ${new Date().toLocaleString('de-DE')} (${snapshot().device})`,content:b64enc(JSON.stringify(snapshot()))};
        if(remote) body.sha=remote.sha;
        const r=await gh(DATA_PATH,{method:'PUT',body:JSON.stringify(body)});
        if(r.status===409||r.status===422){ continue; } // inzwischen geändert → neu holen & zusammenführen
        if(!r.ok) throw new Error(ghErr(r));
        const j=await r.json(); rememberBase(j.content.sha);
        if(changedRemote) render();
        break;
      }
      await syncPhotosUp();
      setSy('ok'); return true;
    }catch(e){ setSy('err',e.message||'Keine Verbindung'); return false; }
    finally{ syBusy=null; }
  })();
  return syBusy;
}
async function syncPhotosUp(){
  SY.upPhotos=SY.upPhotos||[];
  for(const p of S.photos){ if(SY.upPhotos.includes(p.id)) continue;
    const d=await photoGetLocal(p.id); if(!d) continue;
    const r=await gh(`photos/${p.id}.jpg`,{method:'PUT',body:JSON.stringify({message:'Foto '+p.date,content:d.split(',')[1]})});
    if(r.ok||r.status===422){ SY.upPhotos.push(p.id); sySave(); } else break; }
}
async function syncPhotoFetch(id){
  if(!syncOn()) return null;
  try{ const r=await gh(`photos/${id}.jpg`,{raw:true}); if(!r.ok) return null; const blob=await r.blob();
    return await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).replace(/^data:[^;]*;/,'data:image/jpeg;')); fr.readAsDataURL(blob); }); }catch(e){ return null; }
}
document.addEventListener('visibilitychange',()=>{ if(!syncOn()) return; if(document.hidden){ if((S.mod||0)>(SY.syncedMod||0)) syncNow({quiet:true}); } else if(!SY.lastSync||Date.now()-SY.lastSync>30000) syncNow(); });
window.addEventListener('online',()=>syncNow());

/* ---- Einrichtung & Status ---- */
function openSync(){
  const sb=openSheet('Automatische Sicherung','');
  const draw=()=>{
    sb.innerHTML=`<div class="card"><div class="row"><span class="ico" style="background:var(--accSoft);width:44px;height:44px">${cloudIcon()}</span><div class="grow" id="syStatus">${syStatusHtml()}</div></div>
      ${syncOn()?`<div class="small mute" style="margin-top:10px">Repository: <b>${esc(SY.owner)}/${esc(SY.repo)}</b> (privat) · jede Änderung wird nach ca. 10 s gesichert, beim Öffnen wird der neueste Stand geholt.</div>
      <div class="row" style="margin-top:12px"><button class="btn pri grow" id="syNow">Jetzt synchronisieren</button><a class="btn" href="https://github.com/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}/commits" target="_blank" rel="noopener">Verlauf ↗</a></div>`:''}</div>
     ${syncOn()?`<div class="card"><h3>Weiteres Gerät verbinden</h3><p class="small mute" style="margin-top:0">Am PC den QR-Code anzeigen und mit der App auf dem iPhone (Sicherung → „QR-Code scannen“) einlesen – dann musst du nichts abtippen.</p>
        <div class="row"><button class="btn grow" id="syQr">QR-Code anzeigen</button><button class="btn grow" id="syScan2">QR-Code scannen</button></div><div id="qrBox" style="margin-top:12px;text-align:center"></div></div>
       <button class="btn danger block" id="syOff">Sicherung auf diesem Gerät trennen</button>`
     :`<div class="card"><h3>Einrichten (einmalig)</h3>
        <p class="small mute" style="margin-top:0">Du brauchst ein <b>privates</b> GitHub-Repository (z. B. <b>formkurve-daten</b>) und einen Schlüssel dafür – die Anleitung zeigt jeden Klick.</p>
        <button class="btn pri block" id="syScan" style="margin-bottom:12px">📷 QR-Code vom anderen Gerät scannen</button>
        <div class="field"><label>GitHub-Benutzername</label><input id="syO" value="${esc(SY.owner||'')}" autocapitalize="off" autocorrect="off"></div>
        <div class="field"><label>Daten-Repository</label><input id="syR" value="${esc(SY.repo||'formkurve-daten')}" autocapitalize="off" autocorrect="off"></div>
        <div class="field"><label>Schlüssel (Fine-grained Token, beginnt mit github_pat_)</label><input id="syK" type="password" autocapitalize="off" autocorrect="off" placeholder="github_pat_…"></div>
        <button class="btn pri block" id="syGo">Verbinden & sichern</button>
        <div id="syScanBox" style="margin-top:12px"></div></div>`}
     <p class="tiny dim">Der Schlüssel bleibt nur auf deinen Geräten gespeichert und erlaubt ausschließlich Zugriff auf das Daten-Repository.</p>`;
    const now=$('#syNow',sb); if(now) now.onclick=async()=>{ if(await syncNow()) toast('Gesichert ✓'); draw(); };
    const off=$('#syOff',sb); if(off) off.onclick=async()=>{ if(await confirmBox('Sicherung auf diesem Gerät trennen? Die Daten in GitHub und auf dem Gerät bleiben erhalten.','Trennen',true)){ SY={}; sySave(); setSy('idle'); draw(); render(); } };
    const qr=$('#syQr',sb); if(qr) qr.onclick=()=>showPairQr($('#qrBox',sb));
    const go=$('#syGo',sb); if(go) go.onclick=()=>connectSync($('#syO',sb).value.trim(),$('#syR',sb).value.trim(),$('#syK',sb).value.trim(),draw);
    const sc=$('#syScan',sb)||$('#syScan2',sb); if(sc) sc.onclick=()=>{ const box=$('#syScanBox',sb)||$('#qrBox',sb);
      box.innerHTML='<div class="scanbox"><video id="scanv" playsinline muted></video></div><div class="small mute" id="qrInfo" style="margin-top:6px"></div>';
      startScan($('#scanv',box),txt=>{ stopScan(); try{ const c=JSON.parse(txt); if(c.fk!==1) throw 0; connectSync(c.o,c.r,c.t,draw); }catch(e){ toast('Das ist kein Formkurve-QR-Code'); } },m=>{ const i=$('#qrInfo',box); if(i) i.textContent=m; },true); };
  };
  draw();
  sheets[sheets.length-1].onClose=stopScan;
}
async function connectSync(o,r,t,after){
  if(!o||!r||!t){ toast('Bitte alle drei Felder ausfüllen'); return; }
  const prev=SY; SY={...SY,owner:o,repo:r,token:t,sha:null,base:null,syncedMod:0};
  setSy('sync');
  try{
    const rr=await gh(''); if(!rr.ok) throw new Error(ghErr(rr));
    const info=await rr.json(); if(!info.private&&!await confirmBox(`Achtung: „${o}/${r}“ ist ÖFFENTLICH – jeder könnte deine Daten sehen. Trotzdem verwenden?`,'Trotzdem',true)) throw new Error('Abgebrochen – bitte ein privates Repository verwenden');
    const remote=await pullRemote();
    if(remote){
      const hasLocal=S.workouts.length||Object.keys(S.diary).length||S.measures.length;
      if(hasLocal){ applyData(mergeData(snapshot().data,remote.doc.data,null)); S.mod=Date.now(); }
      else { applyData(remote.doc.data); rememberBase(remote.sha); }
    } else S.mod=Date.now();
    sySave(); const ok=await syncNow();
    if(ok){ confetti(40); toast(remote?'Verbunden – Daten zusammengeführt ✓':'Verbunden – erste Sicherung erstellt ✓',3000); render(); }
    if(after) after();
  }catch(e){ SY=prev; sySave(); setSy('err',e.message); toast(e.message,4000); if(after) after(); }
}
async function showPairQr(box){
  box.innerHTML='<div class="small mute">Lade QR-Code …</div>';
  try{
    await loadLib('lib/qrcode.js','https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',()=>!!window.qrcode);
    const q=qrcode(0,'M'); q.addData(JSON.stringify({fk:1,o:SY.owner,r:SY.repo,t:SY.token})); q.make();
    box.innerHTML=`<div style="background:#fff;display:inline-block;padding:10px;border-radius:14px">${q.createSvgTag({cellSize:5,margin:2})}</div><div class="small" style="color:var(--warn);margin-top:6px;font-weight:700">Enthält deinen Schlüssel – nicht fotografieren oder teilen.</div>`;
  }catch(e){ box.innerHTML=`<div class="small" style="color:var(--warn)">${esc(e.message)}</div>`; }
}

/* ---- Bildschirm beim Workout anlassen ---- */
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator&&!wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); }
    if(!on&&wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S&&S.active&&$('#wElapsed')) keepAwake(true); });

/* ================= START ================= */
load(); buildEx(); seed(); render();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(syncOn()) setTimeout(()=>syncNow(),300);

</script>
