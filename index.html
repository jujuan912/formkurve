ill not move or by having a partner hold them. Your legs should be bent at the knees.\nElevate your upper body so that it creates an imaginary V-shape with your thighs. Your arms should be fully extended in front of you perpendicular to your torso and with the hands clasped. This is the starting position.\nTwist your torso to the right side until your arms are parallel with the floor while breathing out.\nHold the contraction for a second and move back to the starting position while breathing out. Now move to the opposite side performing the same techniques you applied to the right side.\nRepeat for the recommended amount of repetitions."],["Sandbag_Load","Sandbag Load","","Strongman","Sonstiges",[13],[0,3,4,6,7,8,10,11,14,15],"kraft",2,"To load sandbags or other objects, begin with the implements placed a distance from the loading platform, typically 50 feet.\nBegin by lifting the sandbag. Sandbags are extremely awkward, and the manner of lifting them can vary depending on the particular sandbag used. Reach as far around it as possible, extending through the hips and knees to pull it up high. Shouldering is usually not allowed.\nMove as quickly as possible to the platform, and load it, extending through your hips, knees, and ankles to get it as high as possible. Place it onto the platform, ensuring it doesn't fall off.\nReturn to the starting position to retrieve the next sandbag, and repeat until the event is completed."],["Scapular_Pull-Up","Scapular Pull-Up","","Kraft","Ohne",[15],[9,11],"kraft",2,"Take a pronated grip on a pull-up bar.\nFrom a hanging position, raise yourself a few inches without using your arms. Do this by depressing your shoulder girdle in a reverse shrugging motion.\nPause at the completion of the movement, and then slowly return to the starting position before performing more repetitions."],["Scissor_Kick","Scissor Kick","","Dehnen","Körpergewicht",[0],[],"zeit",2,"To begin, lie down with your back pressed against the floor or on an exercise mat (optional). Your arms should be fully extended to the sides with your palms facing down. Note: The arms should be stationary the entire time.\nWith a slight bend at the knees, lift your legs up so that your heels are about 6 inches off the ground. This is the starting position.\nNow lift your left leg up to about a 45 degree angle while your right leg is lowered until the heel is about 2-3 inches from the ground.\nSwitch movements by raising your right leg up and lowering your left leg. Remember to breathe while performing this exercise.\nRepeat for the recommended amount of repetitions."],["Scissors_Jump","Scissors Jump","","Plyometrie","Körpergewicht",[13],[7,8],"body",2,"Assume a lunge stance position with one foot forward with the knee bent, and the rear knee nearly touching the ground.\nEnsure that the front knee is over the midline of the foot. Extending through both legs, jump as high as possible, swinging your arms to gain lift.\nAs you jump as high as you can, switch the position of your legs, moving your front leg to the back and the rear leg to the front.\nAs you land, absorb the impact through the legs by adopting the lunge position, and repeat."],["Seated_Band_Hamstring_Curl","Seated Band Hamstring Curl","","Kraft","Sonstiges",[8],[],"kraft",2,"Secure a band close to the ground and place a bench a couple feet away from it.\nSeat yourself on the bench and secure the band behind your ankles, beginning with your legs straight. This will be your starting position.\nFlex the knees, bringing your feet towards the bench. You may need to lean back slightly to keep your feet from striking the floor.\nPause at the completion of the movement, and then slowly return to the starting position."],["Seated_Barbell_Military_Press","Seated Barbell Military Press","","Kraft","Langhantel",[14],[16],"kraft",2,"Sit on a Military Press Bench with a bar behind your head and either have a spotter give you the bar (better on the rotator cuff this way) or pick it up yourself carefully with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down.\nOnce you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.\nLower the bar down to the collarbone slowly as you inhale.\nLift the bar back up to the starting position as you exhale.\nRepeat for the recommended amount of repetitions."],["Seated_Barbell_Twist","Seated Barbell Twist","","Kraft","Langhantel",[0],[],"kraft",2,"Start out by sitting at the end of a flat bench with a barbell placed on top of your thighs. Your feet should be shoulder width apart from each other.\nGrip the bar with your palms facing down and make sure your hands are wider than shoulder width apart from each other. Begin to lift the barbell up over your head until your arms are fully extended.\nNow lower the barbell behind your head until it is resting along the base of your neck. This is the starting position.\nWhile keeping your feet and head stationary, move your waist from side to side so that your oblique muscles feel the contraction. Only move from side to side as far as your waist will allow you to go. Stretching or moving too far can cause an injury to occur. Tip: Use a slow and controlled motion.\nRemember to breathe out while twisting your body to the side and in when moving back to the starting position.\nRepeat for the recommended amount of repetitions."],["Seated_Bent-Over_One-Arm_Dumbbell_Triceps_Extension","Seated Bent-Over One-Arm Dumbbell Triceps Extension","","Kraft","Kurzhantel",[16],[],"kraft",2,"Sit down at the end of a flat bench with a dumbbell in one arm using a neutral grip (palms of the hand facing you).\nBend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up.\nThe upper arm with the dumbbell should be close to the torso and aligned with it (lifted up until it is parallel to the floor while the forearms are pointing towards the floor as the hands hold the weights). Tip: There should be a 90-degree angle between the forearms and the upper arm. This is your starting position.\nKeeping the upper arm stationary, use the triceps to lift the weight as you exhale until the forearm is parallel to the floor and the whole arm is extended. Like many other arm exercises, only the forearm moves.\nAfter a second contraction at the top, slowly lower the dumbbell back to the starting position as you inhale.\nRepeat the movement for the prescribed amount of repetitions.\nSwitch arms and repeat the exercise."],["Seated_Bent-Over_Rear_Delt_Raise","Seated Bent-Over Rear Delt Raise","","Kraft","Kurzhantel",[14],[],"kraft",2,"Place a couple of dumbbells looking forward in front of a flat bench.\nSit on the end of the bench with your legs together and the dumbbells behind your calves.\nBend at the waist while keeping the back straight in order to pick up the dumbbells. The palms of your hands should be facing each other as you pick them. This will be your starting position.\nKeeping your torso forward and stationary, and the arms slightly bent at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. (Note: avoid swinging the torso or bringing the arms back as opposed to the side.)\nAfter a one second contraction at the top, slowly lower the dumbbells back to the starting position.\nRepeat for the recommended amount of repetitions."],["Seated_Bent-Over_Two-Arm_Dumbbell_Triceps_Extension","Seated Bent-Over Two-Arm Dumbbell Triceps Extension","","Kraft","Kurzhantel",[16],[],"kraft",2,"Sit down at the end of a flat bench with a dumbbell in both arms using a neutral grip (palms of the hand facing you).\nBend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up.\nThe upper arms with the dumbbells should be close to the torso and aligned with it (lifted up until they are parallel to the floor while the forearms are pointing towards the floor as the hands hold the weights). Tip: There should be a 90-degree angle between the forearms and the upper arm. This is your starting position.\nKeeping the upper arms stationary, use the triceps to lift the weight as you exhale until the forearms are parallel to the floor and the whole arm is extended. Like many other arm exercises, only the forearm moves.\nAfter a second contraction at the top, slowly lower the dumbbells back to the starting position as you inhale.\nRepeat the movement for the prescribed amount of repetitions."],["Seated_Biceps","Seated Biceps","","Dehnen","Körpergewicht",[3],[5,14],"zeit",2,"Sit on the floor with your knees bent and your partner standing behind you. Extend your arms straight behind you with your palms facing each other. Your partner will hold your wrists for you. This will be the starting position.\nAttempt to flex your elbows, while your partner prevents any actual movement.\nAfter 10-20 seconds, relax your arms while your partner gently pulls your wrists up to stretch your biceps. Be sure to let your partner know when the stretch is appropriate to prevent injury or overstretching."],["Seated_Cable_Rows","Seated Cable Rows","Rudern am Kabel sitzend","Kraft","Kabelzug",[11],[3,9,14],"kraft",2,"For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.\nLean over as you keep the natural alignment of your back and grab the V-bar handles.\nWith your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.\nKeeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.\nRepeat for the recommended amount of repetitions."],["Seated_Cable_Shoulder_Press","Seated Cable Shoulder Press","","Kraft","Kabelzug",[14],[16],"kraft",2,"Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 90 degrees to the body, with your head and chest up. The elbows should also be bent to about 90 degrees. This will be your starting position.\nBegin by extending through the elbow, pressing the handles together above your head.\nAfter pausing at the top, return the handles to the starting position. Ensure that you maintain tension on the cables.\nYou can also execute this movement with your back off the pad and alternate hands."],["Seated_Calf_Raise","Seated Calf Raise","Wadenheben sitzend","Kraft","Maschine",[4],[],"kraft",2,"Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.\nPlace your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.\nLift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.\nSlowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement.\nRaise the heels by extending the ankles as high as possible as you contract the calves and breathe out. Hold the top contraction for a second.\nRepeat for the recommended amount of repetitions."],["Seated_Calf_Stretch","Seated Calf Stretch","","Dehnen","Ohne",[4],[8,10],"zeit",2,"Sit up straight on an exercise mat.\nBend one knee and put that foot on the floor to stabilize the torso.\nStraighten your other leg and flex your ankle.\nUsing a band, towel, or your hand if you can reach, pull the toes toward you. Hold for 10 to 20 seconds, then switch sides."],["Seated_Close-Grip_Concentration_Barbell_Curl","Seated Close-Grip Concentration Barbell Curl","","Kraft","Langhantel",[3],[],"kraft",2,"Sit down on a flat bench with a barbell or E-Z Bar in front of you in between your legs. Your legs should be spread with the knees bent and the feet on the floor.\nUse your arms to pick the barbell up and place the back of your upper arms on top of your inner thighs (around three and a half inches away from the front of the knee). A supinated grip closer than shoulder width is needed to perform this exercise. Tip: Your arm should be extended at arms length and the barbell should be above the floor. This will be your starting position.\nWhile holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.\nSlowly begin to bring the barbell back to starting position as your breathe in. Tip: Avoid swinging motions at any time.\nRepeat for the recommended amount of repetitions."],["Seated_Dumbbell_Curl","Seated Dumbbell Curl","","Kraft","Kurzhantel",[3],[],"kraft",2,"Sit on a flat bench with a dumbbell on each hand being held at arms length. The elbows should be close to the torso.\nRotate the palms of the hands so that they are facing your torso. This will be your starting position.\nWhile holding the upper arm stationary, curl the weights and start twisting the wrists once the dumbbells pass your thighs so that the palms of your hands face forward at the end of the movement. Make sure that you contract the biceps as you breathe out and make sure that only the forearms move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.\nSlowly begin to bring the dumbbells back to the starting position as your breathe in and as you rotate the wrists back to a neutral grip.\nRepeat for the recommended amount of repetitions."],["Seated_Dumbbell_Inner_Biceps_Curl","Seated Dumbbell Inner Biceps Curl","","Kraft","Kurzhantel",[3],[],"kraft",2,"Sit on the end of a flat bench with a dumbbell in each hand being held at arms length. The elbows should be close to the torso.\nRotate the palms of the hands so that they are facing inward in a neutral position. This will be your starting position.\nWhile holding the upper arms stationary, curl the dumbbells out and up, turning the palms out as you lift and keeping your forearms in line with your outer deltoids. Tips:\nOnly the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.\nSlowly begin to bring the dumbbells back to the starting position as your breathe in. Remember to rotate your arms as you lower the dumbbells so that you can switch back to a neutral grip.\nRepeat for the recommended amount of repetitions."],["Seated_Dumbbell_Palms-Down_Wrist_Curl","Seated Dumbbell Palms-Down Wrist Curl","","Kraft","Kurzhantel",[6],[],"kraft",2,"Start out by placing two dumbbells on the floor in front of a flat bench.\nSit down on the edge of the flat bench with your legs at about shoulder width apart. Make sure to keep your feet on the floor.\nUse your arms to grab both of the dumbbells and bring them up so that your forearms are resting against your thighs with the palms of the hands facing down. Your wrists should be hanging over the edge of your thighs.\nStart out by curling your wrist upwards and exhaling.\nSlowly lower your wrists back down to the starting position while inhaling. Make sure to inhale during this part of the exercise. Tip: Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.\nRepeat for the recommended amount of repetitions.\nWhen finished, simply lower the dumbbells to the floor."],["Seated_Dumbbell_Palms-Up_Wrist_Curl","Seated Dumbbell Palms-Up Wrist Curl","","Kraft","Kurzhantel",[6],[],"kraft",2,"Start out by placing two dumbbells on the floor in front of a flat bench.\nSit down on the edge of the flat bench with your legs at about shoulder width apart. Make sure to keep your feet on the floor.\nUse your arms to grab both of the dumbbells and bring them up so that your forearms are resting against your thighs with the palms of the hands facing up. Your wrists should be hanging over the edge of your thighs.\nStart out by curling your wrist upwards and exhaling.\nSlowly lower your wrists back down to the starting position while inhaling. Make sure to inhale during this part of the exercise. Tip: Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.\nRepeat for the recommended amount of repetitions.\nWhen finished, simply lower the dumbbells to the floor."],["Seated_Dumbbell_Press","Seated Dumbbell Press","","Kraft","Kurzhantel",[14],[16],"kraft",2,"Grab a couple of dumbbells and sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs.\nClean the dumbbells up one at a time by using your thighs to bring the dumbbells up to shoulder height at each side.\nRotate the wrists so that the palms of your hands are facing forward. This is your starting position.\nAs you exhale, push the dumbbells up until they touch at the top.\nAfter a second pause, slowly come down back to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Seated_Flat_Bench_Leg_Pull-In","Seated Flat Bench Leg Pull-In","","Kraft","Körpergewicht",[0],[],"body",2,"Sit on a bench with the legs stretched out in front of you slightly below parallel and your arms holding on to the sides of the bench. Your torso should be leaning backwards around a 45-degree angle from the bench. This will be your starting position.\nBring the knees in toward you as you move your torso closer to them at the same time. Breathe out as you perform this movement.\nAfter a second pause, go back to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Seated_Floor_Hamstring_Stretch","Seated Floor Hamstring Stretch","","Dehnen","Ohne",[8],[4],"zeit",2,"Sit on a mat with your right leg extended in front of you and your left leg bent with your foot against your right inner thigh.\nLean forward from your hips and reach for your ankle until you feel a stretch in your hamstring. Hold for 15 seconds, then repeat for your other side."],["Seated_Front_Deltoid","Seated Front Deltoid","","Dehnen","Körpergewicht",[14],[5],"zeit",2,"Sit upright on the floor with your legs bent, your partner standing behind you. Stick your arms straight out to your sides, with your palms facing the ground. Attempt to move them as far behind you as possible, as your assistant holds your wrists. This will be your starting position.\nKeeping your elbows straight, attempt to move your arms to the front, with your partner gently restraining you to prevent any actual movement for 10-20 seconds.\nNow, relax your muscles and allow your partner to gently increase the stretch on the shoulders and chest. Hold for 10 to 20 seconds."],["Seated_Glute","Seated Glute","","Dehnen","Körpergewicht",[7],[2],"zeit",2,"In a seated position with your knees bent, cross one ankle over the opposite knee. Your partner will stand behind you. Now, lean forward as your partner braces your shoulders with their hands. This will be your starting position.\nAttempt to push your torso back for 10-20 seconds, as your partner prevents any actual movement of your torso.\nNow relax your muscles as your partner increases the stretch by gently pushing your torso forward for 10-20 seconds."],["Seated_Good_Mornings","Seated Good Mornings","","Powerlifting","Langhantel",[10],[7],"kraft",2,"Set up a box in a power rack. The pins should be set at an appropriate height. Begin by stepping under the bar and placing it across the back of the shoulders, not on top of your traps. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders.\nRemove the bar from the rack, creating a tight arch in your lower back. Keep your head facing forward. With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. This will be your starting position.\nKeeping the bar tight, bend forward at the hips as much as possible. If you set the pins to what would be parallel, you not only have a safety if you fail, but know when to stop.\nPause just above the pins and reverse the motion until your torso it upright."],["Seated_Hamstring","Seated Hamstring","","Dehnen","Ohne",[8],[4],"zeit",2,"In a seated position with your legs extended, have your partner stand behind you. Now, lean forward as your partner braces your shoulders with their hands. This will be your starting position.\nAttempt to push your torso back for 10-20 seconds, as your partner prevents any actual movement of your torso.\nNow relax your muscles as your partner increases the stretch by gently pushing your torso forward for 10-20 seconds."],["Seated_Hamstring_and_Calf_Stretch","Seated Hamstring and Calf Stretch","","Dehnen","Sonstiges",[8],[4],"zeit",2,"Loop a belt, rope, or band around one foot. Sit down with both legs extended . This will be your starting position.\nLeaning forward slightly, pull on the belt to draw the toes of your foot back. Hold this position for 10-20 seconds and then repeat with the other leg."],["Seated_Head_Harness_Neck_Resistance","Seated Head Harness Neck Resistance","","Kraft","Sonstiges",[12],[],"kraft",2,"Place a neck strap on the floor at the end of a flat bench. Once you have selected the weights, sit at the end of the flat bench with your feet wider than shoulder width apart from each other. Your toes should be pointed out.\nSlowly move your torso forward until it is almost parallel with the floor. Using both hands, securely position the neck strap around your head. Tip: Make sure the weights are still lying on the floor to prevent any strain on the neck. Now grab the weight with both hands while elevating your torso back until it is almost perpendicular to the floor. Note: Your head and torso needs to be slightly tilted forward to perform this exercise.\nNow place both hands on top of your knees. This is the starting position.\nSlowly lower your neck down until your chin touches the upper part of your chest while breathing in.\nWhile exhaling, bring your neck back to the starting position.\nRepeat for the recommended amount of repetitions."],["Seated_Leg_Curl","Seated Leg Curl","Beinbeuger sitzend","Kraft","Maschine",[8],[],"kraft",2,"Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.\nPlace the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.\nAs you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.\nSlowly return to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions."],["Seated_Leg_Tucks","Seated Leg Tucks","","Kraft","Körpergewicht",[0],[],"body",2,"Sit on a bench with the legs stretched out in front of you slightly below parallel and your arms holding on to the sides of the bench. Your torso should be leaning backwards around a 45-degree angle from the bench. This will be your starting position.\nBring the knees in toward you as you move your torso closer to them at the same time. Breathe out as you perform this movement.\nAfter a second pause, go back to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Seated_One-Arm_Dumbbell_Palms-Down_Wrist_Curl","Seated One-Arm Dumbbell Palms-Down Wrist Curl","","Kraft","Kurzhantel",[6],[],"kraft",2,"Sit on a flat bench with a dumbbell in your right hand.\nPlace your feet flat on the floor, at a distance that is slightly wider than shoulder width apart.\nLean forward and place your right forearm on top of your upper right thigh with your palm down. Tip: Make sure that the back of the wrist lies on top of your knees. This will be your starting position.\nLower the dumbbell as far as possible as you keep a tight grip on the dumbbell. Inhale as you perform this movement.\nNow curl the dumbbell as high as possible as you contract the forearms and as you exhale. Keep the contraction for a second before you lower again. Tip: The only movement should happen at the wrist.\nPerform for the recommended amount of repetitions, switch arms and repeat the movement."],["Seated_One-Arm_Dumbbell_Palms-Up_Wrist_Curl","Seated One-Arm Dumbbell Palms-Up Wrist Curl","","Kraft","Kurzhantel",[6],[],"kraft",2,"Sit on a flat bench with a dumbbell in your right hand.\nPlace your feet flat on the floor, at a distance that is slightly wider than shoulder width apart.\nLean forward and place your right forearm on top of your upper right thigh with your palm up. Tip: Make sure that the front of the wrist lies on top of your knees. This will be your starting position.\nLower the dumbbell as far as possible as you keep a tight grip on the dumbbell. Inhale as you perform this movement.\nNow curl the dumbbell as high as possible as you contract the forearms and as you exhale. Keep the contraction for a second before you lower again. Tip: The only movement should happen at the wrist.\nPerform for the recommended amount of repetitions, switch arms and repeat the movement."],["Seated_One-arm_Cable_Pulley_Rows","Seated One-arm Cable Pulley Rows","","Kraft","Kabelzug",[11],[3,9,15],"kraft",2,"To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.\nLean over as you keep the natural alignment of your back and grab the single handle attachment with your left arm using a palms-down grip.\nWith your arm extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lat as you hold the bar in front of you. The right arm can be kept by the waist. This is the starting position of the exercise.\nKeeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it as you rotate the wrist, so that by the time your hand is by your abdominals it is in a neutral position (palms facing the torso). Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard.\nHold that contraction for a second and slowly go back to the original position while breathing in. Tip: Remember to rotate the wrist as you go back to the starting position so that the palms are facing down again.\nRepeat for the recommended amount of repetitions and then perform the same movement with the right hand."],["Seated_Overhead_Stretch","Seated Overhead Stretch","","Dehnen","Ohne",[0],[],"zeit",2,"Sit up straight on an exercise mat.\nTouch the soles of your feet together with your feet six to eight inches in front of your hips.\nPlace one hand on the floor beside you and your other hand behind your head.\nLift your elbow to the ceiling as you incline your torso to the other side. Hold for 10 to 20 seconds, then switch sides."],["Seated_Palm-Up_Barbell_Wrist_Curl","Seated Palm-Up Barbell Wrist Curl","","Kraft","Langhantel",[6],[],"kraft",2,"Hold a barbell with both hands and your palms facing up; hands spaced about shoulder width.\nPlace your feet flat on the floor, at a distance that is slightly wider than shoulder width apart.\nLean forward and place your forearms on top of your upper thighs with your palms up. Tip: Make sure that the front of the wrists lay on top of your knees. This will be your starting position.\nLower the bar as far as possible while inhaling and keeping a tight grip.\nNow curl bar up as high as possible while flexing the forearms and exhaling. Hold the contraction at the top for a second and Tip: Only the wrist should move."],["Seated_Palms-Down_Barbell_Wrist_Curl","Seated Palms-Down Barbell Wrist Curl","","Kraft","Langhantel",[6],[],"kraft",2,"Hold a barbell with both hands and your palms facing down; hands spaced about shoulder width.\nPlace your feet flat on the floor, at a distance that is slightly wider than shoulder width apart.\nLean forward and place your forearms on top of your upper thighs with your palms down. Tip: Make sure that the back of the wrists lay on top of your knees. This will be your starting position.\nLower the bar as far as possible while inhaling and keeping a tight grip.\nNow curl bar up as high as possible while flexing the forearms and exhaling. Hold the contraction at the top for a second and Tip: Only the wrist should move."],["Seated_Side_Lateral_Raise","Seated Side Lateral Raise","","Kraft","Kurzhantel",[14],[],"kraft",2,"Pick a couple of dumbbells and sit at the end of a flat bench with your feet firmly on the floor. Hold the dumbbells with your palms facing in and your arms straight down at your sides at arms' length. This will be your starting position.\nWhile maintaining the torso stationary (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.\nLower the dumbbells back down slowly to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Seated_Triceps_Press","Seated Triceps Press","","Kraft","Kurzhantel",[16],[],"kraft",2,"Sit down on a bench with back support and grasp a dumbbell with both hands and hold it overhead at arm's length. Tip: a better way is to have somebody hand it to you especially if it is very heavy. The resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hand should be facing inward. This will be your starting position.\nKeeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semi-circular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.\nGo back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.\nRepeat for the recommended amount of repetitions."],["Seated_Two-Arm_Palms-Up_Low-Pulley_Wrist_Curl","Seated Two-Arm Palms-Up Low-Pulley Wrist Curl","","Kraft","Kabelzug",[6],[],"kraft",2,"Put a bench in front of a low pulley machine that has a barbell or EZ Curl attachment on it.\nMove the bench far enough away so that when you bring the handle to the top of your thighs tension is created on the cable due to the weight stack being moved up.\nNow hold the handle with both hands, palms up, using a shoulder-width grip.\nStep back and sit on the bench with your feet about shoulder width apart, firmly on the floor.\nLean forward and place the forearms on your thighs with the back of your wrists over your knees. This will be your starting position.\nLower the bar as far as possible, while inhaling and keeping a tight grip.\nNow curl the bar up as high as possible while contracting the forearms. Tip: Only the wrist should move; not the forearms.\nAfter a second contraction at the top go back to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["See-Saw_Press_Alternating_Side_Press","See-Saw Press (Alternating Side Press)","","Kraft","Kurzhantel",[14],[0,16],"kraft",2,"Grab a dumbbell with each hand and stand up erect.\nClean (lift) the dumbbells to the chest/shoulder level and then rotate your wrists so that your palms are facing towards you as if you were getting ready to perform an Arnold Press. This will be your starting position.\nNow start extending your left arm overhead as you rotate the wrist so that the palm of your hand faces forward as you go up. Your elbows should come out also as you lift the weight. Simultaneously, you will also be bending from your hip to your opposite side. Tip: If you perform the exercise correctly, is should look as if you are trying to reach for something overhead on the right hand side of your body, but with your left arm. Breathe out as you perform this movement.\nOnce you reach the top position breathe in. Then, with the weight fully extended overhead and you bent over to your right hand side, begin the movement to the left side.\nRepeat for the recommended amount of repetitions."],["Shotgun_Row","Shotgun Row","","Kraft","Kabelzug",[9],[3,11],"kraft",2,"Attach a single handle to a low cable.\nAfter selecting the correct weight, stand a couple feet back with a wide-split stance. Your arm should be extended and your shoulder forward. This will be your starting position.\nPerform the movement by retracting the shoulder and flexing the elbow. As you pull, supinate the wrist, turning the palm upward as you go.\nAfter a brief pause, return to the starting position."],["Shoulder_Circles","Shoulder Circles","","Dehnen","Ohne",[14],[15],"zeit",2,"With shoulders relaxed and arms resting loosely at your sides (or in your lap if you're seated), gently roll your shoulders forward, up, back, and down.\nReverse direction. You can do this exercise alternating shoulders or both at the same time."],["Shoulder_Press_-_With_Bands","Shoulder Press - With Bands","","Kraft","Bänder",[14],[16],"kraft",2,"To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles and lift them so that the hands are at shoulder height at each side.\nRotate the wrists so that the palms of your hands are facing forward. Your elbows should be bent, with the upper arms and forearms in line to the torso. This is your starting position.\nAs you exhale, lift the handles up until your arms are fully extended overhead."],["Shoulder_Raise","Shoulder Raise","","Dehnen","Ohne",[14],[9],"zeit",2,"Relax your arms to your sides and raise your shoulders up toward your ears, then back down."],["Shoulder_Stretch","Shoulder Stretch","","Dehnen","Ohne",[14],[],"zeit",2,"Reach your left arm across your body and hold it straight."],["Side-Lying_Floor_Stretch","Side-Lying Floor Stretch","","Dehnen","Ohne",[9],[],"zeit",2,"First lie on your left side, bending your left knee in front of you to stabilize your torso (use your abdominal muscles as well to hold you upright).\nStraighten your right leg and rest the right foot on the floor behind your left. Straighten your right arm over your head and gently pull on your right wrist to stretch the entire right side of the body. Switch sides."],["Side_Bridge","Side Bridge","Seitstütz","Kraft","Körpergewicht",[0],[14],"zeit",2,""],["Side_Hop-Sprint","Side Hop-Sprint","","Plyometrie","Sonstiges",[13],[1,2,4,8],"kraft",2,"Stand to the side of a cone or hurdle.\nBegin this drill by hopping sideways over the obstacle, rebounding out of your landing to hop back to where you started.\nHop for a prescribed number or repetitions as quickly as possible, and finish this drill by sprinting a short distance upon landing the last hop."],["Side_Jackknife","Side Jackknife","","Kraft","Körpergewicht",[0],[],"body",2,""],["Side_Lateral_Raise","Side Lateral Raise","Seitheben (Kurzhantel)","Kraft","Kurzhantel",[14],[],"kraft",2,"Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.\nWhile maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.\nLower the dumbbells back down slowly to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Side_Laterals_to_Front_Raise","Side Laterals to Front Raise","","Kraft","Kurzhantel",[14],[15],"kraft",2,"In a standing position, hold a pair of dumbbells at your side. This will be your starting position.\nKeeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.\nAt the top of the exercise move the weights out in front of you, keeping your arms extended.\nLower the weights with a controlled motion.\nOn the next repetition, raise the weights in front of you to shoulder height before moving the weights laterally to your sides.\nLower the weights to the starting position."],["Side_Leg_Raises","Side Leg Raises","","Dehnen","Körpergewicht",[2],[],"zeit",2,"Stand next to a chair, which you may hold onto as a support. Stand on one leg. This will be your starting position.\nKeeping your leg straight, raise it as far out to the side as possible, and swing it back down, allowing it to cross the opposite leg.\nRepeat this swinging motion 5-10 times, increasing the range of motion as you do so."],["Side_Lying_Groin_Stretch","Side Lying Groin Stretch","","Dehnen","Ohne",[2],[8],"zeit",2,"Start off by lying on your right side and bend your right knee in front of you to stabilize the torso.\nRest your head on your right hand or shoulder. Lift your left leg upward and hold it by the back of the knee (easier) or the foot (harder).\nPull your left knee in toward your left shoulder and simultaneously press your foot or knee down to the floor. To intensify this stretch, straighten your left leg. Switch sides."],["Side_Neck_Stretch","Side Neck Stretch","","Dehnen","Ohne",[12],[],"zeit",2,"Start with your shoulders relaxed, gently tilt your head towards your shoulder.\nAssist stretch with a gentle pull on the side of the head."],["Side_Standing_Long_Jump","Side Standing Long Jump","","Plyometrie","Ohne",[13],[4,7,8],"kraft",2,"Begin standing with your feet hip width apart in an athletic stance. Your head and chest should be up, knees and hips slightly bent. This will be your starting position.\nLeaning to your right, extend through your hips, knees, and ankles to jump into the air. Block with the arms to lead the movement, jumping as far to your right as you can.\nLand facing the same direction with your feet hip width apart, absorbing the impact through your lower body."],["Side_To_Side_Chins","Side To Side Chins","","Kraft","Sonstiges",[9],[3,6,11,14],"kraft",2,"Grab the pull-up bar with the palms facing forward using a wide grip.\nAs you have both arms extended in front of you holding the bar at a wide grip, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.\nPull your torso up while leaning to the left hand side until the bar almost touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space (no swinging) and only the arms should move. The forearms should do no other work other than hold the bar.\nAfter a second of contraction, inhale as you go back to the starting position.\nNow, pull your torso up while leaning to the right hand side until the bar almost touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.\nAfter a second of contraction, inhale as you go back to the starting position.\nRepeat steps 3-6 until you have performed the prescribed amount of repetitions for each side."],["Side_Wrist_Pull","Side Wrist Pull","","Dehnen","Ohne",[14],[6,9],"zeit",2,"This stretch works best standing. Cross your left arm over the midline of your body and hold the left wrist in your right hand down at the level of your hips. Start the stretch with a bent left arm.\nSlowly straighten, pull, and lift it up to shoulder height, as pictured. Feel this stretch originate in your back, not your shoulders, and don't pull too hard on the shoulders joint. Switch sides."],["Side_to_Side_Box_Shuffle","Side to Side Box Shuffle","","Plyometrie","Sonstiges",[13],[1,2,4,8],"kraft",2,"Stand to one side of the box with your left foot resting on the middle of it.\nTo begin, jump up and over to the other side of the box, landing with your right foot on top of the box and your left foot on the floor. Swing your arms to aid your movement.\nContinue shuffling back and forth across the box."],["Single-Arm_Cable_Crossover","Single-Arm Cable Crossover","","Kraft","Kabelzug",[5],[],"kraft",2,"Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.\nStep forward in front of both pulleys with your arms extended in front of you, bringing your hands together. Your head and chest should be up as you lean forward, while your feet should be staggered. This will be your starting position.\nKeeping your left arm in place, allow your right arm to extend out to the side, maintaining a slight bend at the elbow. The right arm should be perpendicular to the body at approximately shoulder level.\nReturn your arm back to the starting position by pulling your hand back to the midline of the body.\nHold for a second at the starting position and repeat the movement on the opposite side. Continue alternating back and forth for the prescribed number of repetitions."],["Single-Arm_Linear_Jammer","Single-Arm Linear Jammer","","Kraft","Langhantel",[14],[5,16],"kraft",2,"Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.\nRaise the bar from the floor, taking it to your shoulders with one or both hands. Adopt a wide stance. This will be your starting position.\nPerform the movement by extending the elbow, pressing the weight up. Move explosively, extending the hips and knees fully to produce maximal force.\nReturn to the starting position."],["Single-Arm_Push-Up","Single-Arm Push-Up","","Kraft","Körpergewicht",[5],[14,16],"body",2,"Begin laying prone on the ground. Move yourself into a position supporting your weight on your toes and one arm. Your working arm should be placed directly under the shoulder, fully extended. Your legs should be extended, and for this movement you may need a wider base, placing your feet further apart than in a normal push-up.\nMaintain good posture, and place your free hand behind your back. This will be your starting position.\nLower yourself by allowing the elbow to flex until you touch the ground.\nDescend slowly, and reverse direction be extending the arm to return to the starting position."],["Single-Cone_Sprint_Drill","Single-Cone Sprint Drill","","Plyometrie","Sonstiges",[13],[4,7,8],"kraft",2,"This drill teaches quick foot action. You need a single cone. Begin standing next to the cone with one arm back and one arm forward.\nChop the feet as quickly as possible, blocking with the arms. Circle the cone, keep your knees up, with violent foot action.\nRest after three trips around the cone."],["Single-Leg_High_Box_Squat","Single-Leg High Box Squat","","Kraft","Sonstiges",[13],[7,8],"kraft",2,"Position a box in a rack. Secure a band or rope in place above the box.\nStanding in front of it, step onto the box to a full standing position, letting your other leg remain unsupported. Hold onto the band for balance\n. Continue stepping up and down on the same leg before switching to the opposite side."],["Single-Leg_Hop_Progression","Single-Leg Hop Progression","","Plyometrie","Sonstiges",[13],[1,2,4,8],"kraft",2,"Arrange a line of cones in front of you. Assume a relaxed standing position, balanced on one leg. Raise the knee of your opposite leg. This will be your starting position.\nHop forward, jumping and landing with the same leg over the cone.\nUse a countermovement jump to hop from cone to cone.\nAt the end, turn around and go back on the other leg."],["Single-Leg_Lateral_Hop","Single-Leg Lateral Hop","","Plyometrie","Sonstiges",[13],[1,2,4,8],"kraft",2,"Stand to the side of a cone or hurdle. To get into the start position, stand on one leg with your knee slightly bent.\nTo begin, execute a counterjump to hop sideways over the cone.\nLand on your jumping leg, and immediately rebound out of it by jumping back to the start position.\nContinue hopping back and forth."],["Single-Leg_Leg_Extension","Single-Leg Leg Extension","","Kraft","Maschine",[13],[],"kraft",2,"Seat yourself in the machine and adjust it so that you are positioned properly. The pad should be against the lower part of the shin but not in contact with the ankle. Adjust the seat so that the pivot point is in line with your knee. Select a weight appropriate for your abilities.\nMaintaining good posture, fully extend one leg, pausing at the top of the motion.\nReturn to the starting position without letting the weight stop, keeping tension on the muscle.\nRepeat for the desired number of repetitions."],["Single-Leg_Stride_Jump","Single-Leg Stride Jump","","Plyometrie","Sonstiges",[13],[1,2,4,8],"kraft",2,"Stand to the side of a box with your inside foot on top of it, close to the edge.\nBegin by swinging the arms upward as you push through the top leg, jumping upward as high as possible. Attempt to drive the opposite knee upward.\nLand in the same position that you started, using your inside leg to decelerate the impact."],["Single_Dumbbell_Raise","Single Dumbbell Raise","","Kraft","Kurzhantel",[14],[6,15],"kraft",2,"With a wide stance, hold a dumbell with both hands, grasping the head of the dumbbell instead of the handle. Your arms should be extended and hanging at the waist. This will be your starting position.\nRaise the weight until it is above shoulder level, keeping your arms extended. Your torso and hips should remain stationary throughout the movement.\nReturn to the starting position and repeat for the recommended amount of repetitions."],["Single_Leg_Butt_Kick","Single Leg Butt Kick","","Plyometrie","Körpergewicht",[13],[4,8],"body",2,"Begin by standing on one leg, with the bent knee raised. This will be your start position.\nUsing a countermovement jump, take off upward by extending the hip, knee, and ankle of the grounded leg.\nImmediately flex the knee and attempt to touch your butt with the heel of your jumping leg.\nReturn the leg to a partially bent position underneath the hips and land. Your opposite leg should stay in relatively the same position throughout the drill."],["Single_Leg_Glute_Bridge","Single Leg Glute Bridge","","Kraft","Körpergewicht",[7],[8],"body",2,"Lay on the floor with your feet flat and knees bent.\nRaise one leg off of the ground, pulling the knee to your chest. This will be your starting position.\nExecute the movement by driving through the heel, extending your hip upward and raising your glutes off of the ground.\nExtend as far as possible, pause and then return to the starting position."],["Single_Leg_Push-off","Single Leg Push-off","","Plyometrie","Sonstiges",[13],[4,8],"kraft",2,"Stand on the ground with one foot resting on the box, heel close to the edge.\nPush off with your foot on top of the box, trying to gain as much height as possible by extending through the hip and knee.\nLand with the same foot on top of the box, returning your other foot back to the start position."],["Sit-Up","Sit-Up","Sit-Ups","Kraft","Körpergewicht",[0],[],"body",2,"Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.\nPlace your hands behind your head and lock them together by clasping your fingers. This is the starting position.\nElevate your upper body so that it creates an imaginary V-shape with your thighs. Breathe out when performing this part of the exercise.\nOnce you feel the contraction for a second, lower your upper body back down to the starting position while inhaling.\nRepeat for the recommended amount of repetitions."],["Sit_Squats","Sit Squats","","Dehnen","Ohne",[13],[1,7,8],"zeit",2,"Stand with your feet shoulder width apart. This will be your starting position.\nBegin the movement by flexing your knees and hips, sitting back with your hips.\nContinue until you have squatted a portion of the way down, but are above parallel, and quickly reverse the motion until you return to the starting position. Repeat for 5-10 repetitions."],["Skating","Skating","","Cardio","Sonstiges",[13],[1,2,4,7,8],"cardio",2,"Roller skating is a fun activity which can be effective in improving cardiorespiratory fitness and muscular endurance. It requires relatively good balance and coordination. It is necessary to learn the basics of skating including turning and stopping and to wear protective gear to avoid possible injury.\nYou can skate at a comfortable pace for 30 minutes straight. If you want a cardio challenge, do interval skating — speed skate two minutes of every five minutes, using the remaining three minutes to recover. A 150 lb person will typically burn about 175 calories in 30 minutes skating at a comfortable pace, similar to brisk walking."],["Sled_Drag_-_Harness","Sled Drag - Harness","","Strongman","Sonstiges",[13],[4,7,8],"carry",2,"To begin, load the sled with the desired weight and attach the pulling strap. You can pull with handles, use a harness, or attach the pulling strap to a weight belt.\nWhether pulling forwards or backwards, lean in the direction of travel and progress by extending through the hips and knees."],["Sled_Overhead_Backward_Walk","Sled Overhead Backward Walk","","Kraft","Sonstiges",[14],[4,11,13],"kraft",2,"Attach dual handles to a sled connected by a rope or chain. Load the sled to a light weight.\nFace the sled, backing up until there is some tension in the line. Hold your hands directly above your head with your elbows extended. This will be your starting position.\nWalk backwards, keeping your arms raised above your head. Avoid jerky movements."],["Sled_Overhead_Triceps_Extension","Sled Overhead Triceps Extension","","Kraft","Sonstiges",[16],[],"kraft",2,"Attach dual handles to a sled using a chain or rope. Load the sled to an appropriate load.\nFacing away from the sled, step away until there is tension in the line. Raise your hands above your head, keeping them together, palms facing each other. Your elbows should be pointed upward with the elbows flexed. This will be your starting position.\nExtend through the elbow to straighten the arm. Ensure that your upper arm stays in position to isolate the triceps.\nUpon full extension, step forward to take the slack out of the line. You may keep your feet staggered for more stability."],["Sled_Push","Sled Push","Schlitten schieben","Strongman","Sonstiges",[13],[4,5,7,8,16],"carry",2,"Load your pushing sled with the desired weight.\nTake an athletic posture, leaning into the sled with your arms fully extended, grasping the handles. Push the sled as fast as possible, focusing on extending your hips and knees to strengthen your posterior chain."],["Sled_Reverse_Flye","Sled Reverse Flye","","Kraft","Sonstiges",[14],[],"kraft",2,"Attach dual handles to a sled connected by a rope or chain. Load the sled to a light weight.\nFace the sled, backing up until there is some tension in the line. Take both handles at arms length at about waist level. Bend the knees slightly and keep your chest and head up. This will be your starting position.\nWithout flexing the elbow, pull the handles upward and apart, performing a reverse fly with some external rotation. Your palms should be facing forward as you do this.\nReturn to the starting position, taking a couple steps back to take the slack out of the line."],["Sled_Row","Sled Row","","Kraft","Sonstiges",[11],[3,9],"kraft",2,"Attach dual handles to a sled connected by a rope or chain. Load the sled to an appropriate weight. Face the sled, backing up until there is some tension in the line.\nWith a handle in each hand, bend the knees slightly, keep your head and chest up, and begin with your arms extended.\nTo initiate the movement, flex the elbow as you retract your shoulder blades, pulling the sled towards you.\nTake a step or two back to get tension in the line and repeat."],["Sledgehammer_Swings","Sledgehammer Swings","","Plyometrie","Sonstiges",[0],[4,6,9,11,14],"kraft",2,"You will need a tire and a sledgehammer for this exercise. Stand in front of the tire about two feet away from it with a staggered stance. Grip the sledgehammer.\nIf you are right handed, your left hand should be at the bottom of the handle, and your right hand should be choking up closer to the head.\nAs you bring the sledge up, your right hand slides toward the head; as you swing down, your right hand will slide down to join your left hand. Slam it down as hard as you can against the tire. Control the bounce of the hammer off of the tire.\nRepeat on the other side."],["Smith_Incline_Shoulder_Raise","Smith Incline Shoulder Raise","","Kraft","Langhantel",[14],[5],"kraft",2,"Place an incline bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the incline bench and make sure your shoulders are aligned right under the barbell.\nUsing a shoulder width pronated (palms forward) grip, lift the bar from the rack and hold it straight over you with a slight bend at the elbows. This will be your starting position.\nAs you breathe out, lift the bar up until your arms are fully extended. Note: The contraction should be felt around the shoulders.\nAfter a second pause, bring the bar back down to the starting position as you breathe in.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the bar back in the rack."],["Smith_Machine_Behind_the_Back_Shrug","Smith Machine Behind the Back Shrug","","Kraft","Maschine",[15],[14],"kraft",2,"With the bar at thigh level, load an appropriate weight.\nStand with the bar behind you, taking a shoulder-width, pronated grip on the bar and unhook the weight. You should be standing up straight with your head and chest up and your arms extended. This will be your starting position.\nInitiate the movement by shrugging your shoulders straight up. Do not flex the arms or wrist during the movement.\nAfter a brief pause return the weight to the starting position.\nRepeat for the desired number of repetitions before engaging the hooks to rack the weight."],["Smith_Machine_Bench_Press","Smith Machine Bench Press","","Kraft","Maschine",[5],[14,16],"kraft",2,"Place a flat bench underneath the smith machine. Now place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the flat bench. Using a pronated grip that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.\nAs you breathe in, come down slowly until you feel the bar on your middle chest.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, lock the bar back in the rack."],["Smith_Machine_Bent_Over_Row","Smith Machine Bent Over Row","","Kraft","Maschine",[11],[3,9,14],"kraft",2,"Set the barbell attached to the smith machine to a height that is about 2 inches below your knees.\nBend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up.\nNow grasp the barbell using an overhand (pronated) grip and unlock it from the smith machine rack. Then let it hang directly in front of you as your arms hang extended perpendicular to the floor and your torso. This is your starting position.\nWhile keeping the torso stationary, lift the barbell as you breathe out, keeping the elbows close to the body and not doing any force with the forearm other than holding the weights. On the top contracted position, squeeze the back muscles and hold for a second.\nSlowly lower the weight again to the starting position as you inhale.\nRepeat for the recommended amount of repetitions."],["Smith_Machine_Calf_Raise","Smith Machine Calf Raise","","Kraft","Maschine",[4],[],"kraft",2,"Place a block or weight plate below the bar on the Smith machine. Set the bar to a position that best matches your height. Once the correct height is chosen and the bar is loaded, step onto the plates with the balls of your feet and place the bar on the back of your shoulders.\nTake the bar with both hands facing forward. Rotate the bar to unrack it. This will be your starting position.\nRaise your heels as high as possible by pushing off of the balls of your feet, flexing your calf at the top of the contraction. Your knees should remain extended. Hold the contracted position for a second before you start to go back down.\nReturn slowly to the starting position as you breathe in while lowering your heels.\nRepeat for the recommended amount of repetitions."],["Smith_Machine_Close-Grip_Bench_Press","Smith Machine Close-Grip Bench Press","","Kraft","Maschine",[16],[5,14],"kraft",2,"Place a flat bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the flat bench. Using a close and pronated grip (palms facing forward) that is around shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.\nAs you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that as opposed to a regular bench press, you keep the elbows close to the torso at all times in order to maximize triceps involvement.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, lock the bar back in the rack."],["Smith_Machine_Decline_Press","Smith Machine Decline Press","","Kraft","Maschine",[5],[14,16],"kraft",2,"Position a decline bench in the rack so that the bar will be above your chest. Load an appropriate weight and take your place on the bench.\nRotate the bar to unhook it from the rack and fully extend your arms. Your back should be slightly arched and your shoulder blades retracted. This will be your starting position.\nBegin the movement by flexing your arms, lowering the bar to your chest.\nPause briefly, and then extend your arms to push the weight back to the starting position.\nAfter completing the desired number of repetitions, rotate the bar to rack the weight."],["Smith_Machine_Hang_Power_Clean","Smith Machine Hang Power Clean","","Kraft","Maschine",[8],[7,10,13,14,15],"kraft",2,"Position the bar at knee height and load it to an appropriate weight.\nTake a pronated grip on the bar outside of shoulder width and unhook the bar from the machine. Your arms should be fully extended with your head and chest up. Your elbows should be pointed out with your shoulders back and down. Your hips should be back, loading the tension into the hamstrings. This will be your starting position.\nInitate the movement by forcefully extending the hips and knees, accelerating into the bar. Ensure that you keep your arms straight during this part of the motion.\nUpon full extension, rebend the hips and knees to lower your receiving position.\nAllow the arms to flex at this point, rotating the elbows around the bar to receive it on your shoulders.\nExtend through the hips and knees to come to a standing position with the bar racked on your shoulders to complete the movement."],["Smith_Machine_Hip_Raise","Smith Machine Hip Raise","","Kraft","Maschine",[0],[],"kraft",2,"Position a bench in the rack and load the bar to an appropriate weight. Lie down on the bench, placing the bottom of your feet against the bar. Unlock the bar and extend your legs. You may need to use your hands to assist you. For added stability grasp the sides of the Smith Machine. This will be your starting position.\nInitiate the movement by rotating your pelvis, flexing your spine to raise your hips off of the bench. Maintain a slight bend in the knees throughout the motion.\nAfter a brief pause, return the hips to the bench.\nRepeat for the desired number of repetitions."],["Smith_Machine_Incline_Bench_Press","Smith Machine Incline Bench Press","","Kraft","Maschine",[5],[14,16],"kraft",2,"Place an incline bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the incline bench and make sure your upper chest is aligned with the barbell. Using a pronated grip (palms facing forward) that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.\nAs you breathe in, come down slowly until you feel the bar on your upper chest.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the bar back in the rack."],["Smith_Machine_Leg_Press","Smith Machine Leg Press","","Kraft","Maschine",[13],[4,7,8],"kraft",2,"Position a Smith machine bar a couple feet off of the ground. Ensure that it is resting on the safeties. After loading the bar to an appropriate weight, lie underneath the bar. Place the middle of your feet on the bar, tucking your knees to your chest. This will be your starting position.\nBegin the movement by driving through your feet to move the bar upward, extending the hips and knees. Do not lock out your knees.\nAt the top of the motion, pause briefly before returning to the starting position."],["Smith_Machine_One-Arm_Upright_Row","Smith Machine One-Arm Upright Row","","Kraft","Maschine",[14],[3,15],"kraft",2,"With the bar at thigh level, load an appropriate weight.\nTake a wide grip on the bar and unhook the weight, removing your off hand from the bar. Your arm should be extended as you stand up straight with your head and chest up. This will be your starting position.\nBegin the movement by flexing the elbow, raising the upper arm with the elbow pointed out. Continue until your upper arm is parallel to the floor.\nAfter a brief pause, return the weight to the starting position.\nRepeat for the desired number of repetitions before engaging the hooks to rack the weight."],["Smith_Machine_Overhead_Shoulder_Press","Smith Machine Overhead Shoulder Press","","Kraft","Maschine",[14],[16],"kraft",2,"To begin, place a flat bench (or preferably one with back support) underneath a smith machine. Position the barbell at a height so that when seated on the flat bench, the arms must be almost fully extended to reach the barbell.\nOnce you have the correct height, sit slightly in behind the barbell so that there is an imaginary straight line from the tip of your nose to the barbell. Your feet should be stationary. Grab the barbell with the palms facing forward, unlock it and lift it up so that your arms are fully extended. This is the starting position.\nSlowly begin to lower the barbell until it is level with your chin while inhaling.\nThen lift the barbell back to the starting position using your shoulders while exhaling.\nRepeat for the recommended amount of repetitions."],["Smith_Machine_Pistol_Squat","Smith Machine Pistol Squat","","Kraft","Maschine",[13],[4,7,8],"kraft",2,"To begin, first set the bar to a position that best matches your height. Step under it and position the bar across the back of your shoulders.\nTake the bar with your hands facing forward, unlock it and lift it off the rack by extending your legs. 3\nMove one foot forward about 12 inches in front of the bar. Extend the other leg out in front of you, holding it off the ground. Look forward at all times and maintain a neutral or slightly arched spine. This will be your starting position.\nMaintaining good posture, lower yourself by flexing the knee and hip, going down as far as flexibility allows.\nPause briefly at the bottom and then return to the starting position by driving through the heel of your foot, extending the knee and hip."],["Smith_Machine_Reverse_Calf_Raises","Smith Machine Reverse Calf Raises","","Kraft","Maschine",[4],[],"kraft",2,"Adjust the barbell on the smith machine to fit your height and align a raised platform right under the bar.\nStand on the platform with the heels of your feet secured on top of it with the balls of your feet extending off it. Position your toes facing forward with a shoulder width stance.\nNow, place your shoulders under the barbell while maintaining the foot positioning described and push the barbell up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: The barbell on your back is only for balance purposes.\nRaise the balls of your feet as you breathe out by extending your toes as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position for a second before you start to go back down.\nSlowly go back down to the starting position as you breathe in by lowering the balls of your feet and toes.\nRepeat for the recommended amount of repetitions."],["Smith_Machine_Squat","Smith Machine Squat","Kniebeuge (Multipresse)","Kraft","Maschine",[13],[4,7,8,10],"kraft",2,"To begin, first set the bar on the height that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side (palms facing forward), unlock it and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nPosition your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance which targets overall development; however you can choose any of the three stances discussed in the foot stances section).\nBegin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.\nRepeat for the recommended amount of repetitions."],["Smith_Machine_Stiff-Legged_Deadlift","Smith Machine Stiff-Legged Deadlift","","Kraft","Maschine",[8],[7,10],"kraft",2,"To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.\nLift the bar up by fully extending your arms while keeping your back straight. Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.\nKeeping the knees stationary, lower the barbell to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement\nStart bringing your torso up straight again as soon as you feel the hamstrings stretch by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.\nRepeat for the recommended amount of repetitions."],["Smith_Machine_Upright_Row","Smith Machine Upright Row","","Kraft","Maschine",[15],[3,11,14],"kraft",2,"To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.\nLift the barbell up and fully extend your arms with your back straight. There should be a slight bend at the elbows. This is the starting position.\nUse your side shoulders to lift the bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.\nLower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.\nRepeat for the recommended amount of repetitions."],["Smith_Single-Leg_Split_Squat","Smith Single-Leg Split Squat","","Kraft","Maschine",[13],[4,7,8],"kraft",2,"To begin, place a flat bench 2-3 feet behind the smith machine. Then, set the bar on the height that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side (palms facing forward), unlock it and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nPosition your legs by placing one foot slightly forward under the bar and extending your other leg back and place the top of your foot on the bench. This will be your starting position\nBegin to slowly lower the bar by bending the knee as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calf becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knee should make an imaginary straight line with the toes that is perpendicular to the front. If your knee is past that imaginary line (if it is past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten your leg again and go back to the starting position.\nRepeat for the recommended amount of repetitions.\nSwitch legs and repeat the movement."],["Snatch","Snatch","Reißen","Gewichtheben","Langhantel",[13],[3,7,8,10,14,15,16],"kraft",2,"Place your feet at a shoulder width stance with the barbell resting right above the connection between the toes and the rest of the foot.\nWith a palms facing down grip, bend at the knees and keeping the back flat grab the bar using a wider than shoulder width grip. Bring the hips down and make sure that your body drops as if you were going to sit on a chair. This will be your starting position.\nStart pushing the floor as if it were a moving platform with your feet and simultaneously start lifting the barbell keeping it close to your legs.\nAs the bar reaches the middle of your thighs, push the floor with your legs and lift your body to a complete extension in an explosive motion.\nLift your shoulders back in a shrugging movement as you bring the bar up while lifting your elbows out to the side and keeping them above the bar for as long as possible.\nNow in a very quick but powerful motion, you have to get your body under the barbell when it has reached a high enough point where it can be controlled and drop while locking your arms and holding the barbell overhead as you assume a squat position.\nFinalize the movement by rising up out of the squat position to finish the lift. At the end of the lift both feet should be on line and the arms fully extended holding the barbell overhead."],["Snatch_Balance","Snatch Balance","","Gewichtheben","Langhantel",[13],[4,7,8,14,16],"kraft",2,"Begin with the feet in the pulling position, the bar racked across the back of the shoulders, and the hands placed in a wide snatch grip.\nPop the bar with an abrupt dip and drive of the knees, and aggressively drive under the bar, transitioning the feet into the receiving position.\nReceive the bar locked out overhead near the bottom of the squat. The torso should remain vertical, lowering the hips between the legs.\nContinue to descend to full depth, and return to a standing position. Carefully lower the weight."],["Snatch_Deadlift","Snatch Deadlift","","Gewichtheben","Langhantel",[8],[6,7,8,10,13,15],"kraft",2,"The snatch deadlift strengthens the first pull of the snatch. Begin with a wide snatch grip with the barbell placed on the platform. The feet should be directly under the hips, with the feet turned out. Squat down to the bar, keeping the back in absolute extension with the head facing forward.\nInitiate the movement by driving through the heels, raising the hips. The back angle should remain the same until the bar passes the knees.\nAt that point, drive your hips through the bar as you lay back. Return the bar to the platform by reversing the motion."],["Snatch_Pull","Snatch Pull","","Kraft","Langhantel",[8],[4,7,10,13,15],"kraft",2,"With a barbell on the floor close to the shins, take a wide snatch grip. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.\nBegin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. Move the weight with control as you continue to above the knees.\nNext comes the second pull, the main source of acceleration for the pull. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward.\nThere should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back. Full extension should be violent and abrupt, and ensure that you do not prolong the extension for longer than necessary."],["Snatch_Shrug","Snatch Shrug","","Gewichtheben","Langhantel",[15],[6,14],"kraft",2,"Begin with a wide grip, with the bar hanging at the mid thigh position. You can use a hook or overhand grip. Your back should be straight and inclined slightly forward.\nShrug your shoulders towards your ears. While this exercise can usually by loaded with heavier weight than a snatch, avoid overloading to the point that the execution slows down."],["Snatch_from_Blocks","Snatch from Blocks","","Gewichtheben","Langhantel",[13],[4,6,7,8,10,14,15,16],"kraft",2,"Begin with a loaded barbell on boxes or stands of the desired height. A wide grip should be taken on the bar. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar, with the elbows pointed out. This will be the starting position.\nBegin the first pull by driving through the front of the heels, raising the bar from the boxes.\nTransition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body. At peak extension, shrug the shoulders and allow the elbows to flex to the side.\nAs you move your feet into the receiving position, forcefully pull yourself below the bar as you elevate the bar overhead. The feet should move to just outside the hips, turned out as necessary. Receive the bar with your body as low as possible and the arms fully extended overhead.\nKeeping the bar aligned over the front of the heels, your head and chest up, drive through heels of the feet to move to a standing position. Carefully return the weight to the boxes."],["Speed_Band_Overhead_Triceps","Speed Band Overhead Triceps","","Kraft","Bänder",[16],[],"kraft",2,"For this exercise anchor a band to the ground. We used an incline bench and anchored the band to the base, standing over the bench. Alternatively, this could be performed standing on the band.\nTo begin, pull the band behind your head, holding it with a pronated grip and your elbows up. This will be your starting position.\nTo perform the mo
